title = "grid-oib-agent gitleaks config"

# gitleaks auto-loads this file from the root of the scanned source
# (see .github/workflows/security.yml). Start from the full default ruleset and
# add allowlist entries for known false positives (test fixtures, example keys,
# lockfiles). Add real exceptions here rather than weakening the scan globally.

[extend]
useDefault = true

[allowlist]
description = "Global false-positive allowlist"

# The detect-secrets baseline (.pre-commit-config.yaml) already tracks accepted
# findings; these paths hold fixtures, examples, generated lockfiles, and docs
# that legitimately contain secret-shaped strings.
paths = [
  '''\.secrets\.baseline$''',
  '''(^|/)tests?/''',
  # Shared fixtures that are not under `tests/` and are not themselves specs —
  # `deploy/pulumi/src/test-support/` holds the stack config every Pulumi spec
  # builds from. It was already in scope and simply never tripped a rule, because
  # its placeholder values are short and low-entropy; the first one that wasn't
  # (a URL-safe ClickHouse password) failed the scan on a file whose whole
  # purpose is non-credentials.
  '''(^|/)test-support/''',
  '''(^|/)__mocks__/''',
  '''(^|/)mocks/''',
  '''\.spec\.tsx?$''',
  '''test_.*\.py$''',
  '''conftest\.py$''',
  '''\.env\.example$''',
  '''(^|/)uv\.lock$''',
  '''package-lock\.json$''',
  '''(^|/)docs/''',
]

# Placeholder / obviously-fake credentials used in examples and docs.
regexes = [
  '''(?i)(example|dummy|placeholder|changeme|your[-_]?token|test[-_]?key)''',
]
