  # ── github.com/rabbitmq/amqp091-go inside otelcol-contrib (ADR-0029) ──────
  #
  # Separate from every block above: a toolchain rebuild does not clear it, and
  # neither does the x/mod, x/crypto or grpc fix. Same image, same reachability
  # posture, and the same verification rule — read the candidate binary, do not
  # trust the tag.

  - id: CVE-2026-79921
    expired_at: 2026-10-01
    statement: |
      github.com/rabbitmq/amqp091-go 1.12.0 — HIGH, a denial of service via
      oversized AMQP payloads, marked fixed in 1.13.0. Compiled into
      otelcol-contrib inside the digest-pinned 0.160.0 image; not a package
      this repo references, and it appears in no lockfile we own.

      No published tag clears it. Checked rather than assumed, because the
      x/mod entries above were written after exactly this assumption failed:
      0.160.0 (newest stable) was pulled from the registry and its build info
      read with `go version -m otelcol-contrib`, which reports
      `dep github.com/rabbitmq/amqp091-go v1.12.0` — unchanged. So no digest
      bump available today can currently clear it.

      Not exploitable here, structurally: `otelcol-contrib` is the OMNIBUS
      build and links every contrib component, so the RabbitMQ client is
      compiled in whether or not anything uses it. Nothing uses it. The
      collector configuration in
      deploy/pulumi/src/platform/otel-collector.ts declares exactly one
      receiver (`otlp`), the `health_check` extension, and OTLP/HTTP exporters
      to the Aspire dashboard and Langfuse; every pipeline reads `[otlp]`.
      There is no rabbitmq receiver, exporter or extension — `rabbitmq` and
      `amqp` do not appear anywhere under deploy/ or configs/. An AMQP payload
      parser is reachable only through a component that is instantiated, and
      this one never is.

      Independently, the shared collector posture applies: the pod is the
      cluster's single OTLP ingestion point, is not on the public internet,
      and its peers are our own pods plus the OIDC-gated Aspire dashboard
      under a NetworkPolicy. Availability-only (C:N/I:N), and the prize would
      be a denial of service against telemetry rather than against the
      product.

      Boxed to 2026-10-01 with the x/crypto and grpc entries rather than to
      the 2026-09-17 stdlib block, because it clears on the same terms those
      two do: an upstream dependency bump in contrib, not a Go toolchain
      rebuild. Drop as soon as a collector-contrib image ships amqp091-go >=
      1.13.0 — re-verify with `go version -m otelcol-contrib` on the
      candidate image rather than assuming a tag bump carries it.

  # ── Langfuse web/worker images (ADR-0044) ─────────────────────────────────
  #
  # All seven are npm dependencies bundled INSIDE ghcr.io/langfuse/langfuse, not
  # packages this repo references — nothing here appears in any lockfile we own.
  # Every one is marked `fixed` upstream, so `--ignore-unfixed` does not skip
  # them, and no digest bump can currently clear them. The `3` tag HAS moved
  # since these were written — it now resolves to 3.225.2 (built 2026-08-11) —
  # but 3.225.2 ships byte-identical versions of all seven packages
  # (fast-uri 3.1.4, js-yaml 3.15.0/4.3.0, nanoid 3.3.12, sharp 0.34.5,
  # undici 7.28.0, deepmerge-ts 7.1.5), so moving the pin buys nothing.
  # Verified against the registry and against langfuse's own `pnpm-lock.yaml`
  # at the revision each image is labelled with, not assumed.
  #
  # Shared context for every entry below, so it is not repeated seven times:
  # the Langfuse UI is reachable only through the Envoy Gateway behind an OIDC
  # flow gated on `platform:organizations:view`, and its OTLP receiver is
  # cluster-internal with a NetworkPolicy admitting only otel-collector. There
  # is no unauthenticated surface. The `langfuseEnabled` flag now defaults to
  # true, but the capability half of the gate still needs the tier's
  # credentials, so a stack that has not adopted it runs none of this code.

  - id: CVE-2026-40345
    expired_at: 2026-10-09
    statement: |
      deepmerge-ts 7.1.5 — stack exhaustion when merging recursive object
      graphs. A denial of service that requires the attacker to control the
      objects being merged.

      Reached by exactly ONE dependent in langfuse's lockfile: `@prisma/config`
      6.19.3, which merges `prisma.config.ts` with the CLI's defaults when the
      Prisma CLI and migration engine start. Confirmed by reading the lockfile
      at the revision each image is labelled with, not inferred from the
      package name — deepmerge-ts appears nowhere else in the tree.

      Not exploitable here, and this one is structural: the object graph fed to
      `@prisma/config` is the config file baked into the Langfuse image,
      resolved against the environment `deploy/pulumi/src/platform/langfuse.ts`
      sets. It is assembled at container start, before any request is served.
      Nothing on the trace-ingestion or UI path calls deepmerge-ts at all, so no
      caller — authenticated or not — can supply the recursive graph the defect
      needs.

      This entry is boxed to the same date as the rest of the block even though
      it waits on a longer chain than they do: the fix is deepmerge-ts 8.0.0
      (2026-08-16), a MAJOR bump, so Prisma has to take it into
      `@prisma/config` before Langfuse can pick it up. 7.1.6 (2026-08-11) is
      not the fix. As of 2026-08-18 langfuse `main` — and the `latest` 4.12.0
      image built that morning — still resolve deepmerge-ts 7.1.5, so this is
      not a case of the pin lagging behind an available fix.

      Drop as soon as a Langfuse image ships deepmerge-ts >= 8.0.0.

  - id: CVE-2026-18446
    expired_at: 2026-10-09
    statement: |
      fast-uri 3.1.4 — host confusion via a backslash in the URI authority.
      Bundled inside ghcr.io/langfuse/langfuse as ajv's URI parser (JSON Schema
      `$ref` and `format: uri` handling).

      Not exploitable here, with the honest limit stated: the defect matters
      when a parsed URI's authority is then used for a security decision — an
      allowlist check, an outbound fetch target. Langfuse uses ajv for request
      and schema validation, not for routing or origin decisions, so there is
      no path in this deployment from a caller-supplied URI through fast-uri to
      such a decision. This is "no reachable path found", not "the library is
      unreachable" — it is on the request path, behind the edge permission gate.

      Drop as soon as a Langfuse image ships fast-uri >= 3.1.6, which also
      clears the four entries that follow.

  # Four more fast-uri 3.1.4 advisories, published 2026-09-02 (the develop
