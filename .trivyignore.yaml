# Trivy ignore file for the `image-scan` job in `.github/workflows/security.yml`
# (ADR-0029), which scans the digest-pinned observability images and blocks on
# fixable HIGH/CRITICAL findings.
#
# An entry here is a DELIBERATE, TIME-BOXED exception, not noise tuning. Each one
# must say why the finding is not exploitable in OUR deployment and carry an
# `expired_at`, so the gate turns red again instead of silently ignoring a CVE
# forever if upstream never ships the fix.
#
# The Langfuse block below (ADR-0044) is deliberately boxed SHORTER than the
# first aspire-dashboard entry. That one waits on Microsoft shipping a
# transitive dependency bump; these wait on Langfuse running `npm update` on a
# project that publishes several releases a week. If they are still here in
# October, the assumption behind them was wrong and they deserve re-arguing
# rather than extending.
#
# The SECOND aspire-dashboard entry (CVE-2026-62901) is boxed shorter than all
# of them, for the opposite reason: it waits on Microsoft rebuilding an image
# on a runtime that already exists, which is a matter of days.
#
# The OpenTelemetry Collector block is boxed SHORT because contrib ships every
# ~two weeks, and that is exactly how it emptied: the pin moved 0.157.0 ->
# 0.160.0 and twelve of its thirteen entries went with it. The one that
# survives (amqp091-go) is boxed on the same bet — the next tag that carries
# 1.13.0, not a suppression that renews itself.
#
# The LAST entry is boxed shortest of all, and it is the only one here that is
# not a dependency of anything we or upstream chose: CVE-2026-14456 is OpenSSL
# in the Alpine base both Langfuse images are built from. It waits on Alpine
# publishing the patch and Langfuse rebuilding, which is days-to-weeks, not on
# anybody changing a manifest.
vulnerabilities:
  - id: CVE-2026-49451
    expired_at: 2026-10-31
    statement: |
      Microsoft.OpenApi 3.5.3 is a transitive dependency INSIDE Microsoft's
      aspire-dashboard image (app/Aspire.Dashboard.deps.json), not a package
      this repo references. The fix is 3.5.4/2.7.5, which no published
      aspire-dashboard tag ships yet (13.4.2 is the newest), so no digest bump
      can currently clear it.

      Not exploitable in this deployment: the CVE is a denial of service while
      PARSING an OpenAPI document with circular schema references, and the
      dashboard only PRODUCES its own OpenAPI description; it never parses
      caller-supplied OpenAPI documents. Its only reachable surfaces are the
      OIDC claim-gated UI on :18888 and the API-key-gated OTLP + telemetry
      endpoints, which stay cluster-internal.

      Drop this entry as soon as an aspire-dashboard image ships
      Microsoft.OpenApi >= 3.5.4, and re-check it on every dashboard bump.

  - id: CVE-2026-62901
    expired_at: 2026-09-12
    statement: |
      System.Net.WebSockets in the .NET 8.0.29 runtime bundled INSIDE Microsoft's
      aspire-dashboard image — an unchecked loop condition (CWE-606) that lets a
      network peer exhaust CPU. Fixed in 8.0.30, published 2026-08-11, the same
      day as the advisory; no aspire-dashboard tag ships it yet, so no digest
      bump can currently clear it.

      This one is boxed SHORT and its reachability is weaker than the entry
      above, so read the limit rather than the conclusion. The dashboard UI is
      Blazor Server, which means it really does terminate WebSockets — this is
      not an unreachable code path, and it would be dishonest to file it beside
      the OpenAPI entry as if it were.

      What makes it acceptable for a month is the network position, not the
      code. CVSS scores it AV:N/PR:N because the runtime defect needs no
      credentials; reaching the socket in THIS deployment does. The dashboard
      is cluster-internal, its :18888 UI sits behind the Envoy Gateway's OIDC
      flow gated on `platform:organizations:view`, and its OTLP receiver takes
      only otel-collector under a NetworkPolicy. So the attacker has to be an
      authenticated platform operator or already inside the cluster — and the
      prize is a denial of service against the observability dashboard, which
      degrades our ability to WATCH the product rather than the product itself.
      Availability-only: C:N/I:N.

      Drop this entry the moment an aspire-dashboard image ships a .NET 8.0.30
      runtime — that is the real fix and it is expected within days, which is
      why the box is one month and not the usual two. If it is still here in
      September, the assumption that Microsoft rebuilds promptly was wrong and
      this deserves re-arguing, not extending.

  # ── OpenTelemetry Collector contrib (ADR-0029) ────────────────────────────
  #
  # Thirteen entries used to sit here: the Go 1.26.5 standard library (eight),
  # the golang.org/x/mod sumdb pair, golang.org/x/crypto/ssh, and grpc. Every
  # one of them named the release that would clear it, and the pin moving from
  # 0.157.0 to 0.160.0 cleared all thirteen at once. Verified the way each of
  # those entries demanded — by reading the build info out of the candidate
  # binary rather than trusting the tag:
  #
  #   otel/opentelemetry-collector-contrib@sha256:799dc6cf… (0.160.0, amd64)
  #     go1.26.8                    (>= 1.26.6: the stdlib block)
  #     golang.org/x/mod   v0.40.0  (>= 0.40.0: CVE-2026-56864/56865)
  #     golang.org/x/crypto v0.55.0 (>= 0.55.0: CVE-2026-56854)
  #     google.golang.org/grpc v1.83.2 (>= 1.83.1: CVE-2026-84303/84304, and
  #                                  CVE-2026-84445, which was never boxed —
  #                                  it landed after the last develop scan and
  #                                  turned this job red)
  #
  # The bump introduced NO new advisory: every module the scanner still has
  # something to say about carries the identical version in 0.157.0 and
  # 0.160.0. Checked by diffing the two binaries' build info against OSV, not
  # by reading the release notes.
  #
  # One entry survives, below, because amqp091-go is still 1.12.0.

  # ── Go stdlib inside `usr/bin/migrate` in the Langfuse images (ADR-0044) ──
  #
  # These eight WERE boxed as a property of otelcol-contrib. That was only
  # ever half true, and deleting them with the collector bump proved it: a
  # trivy ignore matches on the CVE id across every scanned image, and the
  # same Go 1.26.5 standard library is compiled into `usr/bin/migrate` — the
  # golang-migrate binary in the Langfuse web and worker images. The
  # collector no longer needs them; that binary still does. Restored under
  # the name of what actually carries them, so the next person who clears
  # one image does not silently unbox another.
  #
  # Shared reachability: `migrate` is a one-shot schema migration, run at
  # container start against the ClickHouse and Postgres URLs the deployment
  # configures. It opens no listener, parses no attacker-supplied document,
  # and is not running while the service serves traffic. Every entry below
  # is a parser or transport defect reachable only by feeding the process
  # hostile input, which nothing in this deployment does.
  #
  # Drop the whole block when the Langfuse images ship a `migrate` built
  # with Go >= 1.26.6 — verify with `go version -m usr/bin/migrate` on the
  # candidate image rather than trusting the tag.

  - id: CVE-2026-33818
    expired_at: 2026-10-09
    statement: |
      encoding/asn1 — denial of service via excessive recursion in Unmarshal.
      Compiled into `usr/bin/migrate` (Go 1.26.5) in the digest-pinned
      Langfuse web and worker images; not a package this repo references.

      Not exploitable here: the binary runs schema migrations at startup
      against our own databases and exits. It accepts no network input and
      is not alive while the service is.

      Drop as soon as a Langfuse image ships `migrate` built with
      Go >= 1.26.6.

