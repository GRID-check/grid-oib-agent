# Trivy ignore file for the `image-scan` job in `.github/workflows/security.yml`
# (ADR-0029), which scans the digest-pinned observability images and blocks on
# fixable HIGH/CRITICAL findings.
#
# An entry here is a DELIBERATE, TIME-BOXED exception, not noise tuning. Each one
# must say why the finding is not exploitable in OUR deployment and carry an
# `expired_at`, so the gate turns red again instead of silently ignoring a CVE
# forever if upstream never ships the fix.
#
# Bump the pin before you box anything. On 2026-10-07 moving Langfuse 4.48.0
# -> 4.54.0 and aspire-dashboard 13.4.2 -> 13.5.2 cleared 34 of this file's 37
# vulnerability entries, verified by scanning the new digests with this file
# empty rather than by reading release notes. Two more went because they had
# already expired: the ClickHouse (OpenSSL) and err2issue (PCRE2) lines of a
# one-day staging exception that ran out on 2026-10-05.
#
# The OpenTelemetry Collector block is boxed SHORT because contrib ships every
# ~two weeks, and that is exactly how it emptied: the pin moved 0.157.0 ->
# 0.160.0 and twelve of its thirteen entries went with it, and 0.161.0 took
# the last (amqp091-go). It is empty now; keep it that way by bumping the pin,
# not by boxing what a newer tag already fixes.
vulnerabilities:
  # ── OpenTelemetry Collector contrib (ADR-0029) ────────────────────────────
  #
  # Thirteen entries used to sit here: the Go 1.26.5 standard library (eight),
  # the golang.org/x/mod sumdb pair, golang.org/x/crypto/ssh, and grpc. Every
  # one of them named the release that would clear it, and the pin moving from
  # 0.157.0 to 0.160.0 cleared all thirteen at once. Verified the way each of
  # those entries demanded — by reading the build info out of the candidate
  # binary rather than trusting the tag:
  #
  #   otel/opentelemetry-collector-contrib@sha256:799dc6cf… (0.160.0, amd64)
  #     go1.26.8                    (>= 1.26.6: the stdlib block)
  #     golang.org/x/mod   v0.40.0  (>= 0.40.0: CVE-2026-56864/56865)
  #     golang.org/x/crypto v0.55.0 (>= 0.55.0: CVE-2026-56854)
  #     google.golang.org/grpc v1.83.2 (>= 1.83.1: CVE-2026-84303/84304, and
  #                                  CVE-2026-84445, which was never boxed —
  #                                  it landed after the last develop scan and
  #                                  turned this job red)
  #
  # The bump introduced NO new advisory: every module the scanner still has
  # something to say about carries the identical version in 0.157.0 and
  # 0.160.0. Checked by diffing the two binaries' build info against OSV, not
  # by reading the release notes.
  #
  # The one that survived that bump, amqp091-go 1.12.0 (CVE-2026-79921), went
  # with the next: 0.161.0 (`sha256:fd328de2…`, amd64 binary read with
  # `go version -m`) carries amqp091-go v1.13.0, which also clears the nine
  # CVE-2026-774xx advisories published against 1.12.0 on 2026-09-23. OSV over
  # the full build info shows no module with an advisory 0.160.0 lacked.

  # ── Langfuse web/worker images (ADR-0044) ─────────────────────────────────
  #
  # An npm dependency bundled INSIDE ghcr.io/langfuse/langfuse and
  # langfuse-worker, not a package this repo references. Langfuse 4.54.0
  # cleared the rest of this block (fast-uri, js-yaml, nanoid, sharp, undici,
  # next, nodemailer, and the Go standard library in `usr/bin/migrate`); the
  # entry below is the one it did not.
  #
  # Shared context: the Langfuse UI is reachable only through the Envoy
  # Gateway behind an OIDC flow gated on `platform:organizations:view`, and its
  # OTLP receiver is cluster-internal with a NetworkPolicy admitting only
  # otel-collector. There is no unauthenticated surface.

  - id: CVE-2026-40345
    expired_at: 2026-10-09
    statement: |
      deepmerge-ts 7.1.5 — stack exhaustion when merging recursive object
      graphs. A denial of service that requires the attacker to control the
      objects being merged.

      Reached by exactly ONE dependent in langfuse's lockfile: `@prisma/config`
      6.19.3, which merges `prisma.config.ts` with the CLI's defaults when the
      Prisma CLI and migration engine start. Confirmed by reading the lockfile
      at the revision each image is labelled with, not inferred from the
      package name — deepmerge-ts appears nowhere else in the tree.

      Not exploitable here, and this one is structural: the object graph fed to
      `@prisma/config` is the config file baked into the Langfuse image,
      resolved against the environment `deploy/pulumi/src/platform/langfuse.ts`
      sets. It is assembled at container start, before any request is served.
      Nothing on the trace-ingestion or UI path calls deepmerge-ts at all, so no
      caller — authenticated or not — can supply the recursive graph the defect
      needs.

      This entry is boxed to the same date as the rest of the block even though
      it waits on a longer chain than they do: the fix is deepmerge-ts 8.0.0
      (2026-08-16), a MAJOR bump, so Prisma has to take it into
      `@prisma/config` before Langfuse can pick it up. 7.1.6 (2026-08-11) is
      not the fix. As of 2026-08-18 langfuse `main` — and the `latest` 4.12.0
      image built that morning — still resolve deepmerge-ts 7.1.5, so this is
      not a case of the pin lagging behind an available fix.

      Drop as soon as a Langfuse image ships deepmerge-ts >= 8.0.0.

  - id: CVE-2026-104850
    expired_at: 2026-11-08
    statement: |
      @modelcontextprotocol/sdk 1.29.0 (fixed in 1.31.0), in both
      ghcr.io/langfuse/langfuse (web) and langfuse-worker at 4.54.0. The advisory
      is the OAuth CLIENT sending credentials to an authorization server, so it
      matters only where the SDK's client OAuth flow runs.

      Not reached by Langfuse's code, checked by reading the images' bundled
      JavaScript (2026-10-08, pulled from the registry and streamed):
      - web imports only server-side SDK modules (server/index.js, server/mcp,
        server/streamableHttp, types, validation/ajv). It never imports
        client/auth.js.
      - worker's in-app agent builds its MCP client with a fixed server URL from
        operator config (LANGFUSE_MCP_BASE_URL / NEXTAUTH_URL) and a Basic key
        header, and passes no authProvider. The SDK runs its OAuth client only
        when an authProvider is set, so the credential-sending path is not
        entered.

      Not a bump: 4.54.0 is the newest Langfuse release in the registry as of
      2026-10-08 (tags listed, 5,243 total). Re-check on every Langfuse bump and
      drop this entry when an image ships @modelcontextprotocol/sdk >= 1.31.0.

  # ── ClickHouse (Langfuse telemetry store) ─────────────────────────────────
  #
  # Pinned at 26.8.15.10 LTS in deploy/pulumi/src/config.ts. The newest 26.8
  # release published on Docker Hub, 26.8.20.9, still ships libssl3
  # 3.0.2-0ubuntu1.29; its openssl package is 1.30. So no bump clears it yet.

  - id: CVE-2026-84782
    expired_at: 2026-11-08
    statement: |
      OpenSSL (libssl3 and openssl, Ubuntu 22.04), information disclosure via
      DTLS handshake retransmission. Fixed in 3.0.2-0ubuntu1.30.

      The defect is in DTLS, the UDP form of TLS. Its only network path is TCP:
      deploy/pulumi/src/platform/network-policies.ts allows the HTTP and native
      ports (TCP) and nothing else into ClickHouse, and only from Langfuse.
      Not verified: whether the image's ClickHouse build links or enables a
      DTLS listener. Drop when a ClickHouse 26.8 build ships libssl3 >=
      3.0.2-0ubuntu1.30, and re-check on every bump.

  # ── err2issue (ADR-0031) ──────────────────────────────────────────────────
  #
  # Digest-pinned in deploy/pulumi/src/config.ts. Eight findings from its Debian
  # 12.15 base (perl-base, libpcre2-8-0), read from the image-scan log on
  # 2026-10-08. Patched Debian packages exist for the ones that name a fixed
  # version, so the real fix is a rebuild on a patched base and a digest bump.
  #
  # Accepted by the repo owner on 2026-10-08 until that rebuild lands. The
  # expiry reopens the gate. err2issue's source is not in this repo, so reach
  # from its code into these libraries is NOT established here, and the
  # statements below do not claim the findings are unexploitable. Clear them
  # when the rebuilt image scans clean.

  - id: CVE-2026-103111
    expired_at: 2026-11-08
    statement: |
      libpcre2-8-0 10.42-1+deb12u1, out-of-bounds write via a crafted regular
      expression. Fixed in 10.42-1+deb12u2. See the err2issue block above.

  - id: CVE-2026-13221
    expired_at: 2026-11-08
    statement: |
      perl-base 5.36.0-7+deb12u3, incorrect regular expression processing on
      large expressions. Fixed in 5.36.0-7+deb12u4. See the err2issue block above.

  - id: CVE-2026-8376
    expired_at: 2026-11-08
    statement: |
      perl-base, heap buffer overflow compiling regular expressions on 32-bit
      builds. Whether the image is a 32-bit build was not checked here. See the
      err2issue block above.

  - id: CVE-2026-42496
    expired_at: 2026-11-08
    statement: |
      perl-archive-tar, path traversal via crafted symlinks. See the err2issue
      block above.

  - id: CVE-2026-42497
    expired_at: 2026-11-08
    statement: |
      perl-Archive-Tar, arbitrary file modification via crafted hardlinks during
      extraction. See the err2issue block above.

  - id: CVE-2026-48962
    expired_at: 2026-11-08
    statement: |
      perl-IO-Compress, arbitrary code execution via an attacker-controlled output
      glob. See the err2issue block above.

  - id: CVE-2026-57432
    expired_at: 2026-11-08
    statement: |
      perl, information disclosure via integer overflow in pack/unpack. See the
      err2issue block above.

  - id: CVE-2026-57433
    expired_at: 2026-11-08
    statement: |
      Storable, denial of service via signed integer overflow in deserialization.
      See the err2issue block above.

secrets:
  - id: gcp-service-account
    paths:
      - "**/web/.next/**"
    expired_at: 2026-11-30
    statement: |
      Eight CRITICAL "Google (GCP) Service-account" hits across the Next.js
      build output inside ghcr.io/langfuse/langfuse. Every one is Langfuse's own
      UI PLACEHOLDER for pasting a Vertex AI credential — the matched text is
      the empty template, `"project_id": "<project_id>"`,
      `"client_x509_cert_url": "<client_x509_cert_url>"`, sitting next to
      `displaySecretKey` in a form component. There is no key material.
      Confirmed by reading the matched lines in the scan output, not inferred
      from the rule name.

      Scoped to `**/web/.next/**` rather than suppressing the rule outright, so
      a genuinely leaked service-account key anywhere else in any scanned image
      still fails the gate. Only the Langfuse web image has that path among the
      five pinned images.

      The `expired_at` here is a RE-VERIFICATION date, not a wait-for-a-fix
      date: upstream will never "fix" placeholder text in a form. It is boxed so
      that someone confirms, after a Langfuse bump, that these matches are still
      the template and not something that has become real.
