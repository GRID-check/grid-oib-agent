# Trivy ignore file for the `image-scan` job in `.github/workflows/security.yml`
# (ADR-0029), which scans the digest-pinned observability images and blocks on
# fixable HIGH/CRITICAL findings.
#
# An entry here is a DELIBERATE, TIME-BOXED exception, not noise tuning. Each one
# must say why the finding is not exploitable in OUR deployment and carry an
# `expired_at`, so the gate turns red again instead of silently ignoring a CVE
# forever if upstream never ships the fix.
#
# Bump the pin before you box anything. On 2026-10-07 moving Langfuse 4.48.0
# -> 4.54.0 and aspire-dashboard 13.4.2 -> 13.5.2 cleared 34 of this file's 37
# vulnerability entries, verified by scanning the new digests with this file
# empty rather than by reading release notes. Two more went because they had
# already expired: the ClickHouse (OpenSSL) and err2issue (PCRE2) lines of a
# one-day staging exception that ran out on 2026-10-05.
#
# The OpenTelemetry Collector block is boxed SHORT because contrib ships every
# ~two weeks, and that is exactly how it emptied: the pin moved 0.157.0 ->
# 0.160.0 and twelve of its thirteen entries went with it, and 0.161.0 took
# the last (amqp091-go). It is empty now; keep it that way by bumping the pin,
# not by boxing what a newer tag already fixes.
vulnerabilities:
  # ── OpenTelemetry Collector contrib (ADR-0029) ────────────────────────────
  #
  # Thirteen entries used to sit here: the Go 1.26.5 standard library (eight),
  # the golang.org/x/mod sumdb pair, golang.org/x/crypto/ssh, and grpc. Every
  # one of them named the release that would clear it, and the pin moving from
  # 0.157.0 to 0.160.0 cleared all thirteen at once. Verified the way each of
  # those entries demanded — by reading the build info out of the candidate
  # binary rather than trusting the tag:
  #
  #   otel/opentelemetry-collector-contrib@sha256:799dc6cf… (0.160.0, amd64)
  #     go1.26.8                    (>= 1.26.6: the stdlib block)
  #     golang.org/x/mod   v0.40.0  (>= 0.40.0: CVE-2026-56864/56865)
  #     golang.org/x/crypto v0.55.0 (>= 0.55.0: CVE-2026-56854)
  #     google.golang.org/grpc v1.83.2 (>= 1.83.1: CVE-2026-84303/84304, and
  #                                  CVE-2026-84445, which was never boxed —
  #                                  it landed after the last develop scan and
  #                                  turned this job red)
  #
  # The bump introduced NO new advisory: every module the scanner still has
  # something to say about carries the identical version in 0.157.0 and
  # 0.160.0. Checked by diffing the two binaries' build info against OSV, not
  # by reading the release notes.
  #
  # The one that survived that bump, amqp091-go 1.12.0 (CVE-2026-79921), went
  # with the next: 0.161.0 (`sha256:fd328de2…`, amd64 binary read with
  # `go version -m`) carries amqp091-go v1.13.0, which also clears the nine
  # CVE-2026-774xx advisories published against 1.12.0 on 2026-09-23. OSV over
  # the full build info shows no module with an advisory 0.160.0 lacked.

  # ── Langfuse web/worker images (ADR-0044) ─────────────────────────────────
  #
  # An npm dependency bundled INSIDE ghcr.io/langfuse/langfuse and
  # langfuse-worker, not a package this repo references. Langfuse 4.54.0
  # cleared the rest of this block (fast-uri, js-yaml, nanoid, sharp, undici,
  # next, nodemailer, and the Go standard library in `usr/bin/migrate`); the
  # entry below is the one it did not, and 4.56.0 (the current pin) does not
  # either.
  #
  # 4.56.0 also moved both images from node:24-alpine to UBI 9 micro. Every
  # Alpine package finding is gone with that base, and any UBI 9 (RHEL)
  # finding is new to this file: scan the 4.56.0 digests with the Langfuse
  # entries removed before boxing anything against the new base.
  #
  # Shared context: the Langfuse UI is reachable only through the Envoy
  # Gateway behind an OIDC flow gated on `platform:organizations:view` or
  # `platform:observability:view`, and its in-cluster API (OTLP receiver and
  # public API) is reachable only from the pods a NetworkPolicy names: the
  # collector, the BFF, the backend tiers, the purger and the scheduler. There
  # is no unauthenticated surface.

  - id: CVE-2026-40345
    expired_at: 2026-11-09
    statement: |
      deepmerge-ts 7.1.5 (GHSA-ggr8-5vv4-36mx) — stack exhaustion when BOTH
      merged objects reference themselves at the same key path. A denial of
      service that needs the attacker to supply a cyclic object graph, which
      plain JSON cannot express.

      Three copies, every one pulled in by `@prisma/config` 6.19.3, which pins
      `"deepmerge-ts": "7.1.5"` exactly: `usr/local/lib/node_modules/prisma` and
      `app/node_modules/.pnpm` in langfuse, `app/worker/node_modules/.pnpm` in
      langfuse-worker (scan of PR #855, 2026-10-09, against 4.54.0). The 8.0.2
      copy beside them in both images scans clean. Still present in 4.56.0:
      its pnpm-lock.yaml resolves `@prisma/config@6.19.3` and
      `deepmerge-ts@7.1.5`, and its web Dockerfile still installs the CLI as
      `prisma@6.19.3` under `/usr/local` (read from the v4.56.0 tag, not from a
      scan of the new digests).

      Not exploitable here, and this one is structural: the Prisma CLI runs only
      from the web image's entrypoint (`prisma db execute`, `prisma migrate
      deploy`) before `server.js` starts, merging the config baked into the
      image with the environment `deploy/pulumi/src/platform/langfuse.ts` sets.
      The worker runs `node worker/dist/index.js`, and `@prisma/client` has no
      runtime dependency on `@prisma/config`. No request path reaches
      deepmerge-ts, authenticated or not.

      Re-argued on 2026-10-09 rather than extended. The first box (to
      2026-10-09) waited on a Langfuse release; none can clear it yet. Every
      stable `@prisma/config` through 7.10.0 (2026-08-25, `latest` on npm) pins
      7.1.5, the first to take 8.x is 8.1.0-dev.5 (2026-09-01), and Langfuse
      4.55.0 (2026-10-08) still shipped Prisma 6.19.3, read from its layers, as
      does 4.56.0 (2026-10-09, the current pin), read from its lockfile. Boxed a
      month because the exit is a Prisma major, then Langfuse adopting it.

      Drop as soon as a Langfuse image ships `@prisma/config` >= 8 (deepmerge-ts
      >= 8.0.0).

  # ── Findings published after the 2026-10-07 bump (scan of PR #853) ────────
  #
  # These landed in the trivy DB after the last green develop scan and turned
  # the job red on every PR that touches an image. Boxed SHORT: each one names
  # a fixed version, so the right exit is a pin bump, not a renewal.

  - id: CVE-2026-84782
    expired_at: 2026-10-22
    statement: |
      OpenSSL 3.0.2 (libssl3/openssl) in clickhouse/clickhouse-server —
      information disclosure via DTLS handshake retransmission. ClickHouse
      speaks TLS over TCP only and never negotiates DTLS, and the server is
      reachable solely by Langfuse inside the cluster. Fixed in Ubuntu's
      3.0.2-0ubuntu1.30; drop when the ClickHouse pin carries it.

  - id: CVE-2026-104850
    expired_at: 2026-10-22
    statement: |
      @modelcontextprotocol/sdk 1.29.0 bundled inside langfuse and
      langfuse-worker — the SDK's OAuth CLIENT can send credentials to an
      authorization server it should not trust. The defect lives in the
      client-side OAuth discovery flow; Langfuse here makes no outbound MCP
      OAuth connections, and its UI sits behind the Envoy Gateway's OIDC flow.
      Fixed in 1.31.0; drop when a Langfuse image ships it. Langfuse 4.56.0 (the
      current pin) does not: its pnpm-lock.yaml still resolves 1.29.0.

  # OpenTelemetry Collector contrib 0.161.0 (the pin), Go 1.26.8 standard
  # library, published after the 2026-10-08 scans (first red on PR #932).
  # Both name Go 1.26.9 as the fix, and no contrib release carries it yet:
  # 0.162.0 (2026-10-05, `sha256:39923a8e…`, amd64 binary read with
  # `go version`) is still go1.26.8, and 0.163.0 exists only as a nightly.
  # Shared context: the collector's OTLP receivers listen in plaintext inside
  # the cluster, reachable from pods in the namespace and from no route, and
  # its exporters speak plain HTTP to the Aspire dashboard and Langfuse.
  # Bump the pin to the first contrib release built with go >= 1.26.9 and drop
  # both.
  - id: CVE-2026-78667
    expired_at: 2026-10-23
    statement: |
      net/http denial of service through crafted Range headers. Range is
      honoured by http.ServeContent / FileServer; the collector's OTLP/HTTP
      receiver accepts POSTed telemetry and serves no ranged content, and no
      route exposes it outside the namespace. See the block note.
  - id: CVE-2026-97031
    expired_at: 2026-10-23
    statement: |
      crypto/tls denial of service through repeated ECH outer-extension
      references in a ClientHello. No TLS listener or TLS client is configured
      on this collector (plaintext in-cluster receivers and exporters), so no
      ClientHello reaches crypto/tls. See the block note.

  # err2issue (debian 12.15 base). Perl and PCRE2 come from the Debian base
  # image; the Python service never shells out to perl and takes no
  # attacker-supplied regular expressions. The fix is a rebuild on a current
  # bookworm base (perl 5.36.0-7+deb12u4, pcre2 10.42-1+deb12u2) and a pin
  # bump; drop the block then.
  - id: CVE-2026-103111
    expired_at: 2026-10-22
    statement: libpcre2-8-0 in the err2issue base image; see the block note.
  - id: CVE-2026-13221
    expired_at: 2026-10-22
    statement: perl-base in the err2issue base image; see the block note.
  - id: CVE-2026-42496
    expired_at: 2026-10-22
    statement: perl Archive::Tar in the err2issue base image; see the block note.
  - id: CVE-2026-42497
    expired_at: 2026-10-22
    statement: perl Archive::Tar in the err2issue base image; see the block note.
  - id: CVE-2026-8376
    expired_at: 2026-10-22
    statement: perl-base (32-bit builds only) in the err2issue base image; see the block note.
  - id: CVE-2026-48962
    expired_at: 2026-10-22
    statement: perl IO::Compress in the err2issue base image; see the block note.
  - id: CVE-2026-57432
    expired_at: 2026-10-22
    statement: perl pack/unpack in the err2issue base image; see the block note.
  - id: CVE-2026-57433
    expired_at: 2026-10-22
    statement: perl Storable in the err2issue base image; see the block note.

secrets:
  - id: gcp-service-account
    paths:
      - "**/web/.next/**"
    expired_at: 2026-11-30
    statement: |
      Eight CRITICAL "Google (GCP) Service-account" hits across the Next.js
      build output inside ghcr.io/langfuse/langfuse. Every one is Langfuse's own
      UI PLACEHOLDER for pasting a Vertex AI credential — the matched text is
      the empty template, `"project_id": "<project_id>"`,
      `"client_x509_cert_url": "<client_x509_cert_url>"`, sitting next to
      `displaySecretKey` in a form component. There is no key material.
      Confirmed by reading the matched lines in the scan output, not inferred
      from the rule name.

      Scoped to `**/web/.next/**` rather than suppressing the rule outright, so
      a genuinely leaked service-account key anywhere else in any scanned image
      still fails the gate. Only the Langfuse web image has that path among the
      pinned images.

      The `expired_at` here is a RE-VERIFICATION date, not a wait-for-a-fix
      date: upstream will never "fix" placeholder text in a form. It is boxed so
      that someone confirms, after a Langfuse bump, that these matches are still
      the template and not something that has become real.

  - id: private-key
    paths:
      - "**/ssl-cert-snakeoil.key"
    expired_at: 2026-11-30
    statement: |
      ghcr.io/cloudnative-pg/pgbouncer ships Debian's ssl-cert "snakeoil" key,
      generated at image build by the ssl-cert package that the PGDG pgbouncer
      package pulls in. It is a self-signed placeholder, identical for every
      pull of the digest, and nothing here uses it: the CloudNativePG Pooler
      mounts its own server and client certificates from the cluster's
      secrets and points pgbouncer's TLS settings at them.

      Scoped to that one filename so a real private key anywhere else in any
      scanned image still fails the gate. RE-VERIFICATION date, like the
      Langfuse entry above: confirm after a pgbouncer bump that the match is
      still the snakeoil file.
