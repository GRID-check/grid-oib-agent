  - id: GHSA-f88m-g3jw-g9cj
    expired_at: 2026-10-09
    statement: |
      sharp 0.34.5 — inherited libvips CVEs (CVE-2026-33327, CVE-2026-33328,
      CVE-2026-35590, CVE-2026-35591), reached by decoding a malicious image.

      Not exploitable here, and this is the strongest of the six because it
      rests on our own configuration rather than on upstream's internals:
      `deploy/pulumi/src/platform/langfuse.ts` deliberately does NOT set
      `LANGFUSE_S3_MEDIA_UPLOAD_*`, and Langfuse enables media capture only by
      the presence of that bucket. Nothing in this deployment feeds an image to
      sharp, because nothing can upload one.

      THIS ENTRY MUST BE RE-ARGUED IF MEDIA UPLOAD IS EVER CONFIGURED. That
      change would turn an unreachable decoder into a caller-reachable one.

      Drop as soon as a Langfuse image ships sharp >= 0.35.0.

  - id: CVE-2026-13697
    expired_at: 2026-10-09
    statement: |
      undici 7.28.0 — information disclosure and denial of service via
      malformed `Cache-Control` directives in a RESPONSE.

      Not exploitable here: the defect needs a response from an origin the
      attacker controls. Langfuse's outbound HTTP in this deployment goes to
      infrastructure named in its own config (Postgres, ClickHouse, the
      SeaweedFS S3 endpoint, the WorkOS issuer) — all operator-configured. The
      one surface that could reach an arbitrary origin is a BYOK model endpoint
      entered in the playground, which is itself a platform-operator action
      behind the permission gate.

      Drop as soon as a Langfuse image ships undici >= 7.29.0.

  # ── Langfuse app dependencies, second wave (ADR-0044) ─────────────────────
  #
  # Five advisories published after the seven boxed above, in the same two
  # digest-pinned images. They were red on develop before the branch that boxes
  # them existed — security.yml only runs on push to develop and weekly, so
  # develop is green on a scan that predates these.
  #
  # No digest bump clears them. Checked the way the block above demands, by
  # reading the newest release's node_modules rather than its release notes:
  # langfuse 3.225.7 (newest 3.x tag) still ships next@16.2.11,
  # js-yaml@3.15.0 + @4.3.0 and nodemailer@9.0.3 — the same versions the pin
  # carries.
  #
  # Two are CRITICAL, and both are structurally inapplicable to THIS image for
  # reasons read out of the image itself — app/web/.next/required-server-files.json
  # in ghcr.io/langfuse/langfuse@sha256:c782c55… (linux/amd64):
  #
  #   images.formats        = ["image/webp"]   -- AVIF is not enabled
  #   images.domains        = []               -- no remote image source
  #   images.remotePatterns = []               -- no remote image source
  #
  # Standing bound on all five: Langfuse is the LLM-observability plane, not
  # the product. Losing it costs tracing, not chat — ADR-0044's whole point is
  # that the agent degrades rather than fails when Langfuse is gone.

  - id: CVE-2026-75604
    expired_at: 2026-10-09
    statement: |
      next 16.2.11 — CRITICAL, unauthenticated RCE via unescaped backslashes in
      incremental-cache paths. Fixed in 15.5.24 / 16.3.3.

      Not exploitable here, structurally: the defect is Windows-only. It is
      backslash handling in `escape-path-delimiters.ts` and
      `file-system-cache.ts`, reached by encoded WINDOWS path separators
      traversing outside the cache root, and the advisory scopes itself to
      "Windows-hosted servers". These are linux/amd64 Node images on a Linux
      Kubernetes cluster, where a backslash is an ordinary filename character
      and no traversal occurs.

      Drop when a Langfuse image ships next >= 16.3.3.

  - id: GHSA-2xp9-vwfh-vxw4
    expired_at: 2026-10-09
    statement: |
      next 16.2.11 — CRITICAL, unauthenticated RCE in the Image Optimization
      API: libheif (via sharp) can be driven to code execution when an AVIF
      file is optimized. Fixed in 15.5.24 / 16.3.3.

      Two independent reasons it cannot fire on this image, both read out of
      its own build manifest rather than assumed:

      1. AVIF is not enabled. `images.formats` is ["image/webp"]; AVIF
         optimization is opt-in and this build did not opt in. Upstream Next
         additionally disabled AVIF optimization outright in response to this
         advisory ("until a fix has propagated").
      2. The optimizer has no remote input. `images.domains` and
         `images.remotePatterns` are both empty, so `/_next/image` optimizes
         only assets shipped inside the image. An attacker cannot hand it a
         file at all, hostile AVIF or otherwise.

      Re-verify BOTH when bumping the pin — an upstream build that enables AVIF
      or adds a remotePattern removes the argument, and neither shows up as a
      version change:
        tar -xzOf <layer> app/web/.next/required-server-files.json \
          | jq .config.images

      Drop when a Langfuse image ships next >= 16.3.3.

  - id: GHSA-rgj7-g3m4-5g8c
    expired_at: 2026-10-09
    statement: |
      sharp 0.34.5 — HIGH, the libheif defects behind the Next advisory above.
      Fixed in 0.35.4 (libheif 1.23.2). "Those processing untrusted input are
      affected."

      Not exploitable here for the same verified reason: in this image sharp is
      reached through Next's image optimizer, which accepts no remote source
      (`images.domains` and `images.remotePatterns` are both empty) and does
      not emit AVIF (`images.formats` is ["image/webp"]). Langfuse exposes no
      other image-processing surface — it ingests JSON traces, not media.

      Drop when a Langfuse image ships sharp >= 0.35.4.

  - id: GHSA-2x7j-588g-ccc2
    expired_at: 2026-10-09
    statement: |
      nodemailer 9.0.3 — HIGH, quadratic time in `addressparser`: a multi-MB
      address list blocks the event loop for minutes. Availability only
      (C:N/I:N/A:H). Fixed in 9.1.0.

      Bounded here rather than absent, and worth saying plainly: the parser is
      reached through Langfuse's own mail paths (project invitations, alert
      delivery), whose addresses come from a signed-in member of a project. The
      surface is authenticated, so this is a tenant member able to stall their
      own Langfuse instance, not an anonymous internet DoS — and the blast
      radius is the observability plane, which the agent survives without.

      Drop when a Langfuse image ships nodemailer >= 9.1.0.

  - id: CVE-2026-84375
    expired_at: 2026-10-09
    statement: |
      js-yaml 3.15.0 and 4.3.0 — HIGH, `maxTotalMergeKeys` does not count empty
      merge sources, so a small document can burn CPU. Availability only
      (C:N/I:N/A:H). Fixed in 3.15.2 / 4.3.2.

      Requires parsing UNTRUSTED YAML. Langfuse's ingestion surface is JSON —
      the OTLP receiver and the public API take no YAML — and js-yaml arrives
      here as a transitive dependency of build and config tooling rather than
      of a request path.

      Stated as the WEAKEST argument in this block: it rests on no request
      handler reaching a YAML parse, which is a reading of the upstream tree
      rather than a property of our own configuration, the way the two
      `images.*` facts above are. If one of these five is to be re-argued
      rather than renewed, it is this one.

      Drop when a Langfuse image ships js-yaml >= 4.3.2 (and >= 3.15.2 for the
      3.x copy).

  # ── Langfuse web/worker images — the Alpine BASE, not the app (ADR-0044) ──
  #
  # The seven entries above are npm packages Langfuse bundles. This one is a
  # different animal and is filed apart from them on purpose: it is an OS
  # package in the base image both Langfuse images are built FROM, so nothing
  # Langfuse does to its own dependency tree affects it and the "no digest bump
  # clears it" reasoning above does not transfer — it had to be re-established
  # against the registry, and it was.

  - id: CVE-2026-14456
    expired_at: 2026-09-26
    statement: |
      libcrypto3 / libssl3 3.5.7-r0 — OpenSSL, unbounded memory growth in the
      QUIC SERVER path, a denial of service. Present in both
      ghcr.io/langfuse/langfuse and ghcr.io/langfuse/langfuse-worker
      (alpine 3.24.1). Marked `fixed` upstream in 3.5.8-r0, so
      `--ignore-unfixed` does not skip it.

      No digest bump clears it, and neither does a major upgrade. Every
      currently published Langfuse image was checked by pulling its amd64
      manifest from ghcr and reading `lib/apk/db/installed` out of the base
      layer — not by reading release notes and not by assuming:

        langfuse:3         (3.225.2)  alpine 3.24.1  libcrypto3/libssl3 3.5.7-r0
        langfuse:latest    (4.x)      alpine 3.24.1  libcrypto3/libssl3 3.5.7-r0
        langfuse-worker:3             alpine 3.24.1  libcrypto3/libssl3 3.5.7-r0
        langfuse-worker:latest        alpine 3.24.1  libcrypto3/libssl3 3.5.7-r0

      The 3 -> 4 major line ships the identical vulnerable base, so "just
      upgrade" is not an available fix here; it would be a schema migration
      that buys nothing on this CVE.

      Not exploitable in this deployment, and the reason is the QUIC half of
      the advisory rather than the OpenSSL half. The defect is in OpenSSL's
      QUIC server implementation, which only runs for a process that serves
      QUIC through that API. Nothing in this cluster does:

        * `deploy/pulumi/src/` contains no occurrence of quic, http3 or alpn —
          no listener, no ALPN advertisement, no UDP port anywhere.
        * The Langfuse listeners in `platform/gateway.ts` are Gateway API
          `protocol: "HTTPS"` with `tls: { mode: "Terminate" }`, so TLS is
          terminated at the Envoy Gateway. The Langfuse containers never
          terminate TLS at all: the web tier listens on one plain container
          port named `http` (`platform/langfuse.ts`), and the worker sits
          behind no Service.
        * Reaching the web tier at all means passing the Envoy edge and the
          OIDC flow gated on `platform:organizations:view`, per the shared
          context above.

      The argument deliberately does NOT rest on whether Node in these images
      links Alpine's libssl3 — that was not verified and does not need to be.
      Even a process that links it cannot reach a QUIC server path it never
      opens.

      Boxed SHORTER than the npm entries above (2026-09-26 against 2026-10-09)
      because it waits on something faster: Alpine publishing 3.5.8-r0 into the
      3.24 branch and Langfuse rebuilding on it, and Langfuse rebuilds several
      times a week. Drop it as soon as a Langfuse image ships
      libcrypto3/libssl3 >= 3.5.8-r0 — check with the same base-layer read, not
      by version number alone, since both tags moved without moving this
      package once already.

secrets:
  - id: gcp-service-account
    paths:
      - "**/web/.next/**"
    expired_at: 2026-11-30
    statement: |
      Eight CRITICAL "Google (GCP) Service-account" hits across the Next.js
      build output inside ghcr.io/langfuse/langfuse. Every one is Langfuse's own
      UI PLACEHOLDER for pasting a Vertex AI credential — the matched text is
      the empty template, `"project_id": "<project_id>"`,
      `"client_x509_cert_url": "<client_x509_cert_url>"`, sitting next to
      `displaySecretKey` in a form component. There is no key material.
      Confirmed by reading the matched lines in the scan output, not inferred
      from the rule name.

      Scoped to `**/web/.next/**` rather than suppressing the rule outright, so
      a genuinely leaked service-account key anywhere else in any scanned image
      still fails the gate. Only the Langfuse web image has that path among the
      five pinned images.

      The `expired_at` here is a RE-VERIFICATION date, not a wait-for-a-fix
      date: upstream will never "fix" placeholder text in a form. It is boxed so
      that someone confirms, after a Langfuse bump, that these matches are still
      the template and not something that has become real.
