# Grid agent — single source of truth for "how do I run this?"
#
# Why this file exists
# -------------------
# The same commands were previously written down in three places that drifted
# independently: `.github/workflows/ci.yml`, the verification table in
# AGENTS.md, and the `ci:*` scripts in `frontends/ui/package.json` (which
# pointed at a `scripts/ci-check.sh` that did not exist). Documented commands
# also assumed a Windows venv layout (`.venv/Scripts/python.exe`) and so did not
# run in CI, the devcontainer, or an agent session.
#
# Everything below is defined once and consumed by humans, agents and CI alike.
# `task verify` IS the merge gate — if it passes locally it passes in CI, and if
# it drifts, it drifts for everyone at once instead of silently for one of them.
#
# Install:  npm i -g @go-task/cli   (or see https://taskfile.dev/installation/)
# Discover: task --list

version: '3'

vars:
  UI: frontends/ui
  # Agent Package Manager CLI, pinned so every machine and CI resolve the same
  # skill bytes. Bump deliberately and re-run `task agents:audit`.
  APM_VERSION: 0.28.0
  WEB: frontends/web
  # go-task ships its own POSIX shell, so command SYNTAX is already portable and
  # nothing below needs an OS branch. These two are the exception, because they
  # are Python packaging facts rather than shell facts: a virtualenv puts its
  # executables in `Scripts/` on Windows and `bin/` everywhere else. Stated once
  # here so no task has to know about it.
  #
  # `uv run` would sidestep the whole question, but not in this repo: it
  # resolves an environment without the `sources/` workspace packages, so the
  # knowledge-layer tests fail to import. The venv that `uv sync --group dev`
  # builds is the one that works.
  VENV_BIN: '{{if eq OS "windows"}}.venv/Scripts{{else}}.venv/bin{{end}}'
  EXE: '{{if eq OS "windows"}}.exe{{end}}'
  PY: '{{.VENV_BIN}}/python{{.EXE}}'
  RUFF: '{{.VENV_BIN}}/ruff{{.EXE}}'
  # Release-note tooling runs OUTSIDE the project environment on purpose. reno is
  # needed by two tasks and one workflow, never by the product, so putting it in
  # `[dependency-groups]` would add a resolver constraint (and uv.lock churn) to
  # every backend install for tooling none of them uses. `--no-project` builds a
  # throwaway env from uv's cache instead — offline after the first run.
  RENO: uv run --no-project --with reno==4.1.0 reno --rel-notes-dir releasenotes
  RELNOTES: uv run --no-project --with reno==4.1.0 python scripts/release_notes.py

env:
  # The documented footgun, removed. Without this pytest resolves `aiq_agent`
  # from whatever is installed in the venv rather than from this worktree, and
  # validates the wrong code while appearing to pass.
  PYTHONPATH: src

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  # ── the gate ────────────────────────────────────────────────────────────────

  verify:
    desc: 'Full merge gate: everything CI runs. Passing here means passing in CI.'
    cmds:
      # Delegate to the same per-tier task groups CI invokes, so there is one
      # definition of each tier's gate rather than a second list here that can
      # drift from the workflow (that drift is exactly what this file removes).
      - task: lint:repo
      - task: be:verify
      - task: fe:verify
      - task: web:verify
      - task: infra:types
      - task: infra:test

  verify:fast:
    desc: Everything CI runs except the production builds (the slow step)
    cmds:
      - task: lint:repo
      - task: be:verify
      # `fe:verify` minus `fe:build` — the only UI check this task omits.
      - task: fe:lint
      - task: fe:types
      - task: fe:test:ci
      # `web:verify` minus `web:build` — the only web check this task omits.
      - task: web:install
      - task: web:check
      - task: infra:types
      - task: infra:test

  setup:
    desc: Install every toolchain this repo needs (backend venv + UI + web + infra)
    env:
      # Same reason as .github/actions/setup-python-env: nltk pathsec refuses
      # hard-linked corpora, and SentenceSplitter (production + retrieval gate)
      # opens them. Copy mode is the install, not a per-job workaround.
      UV_LINK_MODE: copy
    cmds:
      - uv venv .venv
      - uv sync --group dev
      - task: fe:install
      - task: web:install
      # Two Node programs under deploy/pulumi, each with its own lockfile: the
      # Pulumi program itself (which `infra:types` typechecks and `infra:test`
      # runs) and the policy pack beside it. Installing only the policy pack
      # left a fresh clone failing `task verify` at `infra:types`, because the
      # program's own TypeScript and Vitest were never fetched.
      - npm --prefix deploy/pulumi ci
      - npm --prefix deploy/pulumi/policy ci
      - task: agents:setup

  # ── agent skills (apm) ──────────────────────────────────────────────────────
  #
  # `skills/` is the single source: this repo's own skills live there, declared
  # in `apm.yml` as local paths beside the pinned third-party ones. apm
  # publishes the whole set into every target in that manifest, so `.claude/`
  # and `.agents/` are GENERATED and gitignored. Adding a harness is one line
  # in `apm.yml`, not a new copy step here.
  #
  # Run through `uvx` rather than a global install: uv is already required for
  # the backend venv, and this way the CLI version is pinned in one line here
  # instead of depending on whatever `apm` happens to be on someone's PATH.
  # `--frozen` refuses to install when the lockfile is missing or out of sync,
  # which is what makes this reproducible in CI.

  agents:setup:
    desc: Publish every skill in apm.yml into the harness directories it targets
    cmds:
      - uvx --from apm-cli=={{.APM_VERSION}} apm install --frozen

  agents:audit:
    desc: Scan installed agent skills for drift and hidden Unicode
    cmds:
      - uvx --from apm-cli=={{.APM_VERSION}} apm audit

  agents:update:
    desc: Refresh agent-skill pins in apm.yml, then review the diff before committing
    cmds:
      - uvx --from apm-cli=={{.APM_VERSION}} apm update --yes

  # ── frontend (frontends/ui) ─────────────────────────────────────────────────

  fe:install:
    desc: Install UI dependencies
    dir: '{{.UI}}'
    cmds:
      # Bun is the INSTALLER and script runner only — never the runtime. Do not
      # add `--bun`: it exports NODE_OPTIONS=--bun, and Turbopack's PostCSS step
      # spawns a real `node`, which rejects the flag and fails the build.
      - bun install --frozen-lockfile

  fe:lint:
    desc: ESLint the UI
    dir: '{{.UI}}'
    cmds:
      - bun run lint

  fe:types:
    desc: Typecheck the UI (includes specs — a spec type error blocks next build)
    dir: '{{.UI}}'
    cmds:
      - bun run type-check

  fe:test:
    desc: Run the UI test suite
    dir: '{{.UI}}'
    cmds:
      - bun run test

  fe:test:ci:
    desc: UI tests with the coverage reporters CI's coverage comment consumes
    dir: '{{.UI}}'
    cmds:
      - bun run test:ci -- --coverage.reporter=json-summary --coverage.reporter=json

  db:test:rls:
    desc: >-
      Tenant-isolation suite against a throwaway Postgres, connected as the
      restricted runtime role (ADR-0041). Needs PostgreSQL server binaries.
    cmds:
      - bash scripts/rls-test-db.sh

  fe:test:shard:
    desc: 'One shard of the UI suite, as a blob report (CI: SHARD=1/4 task fe:test:shard)'
    dir: '{{.UI}}'
    cmds:
      # `--reporter=blob` writes .vitest-reports/ instead of printing a summary;
      # fe:test:merge stitches the shards back into one run + one coverage set.
      # Coverage must be collected per shard — it cannot be recomputed at merge
      # time, because each shard only ever loaded its own slice of the app.
      - bun run test:shard -- --shard={{.SHARD}}

  fe:test:merge:
    desc: Merge sharded blob reports into one result + the coverage CI comments on
    dir: '{{.UI}}'
    cmds:
      - >-
        bun run test:merge --
        --coverage.reporter=json-summary --coverage.reporter=json
        --coverage.reporter=text-summary

  fe:build:
    desc: Production build of the UI
    dir: '{{.UI}}'
    cmds:
      - bun run build

  fe:screenshots:
    desc: 'Capture UI screenshot evidence (optional: -- <registry id>)'
    dir: '{{.UI}}'
    cmds:
      - bun run screenshots -- {{.CLI_ARGS}}

  fe:touch-audit:
    desc: 'Measure every /dev surface at a phone viewport (optional: -- <registry id>)'
    dir: '{{.UI}}'
    cmds:
      # Reports overflow, scroll traps and sub-44px targets. NOT part of
      # `verify`: the shape errors it exists for are held statically by
      # `mobile-affordances.spec.ts`, and a browser measurement of ~120 surfaces
      # is a deliberate run, not a per-commit tax. Reach for it when you build a
      # user-visible surface.
      #
      # NEEDS A CHROMIUM. The repo pins `playwright-core`, which ships none, so
      # this reads `CHROMIUM_PATH`, `PLAYWRIGHT_BROWSERS_PATH`, `/opt/pw-browsers`
      # (devcontainer and CI image) and Playwright's own per-OS cache — which is
      # where `npx playwright install chromium` puts it, so on a bare machine that
      # one command is the whole story. The script says so itself rather than
      # failing on a missing-executable stack trace.
      - bun run touch-audit -- {{.CLI_ARGS}}

  fe:provision:authz:
    desc: 'Check WorkOS authz drift against the catalog (add `-- --apply` to reconcile)'
    dir: '{{.UI}}'
    cmds:
      - bun run provision:authz {{.CLI_ARGS}}

  fe:provision:audit-schemas:
    desc: 'Check WorkOS audit-log schema drift against the registry (add `-- --apply` to reconcile)'
    dir: '{{.UI}}'
    cmds:
      - bun run provision:audit-schemas {{.CLI_ARGS}}

  fe:provision:workos-env:
    desc: 'Check WorkOS environment identity drift (add `-- --apply` to reconcile)'
    dir: '{{.UI}}'
    cmds:
      - bun run provision:workos-env {{.CLI_ARGS}}

  fe:cards:check:
    desc: The committed Zod card schema still matches shared/cards/schemas.json
    # The other half of the `card-schemas` pre-commit hook. That hook skips this
    # stage where frontends/ui/node_modules is absent, which is every repo-lint
    # CI run, so the check lives here too and the frontend job runs it after
    # `fe:install`. Running the generator IS the check.
    cmds:
      - node frontends/ui/scripts/generate-card-schemas.mjs
      - git diff --exit-code -- frontends/ui/src/shared/cards/generated.ts

  fe:verify:
    desc: Everything CI runs for the frontend tier
    cmds:
      - task: fe:cards:check
      - task: fe:lint
      - task: fe:types
      - task: fe:test:ci
      - task: fe:build

  # ── web (frontends/web — Piloti landing site + blog) ────────────────────────

  web:install:
    desc: Install web (landing site) dependencies
    dir: '{{.WEB}}'
    cmds:
      # npm, not bun: the Astro toolchain ships its own lockfile and bundler.
      - npm ci

  web:check:
    desc: Astro typecheck + content validation for the web service
    dir: '{{.WEB}}'
    cmds:
      - npm run check

  web:build:
    desc: Production build of the web service
    dir: '{{.WEB}}'
    cmds:
      - npm run build

  web:verify:
    desc: Everything CI runs for the web tier
    cmds:
      - task: web:install
      - task: web:check
      - task: web:build

  web:preview:
    desc: Build the web service with drafts rendered (blog preview only — never ship this)
    dir: '{{.WEB}}'
    env:
      # Preview-only. `astro build` bakes the result into the image, so a release
      # build with this set would publish every unfinished draft to the live site.
      PUBLIC_INCLUDE_DRAFTS: '1'
      PUBLIC_SITE_URL: '{{.PREVIEW_SITE_URL | default "http://localhost:4321"}}'
    cmds:
      - npm ci
      - npm run build

  # ── backend (src/, sources/, frontends/aiq_api) ─────────────────────────────

  be:lint:
    desc: Ruff lint + format check
    cmds:
      - '{{.RUFF}} check .'
      - '{{.RUFF}} format --check .'

  be:format:
    desc: Apply ruff formatting and autofixes
    cmds:
      - '{{.RUFF}} check --fix .'
      - '{{.RUFF}} format .'

  be:test:
    desc: Backend core suite
    cmds:
      - '{{.PY}} -X faulthandler -m pytest tests/ -q'

  be:test:sources:
    desc: The sources/ package suites, which no CI job used to run
    cmds:
      # One pytest per package, not `pytest sources`, and the glob rather than a
      # list so a new package is covered the day it lands.
      #
      # Every package ships a `tests/__init__.py`, so one run over all of them
      # derives the module name `tests.conftest` for each and the second one
      # aborts collection with "Plugin already registered under a different
      # name". Splitting the invocation is what makes this suite runnable at
      # all; merging it into one run needs those conftest names disambiguated
      # first.
      - 'for d in sources/*/tests; do "{{.PY}}" -X faulthandler -m pytest "$d" -q || exit 1; done'

  be:eval:retrieval:
    desc: Retrieval regression gate — the Punkt arm must keep its citable-unit share (model-free, offline)
    env:
      PYTHONPATH: src:frontends/benchmarks/oib_retrieval/src
    cmds:
      # ADR-0044 rule 7 made enforceable: a chunker or German-analyzer change
      # that makes fewer Punkte survive as a citable unit fails here, on the
      # real corpus, with no embedder and no key. Baseline is in the harness
      # README; the gate sits a few points under it so a measurement wobble is
      # not a red build while a real regression is.
      - '{{.PY}} -m oib_retrieval_eval.runner --structure-only --fail-below {{.RETRIEVAL_GATE_PCT | default "95"}}'

  be:eval:overview:
    desc: Overview/exact/paraphrase golden recall report — the item-12 ratchet (offline, prints cohort table + per-query diff)
    env:
      PYTHONPATH: src:frontends/benchmarks/oib_retrieval/src
    cmds:
      # Gating lives in tests/benchmarks/test_oib_overview_recall.py (CI runs it
      # via be:test:ci); this task is the human entry point to the same numbers.
      - '{{.PY}} -m oib_retrieval_eval.overview'

  be:eval:record-vector:
    desc: Re-record the vector channel for the overview golden set (needs the embeddings key; writes a fixture CI then reads offline)
    env:
      PYTHONPATH: src:frontends/benchmarks/oib_retrieval/src:sources/knowledge_layer/src
    cmds:
      # The recording is the only part of that harness that needs a model and a
      # key. It is committed so `be:eval:overview` and CI stay offline; re-run
      # this when AIQ_EMBED_MODEL, data/oib or the golden questions change.
      - '{{.PY}} -m oib_retrieval_eval.record_vector'

  be:eval:turn-shapes:
    desc: ADR-0052 turn-shape eval against the live shallow model (needs OPENROUTER_API_KEY; skips without it)
    cmds:
      # The two behaviours ADR-0052 moved from the router into the prompt — a
      # greeting does not search, a commissioned report escalates before it
      # retrieves — plus a control question that must still search. Real
      # prompt, real model, stub tools that record the trace. `-rs` prints the
      # skip reason, so a run without the key says so instead of going green.
      - '{{.PY}} -X faulthandler -m pytest tests/benchmarks/test_turn_shapes_live.py -q -rs'

  be:test:ci:
    desc: Backend core suite with the coverage gate CI enforces
    cmds:
      - >-
        {{.PY}} -X faulthandler -m pytest tests/ -v
        --junitxml=report-core.xml
        --cov=src/aiq_agent --cov-report=xml:coverage.xml --cov-report=term
        --cov-fail-under=65

  be:test:api:
    desc: aiq_api plugin suite
    cmds:
      - '{{.PY}} -X faulthandler -m pytest frontends/aiq_api/tests/ -q'

  be:test:api:ci:
    desc: aiq_api plugin suite with coverage reporting
    cmds:
      - >-
        {{.PY}} -X faulthandler -m pytest frontends/aiq_api/tests/ -v
        --junitxml=report-aiqapi.xml
        --cov=frontends/aiq_api/src/aiq_api --cov-report=xml:coverage-aiqapi.xml
        --cov-report=term

  be:verify:
    desc: Everything CI runs for the backend tier
    cmds:
      - task: be:lint
      - task: be:test:ci
      - task: be:test:api:ci
      # sources/ used to be covered only by the push-stage pre-commit hook,
      # which CI's repo-lint job skips — a stale test there stayed green
      # through every gate. Now it is part of the tier.
      - task: be:test:sources

  # ── infra (deploy/pulumi) ───────────────────────────────────────────────────

  infra:types:
    desc: Typecheck the Pulumi program and its policy pack
    cmds:
      - npm --prefix deploy/pulumi run typecheck
      - npm --prefix deploy/pulumi/policy run typecheck

  infra:test:
    desc: Manifest tests for the Pulumi program (no cluster, no stack credentials)
    # `typecheck` proves the program is well-typed; it proves nothing about the
    # manifests, which is where every SeaweedFS bug in this repo's history has
    # lived — a renamed flag, a Service missing the gRPC port `weed shell`
    # needs, a liveness probe pointed at an endpoint that answers 423. All
    # string-valued, all invisible to tsc. These run the program under
    # `pulumi.runtime.setMocks` and assert the resource inputs directly.
    cmds:
      - npm --prefix deploy/pulumi test

  infra:preview:
    desc: 'Pulumi preview (needs stack credentials)'
    dir: deploy/pulumi
    cmds:
      - npm run preview

  # ── repo-wide ───────────────────────────────────────────────────────────────

  # ── release notes (releasenotes/ -> piloti.at/changelog) ────────────────────
  #
  # Every user-visible change ships a note; the notes are published to the
  # marketing site automatically on merge. The full rules are in
  # docs/contributing/release-notes.md, the mandate is in AGENTS.md.

  release:note:
    desc: 'Start a release note for the change you are making: task release:note -- <slug>'
    cmds:
      # reno picks the filename (slug + random suffix), which is what keeps two
      # branches from ever colliding on the same note file.
      - '{{.RENO}} new {{.CLI_ARGS}}'

  release:lint:
    desc: Check the release notes against the house rules (CI runs this on every PR)
    cmds:
      # Ours first: it is the one that reads the notes as published prose.
      - '{{.RELNOTES}} lint'
      # reno's own lint catches the structural problems ours does not look for
      # (a note on no branch, a malformed section body).
      - '{{.RENO}} lint .'

  release:preview:
    desc: reno's own report — the notes grouped by the release they shipped in
    cmds:
      - '{{.RENO}} report .'

  release:changelog:
    desc: Regenerate frontends/web/src/data/changelog.json from the notes
    # Normally you never run this: the release-notes workflow does it on merge to
    # develop and commits the result. Run it locally to preview the page, or to
    # resolve a conflict in the generated file (regenerate, do not hand-merge).
    # Without OPENROUTER_API_KEY the German side falls back to English.
    cmds:
      - '{{.RELNOTES}} publish {{.CLI_ARGS}}'

  lint:repo:
    desc: pre-commit across the whole repo — the same scope CI lints
    cmds:
      # From the venv, not PATH: `uv sync --group dev` installs pre-commit into
      # .venv and nothing puts it on PATH.
      - '{{.VENV_BIN}}/pre-commit{{.EXE}} run --all-files'
