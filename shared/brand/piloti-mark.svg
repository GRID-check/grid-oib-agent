<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The Piloti mark: the column. One drawing sheet is the capital, its two
       edges rolled into the volutes; a plain shaft carries it; one plinth sits a
       module below, the gap the piloti lifts. Built on a 16 x 16 grid (one module
       = 2 units = 1 px at 16 px): every straight edge lands on a pixel, the sheet,
       the rolls and the plinth are one module thick, the shaft four.
       MASTER copy. `node scripts/build-brand-assets.mjs` in frontends/web copies
       it into both apps, renders every raster icon from it and checks that the
       inline logos draw the same path. The tile carries its own dark ground, so
       it needs no dark-scheme variant. -->
  <title>Piloti</title>
  <rect width="32" height="32" rx="7" fill="#2a301f"/>
  <g id="mark">
    <path fill="#eef2e4" d="M16 4H10A4 4 0 0 0 6 8A4 4 0 0 0 10 12V10A2 2 0 0 1 8 8A2 2 0 0 1 10 6A2 2 0 0 1 12 8V24H20V8A2 2 0 0 1 22 6A2 2 0 0 1 24 8A2 2 0 0 1 22 10V12A4 4 0 0 0 26 8A4 4 0 0 0 22 4ZM8 26H24V28H8Z"/>
  </g>
</svg>
