# Grid OIB workflow config — OpenRouter endpoint + credential, persistent OIB
# knowledge base plus web search. The MODEL each role runs on is admin-controlled
# at runtime (Platform → Models), not decided here; see the note above `llms:`.

general:
  use_uvloop: true
  telemetry:
    logging:
      console:
        _type: console
        level: INFO
      otlp:
        # Ships runtime logs to the same OTLP collector as the traces below
        # (Aspire dashboard "Strukturierte Protokolle", ADR-0029). The
        # /v1/logs path is derived from the injected traces endpoint; no
        # endpoint == observability tier not deployed == no-op.
        _type: otelcollector_logs
        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
        level: INFO
    tracing:
      # Ships spans to the OTLP endpoint over HTTP/protobuf. Only the endpoint
      # is injected by the deployment (OTEL_EXPORTER_OTLP_ENDPOINT); producers
      # send unauthenticated OTLP to the in-cluster collector and hold no
      # ingestion key of their own (ADR-0029).
      #
      # The endpoint DEFAULTS TO EMPTY ON PURPOSE. NAT cannot declare this
      # entry conditionally, so the exporter is always constructed; the
      # registration in `otel_header_redaction_exporter.py` turns a blank
      # endpoint into a no-op exporter. That keeps the backend on the same
      # "availability = flag AND capability" rule as the rest of the tier —
      # Compose and local dev export nothing instead of retrying forever
      # against a collector that was never deployed. A previous localhost
      # fallback here did exactly that.
      #
      # Set it to run against a local collector; the value must include the
      # full /v1/traces path, because explicit config endpoints are used as-is
      # (only SDK env-var defaults get the signal path appended).
      otelcollector_redaction:
        _type: otelcollector_redaction
        project: ${OTEL_SERVICE_NAME:-grid-aiq-agent}
        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
        resource_attributes:
          deployment.environment: ${APP_ENV:-production}

  front_end:
    _type: aiq_api
    runner_class: aiq_api.plugin.AIQAPIWorker
    db_url: ${NAT_JOB_STORE_DB_URL:-sqlite+aiosqlite:///./jobs.db}
    expiry_seconds: 86400
    cors:
      # Env-overridable so a deployed instance (e.g. a Coolify preview) can allow
      # its own https origin. Default keeps local dev working. Set
      # CORS_ALLOW_ORIGIN_REGEX to a regex matching your frontend origin(s).
      allow_origin_regex: '${CORS_ALLOW_ORIGIN_REGEX:-http://localhost(:\d+)?|http://127.0.0.1(:\d+)?}'
      allow_methods:
        - GET
        - POST
        - DELETE
        - OPTIONS
      allow_headers:
        - "*"
      allow_credentials: true
      expose_headers:
        - "*"

llms:
  # ───────────────────────────────────────────────────────────────────────────
  # THIS FILE DOES NOT DECIDE WHICH MODEL RUNS.
  #
  # `model_name` below is the BOOT FLOOR only — what a role runs on in a process
  # that has no BFF to ask (local `nat run`, a detached worker, an unreachable
  # frontend). The default an actual user gets is a row in the database:
  # `platform_model_defaults`, provisioned by the BFF on first boot when the
  # table is empty and edited under Platform → Models. Every organization that
  # has not chosen its own model for an agent group follows that row on its next
  # turn; a tenant's own choice (Organization → Models) still wins over both.
  # Resolution order: org override → platform default → the value here.
  #
  # TWO EXCEPTIONS, and they are real: `summary_llm` and `rerank_llm` have no
  # agent group, so nothing can re-point them — they resolve to the literals
  # below on EVERY request, always, and editing them is an unconditional
  # fleet-wide model change no admin can revert. Bootstrap also declines to
  # provision a group whose endpoint is not the platform model provider, which
  # leaves that group on the value below too.
  # See docs/architecture/org-model-configuration.md.
  #
  # So: do NOT edit these to move the fleet to a newer model — that is a save in
  # the admin UI, not a commit and a redeploy. Change them (or set
  # GRID_DEFAULT_MODEL) only to move the *floor*, e.g. for a deployment that
  # runs without the BFF. What this file remains the sole owner of is the
  # plumbing: base_url, api_key, temperature, max_tokens, timeouts and
  # retries — none of which an override may touch. reasoning_effort is a
  # fallback: the platform owner's thinking level per agent group wins where
  # one is set (platform_reasoning_efforts,
  # docs/architecture/org-model-configuration.md).
  # ───────────────────────────────────────────────────────────────────────────
  #
  # ───────────────────────────────────────────────────────────────────────────
  # REASONING EFFORT PER AGENT ROLE — OPENROUTER-STANDARD VALUES, PASSED THROUGH
  # reasoning_effort uses OpenRouter's unified vocabulary (none/minimal/low/
  # medium/high/xhigh) and is sent verbatim: OpenRouter maps the requested
  # effort to the nearest level the EFFECTIVE model supports, per model,
  # server-side — including models selected by org overrides (ADR-0014). We
  # deliberately keep NO app-side per-provider mapping (it would duplicate and
  # drift from OpenRouter's contract). Never use provider-native tier names
  # here (e.g. DeepSeek's "max") — OpenRouter rejects/ignores them; the
  # highest unified level is "xhigh". See
  # https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
  # Policy: none for pure routing/trivial one-liners, medium for everything
  # else — high tiers multiplied hidden reasoning tokens across hundreds of
  # agent turns per run for no measurable quality gain (observed 20+ min runs
  # stuck in planning). Each role has its own LLM definition so roles are
  # independently tunable; swap model_name/base_url/api_key to change provider
  # (the system is LLM-agnostic — see docs/architecture/llm-providers.md).
  #
  # request_timeout (seconds) bounds every HTTP call — NAT's default is None
  # (UNBOUNDED), which let one stalled provider call hang a whole deep-research
  # run indefinitely. max_retries is the OpenAI-client retry count; kept low
  # because the middleware layers (ModelRetryMiddleware,
  # SelectiveToolRetryMiddleware) add their own retries on top.
  # ───────────────────────────────────────────────────────────────────────────

  # Shallow Research — fast retrieval + synthesis (the quick-answer tier).
  research_llm:
    _type: openai
    model_name: ${GRID_DEFAULT_MODEL:-openai/gpt-6-luna}
    base_url: "https://openrouter.ai/api/v1"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 1.0
    top_p: 0.95
    max_tokens: 65536
    max_retries: 2
    request_timeout: 120
    # medium, like every other role in this file. This is the role that decides
    # WHAT TO RETRIEVE — with no results in hand, which of four corpora holds the
    # answer — and the whole round budget is then spent executing that decision.
    # It was the only role denied deliberation.
    #
    # The traces price the trade, and it is not close. Output is 0.4-1.4 % of a
    # turn's tokens and ~2 % of its cost; one wasted retrieval round costs
    # ~40 000 INPUT tokens, i.e. ~14 % of a turn, plus a round off a budget that
    # truncates. Tripling output tokens at medium is single-digit percent of a
    # turn; one round saved pays for it many times over.
    #
    # The previous note argued LATENCY, not cost: "medium spent a large
    # hidden-token think budget before emitting the first answer token (final
    # synth ≈29s on a simple meta-ish query)". That is a real effect measured on
    # the case where deliberation is worth least. Re-measure it on the loop eval,
    # which is the question set this role is for, not on a meta query — and
    # weigh it knowing that a truncated answer at 27 s is worse than a complete
    # one at 35 s.
    reasoning_effort: medium
    # The Responses API, for `shallow_research_agent.deferred_tool_loading`
    # below: that feature needs it and fails the workflow build without it,
    # deliberately, rather than sending the tool schemas anyway (ADR-0048).
    # Nothing else in this file needs it; the default (chat_completion) is what
    # every other role runs on. Deferral is off since 2026-09-25 (see below);
    # this stays on until the answer suite has measured Chat Completions for
    # this role, because the transport of every research call is not a change
    # to make as a side effect.
    api_type: responses
    # ── PROMPT CACHING: nothing to configure here, and that is the point ──
    # This role re-sends ~35 KB of identical prefix (system prompt + tool
    # schemas) on each of a turn's 3-6 calls. Two facts decide what that costs,
    # and BOTH are handled in code, not by a key in this block:
    #
    # 1. USAGE ACCOUNTING IS ALWAYS ON. OpenRouter returns `cost`,
    #    `cache_discount` and `prompt_tokens_details.cached_tokens` on every
    #    response; its `usage: {include: true}` request option "[is] deprecated
    #    and [has] no effect". Do not add one. What a `responses` role loses is
    #    the *carrier*, not the flag — langchain-openai builds no `llm_output`
    #    on that path, so only LangChain's normalized `usage_metadata` (counts
    #    + cache bucket, no cost) reaches the ledger; `cost_tracking` reads it.
    # 2. THE CACHE KEY IS DERIVED, NOT CONFIGURED. Caching itself is automatic
    #    for the OpenAI family (≥1024 prompt tokens, no `cache_control`
    #    breakpoint); what needs a request field is landing twice on the SAME
    #    upstream endpoint. `common/prompt_caching.py` derives a `session_id` +
    #    `prompt_cache_key` from the org, the model, the system prompt and the
    #    tool set, and `common/llm_factory.py` attaches them to every OpenRouter
    #    call — so this works unchanged when an admin re-points the group at
    #    another model (ADR-0014). Never pin `provider.order` here to "help":
    #    a manual order DISABLES OpenRouter's sticky routing, which is the
    #    mechanism the key exists to drive.
    # https://openrouter.ai/docs/guides/best-practices/prompt-caching

  # HITL Clarification & Planning — clarify ambiguity, generate the research plan.
  clarifier_llm:
    _type: openai
    model_name: ${GRID_DEFAULT_MODEL:-openai/gpt-6-luna}
    base_url: "https://openrouter.ai/api/v1"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 1.0
    top_p: 0.95
    max_tokens: 65536
    max_retries: 2
    request_timeout: 120
    reasoning_effort: medium

  # Deep Researcher — Orchestrator (also the report writer): top-level control.
  deep_orchestrator_llm:
    _type: openai
    model_name: ${GRID_DEFAULT_MODEL:-openai/gpt-6-luna}
    base_url: "https://openrouter.ai/api/v1"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 1.0
    top_p: 0.95
    max_tokens: 128000
    # The writer runs on this model and a long German report at this output
    # size takes minutes to stream. A 180 s bound inside a 2400 s run budget
    # ended exactly those runs with a generic provider error — and one retry
    # of a ten-minute call is the most a run can afford before its own clock.
    max_retries: 1
    request_timeout: 600
    reasoning_effort: medium

  # Deep Researcher — Planning sub-agents.
  deep_planner_llm:
    _type: openai
    model_name: ${GRID_DEFAULT_MODEL:-openai/gpt-6-luna}
    base_url: "https://openrouter.ai/api/v1"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 1.0
    top_p: 0.95
    max_tokens: 128000
    max_retries: 2
    request_timeout: 180
    reasoning_effort: medium

  # Deep Researcher — Researcher sub-agents (parallel investigations).
  deep_researcher_llm:
    _type: openai
    model_name: ${GRID_DEFAULT_MODEL:-openai/gpt-6-luna}
    base_url: "https://openrouter.ai/api/v1"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 1.0
    top_p: 0.95
    max_tokens: 65536
    max_retries: 2
    request_timeout: 120
    reasoning_effort: medium

  # Deep Researcher — source routing (which source to query). Lighter decision.
  deep_router_llm:
    _type: openai
    model_name: ${GRID_DEFAULT_MODEL:-openai/gpt-6-luna}
    base_url: "https://openrouter.ai/api/v1"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 1.0
    top_p: 0.95
    max_tokens: 8192
    max_retries: 2
    request_timeout: 60
    reasoning_effort: medium

  # RIS query planner — pure JSON-schema extraction (structured outputs), not a
  # reasoning task. Dedicated cheap twin of deep_router_llm (same model/base_url)
  # so we can drop reasoning_effort to none WITHOUT weakening deep_router_llm,
  # which is also the deep-research source_router_llm where medium still matters.
  ris_planner_llm:
    _type: openai
    model_name: ${GRID_DEFAULT_MODEL:-openai/gpt-6-luna}
    base_url: "https://openrouter.ai/api/v1"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 1.0
    top_p: 0.95
    max_tokens: 8192
    max_retries: 2
    request_timeout: 60
    reasoning_effort: none

  # Card generation — structured rich-UI compliance cards.
  card_llm:
    _type: openai
    model_name: ${GRID_DEFAULT_MODEL:-openai/gpt-6-luna}
    base_url: "https://openrouter.ai/api/v1"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 1.0
    top_p: 0.95
    max_tokens: 65536
    max_retries: 2
    request_timeout: 120
    reasoning_effort: medium

  # Post-answer follow-up questions — one short structured-output call over a
  # finished answer. A dedicated entry rather than a second use of card_llm for
  # two reasons the stage depends on. reasoning_effort is `none`: the stage
  # declares a hard output-token ceiling and reasoning tokens are spent against
  # that same ceiling, so a thinking model would truncate the JSON body and turn
  # a working stage into one that silently returns nothing (the trap
  # memory_reflection documents and avoids by declaring no ceiling at all).
  # request_timeout sits UNDER the stage's 20s asyncio bound with one retry, so
  # a slow provider produces a recorded timeout rather than a stage that was
  # already dead when the bound fired.
  follow_ups_llm:
    _type: openai
    model_name: ${GRID_DEFAULT_MODEL:-openai/gpt-6-luna}
    base_url: "https://openrouter.ai/api/v1"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 1.0
    top_p: 0.95
    max_tokens: 1024
    max_retries: 1
    request_timeout: 15
    reasoning_effort: none

  # Compliance pipeline — Stage 1 requirement derivation + Stage 2 evidence
  # judging (structured outputs; ~10-16 calls per full 6-Richtlinien check).
  compliance_llm:
    _type: openai
    model_name: ${GRID_DEFAULT_MODEL:-openai/gpt-6-luna}
    base_url: "https://openrouter.ai/api/v1"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 1.0
    top_p: 0.95
    max_tokens: 65536
    max_retries: 2
    request_timeout: 120
    reasoning_effort: medium

  # Document / project summaries — trivial one-liners.
  summary_llm:
    _type: openai
    model_name: ${GRID_DEFAULT_MODEL:-openai/gpt-6-luna}
    base_url: "https://openrouter.ai/api/v1"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 1.0
    top_p: 0.95
    max_tokens: 100
    max_retries: 2
    request_timeout: 30
    reasoning_effort: none

  # LLM-judge retrieval reranking — one batched relevance judgment over up to
  # rerank_candidates chunks. Dedicated entry: summary_llm's 100-token cap is
  # too small for the JSON scores reply. Greedy decoding (0) pins the judgment;
  # pure JSON extraction needs no reasoning effort.
  #
  # max_tokens must fit ONE SCORE PER CANDIDATE. At ~12 tokens per entry, the old
  # 256 sat 12 tokens above a 20-candidate reply — and a model emitting one decimal
  # score ("8.5") overran it, truncating the JSON mid-object and silently disabling
  # reranking for that turn. 2048 covers a ~150-candidate pool with headroom.
  #
  # request_timeout x (max_retries + 1) must stay UNDER rerank_chunks' own 30s
  # asyncio timeout, or the outer bound fires first and both knobs are dead letters.
  # It must ALSO exceed the time the reply itself takes to decode. A 60-candidate
  # pool is ~16k input tokens and ~720 output tokens; at a routine 50 tok/s that is
  # ~14s of decoding alone, so the 12s this briefly carried would have timed out on
  # every turn -- and because reranking fails open, the only symptom would have been
  # one warning line and silently unranked results. 25s single-shot leaves headroom
  # without letting a hung provider hold a turn open to the outer bound.
  #
  # NOTE: rerank_llm has NO agent group, so no platform default or org override
  # can re-point it — this literal is what every request uses, always. OpenRouter
  # DROPS a sampling parameter an endpoint does not advertise, so `temperature`
  # can be silently inert on a given model; `seed` is set for the same reason.
  rerank_llm:
    _type: openai
    model_name: ${GRID_DEFAULT_MODEL:-openai/gpt-6-luna}
    base_url: "https://openrouter.ai/api/v1"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 0
    seed: 1
    top_p: 1.0
    max_tokens: 2048
    max_retries: 0
    request_timeout: 25
    reasoning_effort: none

functions:
  data_sources:
    _type: data_source_registry
    sources:
      - id: web_search
        name: "Web Search"
        description: "Search the web for real-time information."
        tools:
          - web_search_tool
          - advanced_web_search_tool
      - id: knowledge_layer
        name: "Knowledge Base"
        description: "Search uploaded documents and files."
        tools:
          - knowledge_search
          # The locator reads the same index through the same scope, so it
          # belongs to the same source: narrowing that turns the knowledge base
          # off must take both, and `get_source_id_for_tool` must resolve it or
          # nothing it returns is captured as a citable source.
          - read_passage
      - id: ris
        name: "RIS – Österreichisches Recht"
        description: "Search Austrian federal/state law and case law in the official RIS (Rechtsinformationssystem des Bundes) and fetch entire documents on demand."
        tools:
          # All four, deliberately: `get_source_id_for_tool` must resolve the
          # name a tool result arrives under, or nothing it returned is captured
          # as a citable source. `ris_lookup_tool` is the chat surface's one RIS
          # tool; the other three are deep research's (and its own internals).
          - ris_lookup_tool
          - ris_search_tool
          - ris_fetch_tool
          - ris_catalog_lookup_tool

  web_search_tool:
    _type: tavily_web_search
    max_results: 8
    max_content_length: 1000
    # Optional domain allow/deny lists (default: unrestricted). These are HARD
    # filters: with include_domains set, any result NOT on the list is dropped;
    # exclude_domains removes matching domains. Shallow chat uses THIS instance,
    # so a real allow-list must be set here AND on advanced_web_search_tool below.
    # RIS domain is excluded because the structured RIS adapter handles Austrian
    # building law exclusively (accurate, up-to-date, traceable).
    # include_domains: []
    exclude_domains:
      - ris.bka.gv.at

  advanced_web_search_tool:
    _type: tavily_web_search
    max_results: 4
    advanced_search: true
    # Optional domain allow/deny lists (default: unrestricted). These are HARD
    # filters: with include_domains set, any result NOT on the list is dropped;
    # exclude_domains removes matching domains. Deep research uses THIS instance,
    # so a real allow-list must be set here AND on web_search_tool above.
    # RIS domain is excluded because the structured RIS adapter handles Austrian
    # building law exclusively (accurate, up-to-date, traceable).
    # include_domains: []
    exclude_domains:
      - ris.bka.gv.at

  # Austrian RIS (OGD-RIS API, no API key needed): live search over federal/
  # state law and case law, plus on-demand fetching of ENTIRE documents
  # (complete consolidated laws, court decisions). Fetched documents are also
  # ingested into the per-session knowledge collection so knowledge_search can
  # retrieve and cite specific sections afterwards.
  ris_search_tool:
    _type: ris_search
    # max_results == page_size: the agent sees every hit the page fetched, so
    # asking for page 2 continues where page 1 stopped instead of skipping the
    # hits that were fetched but never shown.
    page_size: 20
    max_results: 20
    # Query planning via strict structured outputs (response_format:
    # json_schema); falls back to the agent's raw arguments when the planner
    # is unavailable or fails. Uses ris_planner_llm — a dedicated cheap twin of
    # deep_router_llm at reasoning_effort: none, because this is pure JSON
    # extraction, not a reasoning task. Kept separate from deep_router_llm so
    # lowering effort here does not weaken deep-research source routing.
    planner_llm: ris_planner_llm

  ris_fetch_tool:
    _type: ris_fetch_document
    max_chars: 40000
    ingest_into_knowledge: true

  # The chat surface's single RIS tool: question in, citable passages out.
  # Its bounds are its own (candidates 3, fetches 2, passages 6) and live in
  # `sources/ris_adapter/src/lookup/`, one module per stage — they are not
  # tunable here, because each is a claim about what one charged call may cost.
  # `planner_llm` serves BOTH internal LLM calls: planning a live search and
  # picking the answering §§ out of a law's headings. Neither happens when the
  # catalog answers and the caller named a §.
  ris_lookup_tool:
    _type: ris_lookup
    planner_llm: ris_planner_llm
    ingest_into_knowledge: true

  # Norm registry (configs/norms/<country>/registry.yml, override via
  # GRID_NORMS_DIR; ADR-0025): typed spine with verified RIS pointers.
  # ris_search short-circuits to these pointers on a catalog match
  # (catalog_shortcut), ris_catalog_lookup annotates hits with registry
  # relations, and both answering prompts show the lane-rendered block.
  ris_catalog_lookup_tool:
    _type: ris_catalog_lookup
    max_matches: 8

  # LET THE MODEL SEE A PLAN, NOT ONLY ITS CAPTION.
  #
  # Built, registered and documented as default-on since it was written, and
  # declared in no config until 2026-09 — `git log -S view_knowledge_image --
  # configs/` was empty, so it had never been bound to an agent at all. NAT can
  # only bind a function that appears under `functions:`, so the tool existed
  # and could not be called: retrieval returned VLM captions OF drawings and
  # the model never saw a drawing. That is the honest half of "der Agent
  # bezieht die visuellen Planunterlagen kaum ein" — the chunks are in the
  # index and reachable, the picture was not.
  #
  # It fails closed on its own: no vision key, or `AIQ_VIEW_IMAGES_ENABLED`
  # off, and it returns a sentence saying so rather than an image.
  view_knowledge_image:
    _type: view_knowledge_image

  knowledge_search:
    _type: knowledge_retrieval
    backend: llamaindex
    collection_name: ${COLLECTION_NAME:-oib_knowledge}
    include_base_collection: true
    include_session_collection: true
    project_collections: []
    # Phase-0 default exclusion (norm-registry spec §8): diff documents and the
    # superseded non-rev.1 zitierte_normen duplicate never surface in default
    # retrieval. Replaced by role/edition metadata filters in Phase 2.
    exclude_file_names:
      - aenderungen_oib-rl_1_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_1_leitfaden_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_2.1_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_2.2_ausgabe_mai_2023.pdf
      - aenderungen_oib-richtlinie_2.2_ausgabe_mai_2023.pdf  # the name oib.or.at publishes 2.2 under
      - aenderungen_oib-rl_2.3_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_2_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_2_leitfaden_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_3_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_4_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_5_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_6-leitfaden_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_6_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_begriffsbestimmungen_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_zitierte_normen_und_sonstige_technische_regelwerke_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_zitierte_normen_und_sonstige_technische_regelwerke_ausgabe_mai_2023_rev.1.pdf
      - oib-rl_zitierte_normen_und_sonstige_technische_regelwerke_ausgabe_mai_2023.pdf
    generate_summary: true
    summary_model: summary_llm
    summary_db: ${AIQ_SUMMARY_DB:-sqlite+aiosqlite:///./summaries.db}
    # top_k=16 with a 5-per-document diversity cap still spans >=4 distinct
    # Richtlinien on cross-cutting questions instead of 5 chunks from the 1-2
    # top-scoring PDFs, and gives each of them enough consecutive text to reason
    # over. The cap and the total move together: raising the cap without raising
    # top_k buys per-document depth by giving up that breadth.
    top_k: 16
    max_chunks_per_document: 5
    chroma_dir: ${AIQ_CHROMA_DIR:-/tmp/chroma_data}
    # LLM-judge reranking: over-fetch rerank_candidates chunks and re-order them
    # against the query with the dedicated rerank LLM before trimming to top_k.
    # Fail-open: any judge error returns the fused (hybrid+vector) order.
    #
    # The pool must exceed top_k by SEVERAL TIMES, not by a margin. At 20-vs-16 the
    # judge could only reshuffle 20 candidates into 16 slots, so the stage that is
    # supposed to convert recall into precision had four chunks of headroom. 60 gives
    # it a real pool; the cost is one batched call either way (the extra candidates
    # come from a Chroma n_results bump, not extra round-trips), plus the judge's
    # input tokens. The trim is now max(top_k, rerank_candidates), so raising
    # Platform -> Retrieval top_k above this can no longer silently cap a search.
    rerank_llm: rerank_llm
    rerank_candidates: 60
    # Cross-encoder reranking, PRIMARY; the LLM judge above is the fallback.
    # A cross-encoder scores each (query, passage) pair with a model built for
    # exactly that and answers in ~100ms over the FULL chunk, where the judge is
    # one frontier-model call reading 60 excerpts of 1200 chars: ~16k input
    # tokens, ~14s of decoding, on the path to the first answer token of every
    # research turn (docs/architecture/latency-and-caching-audit-2026-09.md §3.2).
    #
    # `openrouter` because it is the one key every deployment already holds:
    # `OPENROUTER_API_KEY` is the credential, `POST /api/v1/rerank` the route
    # (answers 401 without a key, so it exists). The default model is
    # `cohere/rerank-v3.5`, multilingual, which a German corpus needs.
    # `AIQ_RERANKER_MODEL` / `AIQ_RERANKER_BASE_URL` override per deployment.
    #
    # Fail-open: a key that does not resolve or any provider error falls back to
    # the judge (first failure per 5 min warns, the rest debug; 5 consecutive
    # failures disable the cross-encoder for 5 min). A provider that HANGS costs
    # `AIQ_RERANKER_TIMEOUT_SECONDS` (3s) before that fallback, so worst case a
    # turn pays 3s + the judge's own 30s bound — never the other way round. Set
    # `reranker_provider: none` to hand reranking back to the judge. No offline
    # eval covers reranking (`frontends/benchmarks/
    # oib_retrieval` stops upstream of it); the golden compliance eval and the
    # profiler's `tool` spans for `knowledge_search` are the before/after.
    reranker_provider: openrouter
    # The retrieval loop (rag-system-audit-2026-08 F13): the same judge model
    # reads the head of the fused pool BESIDE the reranker and says whether it
    # can answer the question. A sufficient pool — the common case — costs no
    # extra latency. An insufficient one gets up to two alternative
    # formulations, each retrieved from every collection in scope and fused
    # into the same RRF before a second rerank; the live status line says so.
    # Fail-open: any judge error keeps the first pool.
    requery_llm: rerank_llm
    requery_max_queries: 2
    # The prefetch requeries like any search. Skipping it was measured 3.4 s
    # slower on the turns it applied to, and the switch was removed
    # (docs/architecture/turn-latency-measured-2026-09.md §3.5).
    # Who answers the judge's yes/no (ADR-0064). `jev` asks the decision model
    # one noul per passage of the fused head — ~300 ms in parallel, a fraction
    # of a cent — and runs `requery_llm` only when the head is insufficient,
    # for the phrasings a decision model cannot write. The hidden frontier
    # call on EVERY search becomes a frontier call on the insufficient
    # minority. No key, ZDR org, breaker open: the judge runs as before.
    # `reranker_provider: jev` is the same model as a reranker, an option to
    # evaluate beside the cross-encoder, not the default.
    requery_decider: jev
    decision_sufficiency_threshold: 0.55

  # The locator beside the search: open the passage a conclusion NAMED
  # (document + Punkt, or document + page) instead of searching for it again.
  # Deterministic — one filtered fetch, no reranker, no requery judge, no LLM.
  # Collection scope, base corpus and file exclusions are read off the
  # `knowledge_search` instance named here rather than restated, so the two
  # cannot end up pointed at different corpora.
  read_passage:
    _type: read_passage
    knowledge_search: knowledge_search

  # Project Memory: silent, observable capture of durable project findings.
  # Available in project-scoped chats; no-ops (with a clear error) elsewhere.
  remember:
    _type: project_memory_remember

  # Rich UI cards, deep research only: its writer calls emit_card mid-answer
  # when a structured element (legal basis, dimension/stair diagram, summary)
  # adds value. Chat binds no emit_card; its cards travel in the answer
  # envelope's `cards` field, whose contract carries the doctrine
  # (cards/envelope.py). Either way cards are validated and delivered
  # alongside the written answer.
  emit_card:
    _type: emit_card

  # Blocking multiple-choice question the answering agent can put mid-turn,
  # for a choice it can enumerate but cannot decide (which of two IFC models,
  # which Bundesland). Goes through the same HITL channel as the clarifier, so
  # the addressee guard and reconnect handling apply; degrades to "answer with
  # a stated assumption" wherever no HITL channel is bound.
  ask_user:
    _type: ask_user

  # L2 of the card vocabulary. `emit_card` advertises one line per card type;
  # this returns the exact nesting and a worked example for the type actually
  # being emitted. Rendering all 27 shapes up front costs ~5,200 tokens on every
  # turn whether or not a card is emitted, and ~190 more for each type we add.
  #
  # Bound to NO agent today, and declared so a config that wants it has the
  # `_type` to hand. Deep research's writer emits through `emit_card`, and a
  # failed call returns this same L2 entry for the type that failed, so the
  # shape is learned on the retry that needed it instead of in a charged round
  # trip paid in advance. Chat has no `emit_card`: the envelope contract carries
  # the common shapes, and a refused card goes to `card_repair_llm` with its
  # type's shape.
  describe_card:
    _type: describe_card

  # Document surfacing: show a file (filename= / mode=one) or a short browse
  # choice (mode=many). Distinct from knowledge_search, which cites passages;
  # the UI peeks cited files, so the agent must not also surface after citing.
  surface_documents:
    _type: surface_documents

  # The five WRITE-side workspace tools (src/aiq_agent/tools/files). Each one
  # proposes: it resolves the file, the folder or the Dokumentart against what
  # the turn can already see, renders ONE `file_operation_proposal` card, and
  # changes nothing. Accepting the card runs the operation through the routes
  # the Files pane already uses, in the reader's own session — the BFF stays
  # the single writer of `grid_app` (ADR-0003), which is why there is no
  # backend path here to write with.
  #
  # Bound on Piloti only. Deep research runs unattended on the
  # job worker with nobody to press Accept, so a proposal card there is a
  # decision nobody is on the other end of; the two agents differ here for the
  # same reason `ask_user` does.
  move_document:
    _type: move_document
  rename_document:
    _type: rename_document
  create_folder:
    _type: create_folder
  # No doc_class verb here: proposals wait for a project-scoped doc_class route.
  assign_document:
    _type: assign_document

  # The working directory's two doors into the project (src/aiq_agent/tools/
  # documents). `file_draft` puts a draft the turn WROTE into the project as a
  # draft version; `submit_draft` sends that version for review. Unlike the five
  # proposal tools above these two DO change the project — and they do it through
  # `POST /api/internal/document-versions`, echoing the BFF-signed request
  # envelope, so the write happens in the requesting person's pinned session
  # under their permissions and their audit actor (ADR-0054 §4). The BFF stays
  # the single writer of `grid_app`.
  #
  # Bound on Piloti only, for the same reason as the proposal
  # tools and one more: the envelope is minted per chat turn, so an unattended
  # deep-research run has no signed identity to file as and the tool refuses.
  file_draft:
    _type: file_draft
  submit_draft:
    _type: submit_draft

  # Delegation (src/aiq_agent/tools/tasks). Hands work that outlives this turn
  # to a `tasks` row (ADR-0051) — the compliance checker, the Einreichcheck
  # skill, a document to write, a draft to revise — through
  # `POST /api/internal/tasks`, echoing the same BFF-signed envelope, so the row
  # is created in the requesting person's pinned session, under their
  # permissions, and spends their budget.
  #
  # Bound on Piloti only, for the two reasons the filing tools
  # give and one of its own: the envelope is minted per chat turn, so an
  # unattended run has no identity to delegate as; and a background run
  # delegating further background runs is a loop with nobody in it.
  create_task:
    _type: create_task

  # BIM/IFC: deterministic structured queries over the project's uploaded IFC
  # model (ADR-0045). Distinct from knowledge_search in kind, not degree — that
  # tool retrieves text about REGULATIONS, this one runs SQL against THIS
  # building's elements, so "how many external walls on the ground floor" comes
  # back as a count rather than as a summary an LLM had to add up.
  ifc_query:
    _type: ifc_query
    default_limit: 25

  # BIM/IFC, the geometric half: measurements, topology and spatial relations
  # read from the model's own bytes by the IfcOpenShell engine (roadmap §13b).
  # It answers what the EXPORT DID NOT WRITE DOWN — a room's floor area with no
  # published quantity, a window's Brüstungshöhe, the lichte Raumhöhe under a
  # suspended ceiling — and every answer carries its provenance (deklariert /
  # gemessen ±Toleranz / vermutlich) so a measurement can never be reported as
  # something the model states. Gated by the same `ifc-models` flag as
  # ifc_query: both go through lib/bim/internal-access in the BFF, so a model
  # this tool can reach is one ifc_query could already answer questions about.
  ifc_measure:
    _type: ifc_measure
    default_limit: 50

  # RETIRED as a chat tool: the purpose-built OIB Soll-Ist-Abgleich
  # (backlog T4-3, staged requirement-profile -> evidence-judgment pipeline)
  # is no longer bound to any agent. The `compliance_check` function block and
  # its `shallow_research_agent` tool-list entry were removed together with the
  # `aiq_compliance_checker` plugin entry point; the implementation stays in
  # place (src/aiq_agent/agents/compliance_checker/) for reference. See its
  # README.

  # The FUNCTION NAME here is deliberately still `shallow_research_agent` while
  # the `_type` is `research_agent`. NAT puts the function name — not the type —
  # on the wire as `Function Start: <name>`, and the frontend persists that
  # string as `functionName` in every stored turn's metadata
  # (`lib/conversations/message-provenance.ts`). Renaming it would leave old
  # turns matching one name and new turns another, and the live-trace rules that
  # match it (`features/chat/lib/live-activity.ts`, `executed-steps.ts`) key on
  # the substring `shallow`, so a bare greeting would start announcing
  # "Recherche läuft". The type is free because no `_type` is ever persisted.
  shallow_research_agent:
    _type: research_agent
    llm: research_llm
    # Explicit list (replaces registry inheritance) so the non-data-source
    # `remember` and `ask_user` tools are included alongside search/knowledge.
    tools:
      - web_search_tool
      - knowledge_search
      - read_passage
      - view_knowledge_image
      # ONE RIS tool on the chat surface. Search → pick → fetch → find the
      # paragraph was three charged calls and a 40 000-character blob that
      # carried no Citation key, so nothing downstream could treat it as
      # evidence; `ris_lookup` runs that path inside itself and returns passages
      # in the knowledge layer's own grounding grammar. The other three stay
      # registered and stay bound to deep research below, which has its own
      # budget shape.
      - ris_lookup_tool
      - remember
      # No `emit_card`: every chat card travels in the answer envelope's
      # `cards` field (cards/envelope.py), at no extra call. Bound, the tool
      # was 2 676 tokens of schema on every call, repeating the contract the
      # envelope schema already teaches, and a model at low effort spent a
      # whole round on it (September 2026 census). Deep research binds its own.
      - surface_documents
      - move_document
      - rename_document
      - create_folder
      - assign_document
      - file_draft
      - submit_draft
      - create_task
      - ifc_query
      - ifc_measure
      - ask_user
    verbose: true
    # A CEILING ON ROUNDS, NOT A QUOTA ON CALLS — and the number is the floor of
    # the longest chain this surface documents, plus one repair.
    #
    # The accounting is one unit per ROUND in `piloti/agent.py`: a round is one
    # LLM decision that emitted tool calls, charged when the model emits it and
    # never refunded. Three consequences that are not obvious from the name:
    #   * a round that comes back with 0 hits costs what one that answers costs;
    #   * PARALLEL calls inside one round cost ONE between them. That is the
    #     point: a model that opens all five members of a Richtlinien-Familie in
    #     one batch is using its round well, and „was weißt du über die OIB 2"
    #     — one `knowledge_search` plus five parallel `read_passage` — used to
    #     exhaust a budget of seven on the single most ordinary question the
    #     product answers. The prompt asks for that fan-out; the budget used to
    #     forbid it;
    #   * `use_skill` is a real round when the model spends one on it, and is
    #     charged like any other. Nothing is reserved on top of this number: no
    #     skill is forced on a turn, so every `use_skill` round is one the
    #     QUESTION spent on a skill the model chose to open — which is what the
    #     floors below already count. A standing instruction that used to arrive
    #     as a forced skill is prompt text now (the platform prompt, and the
    #     office's own `X-Grid-Org-Instructions` block), and prompt text costs
    #     no round.
    #
    # There is no second currency beside this one. The interaction allowance
    # that used to hold `emit_card` / `remember` / the working directory's file
    # verbs out of the budget existed only because the budget counted CALLS; a
    # round of three cards is one round, so nothing has to be exempted and
    # nothing has to be kept in step.
    #
    # Floors traced against the tool surface as it now stands, IN ROUNDS. The
    # chains are the same; what changed is that a step needing two or three
    # parallel calls is one round, so each floor is the number of think-act
    # cycles rather than the number of calls:
    #   „wie hoch ist der Keller"  use_skill, survey                        = 2
    #     ...plus a storey-name miss repaired by briefing                    = 3
    #   OIB 3 Lichteinfall         use_skill, knowledge_search (the clause
    #     supplies angle_deg/swivel_deg, which light_incidence refuses to
    #     default), find_elements+relations, overhang, light_incidence       = 5
    #   OIB 2 Fluchtweg            use_skill, knowledge_search,
    #     find_elements, egressPath+clearWidth over the door list,
    #     fire/doorGraph                                                    = 5
    #   „was weißt du über die OIB 2"  knowledge_search, then the family
    #     opened in one parallel batch of read_passage                      = 2
    #
    # Truncation is still silent TO THE READER — the synthesis anchor says
    # „exhausted your research budget" to the MODEL and asks for no disclosure,
    # and `[CONFIDENCE:…]` grades SOURCE grounding, not whether
    # evidence-gathering was cut off — but it is not invisible to US: it emits a
    # `status:budget` telemetry step and a `Forcing synthesis (rounds)` warning
    # carrying the ceiling, the rounds spent, the input tokens and the ordered
    # tool shape, so "how often, and on which questions" is a query rather than
    # a guess. Whether the READER is told is a product decision.
    #
    # 5 is the bare floor with no repair budget, and a storey-name miss is the
    # commonest repair on this surface. 7 = floor + two repairs. The number is
    # kept at 7 rather than lowered with the unit: the floors moved because
    # parallel calls stopped costing, and reading that as headroom to take back
    # would re-introduce the failure this change removes. Every round is a full
    # round trip carrying ~9 000 tokens of tool schema plus the grown history,
    # and what bounds THAT is `max_input_tokens_per_turn` below, not this.
    #
    # Raising a ceiling costs nothing on a query that never reaches it — the
    # short shapes above still stop at 2. The only new cost is a confused model
    # wandering, bounded at two extra round trips. Set against that, truncation
    # before the measurement is the worst failure this product has.
    #
    # 7 rounds = 14 node visits + forced synthesis, under the graph's
    # `recursion_limit`, which is derived from this number alone and is
    # `(max_tool_iterations * 2) + 10` = 24. Nothing else bounds the loop, and
    # there is no `max_llm_turns` to move with it — that key was dead for
    # releases and is gone.
    max_tool_iterations: 7
    # The bound that protects the person paying, and the reason the round
    # ceiling is free to be generous. Rounds say how far the investigation goes;
    # they say nothing about what it costs now that one round can fan out into
    # twelve calls against an 80 000-token context. Read off the cost tracker
    # that already meters every call of the turn (`common/cost_tracking.py`),
    # checked at the top of the agent node beside the round ceiling, and
    # answered the same way: forced synthesis, with its own
    # `status:budget:input` record so a firing is countable.
    #
    # 600 000 is well above the worst turn measured — 288 583 prompt tokens
    # across eight calls, on „was weißt du über die OIB 2" — and that headroom
    # is deliberate. A bound that fires on a hard question is a hobble; this one
    # exists to stop a runaway, and a firing should be rare enough that the
    # record is worth reading. Lower it only against measurement, never to
    # "save money" on a distribution nobody has looked at. 0 disables it.
    max_input_tokens_per_turn: 600000
    # A RUNAWAY GUARD, not a doctrine. Nothing caps the width of a round on
    # purpose — a round costs one whatever it fans out into, and the family
    # overview the prompt asks for is five parallel opens in one batch — but
    # "no cap at all" means one confused decision can put sixty concurrent
    # calls into the vector store, and the token bound above only sees that at
    # the START of the next round, after the fan-out has been served. 12 sits
    # far above every batch the prompt asks for, so a normal turn never meets
    # it. The calls past it are not refused: each is answered with a notice
    # saying it was not run THIS round and may be issued again in the next one,
    # and it stays on the message (a provider rejects an un-answered call).
    # Each firing leaves a `status:width:N` record, so a cap that fires on real
    # turns is visible rather than inferred. 0 disables it.
    max_calls_per_round: 12
    # The turn's one repair (ADR-0067): a quotation the model misremembered is
    # corrected in place to the cited passage's own wording on card_repair_llm.
    # No retrieval, no rewrite. Off, or without card_repair_llm, the quote
    # ships marked.
    repair_pass: true
    # A card the answer envelope carried and the validator refused is fixed
    # ONCE on the card model — the failed object, the refusal and the type's
    # shape in a few thousand tokens — instead of costing the full-context
    # round the `emit_card` retry used to. Unset = drop it and record it.
    card_repair_llm: card_llm
    # Agent skills (progressive-disclosure `use_skill` tool) active on research
    # turns. Empty allowlist = every resolved skill (builtin + org) is offered.
    skills_enabled: true
    # No skill body rides the prompt by size (ADR-0063, amended): all nine
    # chat methods together were ~4 600 tokens on every call, for methods most
    # turns never use. The turn-start decision below picks the ONE method the
    # question is the subject of and reads that body in (~400 tokens, or the
    # IFC method on a model question); the rest stay a catalog line behind
    # `use_skill`. These two are an opt-in budget for an org that wants a
    # method on every turn regardless.
    skills_inline_max_body_chars: 0
    skills_inline_budget_chars: 0
    # The turn-start decision (ADR-0064): one decision-model request beside
    # the skill resolution — does the message need evidence, which corpus and
    # which OIB families, which skill, which card types — acted on by ADDING
    # only: the named fetches run as round 0 before the first LLM call (no
    # budget spent, answered by the duplicate guard when the model asks
    # again), the chosen skill's body and card shapes ride this turn's prompt. Every tool stays bound whatever it
    # says (ADR-0052). `scripts/decision_eval.py` is the adoption gate;
    # GRID_DECISIONS_ENABLED=false switches every decision off at once.
    turn_decisions: true
    skill_allowlist: []
    # Retrieval-based tool narrowing. OFF, deliberately — the block below is the
    # tested configuration, not a suggestion, and it is commented out because on
    # THIS surface the trade is not yet worth taking.
    #
    # The two BIM tools are 81 % of the ~9 000 tokens of tool schema that ride on
    # every call here, so narrowing to four tools saves ~24 % of that payload on
    # average and 81 % on a pure-Normen question. But tokens are not what this
    # agent runs out of — TURNS are, and narrowing does not buy one back. What it
    # can spend is an answer: measured against the eleven tools it had then, a lexical rank
    # over the user's turn alone keeps the answering tool for only 71 % of a
    # realistic German question set. The pins below carry that to 100 %, because
    # they cover the two shapes a query-time ranking structurally cannot see —
    # tools named by INTENT rather than subject (`remember`, `use_skill`,
    # `surface_documents`) and tools that are SEQUENCED, whose turn
    # comes from what a previous tool returned (`ris_fetch_tool` after
    # `ris_search_tool`). Both are guarded by tests.
    #
    # Turn it on when the surface grows past what a prompt can hold — an MCP
    # server with thirty tools — not to shave tokens off eleven.
    #
    # tool_search:
    #   enabled: true
    #   top_k: 4
    #   always_include:
    #     - remember
    #     - use_skill
    #     - surface_documents
    #     - ris_fetch_tool
    #
    # OpenRouter server-side tool search (ADR-0048). ON, but as of 2026-09-23
    # NO model we measured honours it, so today it binds full schemas
    # everywhere (see below). Orthogonal to `tool_search` above: that one decides
    # WHICH tools are bound, this one decides whether their schemas travel with
    # the request. Requires `api_type: responses` on research_llm — enabling it
    # without that fails the workflow build instead of quietly sending the
    # schemas. The build-time probe measures whether the deferral is HONOURED,
    # not whether the flag is echoed: it sends the canary namespace, then the
    # same plus a ~4 000-token deferred ballast function, and accepts only if
    # usage.input_tokens grows by < 200. A model that bills the ballast binds
    # full schemas and the build logs a WARNING naming the growth; it never
    # fails the build.
    #
    # Measured 2026-09-23. A replayed Piloti research call to
    # openai/gpt-5.6-luna (19 functions, all defer_loading: true, echoed back
    # on every one) billed 40 154 input tokens with defer_loading true AND
    # false; dropping three large tools from the namespace cut 10 012. The
    # earlier "14 023 -> 437" saving recorded here no longer holds. The probe:
    #
    #                                  canary   + deferred ballast    growth
    #   openai/gpt-5.6-luna              187          4 100           +3 913
    #   openai/gpt-5.6-sol               187          4 100           +3 913
    #   anthropic/claude-sonnet-5        847          6 034           +5 187
    #   google/gemini-3.7-flash          175          5 072           +4 897
    #
    # Where a provider does honour it, deferral still saves nothing on the turn
    # that loads a schema (it adds the ~620-token tool-search apparatus); it
    # saves the other turns. Where it does not, it would cost that apparatus on
    # every turn, which is why the probe now turns it off.
    #
    # Deferral is gated PER MODEL as well as per endpoint, because the per-org
    # override seam (ADR-0014) can hand a single research turn a model this
    # workflow was never built against. Two independent conditions must hold:
    # the model is cleared for the tool_search + namespace shape, AND it scores
    # at least `min_intelligence_index` on Artificial Analysis's
    # intelligence_index. Neither implies the other — x-ai/grok-4.6 scores 60.9
    # and cannot defer at all; anthropic/claude-sonnet-4.6 defers (it was one of
    # six models seen emitting a real function_call) and is excluded on SCORE
    # alone, at 48.4. Do not re-add sonnet-4.6 or minimax/minimax-m3 (45.4) to
    # the allowlist without also moving the threshold — their absence is a
    # threshold decision, not a missing measurement.
    #
    # A "no" from either condition means BIND THE FULL SCHEMAS. It is never a
    # refused request or a failed build, so a sub-floor model runs exactly as it
    # did before this existed.
    #
    # The defaults ship the measured lists (see `deferred_tool_loading.py`), so
    # `enabled: true` alone turns it on. The `allow` list means the provider
    # accepted and echoed the shape — NOT that it saves anything.
    #
    # Any model not denied is probed ONCE, off the request path, and the
    # verdict cached; until a probe has measured the saving, an unlisted or
    # allowlisted model gets full schemas. So a new model costs one background
    # request, never a wasted round trip on a live turn.
    # OFF since 2026-09-25. Every model measured on 2026-09-23 echoed
    # `defer_loading` and billed the deferred schemas in full, and the boot
    # model measured +3,913 input tokens with it on; no model has been shown
    # to save. What it did send was the `tool_search` payload, which NAT's
    # trace callback cannot parse (one ERROR per call, #635). Turn it back on
    # when a model's probe measures a saving: from then on only such a model
    # defers, an allowlisted one included.
    deferred_tool_loading:
      enabled: false
      # Floor on Artificial Analysis intelligence_index. 0 disables it.
      min_intelligence_index: 50
    #   models:
    #     # Only override these to add a model the shipped lists do not know.
    #     # Every list REPLACES its seeded counterpart rather than extending it
    #     # — `deny` no less than `allow`. So an override has to restate the
    #     # shipped entries it still wants, or it silently re-enables them: the
    #     # three-line example below would readmit the four denied ids it omits,
    #     # and each of those would then cost a wasted round trip per tool
    #     # subset before the fallback latched. The shipped `deny` is:
    #     #   x-ai/grok-4.6, x-ai/grok-4.5, deepseek/deepseek-v4-pro-0813,
    #     #   deepseek/deepseek-v4-flash-0731, moonshotai/kimi-k3,
    #     #   meta-llama/llama-3.3-70b-instruct, openai/gpt-4o-mini
    #     deny:
    #       - x-ai/grok-4.6                    # 422, and scores 60.9 — capability is not quality
    #       - deepseek/deepseek-v4-flash-0731  # routing-flaky: two sweeps disagreed
    #       - meta-llama/llama-3.3-70b-instruct  # routing-flaky: 5 of 6 defer, the 6th 422s
    #     provisional:
    #       # Permitted on request, capability UNVERIFIED — OpenRouter answers 403
    #       # "requires 18+ age confirmation", an ACCOUNT gate that fires before
    #       # the payload is read, so nobody knows whether it takes the shape.
    #       # Yields to whatever the probe or a real request learns (unlike
    #       # `allow`, which is an assertion). Deliberate and informed: if it
    #       # cannot defer, the fallback costs one round trip per tool subset,
    #       # then latches. Not a precedent for listing unverified models.
    #       - meta/muse-spark-1.1

  # Filesystem skills for deep research. Researcher workers load OIB/BIM
  # methods with read_file from /skills/; the writer loads synthesis the same
  # way. Curated offers are hidden on this mount and reach a run through the
  # BFF payload instead. The NVIDIA `research` collection stays off: it needs
  # a sandbox this config does not run.
  deep_research_skills:
    _type: deep_research_skills
    agents:
      researcher-agent: [oib, bim]
      writer-agent: [synthesis]

  deep_research_agent:
    _type: deep_research_agent
    enable_citation_verification: true
    orchestrator_llm: deep_orchestrator_llm
    source_router_llm: deep_router_llm
    researcher_llm: deep_researcher_llm
    planner_llm: deep_planner_llm
    writer_llm: deep_orchestrator_llm
    skills: deep_research_skills
    # Explicit tool list (mirrors shallow_research_agent) so deep research
    # workers get the same OIB knowledge base + RIS access, plus remember and
    # emit_card. Deep uses advanced_web_search_tool (the deep-tuned Tavily
    # instance), not web_search_tool. Pinning the list also avoids depending on
    # data_source_registry inheritance in the async job-worker build path.
    tools:
      - knowledge_search
      # The locator, now on both surfaces. A researcher worker that has read a
      # Gliederung and knows the Punkt it needs was sending the corpus to find
      # that passage again by similarity, paying a fan-out and a reranker pass
      # for an address it already held — and every batch it spent that way is a
      # round the run does not get back.
      - read_passage
      - view_knowledge_image
      - ris_search_tool
      - ris_fetch_tool
      - ris_catalog_lookup_tool
      - advanced_web_search_tool
      - remember
      - emit_card
      - surface_documents
      - ifc_query
      - ifc_measure
    verbose: true
    # Durable checkpointing for async deep-research jobs (T3-8), mirroring
    # workflow.checkpoint_db below: re-invoking the same job_id resumes from
    # the last persisted checkpoint instead of starting over. STRICTLY OPT-IN:
    # empty/unset AIQ_DEEP_CHECKPOINT_DB means no durability (in-memory graph,
    # today's behavior). Do NOT default to a relative sqlite path here — the
    # container's working directory is not guaranteed writable, and a default-on
    # value took application startup down (post-#72 incident). Point the env var
    # at a writable volume path or a Postgres DSN to enable resume-by-job_id.
    checkpoint_db: ${AIQ_DEEP_CHECKPOINT_DB:-}

workflow:
  _type: chat_deepresearcher_agent
  verbose: true
  # The conversation window, in tokens, trimmed before the agent runs. Set
  # explicitly rather than left to the default, because this is the number the
  # deployment is choosing: it is the one part of the context nobody can
  # reconstruct. A single call on this surface carries 37-84k input tokens and
  # the static prompt alone is ~14k, so 8 000 trimmed the user's own words and
  # their corrections while re-sending everything else. See the field docstring
  # in `piloti/conversation_register.py`.
  max_history_tokens: 40000
  enable_clarifier: true
  # The clarification step that confirms a research plan before deep research
  # runs. A block on the workflow rather than its own function: it has one
  # caller and is never chosen by a model. The `clarifier` agent group is
  # unchanged, so a per-org model override still re-points it.
  clarifier:
    llm: clarifier_llm
    planner_llm: clarifier_llm
    max_turns: 3
    enable_plan_approval: true
    log_response_max_chars: 2000
    verbose: true
  use_async_deep_research: true
  checkpoint_db: ${AIQ_CHECKPOINT_DB:-./checkpoints.db}
  # Enables the async post-answer memory-reflection stage (reuses the cheap
  # card_llm). This only makes the capability AVAILABLE; whether it runs is
  # decided per TURN by the BFF (`GET /api/internal/stages`): the
  # `memory-reflection` WorkOS flag when GRID_ENFORCE_FEATURE_FLAGS is on,
  # otherwise GRID_MEMORY_REFLECTION_ENABLED, which defaults ON — so a
  # non-WorkOS deployment DOES get the stage. (The previous claim here, "solely
  # the WorkOS feature flag, no env-var fallback", contradicted
  # `feature-flags.ts` and has been wrong since that fallback was added.)
  memory_reflection_llm: card_llm
  # Enables the async post-answer follow-up-questions stage. As above, this only
  # makes the capability AVAILABLE; whether it runs is decided per TURN by the
  # BFF (`GET /api/internal/stages`): the `post-answer-follow-ups` WorkOS flag
  # when GRID_ENFORCE_FEATURE_FLAGS is on, otherwise
  # GRID_STAGE_FOLLOW_UPS_ENABLED, which defaults ON.
  # The stage delivers a `grid_stage_message` frame, rendered as a rail below
  # the answer card. It ran `silent` for one slice first, so its skip rate,
  # empty rate and true per-turn cost were measured before any reader saw a chip
  # (post-answer-stages.md §10, slices 1 and 3). The in-answer `follow_ups` CARD
  # it replaces is retired (slice 4), so removing `follow_ups_llm` here no longer
  # falls back to the card — it leaves the product with no follow-up questions.
  follow_ups_llm: follow_ups_llm
