# Grid OIB workflow config — OpenRouter endpoint + credential, persistent OIB
# knowledge base plus web search. The MODEL each role runs on is admin-controlled
# at runtime (Platform → Models), not decided here; see the note above `llms:`.

general:
  use_uvloop: true
  telemetry:
    logging:
      console:
        _type: console
        level: INFO
      otlp:
        # Ships runtime logs to the same OTLP collector as the traces below
        # (Aspire dashboard "Strukturierte Protokolle", ADR-0029). The
        # /v1/logs path is derived from the injected traces endpoint; no
        # endpoint == observability tier not deployed == no-op.
        _type: otelcollector_logs
        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
        level: INFO
    tracing:
      # Ships spans to the OTLP endpoint over HTTP/protobuf. Only the endpoint
      # is injected by the deployment (OTEL_EXPORTER_OTLP_ENDPOINT); producers
      # send unauthenticated OTLP to the in-cluster collector and hold no
      # ingestion key of their own (ADR-0029).
      #
      # The endpoint DEFAULTS TO EMPTY ON PURPOSE. NAT cannot declare this
      # entry conditionally, so the exporter is always constructed; the
      # registration in `otel_header_redaction_exporter.py` turns a blank
      # endpoint into a no-op exporter. That keeps the backend on the same
      # "availability = flag AND capability" rule as the rest of the tier —
      # Compose and local dev export nothing instead of retrying forever
      # against a collector that was never deployed. A previous localhost
      # fallback here did exactly that.
      #
      # Set it to run against a local collector; the value must include the
      # full /v1/traces path, because explicit config endpoints are used as-is
      # (only SDK env-var defaults get the signal path appended).
      otelcollector_redaction:
        _type: otelcollector_redaction
        project: ${OTEL_SERVICE_NAME:-grid-aiq-agent}
        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
        resource_attributes:
          deployment.environment: ${APP_ENV:-production}

  front_end:
    _type: aiq_api
    runner_class: aiq_api.plugin.AIQAPIWorker
    db_url: ${NAT_JOB_STORE_DB_URL:-sqlite+aiosqlite:///./jobs.db}
    expiry_seconds: 86400
    cors:
      # Env-overridable so a deployed instance (e.g. a Coolify preview) can allow
      # its own https origin. Default keeps local dev working. Set
      # CORS_ALLOW_ORIGIN_REGEX to a regex matching your frontend origin(s).
      allow_origin_regex: '${CORS_ALLOW_ORIGIN_REGEX:-http://localhost(:\d+)?|http://127.0.0.1(:\d+)?}'
      allow_methods:
        - GET
        - POST
        - DELETE
        - OPTIONS
      allow_headers:
        - "*"
      allow_credentials: true
      expose_headers:
        - "*"

llms:
  # ───────────────────────────────────────────────────────────────────────────
  # THIS FILE DOES NOT DECIDE WHICH MODEL RUNS.
  #
  # `model_name` below is the BOOT FLOOR only — what a role runs on in a process
  # that has no BFF to ask (local `nat run`, a detached worker, an unreachable
  # frontend). The default an actual user gets is a row in the database:
  # `platform_model_defaults`, provisioned by the BFF on first boot when the
  # table is empty and edited under Platform → Models. Every organization that
  # has not chosen its own model for an agent group follows that row on its next
  # turn; a tenant's own choice (Organization → Models) still wins over both.
  # Resolution order: org override → platform default → the value here.
  #
  # TWO EXCEPTIONS, and they are real: `summary_llm` and `rerank_llm` have no
  # agent group, so nothing can re-point them — they resolve to the literals
  # below on EVERY request, always, and editing them is an unconditional
  # fleet-wide model change no admin can revert. Bootstrap also declines to
  # provision a group whose endpoint is not the platform model provider, which
  # leaves that group on the value below too.
  # See docs/architecture/org-model-configuration.md.
  #
  # So: do NOT edit these to move the fleet to a newer model — that is a save in
  # the admin UI, not a commit and a redeploy. Change them (or set
  # GRID_DEFAULT_MODEL) only to move the *floor*, e.g. for a deployment that
  # runs without the BFF. What this file remains the sole owner of is the
  # plumbing: base_url, api_key, temperature, max_tokens, reasoning_effort,
  # timeouts and retries — none of which an override may touch.
  # ───────────────────────────────────────────────────────────────────────────
  #
  # ───────────────────────────────────────────────────────────────────────────
  # REASONING EFFORT PER AGENT ROLE — OPENROUTER-STANDARD VALUES, PASSED THROUGH
  # reasoning_effort uses OpenRouter's unified vocabulary (none/minimal/low/
  # medium/high/xhigh) and is sent verbatim: OpenRouter maps the requested
  # effort to the nearest level the EFFECTIVE model supports, per model,
  # server-side — including models selected by org overrides (ADR-0014). We
  # deliberately keep NO app-side per-provider mapping (it would duplicate and
  # drift from OpenRouter's contract). Never use provider-native tier names
  # here (e.g. DeepSeek's "max") — OpenRouter rejects/ignores them; the
  # highest unified level is "xhigh". See
  # https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
  # Policy: none for pure routing/trivial one-liners, medium for everything
  # else — high tiers multiplied hidden reasoning tokens across hundreds of
  # agent turns per run for no measurable quality gain (observed 20+ min runs
  # stuck in planning). Each role has its own LLM definition so roles are
  # independently tunable; swap model_name/base_url/api_key to change provider
  # (the system is LLM-agnostic — see docs/architecture/llm-providers.md).
  #
  # request_timeout (seconds) bounds every HTTP call — NAT's default is None
  # (UNBOUNDED), which let one stalled provider call hang a whole deep-research
  # run indefinitely. max_retries is the OpenAI-client retry count; kept low
  # because the middleware layers (ModelRetryMiddleware,
  # SelectiveToolRetryMiddleware) add their own retries on top.
  # ───────────────────────────────────────────────────────────────────────────

  # Intent Router — classify meta-vs-research + shallow-vs-deep depth. Pure routing.
  intent_llm:
    _type: openai
    model_name: ${GRID_DEFAULT_MODEL:-openai/gpt-5.6-luna}
    base_url: "https://openrouter.ai/api/v1"
    api_key: ${OPENROUTER_API_KEY}
    # Pure router: classification must be repeatable for the same query.
    # temperature 1.0 made shallow-vs-deep depth noisy across runs; greedy
    # decoding pins the decision so identical queries route identically.
    #
    # CAVEAT — temperature is NOT honoured by every model. OpenRouter DROPS a
    # sampling parameter an endpoint does not advertise (and
    # provider.require_parameters is deliberately unset, see the note below), so
    # on a model whose supported_parameters omits `temperature` — the current
    # default, openai/gpt-5.6-luna, is one — this line is silently inert and the
    # routing noise returns. `seed` is the lever those models do expose; it is
    # best-effort (providers may still vary) but it is what remains. Keep BOTH:
    # temperature serves models that honour it, seed serves the rest.
    temperature: 0
    seed: 1
    top_p: 1.0
    max_tokens: 4096
    max_retries: 2
    request_timeout: 60
    reasoning_effort: none
    # NOTE: the OpenRouter response-healing plugin is forced on every OpenRouter
    # LLM centrally in code (aiq_agent.common.llm_factory
    # .apply_openrouter_structured_defaults, applied via get_langchain_llm), so
    # it is intentionally NOT repeated per-LLM here. provider.require_parameters
    # is deliberately NOT set — it 404s when a group is overridden to a model
    # whose endpoints don't support every param we send.

  # Shallow Research — fast retrieval + synthesis (the quick-answer tier).
  shallow_llm:
    _type: openai
    model_name: ${GRID_DEFAULT_MODEL:-openai/gpt-5.6-luna}
    base_url: "https://openrouter.ai/api/v1"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 1.0
    top_p: 0.95
    max_tokens: 65536
    max_retries: 2
    request_timeout: 120
    # low (not medium): the shallow tier is the quick-answer path; on reasoning
    # models (e.g. grok-4.5 via org override) medium spent a large hidden-token
    # "think" budget before emitting the first answer token — the dominant slice
    # of the synthesis-call latency observed in the profiler (final synth ≈29s on
    # a simple meta-ish query). Shallow retrieval+synthesis does not need deep
    # deliberation; deep_* roles keep medium for the genuinely hard reasoning.
    reasoning_effort: low

  # HITL Clarification & Planning — clarify ambiguity, generate the research plan.
  clarifier_llm:
    _type: openai
    model_name: ${GRID_DEFAULT_MODEL:-openai/gpt-5.6-luna}
    base_url: "https://openrouter.ai/api/v1"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 1.0
    top_p: 0.95
    max_tokens: 65536
    max_retries: 2
    request_timeout: 120
    reasoning_effort: medium

  # Deep Researcher — Orchestrator (also the report writer): top-level control.
  deep_orchestrator_llm:
    _type: openai
    model_name: ${GRID_DEFAULT_MODEL:-openai/gpt-5.6-luna}
    base_url: "https://openrouter.ai/api/v1"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 1.0
    top_p: 0.95
    max_tokens: 128000
    max_retries: 2
    request_timeout: 180
    reasoning_effort: medium

  # Deep Researcher — Planning sub-agents.
  deep_planner_llm:
    _type: openai
    model_name: ${GRID_DEFAULT_MODEL:-openai/gpt-5.6-luna}
    base_url: "https://openrouter.ai/api/v1"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 1.0
    top_p: 0.95
    max_tokens: 128000
    max_retries: 2
    request_timeout: 180
    reasoning_effort: medium

  # Deep Researcher — Researcher sub-agents (parallel investigations).
  deep_researcher_llm:
    _type: openai
    model_name: ${GRID_DEFAULT_MODEL:-openai/gpt-5.6-luna}
    base_url: "https://openrouter.ai/api/v1"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 1.0
    top_p: 0.95
    max_tokens: 65536
    max_retries: 2
    request_timeout: 120
    reasoning_effort: medium

  # Deep Researcher — source routing (which source to query). Lighter decision.
  deep_router_llm:
    _type: openai
    model_name: ${GRID_DEFAULT_MODEL:-openai/gpt-5.6-luna}
    base_url: "https://openrouter.ai/api/v1"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 1.0
    top_p: 0.95
    max_tokens: 8192
    max_retries: 2
    request_timeout: 60
    reasoning_effort: medium

  # RIS query planner — pure JSON-schema extraction (structured outputs), not a
  # reasoning task. Dedicated cheap twin of deep_router_llm (same model/base_url)
  # so we can drop reasoning_effort to none WITHOUT weakening deep_router_llm,
  # which is also the deep-research source_router_llm where medium still matters.
  ris_planner_llm:
    _type: openai
    model_name: ${GRID_DEFAULT_MODEL:-openai/gpt-5.6-luna}
    base_url: "https://openrouter.ai/api/v1"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 1.0
    top_p: 0.95
    max_tokens: 8192
    max_retries: 2
    request_timeout: 60
    reasoning_effort: none

  # Card generation — structured rich-UI compliance cards.
  card_llm:
    _type: openai
    model_name: ${GRID_DEFAULT_MODEL:-openai/gpt-5.6-luna}
    base_url: "https://openrouter.ai/api/v1"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 1.0
    top_p: 0.95
    max_tokens: 65536
    max_retries: 2
    request_timeout: 120
    reasoning_effort: medium

  # Compliance pipeline — Stage 1 requirement derivation + Stage 2 evidence
  # judging (structured outputs; ~10-16 calls per full 6-Richtlinien check).
  compliance_llm:
    _type: openai
    model_name: ${GRID_DEFAULT_MODEL:-openai/gpt-5.6-luna}
    base_url: "https://openrouter.ai/api/v1"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 1.0
    top_p: 0.95
    max_tokens: 65536
    max_retries: 2
    request_timeout: 120
    reasoning_effort: medium

  # Document / project summaries — trivial one-liners.
  summary_llm:
    _type: openai
    model_name: ${GRID_DEFAULT_MODEL:-openai/gpt-5.6-luna}
    base_url: "https://openrouter.ai/api/v1"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 1.0
    top_p: 0.95
    max_tokens: 100
    max_retries: 2
    request_timeout: 30
    reasoning_effort: none

  # LLM-judge retrieval reranking — one batched relevance judgment over up to
  # rerank_candidates chunks. Dedicated entry: summary_llm's 100-token cap is
  # too small for a 15-candidate JSON scores reply. Greedy decoding (0) pins the
  # judgment; pure JSON extraction needs no reasoning effort.
  #
  # NOTE: rerank_llm has NO agent group, so no platform default or org override
  # can re-point it — this literal is what every request uses, always. That also
  # means the temperature caveat on intent_llm applies here with no way to route
  # around it from the admin surface; `seed` is set for the same reason.
  rerank_llm:
    _type: openai
    model_name: ${GRID_DEFAULT_MODEL:-openai/gpt-5.6-luna}
    base_url: "https://openrouter.ai/api/v1"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 0
    seed: 1
    top_p: 1.0
    max_tokens: 256
    max_retries: 2
    request_timeout: 60
    reasoning_effort: none

functions:
  data_sources:
    _type: data_source_registry
    sources:
      - id: web_search
        name: "Web Search"
        description: "Search the web for real-time information."
        tools:
          - web_search_tool
          - advanced_web_search_tool
      - id: knowledge_layer
        name: "Knowledge Base"
        description: "Search uploaded documents and files."
        tools:
          - knowledge_search
      - id: ris
        name: "RIS – Österreichisches Recht"
        description: "Search Austrian federal/state law and case law in the official RIS (Rechtsinformationssystem des Bundes) and fetch entire documents on demand."
        tools:
          - ris_search_tool
          - ris_fetch_tool
          - ris_catalog_lookup_tool

  web_search_tool:
    _type: tavily_web_search
    max_results: 8
    max_content_length: 1000
    # Optional domain allow/deny lists (default: unrestricted). These are HARD
    # filters: with include_domains set, any result NOT on the list is dropped;
    # exclude_domains removes matching domains. Shallow chat uses THIS instance,
    # so a real allow-list must be set here AND on advanced_web_search_tool below.
    # RIS domain is excluded because the structured RIS adapter handles Austrian
    # building law exclusively (accurate, up-to-date, traceable).
    # include_domains: []
    exclude_domains:
      - ris.bka.gv.at

  advanced_web_search_tool:
    _type: tavily_web_search
    max_results: 4
    advanced_search: true
    # Optional domain allow/deny lists (default: unrestricted). These are HARD
    # filters: with include_domains set, any result NOT on the list is dropped;
    # exclude_domains removes matching domains. Deep research uses THIS instance,
    # so a real allow-list must be set here AND on web_search_tool above.
    # RIS domain is excluded because the structured RIS adapter handles Austrian
    # building law exclusively (accurate, up-to-date, traceable).
    # include_domains: []
    exclude_domains:
      - ris.bka.gv.at

  # Austrian RIS (OGD-RIS API, no API key needed): live search over federal/
  # state law and case law, plus on-demand fetching of ENTIRE documents
  # (complete consolidated laws, court decisions). Fetched documents are also
  # ingested into the per-session knowledge collection so knowledge_search can
  # retrieve and cite specific sections afterwards.
  ris_search_tool:
    _type: ris_search
    # max_results == page_size: the agent sees every hit the page fetched, so
    # asking for page 2 continues where page 1 stopped instead of skipping the
    # hits that were fetched but never shown.
    page_size: 20
    max_results: 20
    # Query planning via strict structured outputs (response_format:
    # json_schema); falls back to the agent's raw arguments when the planner
    # is unavailable or fails. Uses ris_planner_llm — a dedicated cheap twin of
    # deep_router_llm at reasoning_effort: none, because this is pure JSON
    # extraction, not a reasoning task. Kept separate from deep_router_llm so
    # lowering effort here does not weaken deep-research source routing.
    planner_llm: ris_planner_llm

  ris_fetch_tool:
    _type: ris_fetch_document
    max_chars: 40000
    ingest_into_knowledge: true

  # Norm registry (configs/norms/<country>/registry.yml, override via
  # GRID_NORMS_DIR; ADR-0025): typed spine with verified RIS pointers.
  # ris_search short-circuits to these pointers on a catalog match
  # (catalog_shortcut), ris_catalog_lookup annotates hits with registry
  # relations, and the researcher prompts show the lane-rendered block.
  ris_catalog_lookup_tool:
    _type: ris_catalog_lookup
    max_matches: 8

  knowledge_search:
    _type: knowledge_retrieval
    backend: llamaindex
    collection_name: ${COLLECTION_NAME:-oib_knowledge}
    include_base_collection: true
    include_session_collection: true
    project_collections: []
    # Phase-0 default exclusion (norm-registry spec §8): diff documents and the
    # superseded non-rev.1 zitierte_normen duplicate never surface in default
    # retrieval. Replaced by role/edition metadata filters in Phase 2.
    exclude_file_names:
      - aenderungen_oib-rl_1_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_1_leitfaden_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_2.1_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_2.2_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_2.3_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_2_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_2_leitfaden_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_3_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_4_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_5_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_6-leitfaden_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_6_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_begriffsbestimmungen_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_zitierte_normen_und_sonstige_technische_regelwerke_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_zitierte_normen_und_sonstige_technische_regelwerke_ausgabe_mai_2023_rev.1.pdf
      - oib-rl_zitierte_normen_und_sonstige_technische_regelwerke_ausgabe_mai_2023.pdf
    generate_summary: true
    summary_model: summary_llm
    summary_db: ${AIQ_SUMMARY_DB:-sqlite+aiosqlite:///./summaries.db}
    # top_k=16 with a 5-per-document diversity cap still spans >=4 distinct
    # Richtlinien on cross-cutting questions instead of 5 chunks from the 1-2
    # top-scoring PDFs, and gives each of them enough consecutive text to reason
    # over. The cap and the total move together: raising the cap without raising
    # top_k buys per-document depth by giving up that breadth.
    top_k: 16
    max_chunks_per_document: 5
    chroma_dir: ${AIQ_CHROMA_DIR:-/tmp/chroma_data}
    # LLM-judge reranking: over-fetch rerank_candidates (20) chunks and re-order
    # them against the query with the dedicated rerank LLM before trimming to
    # top_k. Must exceed top_k — rerank_chunks trims to rerank_candidates, so a
    # smaller pool than top_k could never fill the full result set. Fail-open:
    # any judge error returns the fused (hybrid+vector) order.
    rerank_llm: rerank_llm
    rerank_candidates: 20

  # Project Memory: silent, observable capture of durable project findings.
  # Available in project-scoped chats; no-ops (with a clear error) elsewhere.
  remember:
    _type: project_memory_remember

  # Rich UI cards: the agent calls emit_card mid-answer when a structured
  # element (legal basis, dimension/stair diagram, summary) adds value. Cards
  # are validated and delivered alongside the written answer.
  emit_card:
    _type: emit_card

  # Blocking multiple-choice question the answering agent can put mid-turn,
  # for a choice it can enumerate but cannot decide (which of two IFC models,
  # which Bundesland). Goes through the same HITL channel as the clarifier, so
  # the addressee guard and reconnect handling apply; degrades to "answer with
  # a stated assumption" wherever no HITL channel is bound.
  ask_user:
    _type: ask_user

  # L2 of the card vocabulary. `emit_card` advertises one line per card type;
  # this returns the exact nesting and a worked example for the type actually
  # being emitted. Rendering all 27 shapes up front costs ~5,200 tokens on every
  # turn whether or not a card is emitted, and ~190 more for each type we add.
  describe_card:
    _type: describe_card

  # Document surfacing: show a file (filename= / mode=one) or a short browse
  # choice (mode=many). Distinct from knowledge_search, which cites passages;
  # the UI peeks cited files, so the agent must not also surface after citing.
  surface_documents:
    _type: surface_documents

  # BIM/IFC: deterministic structured queries over the project's uploaded IFC
  # model (ADR-0045). Distinct from knowledge_search in kind, not degree — that
  # tool retrieves text about REGULATIONS, this one runs SQL against THIS
  # building's elements, so "how many external walls on the ground floor" comes
  # back as a count rather than as a summary an LLM had to add up.
  ifc_query:
    _type: ifc_query
    default_limit: 25

  # BIM/IFC, the geometric half: measurements, topology and spatial relations
  # read from the model's own bytes by the IfcOpenShell engine (roadmap §13b).
  # It answers what the EXPORT DID NOT WRITE DOWN — a room's floor area with no
  # published quantity, a window's Brüstungshöhe, the lichte Raumhöhe under a
  # suspended ceiling — and every answer carries its provenance (deklariert /
  # gemessen ±Toleranz / vermutlich) so a measurement can never be reported as
  # something the model states. Gated by the same `ifc-models` flag as
  # ifc_query: both go through lib/bim/internal-access in the BFF, so a model
  # this tool can reach is one ifc_query could already answer questions about.
  ifc_measure:
    _type: ifc_measure
    default_limit: 50

  # Purpose-built OIB Soll-Ist-Abgleich (backlog T4-3): staged pipeline
  # (requirement profile per Richtlinie -> batched evidence judgment ->
  # deterministic matrix + German report) — the structured alternative to
  # running compliance checks through open-ended deep research. See
  # src/aiq_agent/agents/compliance_checker/README.md.
  compliance_check:
    _type: compliance_check_agent
    llm: compliance_llm
    knowledge_search_tool: knowledge_search
    max_concurrency: 3
    richtlinien: [1, 2, 3, 4, 5, 6]
    requirement_batch_size: 9
    verbose: false

  intent_classifier:
    _type: intent_classifier
    llm: intent_llm
    # Explicit list so the classifier's prompt advertises the non-data-source
    # `remember` tool — otherwise it denies that memory exists and dead-ends
    # memory requests in the tool-less meta branch.
    tools:
      - web_search_tool
      - knowledge_search
      - ris_search_tool
      - ris_fetch_tool
      - ris_catalog_lookup_tool
      - remember
      - ifc_query
      - ifc_measure
    verbose: true

  clarifier_agent:
    _type: clarifier_agent
    llm: clarifier_llm
    planner_llm: clarifier_llm
    max_turns: 3
    enable_plan_approval: true
    log_response_max_chars: 2000
    verbose: true

  shallow_research_agent:
    _type: shallow_research_agent
    llm: shallow_llm
    # Explicit list (replaces registry inheritance) so the non-data-source
    # `remember`, `emit_card` and `ask_user` tools are included alongside
    # search/knowledge.
    tools:
      - web_search_tool
      - knowledge_search
      - ris_search_tool
      - ris_fetch_tool
      - ris_catalog_lookup_tool
      - remember
      - emit_card
      - describe_card
      - surface_documents
      - ifc_query
      - ifc_measure
      - ask_user
    verbose: true
    max_llm_turns: 10
    max_tool_iterations: 5
    # Agent skills (progressive-disclosure `use_skill` tool) active on research
    # turns. Empty allowlist = every resolved skill (builtin + org) is offered.
    skills_enabled: true
    skill_allowlist: []

  deep_research_agent:
    _type: deep_research_agent
    enable_citation_verification: true
    orchestrator_llm: deep_orchestrator_llm
    source_router_llm: deep_router_llm
    researcher_llm: deep_researcher_llm
    planner_llm: deep_planner_llm
    writer_llm: deep_orchestrator_llm
    # Explicit tool list (mirrors shallow_research_agent) so deep research
    # workers get the same OIB knowledge base + RIS access, plus remember and
    # emit_card. Deep uses advanced_web_search_tool (the deep-tuned Tavily
    # instance), not web_search_tool. Pinning the list also avoids depending on
    # data_source_registry inheritance in the async job-worker build path.
    tools:
      - knowledge_search
      - ris_search_tool
      - ris_fetch_tool
      - ris_catalog_lookup_tool
      - advanced_web_search_tool
      - remember
      - emit_card
      - describe_card
      - ifc_query
      - ifc_measure
    verbose: true
    # Durable checkpointing for async deep-research jobs (T3-8), mirroring
    # workflow.checkpoint_db below: re-invoking the same job_id resumes from
    # the last persisted checkpoint instead of starting over. STRICTLY OPT-IN:
    # empty/unset AIQ_DEEP_CHECKPOINT_DB means no durability (in-memory graph,
    # today's behavior). Do NOT default to a relative sqlite path here — the
    # container's working directory is not guaranteed writable, and a default-on
    # value took application startup down (post-#72 incident). Point the env var
    # at a writable volume path or a Postgres DSN to enable resume-by-job_id.
    checkpoint_db: ${AIQ_DEEP_CHECKPOINT_DB:-}

workflow:
  _type: chat_deepresearcher_agent
  verbose: true
  enable_escalation: true
  enable_clarifier: true
  use_async_deep_research: true
  checkpoint_db: ${AIQ_CHECKPOINT_DB:-./checkpoints.db}
  card_generator_llm: card_llm
  # Enables the async post-answer memory-reflection stage (reuses the cheap
  # card_llm). This only makes the capability AVAILABLE; whether it runs per
  # request is gated at runtime solely by the `memory-reflection` WorkOS
  # feature flag (no env-var fallback; anonymous/non-WorkOS deployments
  # cannot enable it).
  memory_reflection_llm: card_llm
