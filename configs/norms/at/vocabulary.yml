# Bilingual OIB retrieval vocabulary.
#
# The corpus is German; users ask in German AND English. A German-language index
# cannot be reached by an English query on lexical grounds at all, and only weakly
# on dense grounds -- measured on this corpus with a multilingual retriever, an
# English question scored MRR 0.293 against the same question in German at 0.678.
# Prepending the German terms below to the English query closed that gap to 0.674.
# This file is that bridge.
#
# EVERY German term here was counted in data/oib/*.pdf before being written down,
# and the count is recorded beside it. A glossary entry naming a word the corpus
# does not use is worse than no entry: it spends query budget and can only add
# noise. Terms that failed that check are listed at the bottom so nobody re-adds
# them from intuition -- `Anleiterbarkeit`, `Bruttogeschossfläche` and
# `Luftschalldämmung` all occur ZERO times, despite being natural things to guess.
#
# Admin-editable, like the norm registry beside it. `en` are the surface forms an
# English speaker types; `de` are the corpus's own words, most frequent first.

