- id: wbtv
  title: Wiener Bautechnikverordnung 2023
  short: WBTV
  rank: verordnung
  bundesland: Wien
  topics:
  - bautechnikverordnung
  - wbtv
  - bautechnik
  - bauvorschriften
  - oib-richtlinien
  relevance: Vienna building technics ordinance (declares the OIB-Richtlinien binding for Vienna,
    with deviation annex)
  application: LrKons
  document_number: LWI40016790
  citation_url: https://www.ris.bka.gv.at/eli/lgbl/WI/2024/14/P0/LWI40016790
  full_law_url: https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=LrW&Gesetzesnummer=20000702
  binding_note: 'Macht die OIB-Richtlinien in Wien verbindlich: § 1 erklärt die in den Anlagen enthaltenen
    OIB-Richtlinien für einzuhalten (Ausnahmen: Anl. 11 Pkt 2.1.5/2.1.6, Anl. 12 Pkt 5); § 2 erlaubt
    Abweichungen bei gleichwertigem Schutzniveau. Erlassen auf Grund §§ 118 Abs. 5 und 122 BauO Wien.
    Vor dem Zitieren einer OIB-Anforderung für ein Wiener Projekt: verbindlich erklärte Ausgabe und
    Anlagen-Abweichungen in der WBTV prüfen.'
  review_note: 'Offen: welche OIB-Ausgabe (2019 oder 2023) die geltende WBTV-Fassung verbindlich erklärt
    und die Anlagen-Abweichungsliste — aus dem WBTV-Volltext verifizieren.'
  verify:
    title_query: Bautechnikverordnung
    expect: Bautechnikverordnung
  verified_at: '2026-07-17'
