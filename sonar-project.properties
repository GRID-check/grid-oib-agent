# SonarQube Cloud configuration (https://sonarcloud.io).
#
# WHY: the ruff config deliberately ignores the Pylint refactor rules
# (PLR0913 too-many-arguments, PLR0912 too-many-branches, PLR0915
# too-many-statements, PLR0914 too-many-locals — see pyproject.toml), because
# the existing codebase violates them broadly. Sonar's "clean as you code"
# quality gate reports these smells (and cognitive complexity, duplication,
# bugs, security hotspots) on NEW/changed code without failing the build on the
# existing backlog — the right tool for incrementally paying the debt down.
#
# SETUP (one-time, owner action — cannot be done from the repo):
#   1. Create the project on https://sonarcloud.io under your organization and
#      confirm the projectKey/organization below match what SonarCloud assigns.
#   2. Add a SONAR_TOKEN repository secret (Settings -> Secrets -> Actions).
#   The CI workflow (.github/workflows/sonar.yml) is a no-op until SONAR_TOKEN
#   exists, so nothing breaks before setup.

sonar.projectKey=GRID-check_grid-oib-agent
sonar.organization=grid-check
sonar.projectName=grid-oib-agent

# --- Sources (production code) ---
sonar.sources=src,frontends/aiq_api/src,frontends/ui/src,sources
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11, 3.12, 3.13

# --- Tests ---
sonar.tests=tests,frontends/aiq_api/tests
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/test_*.py

# --- Exclusions: generated, vendored, and non-code assets ---
sonar.exclusions=**/node_modules/**,**/.venv/**,**/__pycache__/**,**/.next/**,**/dist/**,**/*.min.js,data/**,**/*.j2,**/drizzle/**,**/mocks/**,**/generated.ts
sonar.coverage.exclusions=**/*.spec.ts,**/*.spec.tsx,**/test_*.py,**/tests/**,**/conftest.py,**/mocks/**

# --- Coverage reports (produced by the CI workflow; ignored if absent) ---
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontends/ui/coverage/lcov.info
