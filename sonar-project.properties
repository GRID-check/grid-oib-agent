# SonarQube configuration — works with SonarQube Cloud (sonarcloud.io) or a
# self-hosted SonarQube server (deploy/compose/docker-compose.sonar.yml).
# The scanner reads SONAR_HOST_URL + SONAR_TOKEN from the environment
# (.github/workflows/sonar.yml), so the same config targets either.
#
# WHY SONAR: the ruff config deliberately ignores the Pylint refactor rules
# (PLR0913 too-many-arguments, PLR0912 too-many-branches, PLR0915
# too-many-statements, PLR0914 too-many-locals — see pyproject.toml), because
# the existing codebase violates them broadly. Sonar's "clean as you code"
# quality gate reports these smells (plus cognitive complexity, duplication,
# bugs, security hotspots) on NEW/changed code without failing the build on the
# existing backlog — the right tool for paying the debt down incrementally.
# NOTE: PR/branch analysis (the clean-as-you-code gate on PRs) requires
# SonarQube Cloud or the paid Developer Edition; Community Edition analyzes the
# main branch only.
#
# SETUP (one-time, owner action):
#   1. Create the project (Cloud) or a server (self-hosted) and confirm the
#      projectKey/organization below match.
#   2. Add a SONAR_TOKEN repo secret; for self-hosted, also set a SONAR_HOST_URL
#      repo variable. The CI workflow is a no-op until SONAR_TOKEN exists.

sonar.projectKey=GRID-check_grid-oib-agent
sonar.organization=grid-check
sonar.projectName=grid-oib-agent
sonar.sourceEncoding=UTF-8

# ============================================================================
# Sources — production code, per language module
# ============================================================================
sonar.sources=src,frontends/aiq_api/src,frontends/ui/src,sources

# --- Python (backend: agent + aiq_api plugin + NAT data-source packages) ---
sonar.python.version=3.11, 3.12, 3.13
# Coverage from both backend pytest runs (see .github/workflows/ci.yml).
sonar.python.coverage.reportPaths=coverage.xml,coverage-aiqapi.xml
# Bandit/ruff can feed external issues later via sonar.python.*.reportPaths.

# --- TypeScript / JavaScript (frontend: Next.js UI + BFF + gateway + purger) ---
# tsconfigPaths lets Sonar's TS analyzer resolve types/paths the way the app
# builds (catches far more than syntactic rules).
sonar.typescript.tsconfigPaths=frontends/ui/tsconfig.json
sonar.javascript.lcov.reportPaths=frontends/ui/coverage/lcov.info
# Large TS project: give the analyzer more heap so it does not bail on big files.
sonar.javascript.node.maxspace=4096

# ============================================================================
# Tests
# ============================================================================
sonar.tests=tests,frontends/aiq_api/tests,frontends/ui/src
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/test_*.py,**/conftest.py

# ============================================================================
# Exclusions
# ============================================================================
# Not analyzed at all: generated, vendored, build output, non-source assets.
sonar.exclusions=\
  **/node_modules/**,\
  **/.venv/**,\
  **/venv/**,\
  **/__pycache__/**,\
  **/.next/**,\
  **/dist/**,\
  **/build/**,\
  **/*.min.js,\
  **/*.min.css,\
  data/**,\
  **/*.j2,\
  **/drizzle/**,\
  **/migrations/**,\
  **/mocks/**,\
  **/__mocks__/**,\
  **/generated.ts,\
  **/*.generated.*,\
  **/shared/cards/schemas.json,\
  **/*.stories.tsx,\
  deploy/**,\
  docs/**

# Analyzed for bugs/smells, but NOT counted toward coverage (no meaningful
# coverage target: tests, mocks, type-only decls, config, entrypoints).
sonar.coverage.exclusions=\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/test_*.py,\
  **/tests/**,\
  **/conftest.py,\
  **/mocks/**,\
  **/*.d.ts,\
  **/*.config.ts,\
  **/*.config.mjs,\
  **/eslint.config.mjs,\
  **/next.config.ts,\
  **/drizzle.config.ts,\
  **/__main__.py,\
  **/register.py

# Duplication: don't flag test files (fixtures/setup repeat by nature).
sonar.cpd.exclusions=\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/test_*.py,\
  **/*.j2
