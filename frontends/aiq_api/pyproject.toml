[build-system]
requires = ["setuptools >= 64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "aiq-api"
version = "0.1.0"
description = "Unified AI-Q API - Knowledge API and Async Job API combined"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
authors = [
    {name = "NVIDIA Corporation"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.100.0",
    "dask[distributed]>=2024.1.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.0.0",
    "langchain-core>=1.3.3,<2",
    "python-multipart>=0.0.27,<0.1",
    # JWT validation for AuthMiddleware (RS256 via JWKS)
    "PyJWT[cryptography]>=2.8.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "psycopg[binary]>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."nat.plugins"]
aiq_api = "aiq_api.register"
