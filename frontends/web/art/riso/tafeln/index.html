      own(c, s.top, i > NSTEP - 4 ? { kelly: 0.18 * (i - NSTEP + 4) } : {});
      own(c, s.south, { mist: 0.3 }); own(c, s.west, { moss: 0.12 });
      line(c, s.sil, 0.8, KEY);
    }
    // the stair's stringer seen from the west, and a handrail
    const strg = poly(P, [[SX0, SY0, 0], [SX0, LAND[0], z0 - 0.25], [SX0, LAND[0], z0], [SX0, SY0, RISE]]);
    line(c, strg, 1.0, KEY);
    const rail = new Path2D(); const ra = P([SX0 - 0.05, SY0 + 0.2, 1.1]), rb = P([SX0 - 0.05, LAND[0], z0 + 1.0]), rc = P([SX0 - 0.05, LAND[1] - 0.1, z0 + 1.0]);
    rail.moveTo(ra[0], ra[1]); rail.lineTo(rb[0], rb[1]); rail.lineTo(rc[0], rc[1]);
    line(c, rail, 1.3, KEY);
    for (let i = 0; i <= NSTEP; i += 4) { const y = SY0 + i * GO + 0.15, zb = (i + 1) * RISE; line(c, E([SX0 - 0.05, y, zb], [SX0 - 0.05, y, zb + 1.1 - RISE]), 0.8, KEY); }
    line(c, E([SX0 - 0.05, LAND[1] - 0.1, z0], [SX0 - 0.05, LAND[1] - 0.1, z0 + 1.0]), 0.8, KEY);
  }

  return { inks: ['mist', 'kelly', 'moss', 'hunter'], draw, key: 'hunter', numeral: { sq: [540, 1058] } };
})();

/* ═════════════════════════════════════════════════════════════════════════

Riso.run({

    { name: 'bauplatz',     base: 'piloti-iv-bauplatz',     art: IV,   composes: ['sq'] },
    { name: 'pruefstand',   base: 'piloti-v-pruefstand',    art: V,    composes: ['sq'] },

  ],

             en: 'Green risograph: a white building raised on three slender columns above a lawn, with a roof garden and ribbon windows; a small figure with a rolled drawing stands nearby.' },
      caption: { de: 'Tafel I — Drei Stützen', en: 'Plate I — Three columns' } },
    { plate: 'stuetzen', format: 'og',

    { plate: 'stuetzen', format: 'banner',

             en: 'Green risograph: the house on three columns at the left; on the lawn to the right, the staked-out plot for the next house.' } },
    { plate: 'schichten', format: 'plate',
      alt: { de: 'Risografie: sechs übereinander schwebende Blätter als Explosionszeichnung, von Quellen über Aufbereitung, Index, Suche und Prüfung bis zur Antwort mit Belegen.',
             en: 'Risograph: six sheets floating one above another as an exploded drawing, from sources through preparation, index, search and check to an answer with citations.' },
      caption: { de: 'Tafel II — Schichten', en: 'Plate II — Layers' } },
    { plate: 'schleife', format: 'plate',
      alt: { de: 'Risografie: ein Papierstreifen, zu einem Möbiusband geschlossen, schwebt über einem Tisch; auf ihm Stationen einer Korrektur, darunter ein Plan mit einer roten Revisionswolke.',
             en: 'Risograph: a strip of paper closed into a Möbius band floats above a table; along it, the stations of a correction, among them a plan with a red revision cloud.' },
      caption: { de: 'Tafel III — Schleife', en: 'Plate III — Loop' } },
    { plate: 'bauplatz', format: 'plate',
      alt: { de: 'Risografie im Morgenlicht: ein leerer Bauplatz mit Schnurgerüst und abgestecktem Grundriss, eine einzelne Stütze mit Bewehrungsenden und ein Pflock mit rotem Band.',
             en: 'Risograph at dawn: an empty building plot with batter boards and a staked-out footprint, a single column with rebar ends and a stake with a red ribbon.' },
      caption: { de: 'Tafel IV — Bauplatz', en: 'Plate IV — Building plot' } },
    { plate: 'pruefstand', format: 'plate',
      alt: { de: 'Risografie: ein Grundriss auf einem schräg gestellten Zeichenbrett, darüber eine Lupe, die einen Wandanschluss vergrößert.',
             en: 'Risograph: a floor plan on a tilted drawing board, with a magnifier held over one wall junction.' },
      caption: { de: 'Tafel V — Prüfstand', en: 'Plate V — Test bench' } },
    { plate: 'zeichentisch', format: 'plate',
      alt: { de: 'Risografie: ein Zeichentisch von oben mit Plan, Kaffeetasse, Dreikantmaßstab, Bleistift und Topfpflanze; kleine Karten gleiten auf einen Stapel.',
             en: 'Risograph: a drafting table from above with a plan, a coffee cup, a scale rule, a pencil and a potted plant; small cards glide onto a stack.' },
      caption: { de: 'Tafel VI — Zeichentisch', en: 'Plate VI — Drafting table' } },
    { plate: 'waage', format: 'plate',
      alt: { de: 'Risografie: eine Balkenwaage auf einem Tisch, in der einen Schale ein Stapel Blätter, in der anderen fünf Münzen; der Balken neigt sich zu den Blättern.',
             en: 'Risograph: a balance on a table with a pile of sheets in one pan and five coins in the other; the beam tips toward the sheets.' },
      caption: { de: 'Tafel VII — Waage', en: 'Plate VII — Balance' } },
    { plate: 'tuer', format: 'plate',
      alt: { de: 'Risografie im Morgenlicht: eine Außentreppe führt an einem aufgeständerten Haus zu einer offenen Tür, aus der grünes Licht fällt; Trittsteine queren die Wiese.',
