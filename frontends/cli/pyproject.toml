[build-system]
build-backend = "setuptools>=83.0.0"
requires = ["setuptools >= 64", "setuptools-scm>=10.2.1"]

[project]
name = "aiq-research-cli"
version = "2.0.1"
description = "AI-Q Blueprint CLI - Interactive command-line interface for the AI-Q blueprint"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
dependencies = [
    "aiq-agent",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "prompt_toolkit>=3.0.0",
]

[tool.setuptools]
packages = ["aiq_research_cli"]
package-dir = {"aiq_research_cli" = "."}

[project.scripts]
aiq-research = "aiq_research_cli.cli:main"
