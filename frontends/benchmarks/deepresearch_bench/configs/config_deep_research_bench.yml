# Deep Research Bench (DRB) Evaluation Configuration
# Uses Langchain Deep Agents for deep research evaluation

general:
  telemetry:
    logging:
      console:
        _type: console
        level: INFO
    # tracing:
      # phoenix:
      #   _type: phoenix
      #   endpoint: http://localhost:6006/v1/traces
      #   project: dev
      # weave:
      #   _type: weave
      #   project: "nvidia-aiq/AIQ_v2_deepresearch_bench"
  use_uvloop: true

llms:
  nemotron_super_llm:
    _type: openai
    model_name: ${GRID_DEFAULT_MODEL:-openai/gpt-5.6-luna}
    base_url: "https://openrouter.ai/api/v1"
    temperature: 0.7
    top_p: 0.7
    max_tokens: 65536
    api_key: ${OPENROUTER_API_KEY}

  gpt_oss_llm:
    _type: openai
    model_name: openai/gpt-oss-120b
    base_url: "https://openrouter.ai/api/v1"
    temperature: 1.0
    top_p: 1.0
    max_tokens: 256000
    api_key: ${OPENROUTER_API_KEY}
    max_retries: 10

functions:
  paper_search_tool:
    _type: paper_search
    max_results: 5
    serper_api_key: ${SERPER_API_KEY}

  advanced_web_search_tool:
    _type: tavily_web_search
    max_results: 2
    advanced_search: true

  deep_research_agent:
    _type: deep_research_agent
    orchestrator_llm: gpt_oss_llm
    source_router_llm: nemotron_super_llm
    researcher_llm: nemotron_super_llm
    planner_llm: gpt_oss_llm
    writer_llm: gpt_oss_llm
    max_loops: 2
    tools:
      - paper_search_tool
      - advanced_web_search_tool

workflow:
  _type: deep_research_workflow

eval:
  general:
    workflow_alias: "aiq-deepresearcher"
    output_dir: frontends/benchmarks/deepresearch_bench/results
    max_concurrency: 4
    dataset:
      _type: json
      file_path: frontends/benchmarks/deepresearch_bench/data/drb_full_dataset.json
      structure:
        question_key: question
        answer_key: expected_output
        generated_answer_key: generated_answer
