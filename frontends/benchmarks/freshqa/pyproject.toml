[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 64", "setuptools-scm>=10.2.1"]

[tool.setuptools]
packages = ["freshqa_eval"]
package-dir = {"freshqa_eval" = "src"}

[project]
name = "freshqa-eval"
version = "1.0.0"
description = "FreshQA evaluator for NAT - FreshEval Relaxed evaluation methodology"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
dependencies = [
    "nvidia-nat-eval==1.7.0",
    "pytz>=2024.1",
    "pydantic>=2.0.0",
]

[project.entry-points."nat.plugins"]
freshqa_eval = "freshqa_eval.register"
