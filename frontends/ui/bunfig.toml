# Bun install settings for the UI package.
#
# A version must have been on the registry for 7 days before `bun install` or
# `bun add` resolves to it: most malicious npm releases are found and pulled
# within days. Versions already in bun.lock keep installing; only new
# resolutions wait. Verified on bun 1.3.11: an exact pin younger than this
# fails with "blocked by minimum-release-age".
[install]
minimumReleaseAge = 604800
