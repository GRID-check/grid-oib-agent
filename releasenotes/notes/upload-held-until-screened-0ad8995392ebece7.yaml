---
upgrade:
  - >
    An uploaded file now reaches colleagues only once its check for sensitive
    data has passed, usually a few moments after the upload. Until then only
    the person who uploaded it and those who may release quarantined files see
    it.
  - >
    A file whose reading failed before the check (an IFC model too large to
    read, for example) waits in Organisation → Quarantäne, marked as not
    checked, until someone who may release files releases or deletes it. The
    person who uploaded it can ask for the release.
  - >
    A corrected file uploaded over an existing document, or a new version of a
    document published from a draft, is checked before colleagues see it.
    Until then the document is visible only to the person who uploaded it and
    those who may release files.
fixes:
  - >
    A file waiting in quarantine no longer shows up anywhere for colleagues
    who may not see it: not in the project overview and its counts, the upload
    history, the IFC model list, the document roles, the name check of a new
    upload, or a file's status. Deleting, moving or renaming it answers as if
    it did not exist.
  - >
    Re-indexing a project or restoring a folder from the Papierkorb no longer
    takes a file out of quarantine. Only a release does.
  - >
    A file has no preview image until its check has passed, and Piloti does
    not read a file under review when a revision is requested on it.
  - >
    A project admin reviewing a colleague's image that is still being checked
    sees the image instead of "preview failed".
  - >
    Prüfbuch confirmations on an IFC model still under review, and the number
    of such files in a folder in the Papierkorb, are no longer shown to
    colleagues who may not see the model or the file.
