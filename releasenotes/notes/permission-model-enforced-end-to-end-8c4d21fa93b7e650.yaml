---
fixes:
  - >
    A Viewer opening a project's chat now sees the composer locked with the
    reason, instead of typing a question and watching it fail on send. The
    member roster reports the role each person really holds, instead of rounding
    narrower roles down to "Viewer".
  - >
    A project whose creation failed part-way is no longer left behind
    unreachable by the person who created it.
  - >
    Access to every project in your organization is now a permission of the
    administrator role, not a matter of a role called Admin. A custom
    administrator role reaches projects like the built-in one.
  - >
    Project admins can create and run scheduled skills again. Only organization
    admins could do so after a permission was renamed.
security:
  - >
    Project roles now mean what the access reference says: the Contributor role
    can be assigned and may use Piloti in the project. A Viewer reads documents
    and conversations but can no longer start research.
operators:
  - >
    Platform Support also works while viewing a tenant organization, which it
    previously could not.
  - >
    Read-only platform staff are now read-only: each platform screen requires
    its own permission, so Platform Support can see every screen and change
    none.
