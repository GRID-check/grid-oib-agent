---
features:
  - >
    Piloti now knows how you filed your project documents: it can say what is in
    Brandschutz, name the folder when it points at a file, and search one folder
    including its subfolders. Renaming or moving a folder updates what it sees
    without re-uploading anything.
fixes:
  - >
    Re-uploading or re-processing a document no longer discards its name, its
    document type or its folder. Re-generating a summary quietly reset
    everything stored alongside it, so a renamed file went back to its raw file
    name the next time it was processed.
