---
features:
  - >
    Usage and budgets are now shown in points instead of euros, on the usage
    page, in the limits per organization, member and project, and in the model
    picker.
  - >
    The model picker shows roughly how many points a typical question costs on
    each model, so a cheap model can be told from an expensive one at a glance.
  - >
    Organizations that use Piloti with their own provider key see tokens instead
    of points, and can set their limits in tokens.
upgrade:
  - >
    Existing budget limits were converted from euros to points. Check your
    organization, member and project limits once and adjust them if the new
    values are not what you meant.
