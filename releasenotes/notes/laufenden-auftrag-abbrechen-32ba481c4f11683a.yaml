---
features:
  - >
    Einen laufenden Auftrag können Sie jetzt im Block selbst beenden:
    „Abbrechen“ steht neben der Kopfzeile, solange der Auftrag läuft oder auf
    Sie wartet. Vorher wird gefragt — und die Rückfrage sagt, was bleibt: Was
    bis dahin recherchiert wurde, steht weiter im Block; nur der Bericht wird
    nicht mehr geschrieben.
