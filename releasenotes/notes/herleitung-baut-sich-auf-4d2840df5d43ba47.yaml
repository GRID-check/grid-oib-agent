---
improvements:
  - >
    Die Herleitung baut sich während der Arbeit sichtbar auf: Neue Schritte und
    Quellen blenden weich ein, jede neue Verbindungslinie zeichnet sich einmal
    vom Schritt zur Quelle, und die Grafik wächst gleitend statt zu springen.
    Ein Punkt läuft entlang der Linien in den gerade offenen Schritt. Das gilt
    am Telefon wie am Desktop und kostet im Ruhezustand weniger Rechenzeit als
    bisher.
  - >
    Eine abgeschlossene Herleitung erscheint beim Öffnen sofort ohne Animation,
    und wer in den Systemeinstellungen reduzierte Bewegung gewählt hat, sieht
    überhaupt keine.
