---
features:
  - >
    Ask for a diagram, a Schaubild or a Grafik and Piloti answers with a real
    drawing, never with text art made of dashes and arrows.
  - >
    „Erstelle ein Dokument über …“ now starts a deep research whose finished
    report is filed in the project under Berichte. If you only want a thorough
    answer, you still get it in the chat.
  - >
    Deep research reports now draw too: sequences and dependencies appear as
    real graphics in the report and in the downloaded PDF.
fixes:
  - >
    Diagrams in answers arrive intact. The source check could rewrite links and
    indentation inside a drawing and break it.
