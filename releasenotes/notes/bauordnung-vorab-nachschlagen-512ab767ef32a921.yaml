---
features:
  - >
    Fragen zur Bauordnung eines Landes, etwa zu Einreichunterlagen,
    Stellplätzen oder Abständen zur Nachbargrenze, werden schneller
    beantwortet. Piloti schlägt das Landesgesetz im RIS nach, bevor es zu
    denken beginnt, und nimmt das Bundesland dafür aus der Frage oder aus den
    Projektdaten.
