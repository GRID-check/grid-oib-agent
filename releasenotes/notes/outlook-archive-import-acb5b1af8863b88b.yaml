---
features:
  - >
    You can import an Outlook archive (.pst or .ost, up to 25 GB) into a
    project's files, and every email becomes a folder with its attachments and a
    note holding its sender, recipients, date and text. Piloti can then find and
    cite your correspondence; your administrator switches the import on.
fixes:
  - >
    Scheduled research reports are filed into the project again in offices
    where this feature is enabled for them; they had been held back.
operators:
  - >
    The Outlook archive import is off by default. Create the mail-import
    WorkOS flag and turn it on per organization; there is no environment
    fallback. The backend gains libpff-python and striprtf.
