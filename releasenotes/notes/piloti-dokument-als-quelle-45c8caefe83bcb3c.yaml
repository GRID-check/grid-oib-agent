---
features:
  - >
    A document Piloti wrote and your office released can now be cited like any
    other source, and it says so: it appears as a Piloti-Dokument, with the name
    of the person who approved it and the date they did, both in the answer's
    sources and in the office colour rather than the colour of building law.
improvements:
  - >
    Such a document is never presented as the legal basis of an answer. Piloti
    quotes it for what your office decided and reaches for the OIB Richtlinien
    or the Bauordnung for what is required, so an approved office document can
    never end up standing in for a requirement.
