---
features:
  - >
    Legal sources from the RIS now open inside Piloti instead of a new browser
    tab, with the cited passage highlighted and the reference ready to copy as a
    citation. The link to the official RIS publication stays in the window
    header.
fixes:
  - >
    The cited passage is highlighted in the document again, survives a reload,
    and „Zitat kopieren“ copies the quote rather than only the bibliographic
    reference.
  - >
    Clicking a reference opens the document at the page the answer refers to,
    and a source lists only the pages the answer actually relies on.
  - >
    Copied citations now name the point by which Austrian law is cited, as in
    „OIB-Richtlinie 2, Pkt. 3.5.2“, not only the page it is printed on.
  - >
    A file uploaded during the conversation opens from the answer's source right
    away, and referenced files Piloti cannot display, such as Word documents or
    spreadsheets, can be downloaded from there.
  - >
    A file whose name mentions an OIB-Richtlinie, such as your own commentary on
    it, is no longer merged with the Richtlinie into one source.
  - >
    Long deep research reports can be downloaded as PDF again. If an export
    still fails, the message gives the reason.
  - >
    If an answer really breaks off, Piloti now says so after about a minute
    instead of up to forty, and a running research is no longer reported as
    interrupted.
  - >
    Laws in the RIS reader are shown in full. The text limit was shorter than
    the Bauordnung für Wien, so § 108 fell outside it.
