---
features:
  - >
    A subfolder can only narrow what its parent allows, and someone who may only
    read a folder sees it marked „Nur lesen“, without upload, rename, move or
    delete. Only a project admin who may edit a folder can change who may read
    or edit it.
  - >
    A folder holding subfolders you cannot read can only be moved by an
    organization admin, and a demoted admin stops reaching every folder within a
    minute. Review requests go only to people who may read the folder, and the
    projects overview counts only the documents you may read.
