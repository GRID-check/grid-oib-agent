---
features:
  - >
    Almost every answer now opens with a one- or two-sentence summary of the
    result and its decisive limitation, right under the verdict when there is
    one.
improvements:
  - >
    A caveat now sits next to the paragraph it concerns instead of at the end of
    the answer.
  - >
    Answers read as one document: the verdict heads the text, the key points
    close it, and cards sit on a quiet background instead of in framed boxes.
