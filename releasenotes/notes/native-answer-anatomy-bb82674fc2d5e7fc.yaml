---
features:
  - >
    Praktisch jede Antwort beginnt jetzt mit einer Zusammenfassung: ein bis
    zwei Sätze, die das Ergebnis samt entscheidender Einschränkung vorwegnehmen
    — als Vorspann im Antwortkopf, direkt unter dem Urteil, wenn eines
    vorliegt.
improvements:
  - >
    Antworten lesen sich jetzt wie ein Dokument aus einem Guss: das Urteil
    steht als Kopfzeile direkt über dem Text, die Kernaussagen schließen ihn
    ab, und Karten sitzen auf einem ruhigen Grund statt in umrandeten Kästen —
    alles Teil der Antwort, nichts wirkt aufgesetzt.
  - >
    Ein Hinweis erscheint dort, wo er hingehört: der Assistent verankert ihn
    beim Absatz, den er betrifft, statt ihn ans Ende der Antwort zu hängen.
