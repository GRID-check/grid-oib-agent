---
features:
  - >
    Befunde eines Berichts leben im Projekt weiter: ein offener Befund lässt
    sich mit „Klären“ als eigener Auftrag anstoßen, dessen Lauf im selben
    Verlauf erscheint; ein fertiger Bericht bietet „Bericht fortschreiben“
    an, und der neue Bericht kennzeichnet je Befund, was neu ist, was sich
    geändert hat und was entfallen ist. Die Befunde wandern außerdem als
    Fakten und offene Punkte ins Projektgedächtnis.
