---
features:
  - >
    An uploaded folder is now matched against the project: Piloti recognises
    existing folders, even when spelled differently or coming from a Mac,
    creates only the missing ones and files every document where it stood in the
    folder tree.
  - >
    Before uploading, Piloti tells you how many documents are new, changed or
    unchanged, and you decide with a tick whether changed ones are updated.
    Unchanged files are skipped.
fixes:
  - >
    Two files with the same name from different subfolders no longer silently
    overwrite each other during a folder upload; both are held back and named in
    the dialog.
  - >
    The project file list now arrives with the page instead of loading folder by
    folder behind grey placeholders.
  - >
    Folders in the list view are no longer tinted yellow, which read like a
    warning; a folder is recognised by its icon.
