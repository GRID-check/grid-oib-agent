---
improvements:
  - >
    The Inbox, the Archiv and the chat history now open as sheets you can pull
    down to close — drag the handle at the top, on your phone or with the
    mouse. Closing plays out smoothly instead of cutting away.
  - >
    The chat history has been redesigned: it now looks and works like the Inbox
    and the Archiv, shows your deep-research runs alongside your chats, and
    lets you filter between the two.
fixes:
  - >
    The chat history no longer claims your chats live only in this browser.
    They are saved to your workspace and available on any device you sign in
    from.
other:
  - >
    The Archiv entry has moved out of the profile menu. It stays one click away
    in the sidebar and the organization header.
