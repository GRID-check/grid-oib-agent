---
features:
  - >
    In the research plan you choose under Unterlagen which documents from the
    project and office archive the research reads in full and which it never
    uses. Excluded documents are never cited, even when a search finds them.
  - >
    While a run is going, Dokument hinzufügen adds another document, and the
    block shows whether each named document was read. A report names any it did
    not reach.
  - >
    A results table in a comparison or file note is headed Ergebnisse, not
    Befunde, and passes no verdict the report did not reach.
