---
features:
  - >
    Dateien lassen sich jetzt per Drag & Drop in einen Ordner ziehen — auf eine
    Ordnerkachel, eine Ordnerzeile oder auf „Alle Dateien" in der Pfadleiste,
    um sie wieder herauszuholen. Der Zielordner hebt sich hervor, solange Sie
    darüber sind. „Verschieben" im Menü der Datei tut weiterhin dasselbe.
