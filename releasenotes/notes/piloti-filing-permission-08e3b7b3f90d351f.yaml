---
features:
  - >
    Whether Piloti may file the documents it writes into a project is now a
    permission of its own, File agent-authored documents. Members without it can
    still upload, rename and delete their own files.
upgrade:
  - >
    The built-in Project Editor and Project Admin roles receive the new filing
    permission. Grant it to a custom project role yourself, or leave it out if
    Piloti should only answer.
