---
features:
  - >
    Ihre Organisation kann Piloti jetzt stehende Anweisungen mitgeben. Unter
    Organisation, Anweisungen schreibt eine Administratorin einmal auf, was
    dauerhaft gelten soll — etwa zuerst das Ergebnis, dann die Begründung, oder
    Wien annehmen, wenn kein Bundesland genannt ist. Der Text wird bei jeder
    Frage mitgegeben, für alle im Büro, ohne dass ihn jemand pro Nachricht
    wiederholen muss.
  - >
    Die Anweisungen sind Vorlieben zu Form, Fokus und Ablauf und auf 1500
    Zeichen begrenzt. Sie setzen Pilotis eigene Regeln nie außer Kraft und
    liefern nie einen normativen Wert: Eine OIB-Anforderung stammt weiterhin aus
    der Richtlinie, die Piloti für diese Antwort geöffnet hat, nie aus diesem
    Feld. Gespeichert wird mit Name und Zeitpunkt, sodass nachvollziehbar
    bleibt, wer eine Vorgabe gesetzt hat.
