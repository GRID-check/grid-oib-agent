---
features:
  - >
    Your organization can now give Piloti standing instructions under
    Organisation, Anweisungen, such as result first, then reasons, or assume
    Vienna when no province is named. They apply to every question from everyone
    in the office.
  - >
    Standing instructions shape form and focus only, up to 1,500 characters, and
    never supply a normative value; an OIB requirement always comes from the
    Richtlinie Piloti opened. Each change is saved with name and time.
