---
fixes:
  - >
    A diagram filed into a project now says inside the file that Piloti drew it,
    in the SVG's title and in the PDF's document properties. A filed drawing
    that leaves the office can no longer pass for one a person drew.
upgrade:
  - >
    Nothing Piloti writes can be filed unmarked any more: the filing service
    reads the finished file and refuses one that does not say who wrote it.
    Files already in a project are unchanged; file a drawing again to get a
    marked copy.
