features:
  - >
    A task you hand to Piloti now appears as a block in the conversation where
    you gave it: title, state, phases and running time, updating live, with the
    finished report beneath it.
  - >
    In the task list a running card shows in one line what the task is doing,
    such as „Recherchieren · 3 Runden · 9 Dokumente“.
