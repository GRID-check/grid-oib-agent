---
features:
  - >
    Piloti now learns from answers you mark as not helpful: each report is
    anonymised and becomes a lesson it reads on every later answer. Your
    feedback text stays in your organization; only the anonymised lesson leaves
    it.
improvements:
  - >
    Giving a thumbs-down with a short note is now the fastest way to improve
    answers for everyone: each report is matched against known failure patterns,
    and repeated reports strengthen the caution the assistant already follows.
