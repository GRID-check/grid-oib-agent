---
features:
  - >
    The project wizard lists all its modules by full name beside the questions,
    each with how many answers it already has, and you can jump to any of them.
  - >
    The new quick start asks only the core questions and records everything else
    as open, listed in the summary so you can fill it in later.
upgrade:
  - >
    Questions about the existing building, such as year of construction,
    heritage protection and structural work, now belong to each building rather
    than to the whole project. Projects with one building keep their answers;
    with several, you assign them once.
