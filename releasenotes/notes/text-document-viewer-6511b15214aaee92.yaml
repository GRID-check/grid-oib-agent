---
features:
  - >
    Text, Markdown and CSV files can now be read directly in Piloti. A Markdown
    checklist appears as a checklist and a CSV file as a table, including
    semicolon-separated exports from a German Excel.
fixes:
  - >
    BMP and TIFF images show a preview again instead of saying none is
    available.
  - >
    For a very long text file, a note under the text now says that only the
    beginning is shown, so the last visible line no longer reads like the end of
    the document.
