operators:
  - >
    Research jobs run only on the database-claimed queue now. Unset
    GRID_JOB_EXECUTION and NAT_DASK_SCHEDULER_ADDRESS, which are gone, and
    GRID_MAX_ACTIVE_JOBS, the Dask-only cap. GRID_MAX_ACTIVE_JOBS_PER_ORG still
    bounds one organization's running jobs. Drain the research queue before you
    upgrade: rows queued by the old release fail on replay.
