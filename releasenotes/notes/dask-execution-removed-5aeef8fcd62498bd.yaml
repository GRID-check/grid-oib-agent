---
operators:
  - >
    Research jobs run only on the database-claimed queue now. Unset
    GRID_JOB_EXECUTION and NAT_DASK_SCHEDULER_ADDRESS, which are gone, and
    GRID_MAX_ACTIVE_JOBS, the Dask-only cap; GRID_MAX_ACTIVE_JOBS_PER_ORG
    stays. Drain the research queue before you upgrade: a job queued or
    running under the old release fails when a new worker claims it.
