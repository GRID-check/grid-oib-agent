---
features:
  - >
    When an answer names a file, such as „Beginnen Sie mit pd8280-2.pdf“, the
    name is now a link that opens the document beside the answer, in running
    text and in tables alike.
  - >
    Hovering a file name shows where it comes from, its format, size and page
    count, its short description and whether Piloti has read it. Only names of
    documents you actually have become links.
fixes:
  - >
    A file is found even when the answer spells its name with different
    capitals, or when it is an attachment uploaded in this chat.
