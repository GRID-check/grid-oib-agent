---
features:
  - >
    Each project now has a Steckbrief in its settings: the address, the period
    from start to completion, and everyone who worked on it, including former
    staff and external planners without a Piloti account.
  - >
    Only name, function, company and period are kept for each person, and any
    person can be removed for good. Piloti does not use them in its answers.
