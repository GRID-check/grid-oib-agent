---
features:
  - >
    Recherchiert Piloti gründlich zu einer Frage, sehen Sie das jetzt als
    Auftrag im Verlauf: derselbe Block mit Phasen, Runden, Dokumenten und
    Laufzeit. Er steht auch in der Aufträge-Liste, lässt sich abbrechen, und der
    Bericht wird abgelegt. Vorher stand dort nur ein Satz.
  - >
    Was im Gespräch schon geklärt wurde — etwa Ihre Antworten auf Pilotis
    Rückfragen — geht in die Recherche mit ein, statt noch einmal gefragt zu
    werden.
