---
improvements:
  - >
    „Zitierbar" no longer appears on every file. A status shows only when it
    changes what you can do next — a document still being read, one that failed,
    or a report Piloti wrote and deliberately never indexed.
  - >
    The header of the file preview now holds only the name, the kind of document
    and the controls for the file. Who created it, who is responsible and
    „Piloti dazu fragen“ moved into the panel beside it.
fixes:
  - >
    A Markdown note or a spreadsheet whose name contains „Plan“, such as
    „Projektplan.md“, no longer shows a floor plan on its card. The file format
    decides the thumbnail.
