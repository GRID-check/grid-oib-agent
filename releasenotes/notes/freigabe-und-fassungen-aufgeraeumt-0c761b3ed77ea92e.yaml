---
improvements:
  - >
    Freigabe und Fassungen now sits folded at the end of the file info and shows
    the state, the path from draft to published and what the file is waiting
    for. It opens by itself when a version is waiting for you.
fixes:
  - >
    Archivieren is now called Stilllegen, since filing into the Archiv is what
    makes a document part of the office's knowledge. Stilllegen asks first and
    says what it does: the file leaves the list, Piloti stops citing it, nothing
    is deleted.
