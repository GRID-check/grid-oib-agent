features:
  - >
    The effort slider now warns when it is set to Maximum, and the level chip
    in the composer turns amber while it is on. Maximum thinks much longer and
    costs far more tokens, and is rarely smarter than High.
fixes:
  - >
    The effort slider no longer has a dotted background that seemed to slide
    along with the handle. It now has a plain fill up to the handle.
