---
improvements:
  - >
    Beim Rechercheplan gibt es jetzt einen Mittelweg: Neben „Recherche starten"
    und „Abbrechen" können Sie mit „Kurz beantworten" Ihre Frage sofort und
    ohne den mehrminütigen Recherchelauf beantworten lassen. „Abbrechen"
    beendet den Vorgang mit einer klaren Bestätigung statt kommentarlos.
  - >
    Die Plan-Vorschau spricht jetzt Ihre Sprache: Überschriften wie „Research
    Plan Preview" und die englische Antwort-Anweisung sind lokalisiert, und
    nach einem Klick zeigt die Karte Ihre Entscheidung in Worten („Kurze
    Antwort angefordert") statt des technischen Schlüsselworts.
