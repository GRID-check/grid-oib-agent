---
fixes:
  - >
    Searching your files keeps the view you chose, list or cards. In the list,
    relevance is a sortable column and each row shows the passage that matched
    and its page.
  - >
    Keyboard navigation in the file list keeps your place instead of jumping
    back to the first row. Home and End jump to either end of the list.
  - >
    The upload panel no longer retires itself out from under you. A wholly
    successful batch still clears after a few seconds, but the countdown holds
    while your pointer is on the panel or your keyboard focus is inside it.
