---
features:
  - >
    Every answer can be downloaded as a Word document, with the question, the
    list of sources, the cards and the confidence note. The button sits next to
    the copy buttons under the answer.
improvements:
  - >
    Copied answers keep their formatting: pasted into Word, Outlook or Notion
    they arrive with real tables, headings and emphasis instead of raw Markdown
    characters.
  - >
    Tables in answers keep their column alignment, checklists show real ticks,
    and deeply structured answers keep every heading level.
  - >
    The chat uses the width of the window: the conversation column is wider and
    answers fill it, and the header above it is smaller.
fixes:
  - >
    Buttons on code blocks and time stamps on chat errors now follow the
    language you set, and Chinese, Japanese or Korean input methods can confirm
    characters with Enter without sending the message.
other:
  - >
    The data source picker in the message box is hidden for now; Piloti draws on
    every available source, and the Herleitung still shows which ones it used.
