    es nicht mehr gibt. Solche Einstellungen werden jetzt übergangen und beim
    nächsten Speichern entfernt.
  - >
    Die Zeile „OIB compliance check" ist aus der Modellauswahl verschwunden.
    Sie gehörte zu einer Prüfung, die Piloti nicht mehr ausführt; eine
    Normprüfung als Auftrag funktioniert unverändert.
