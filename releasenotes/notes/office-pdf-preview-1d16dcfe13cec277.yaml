---
features:
  - >
    Word, Excel and PowerPoint files now open in the document viewer as a PDF
    preview, and a reference to one opens that preview instead of only offering
    a download. Download still gives you the original file, unchanged.
operators:
  - >
    Office previews are converted by a Gotenberg service that the platform
    reaches at GOTENBERG_URL. Without it, office files stay download-only as
    before.
