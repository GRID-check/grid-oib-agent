---
features:
  - >
    Diagramme in Antworten sind neu gestaltet: Abläufe erscheinen als Karten
    mit beschrifteten Pfeilen, Entscheidungen sind hervorgehoben, ein
    Überblick über ein Regelwerk wird als Baum gezeigt (auf dem Telefon als
    Gliederung), wer wem was übergibt als Spalten je Beteiligtem, Termine
    als Balken auf einer Zeitachse und Anteile als Balken mit Prozentangabe.
    Offene und erledigte Punkte einer Aufgabenliste sind als Markierungen
    statt als Kontrollkästchen dargestellt.
  - >
    Eine Antwort kann mehrere Karten zusammenstellen: Varianten, die Sie
    vergleichen (zwei Entwurfslösungen, zwei Bundesländer, Bestand und
    Umbau), erscheinen als Reiter, zusammengehörige Karten auf breiten
    Bildschirmen nebeneinander. Im Word-Export stehen alle Varianten
    untereinander, jede mit ihrem Reitertitel.
fixes:
  - >
    Skizzen sind auf dem Telefon lesbar: Maße und Beschriftungen erscheinen
    nicht mehr in 5 bis 7 Pixel Größe. Breite Tabellen, Vergleiche und
    Diagramme zeigen am Rand an, dass es seitlich weitergeht.
  - >
    Diagramme erscheinen im dunklen Modus durchgehend dunkel; bisher
    wechselten mehrere Diagramme in einer Antwort ab dem dritten in die
    helle Palette, und Achsen, Titel und Legenden wurden unsichtbar.
