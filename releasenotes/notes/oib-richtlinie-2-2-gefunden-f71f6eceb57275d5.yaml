fixes:
  - >
    Fragen zum Brandschutz bei Garagen, überdachten Stellplätzen und
    Parkdecks werden aus der OIB-Richtlinie 2.2 und ihren Erläuterungen
    beantwortet. Bisher fand die Suche diese Richtlinie nicht, zeigte sie im
    Überblick über OIB 2 nicht an und lieferte stattdessen Auszüge aus ihrem
    Änderungsverzeichnis.
