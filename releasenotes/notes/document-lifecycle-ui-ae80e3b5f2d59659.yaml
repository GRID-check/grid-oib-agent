---
features:
  - >
    Dateien now shows each file's state: draft, in review, changes requested,
    approved, published, replaced, rejected or archived. The label appears only
    on files with more than one version and on everything Piloti wrote.
  - >
    The file view offers only the approval steps your role and the file's state
    allow, and the inbox entry for a submitted version names the file and links
    to it.
  - >
    The version list shows who submitted, approved and published each version,
    and any version can be opened, including a replaced one.
  - >
    A Freigabe ausstehend filter sits beside Unvergeben and Von Piloti and
    combines with both.
  - >
    If two people decide at the same moment, the second is told the state has
    changed and sees what happened.
