---
fixes:
  - >
    Administrators can invite colleagues to a project again. Invitations failed
    for some administrator roles.
security:
  - >
    Asking Piloti in a project now needs the chat permission everywhere,
    including in an existing conversation. Replying to a colleague in a shared
    conversation is not affected.
operators:
  - >
    The Platform area no longer appears for members of the platform organization
    who hold no platform permissions; it opened and then refused every screen
    inside it.
