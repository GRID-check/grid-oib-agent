---
features:
  - >
    You can now upload Excel workbooks, PowerPoint presentations, CSV files and
    WebP images. Answers cite the right sheet or slide rather than just the
    file.
improvements:
  - >
    Plans are read more precisely: each drawing on a sheet, such as a floor
    plan, a section or a detail, is captured with its own scale, rooms,
    structure and build-ups. Uncertain readings of the image are marked as such.
  - >
    Plans uploaded as images get the same structured reading as plans in a PDF,
    and a file's detail view shows what was recognised on each drawing.
fixes:
  - >
    Word documents are read correctly and can be cited in answers. They used to
    be accepted on upload and then marked as failed.
