features:
  - >
    You can now hand Piloti recurring work in the chat: „prüf das jeden Montag“
    creates a schedule that keeps running. Creating one needs the permission to
    manage schedules in the project.
  - >
    Every start attempt now appears under Aufgaben, including runs that were
    skipped or failed before they began, each with its reason.
improvements:
  - >
    Tasks and schedules are one list, schedules on top and single runs below,
    and schedules are created and edited right there. Old links to the Jobs tab
    still land in the right place.
