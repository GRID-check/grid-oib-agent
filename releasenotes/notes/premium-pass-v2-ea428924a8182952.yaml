---
# One entry per user-visible change. This text is PUBLISHED, in English and in
# German machine translation, to https://piloti.at/changelog — write it for the
# architect using Piloti, not for the reviewer of your diff.
#
#   - Plain sentences. No RST directives, no code blocks, no issue numbers, no
#     file paths, no internal component names.
#   - Say what the reader can now do, or what stopped going wrong for them.
#   - Two sentences is usually the right length. `task release:lint` enforces
#     the mechanical half of this.
#
# Delete every section you do not need — an empty one fails the lint.
improvements:
  - >
    Answers scan cleaner: sources, export actions and the rating thumbs stay
    visible while confidence, notes and metadata live behind one details line.
    Tabs, view switchers and navigation now glide an active pill instead of
    snapping, and sections unfold smoothly instead of jumping open.
fixes:
  - >
    Filtering the file browser no longer blanks the listing when files match;
    the empty notice only appears when the filter truly emptied it.
  - >
    Loading placeholders no longer jump when content arrives, file states and
    error messages are readable instead of technical, failed operations stay
    visible longer, and the whole interface shares one consistent shape
    language in light and dark mode.
