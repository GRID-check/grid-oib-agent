features:
  - >
    Plattform-Betreiber können unter Plattform → Abruf einstellen, ob Antworten
    live Wort für Wort erscheinen oder vollständig, sobald sie fertig sind. Die
    Herleitung läuft in beiden Fällen live mit. Die Einstellung gilt für alle
    Organisationen ab der nächsten Frage.
