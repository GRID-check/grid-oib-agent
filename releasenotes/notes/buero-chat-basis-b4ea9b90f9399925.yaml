---
features:
  - >
    Piloti now has a second place to ask: the Büro, above every project. Reach
    it with Piloti fragen in the header, with Büro in a project's navigation, or
    with G then B. It answers from building law and your office archive, without
    reading any project's documents — and says so on the empty screen.
  - >
    Office chats keep their own history, headed Büro-Chats, separate from every
    project's. They belong to the organization, so deleting a project never
    deletes them.
