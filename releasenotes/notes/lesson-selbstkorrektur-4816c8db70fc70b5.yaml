---
improvements:
  - >
    Re-uploading a document under the same name now replaces its earlier
    version in the knowledge index instead of competing with it, so an answer
    can no longer cite a superseded upload with full confidence. A document
    under a new name is still treated as a new document — deciding that one
    file supersedes a differently-named one stays a human call.
  - >
    Project memory now takes your feedback into account. When a thumbs-down
    comment describes a problem that sits close to a stored note, that note
    loses weight and is marked less reliable — inside your own project only,
    and never deleted. A note you have pinned is exempt.
  - >
    Lessons learned from feedback now watch themselves. A lesson that keeps
    collecting new reports while active is flagged as not working, and a
    lesson whose root cause has been fixed retires on its own after two weeks
    without a recurrence. Both steps appear in the lesson's audit trail and
    are reversible from Platform → Lessons.
