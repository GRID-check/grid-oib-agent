---
features:
  - >
    The website now shows what Piloti is worth to an office before anyone signs
    anything. Enter how many planners would use it and what they earn, and the
    calculation gives the value per year, the hours it hands back and how
    quickly a seat pays for itself.
  - >
    Every step behind that figure is published with it: which numbers are our
    assumptions, which are yours, what a planner's week is assumed to look like,
    and what the calculation deliberately leaves out.
