---
fixes:
  - >
    Answers no longer show source references that were removed during safety
    checks, and interactive answer cards stay in place even when one card cannot
    be displayed.
  - >
    Deep research answers are now marked as preliminary when the research time
    runs out, instead of reading like fully verified results.
  - >
    Long research jobs no longer write stray or duplicate messages into the chat
    when they are retried or time out in the background.
operators:
  - >
    Research jobs now refuse forged work orders when payload encryption is
    configured, instead of accepting them.
