---
improvements:
  - >
    Die Auswahl der Fundstellen für eine Antwort geht deutlich schneller.
    Bisher bewertete das Sprachmodell bei jeder Suche rund sechzig Kandidaten
    in einem langen Aufruf, der gut zehn Sekunden kosten konnte. Jetzt trifft
    ein dafür gebautes Bewertungsmodell die Auswahl in einem Bruchteil der Zeit
    und liest dabei jede Fundstelle ganz. Fällt es aus, springt der bisherige
    Weg ein.
  - >
    Antworten im Chat kommen früher an. Vor der ersten Zeile lud der Assistent
    mehrere Dinge nacheinander, die nichts voneinander wissen: das
    Projektgedächtnis, die Hinweise aus dem Feedback und die Einstellungen der
    Nachbearbeitung. Das passiert jetzt gleichzeitig. Zwei Buchungen, die nach
    der fertigen Antwort noch vor deren Anzeige liefen, laufen jetzt danach.
  - >
    Eine Antwort, die nach der Prüfung nachgebessert wird, sucht die fehlenden
    Belege jetzt gleichzeitig statt nacheinander.
  - >
    Eine Tiefenrecherche meldet sich schneller als abgeschlossen, sobald der
    Bericht da ist. Die Karten und der Gedächtniseintrag werden gleichzeitig
    erzeugt, und der Gedächtniseintrag bekommt dieselbe Zeitgrenze wie im Chat,
    statt den Abschluss minutenlang aufzuhalten.
fixes:
  - >
    Ein einzelner Chat konnte bei einer kalten Zwischenablage kurz alle anderen
    laufenden Gespräche auf demselben Server anhalten, während er die
    Einstellungen seiner Organisation nachlud. Das Nachladen blockiert die
    anderen jetzt nicht mehr.
