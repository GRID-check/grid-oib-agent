---
improvements:
  - >
    Answers in chat arrive sooner: Piloti now prepares its project memory,
    feedback lessons and settings at the same time instead of one after another.
  - >
    Choosing the passages for an answer is much faster, because a purpose-built
    ranking model now replaces a language-model call that could take ten
    seconds.
  - >
    Opening a project and starting a chat are faster because permissions are
    briefly cached. A changed project role takes effect within thirty seconds.
  - >
    A deep research reports itself finished as soon as the report is ready, and
    an answer that is revised after checking looks up its missing evidence in
    parallel.
fixes:
  - >
    One chat loading its organization's settings no longer briefly holds up
    everyone else's conversations.
