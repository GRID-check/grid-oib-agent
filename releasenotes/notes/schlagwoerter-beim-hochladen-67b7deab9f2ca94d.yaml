---
features:
  - >
    Hochgeladene Dateien bekommen ihre Schlagwörter (Dokumenttyp und
    Fachbereich) schneller und treffsicherer. Ein Fachbereich wie
    Brandschutz wird nur noch vergeben, wenn das Dokument tatsächlich davon
    handelt, und nicht schon, weil ein Plan eine Brandabschnittsgrenze
    einzeichnet.
