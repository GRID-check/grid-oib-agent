---
features:
  - >
    Whole folders can now be uploaded, with Ordner hochladen or by dragging the
    folder onto the file list, with every level beneath it. Files Piloti cannot
    read are rejected one by one, not the whole folder.
  - >
    The detail view shows where a file came from on your office server, and one
    click copies the path so you can keep working on the original.
fixes:
  - >
    Project and archive uploads are no longer capped at 100 MB per upload, so a
    full Einreichung goes through; only your organization's storage quota
    applies.
