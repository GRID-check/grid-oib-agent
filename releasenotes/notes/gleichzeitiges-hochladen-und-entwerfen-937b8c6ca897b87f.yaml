---
fixes:
  - >
    When two people upload a file with the same name at the same time, both
    uploads succeed and the second becomes a new version of the first, instead
    of failing with a server error.
  - >
    When two people open a draft of the same document at once, exactly one draft
    is created and the second person is told it already exists.
  - >
    Creating a folder with a name that is already taken in that place now says
    the name is taken instead of showing a server error.
