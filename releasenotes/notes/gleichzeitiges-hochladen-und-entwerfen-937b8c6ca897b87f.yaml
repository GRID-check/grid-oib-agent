---
fixes:
  - >
    Laden zwei Personen gleichzeitig eine Datei mit demselben Namen in ein
    Projekt oder ins Archiv hoch, klappen jetzt beide Uploads: die zweite
    Datei wird zur neuen Version der ersten, genau wie beim Hochladen
    nacheinander. Bisher brach der zweite Upload mit einem Serverfehler ab.
  - >
    Öffnen zwei Personen gleichzeitig einen Entwurf desselben Dokuments,
    entsteht genau ein Entwurf, und die zweite erfährt, dass er bereits
    existiert, statt einen Serverfehler zu sehen.
  - >
    Wer einen Ordner unter einem Namen anlegt, den es an dieser Stelle schon
    gibt, erfährt jetzt, dass der Name vergeben ist, statt einen Serverfehler
    zu sehen. Ebenso endet es sauber, wenn derselbe Bericht aus zwei Tabs
    gleichzeitig abgelegt wird: beide zeigen denselben Bericht.
