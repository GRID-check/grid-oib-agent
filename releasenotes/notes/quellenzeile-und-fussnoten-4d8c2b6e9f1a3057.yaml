    Fußnoten in einer Antwort tragen ihre Überschrift und Rücksprünge in der
    Sprache der Leserin, und die Sprungmarken führen wieder zur Fußnote.
    Die Reiter der Quellenkarten in der Herleitung folgen ebenfalls der
    eingestellten Sprache.
  - >
    Anschlussfragen kommen schneller: die Vorentscheidung zu Beginn einer
