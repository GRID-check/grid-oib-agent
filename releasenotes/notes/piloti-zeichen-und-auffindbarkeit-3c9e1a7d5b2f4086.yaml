---
features:
  - >
    Piloti hat ein eigenes Zeichen: eine Platte mit Fensterband auf drei
    Stützen. Es steht im Browser-Tab, auf dem Home-Bildschirm und in der
    Vorschau geteilter Links, auf der Website wie in der Anwendung.
  - >
    Die Website beantwortet die häufigsten Fragen zu Piloti direkt auf der
    Startseite: Quellen, Nachvollziehbarkeit, Umgang mit Daten, Kosten und wie
    ein Büro Pilotbüro wird. Der Blog lässt sich per RSS abonnieren, auf
    Deutsch und auf Englisch.
