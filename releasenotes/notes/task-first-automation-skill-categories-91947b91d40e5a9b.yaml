---
features:
  - >
    A task can now run once on a date you choose, recur, or run only when you
    start it. A one-off task such as checking the Einreichplanung the day before
    the Abgabe no longer needs a weekly schedule you have to delete afterwards.
  - >
    The Automation section now has two tabs: Tasks and Skills. A task can carry
    its own schedule, and the week timetable is a view inside Tasks rather than
    a place of its own — old Zeitplan links keep working.
improvements:
  - >
    Finishing a new task now offers "Create and run now", so you can see the
    first result immediately instead of waiting for the next scheduled time to
    find out whether the request says what you meant.
  - >
    Skills can now be arranged into categories, curated by Piloti or by your own
    organization. The Skills tab groups both halves onto them, with search,
    counts and a detail view for every skill.
