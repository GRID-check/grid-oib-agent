---
features:
  - >
    The Automation section now has two tabs: Tasks and Skills. A task can
    carry its own schedule, and the week timetable is a view inside Tasks
    rather than a place of its own — old Zeitplan links keep working.
  - >
    A task can now run once, on a date you choose. Creating one asks when as a
    choice of three — once, recurring, or manual only — so "check the
    Einreichplanung the day before the Abgabe" no longer means building a
    weekly schedule and remembering to delete it. A one-off task shows its
    date on its card and in the week timetable.
improvements:
  - >
    Skills can now be arranged into categories, curated by Piloti or by your
    own organization. The Skills tab groups both halves onto them, with
    search, counts and a detail view for every skill.
  - >
    Finishing a new task now offers "Create and run now", so you can see the
    first result immediately instead of waiting for the next scheduled time to
    find out whether the request says what you meant.
