---
features:
  - >
    Piloti now takes on work that lasts longer than an answer: „Mach den
    Einreichcheck bis Freitag“ creates a task that runs on its own, under your
    name and permissions, and reports back when done.
  - >
    Send a draft back with Änderungen anfordern and Piloti revises it from your
    reason, producing the next version of the same document rather than a second
    one.
upgrade:
  - >
    A finished research report is now filed as a draft and put to you for
    approval, instead of standing in the project like a checked file.
