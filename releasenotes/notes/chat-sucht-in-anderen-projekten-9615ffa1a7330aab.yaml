---
features:
  - >
    In a chat that only you can see, Piloti can now look across your other
    projects: search their documents, find a project by name or address, and
    read a project's brief. It searches only projects you can work in, skips
    folders you are not allowed to read, and names the project for every
    source it cites.
  - >
    A chat that drew on another project stays with the people who may open
    that project. It can be shared only with them, cannot be made visible to
    the whole project, and nothing from it is saved to project memory or
    filed into the project.
