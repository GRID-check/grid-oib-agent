---
features:
  - >
    Piloti now looks into the office's past projects on its own, starting with
    the closed projects most like yours, whenever a question is about how
    something was solved before. Every source from another project names that
    project and is presented as a precedent, not as a rule.
  - >
    Piloti skips folders you are not allowed to read in those projects, and
    files still held back for review, your own uploads included.
  - >
    In a shared chat Piloti searches only what everyone in it may open, so it
    never shows a colleague something they may not read.
  - >
    Drawing on a closed project changes nothing about your chat. A chat that
    drew on a running project can be shared only with people who may open it,
    and nothing from it is saved to project memory.
