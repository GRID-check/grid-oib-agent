---
features:
  - >
    Under a longer answer in a project, Als Aktenvermerk schreiben fills the
    message box with the request, and Piloti then writes a draft into the
    project files.
  - >
    Each search step of the Herleitung can now be folded. With three or more
    steps it arrives folded with only the latest open, so the conclusion stays
    in view.
improvements:
  - >
    An empty project chat now says in one sentence that Piloti also writes file
    notes, notes and drafts on request.
fixes:
  - >
    On a phone, the document type in the file preview header is shortened
    instead of running under the buttons.
