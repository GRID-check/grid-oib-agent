---
improvements:
  - >
    Typing in the search field narrows the file list as you go, and Enter
    searches the full text of every project document. Each result shows the
    passage that matched and its page.
  - >
    Dateien searches from its header now. The field sits with the controls that
    act on the same listing — the view switcher, the Alle / Meine / Nicht
    zugewiesen filter and Hochladen — so the documents start a row higher and
    there is one search on the page, not two places to look.
