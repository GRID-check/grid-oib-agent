---
improvements:
  - >
    Every question now reaches Piloti with all its tools, so „zeig mir die
    Grundrisse“ or „was weißt du über das Projekt“ can show and read files
    instead of answering from the project profile alone.
  - >
    In the Herleitung, project documents, the office archive and chat
    attachments now each have their own label and colour instead of all
    appearing as building law.
  - >
    When Piloti hands a question to deep research, it now says why in its own
    words, shown in the Herleitung.
  - >
    An answer with sound references and one quote that could not be confirmed
    word for word is now rated medium instead of low, and the quote stays
    marked.
  - >
    A deleted document now also disappears from what Piloti knows about the
    project.
