---
features:
  - >
    Antworten bringen ihre Kernelemente strukturiert mit: das Urteil steht als
    kopierbarer Wert groß über der Antwort, die wichtigsten Punkte als
    Kernaussagen darunter, und höchstens ein Hinweis hebt hervor, was Ihr
    nächstes Tun ändert. Jedes Element wird geprüft, bevor es erscheint — ein
    Urteil ist ein Wert, nie ein Absatz.
improvements:
  - >
    Der Schreibstil des Assistenten — Antwort zuerst, Vorbehalte zuletzt und
    einzeln, Zahlen in der Schreibweise der Richtlinie — gilt jetzt
    ausnahmslos für jede Antwort, auch für die langen Rechercheberichte.
  - >
    Fertige Antworten erscheinen sofort als Ganzes. Der Schreibmaschineneffekt,
    der eine bereits fertige Antwort Zeichen für Zeichen eingeblendet hat, ist
    entfernt.
