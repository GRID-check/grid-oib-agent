---
features:
  - >
    Questions about Austrian law are now answered with citable paragraphs from
    the RIS, each with the reference a Bescheid would use, such as „Bauordnung
    für Wien, § 63 Abs 1“. The paragraph is listed as a source and can go
    straight into your text.
improvements:
  - >
    Legal research is now one step in the Herleitung and returns the paragraph
    in question, instead of a hit list, the whole law and text without a
    reference.
