---
fixes:
  - >
    On a phone, the last filter in the Tasks list ran off the edge of the card
    and could not be reached. Filter rows and view switchers now stay inside
    their card and scroll sideways when the labels do not fit.
  - >
    The sliding marker on a filter row or view switcher now stays inside the
    control it belongs to. Where two sat on one screen — the Liste/Zeitplan
    switcher above the Tasks filters — pressing one made the marker fly across
    to the other and back.
