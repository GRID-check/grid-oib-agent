# rclone remote for the Grid dev compose stack: the gateway mounts the
# S3-compatible object-store (dev creds; prod supplies real S3_* via env).
[grids3]
type = s3
provider = Other
env_auth = false
access_key_id = minioadmin
secret_access_key = minioadmin
endpoint = http://object-store:9000
force_path_style = true
no_check_bucket = true
