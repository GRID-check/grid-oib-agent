repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.6.2
    hooks:
      - id: uv-lock

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
        # Committed UI evidence (AGENTS.md: a user-visible change is only
        # "done" with a screenshot). Full-page retina captures of a long
        # surface routinely exceed 1 MB — the tracked gallery shots are ~3 MB —
        # so the cap would block exactly the artifacts the repo requires.
        exclude: ^frontends/ui/visual/screenshots/.*\.png$
      - id: check-yaml
        exclude: ^deploy/helm/helm-charts-k8s/.*/templates/.*\.ya?ml$
      - id: end-of-file-fixer
        exclude: ^skills/[^/]+/skill\.oms\.sig$
      - id: trailing-whitespace

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        # skill signatures are binary-ish blobs; pnpm-lock.yaml is a lockfile of
        # integrity hashes (not covered by detect-secrets' is_lock_file filter) —
        # neither holds real secrets, so keep them out of the scan.
        #
        # scope_header.json is the ADR-0047 wire fixture: its `header` fields are
        # `base64url(JSON.stringify([...]))` of collection NAMES, which is high
        # entropy by construction and a secret by no construction at all. It is
        # excluded rather than baselined because a baseline entry pins a hash to a
        # LINE NUMBER, and this file grows by a case every time a shelf is added —
        # the same trap the Pulumi note below describes. JSON cannot carry the
        # inline `pragma: allowlist secret` comment that would be the other way out.
        #
        # apm.lock.yaml is the same case as pnpm-lock.yaml: a lockfile whose
        # `resolved_commit` and `content_hash` values are hex by construction and
        # secret by none. Excluded rather than baselined for the reason the note
        # below gives — a baseline entry pins a hash to a LINE NUMBER, and this
        # file grows by a block every time a skill is added.
        exclude: (^skills/[^/]+/skill\.oms\.sig$|^frontends/ui/pnpm-lock\.yaml$|^tests/fixtures/collection_scope/scope_header\.json$|^apm\.lock\.yaml$)
        # REGENERATING THE BASELINE — keep the --exclude-lines flag, or CI starts
        # failing again a few commits later:
        #
        #   detect-secrets scan --baseline .secrets.baseline --exclude-lines '^\s*secure:\s'
        #
        # Pulumi stack files are full of `secure:` values that are ciphertext BY
        # DESIGN (encrypted by the stack's Pulumi-Cloud key, and deliberately
        # committed — see deploy/pulumi/README.md). Tracking them as baseline
        # entries pinned 13 hashes to LINE NUMBERS in Pulumi.dev.yaml, so adding
        # any config key above them shifted every line, the hook rewrote the
        # baseline, and the job failed with "files were modified by this hook" —
        # on whichever unlucky PR happened to touch the file next.
        #
        # The filter is line-scoped, not file-scoped, on purpose: a PLAINTEXT
        # secret pasted into a stack file is still caught (verified). Full
        # history is independently covered by gitleaks in security.yml.

  - repo: local
    hooks:
      - id: sync-platform-skills
        name: platform-skills.ts is generated from the builtin SKILL.md files
        # This file has broken the build from behind THREE times, and the shape
        # of the failure is the same every time: a stale generated module
        # type-checks perfectly, so nothing local objects and only CI knows.
        # `--check` runs the generator and diffs, which is the one thing that
        # can see it.
        #
        # Scoped to the two inputs rather than run always: the generator stamps
        # a timestamp into its output, so running it on every commit would make
        # the file dirty on every commit.
        entry: node frontends/ui/scripts/sync-platform-skills.mjs --check
        language: system
        pass_filenames: false
        files: ^(src/aiq_agent/skills/builtin/.*/SKILL\.md|frontends/ui/src/lib/skills/platform-skills\.ts|frontends/ui/scripts/sync-platform-skills\.mjs)$

      - id: card-schemas
        name: the card schemas are generated from cards/models.py
        # Two generated, committed artifacts in one pipeline: the Pydantic
        # models render to shared/cards/schemas.json, which renders to the Zod
        # module the frontend validates with. Neither had a guard, and the
        # failure mode is the one platform-skills.ts already demonstrated three
        # times — a stale generated module type-checks perfectly, so nothing
        # local objects and only CI (or a user) finds out.
        #
        # Running the generators IS the check: pre-commit fails the commit if
        # they modify anything. Neither stamps a timestamp, so a clean tree
        # stays clean (verified).
        # The venv python explicitly, not a bare `python`: `task lint:repo`
        # invokes `.venv/bin/pre-commit` WITHOUT activating the venv, so a
        # bare interpreter here resolves to the system one and cannot import
        # langchain_core. (The `pytest` hook below gets away with it only
        # because it is stages: [push] and CI activates the venv first.)
        # On Windows this path is .venv/Scripts/python.exe.
        entry: bash -c 'PYTHONPATH=src .venv/bin/python scripts/generate_card_schema.py && node frontends/ui/scripts/generate-card-schemas.mjs'
        language: system
        pass_filenames: false
        files: ^(src/aiq_agent/cards/models\.py|shared/cards/schemas\.json|scripts/generate_card_schema\.py|frontends/ui/scripts/generate-card-schemas\.mjs|frontends/ui/src/shared/cards/generated\.ts)$

      - id: agent-docs
        name: every AGENTS.md is reachable by the agents that need it
        # Claude Code reads CLAUDE.md, never AGENTS.md, and bridges them with an
        # `@AGENTS.md` import. The root bridge here was the ten bytes
        # "AGENTS.md\n" — no `@`, so it was prose, and the root guide loaded in
        # exactly zero sessions while /context still showed a memory file.
        # A missing guide has no symptom, so it needs a gate, not a gotcha.
        entry: python3 scripts/check_agent_docs.py
        language: system
        pass_filenames: false
        files: ^(.*/)?(AGENTS|CLAUDE)\.md$|^scripts/check_agent_docs\.py$

      - id: adr-check
        name: the ADR directory and its index tell the same story
        # Four numbers used twice, two statuses that disagreed with the index,
        # and one record indexed nowhere — none of which has a symptom until
        # somebody acts on a decision that was superseded a month ago.
        entry: python3 scripts/check_adrs.py
        language: system
        pass_filenames: false
        files: ^docs/adr/.*\.md$|^scripts/check_adrs\.py$

      - id: validate-skills
        name: skill bundles are well-formed
        # The script existed and nothing ran it — not pre-commit, not the
        # Taskfile, not CI. A validator nobody invokes is a validator that is
        # not ratcheting.
        entry: python3 scripts/validate_skills.py
        language: system
        pass_filenames: false
        files: ^skills/.*$|^scripts/validate_skills\.py$

      - id: pytest
        name: pytest
        entry: pytest tests sources --cov=aiq_agent --cov-report=term --cov-fail-under=65
        language: system
        pass_filenames: false
        stages: [push]

  - repo: https://github.com/tcort/markdown-link-check
    rev: v3.11.2
    hooks:
      - id: markdown-link-check
        args: ["-q", "--config", "ci/markdown-link-check-config.json"]
        # The vendored SkillCheck rulebook is excluded because it is vendored
        # VERBATIM (see src/aiq_agent/skills/review/README.md): its relative
        # links resolve upstream, where the whole `references/` directory
        # exists, and we deliberately took only the one file. Rewriting its
        # links to make a link checker happy would break the byte-for-byte
        # guarantee that keeps its MIT licence and attribution intact.
        exclude: |
          (?x)^(
            skills/[^/]+/skill-card\.md|
            src/aiq_agent/skills/review/skill-check/SKILL\.md
          )$

default_language_version:
  python: python3
