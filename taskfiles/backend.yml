# Backend tier (src/, sources/, frontends/aiq_api), evals, Langfuse/prompts.
#
# Included by the root Taskfile.yml with `flatten: true`: task names stay literal
# (`be:test`). Shared vars (UI, WEB, PY, ...) and env live in the root file.

version: '3'

vars:
  # The pull request selection (be:test:testmon, be:test:affected): one testmon
  # database per suite, and the arguments each suite runs with.
  TESTMON_ENV: TESTMON_DATAFILE=.testmondata-
  TESTMON_PATHS:
    map:
      core: tests/
      api: frontends/aiq_api/tests/
      sources: sources --dist loadfile

tasks:
  # ── backend (src/, sources/, frontends/aiq_api) ─────────────────────────────

  be:lint:
    desc: 'Ruff lint + format check. CI: task be:lint -- --output-format=github'
    cmds:
      # Extra arguments reach `ruff check` only: the formatter calls its own
      # --output-format unstable and warns about it.
      - '{{.RUFF}} check . {{.CLI_ARGS}}'
      - '{{.RUFF}} format --check .'

  be:format:
    desc: Apply ruff formatting and autofixes
    cmds:
      - '{{.RUFF}} check --fix .'
      - '{{.RUFF}} format .'

  be:test:
    desc: Backend core suite
    cmds:
      - '{{.PY}} -X faulthandler -m pytest tests/ -q {{.XDIST}}'

  be:test:harness:
    desc: The tests of the repository's own machinery (CI workflows and plan scripts, release notes, PR hygiene)
    cmds:
      # CI's Repo checks job runs these on every pull request, so the backend
      # filter need not fire for `ci/`, `releasenotes/` or a workflow alone
      # (.github/filters.yml). They stay in the core suite too.
      - >-
        {{.PY}} -X faulthandler -m pytest -q -p no:cacheprovider
        tests/test_ci_workflows.py tests/test_reuse_green_run.py tests/test_last_green.py
        tests/test_image_inputs.py tests/test_pinned_images.py tests/test_plan_summary.py
        tests/test_release_notes.py tests/test_pr_closing_keywords.py tests/test_bun_version_pin.py
        tests/test_pr_selection.py

  be:test:sources:
    desc: The sources/ package suites
    cmds:
      # One run over every package. No package carries a `tests/__init__.py`, so
      # no two conftests claim the module name `tests.conftest`, and a new
      # package is collected the day it lands.
      # Whole files per worker (loadfile): a file's Qdrant collections and
      # module fixtures then stay on one worker.
      - '"{{.PY}}" -X faulthandler -m pytest sources -q {{.XDIST}} --dist loadfile'

  be:test:testmon:
    desc: Record which test runs which code, for the pull request selection (CI runs this on develop)
    cmds:
      # One database per suite: three runs with their own conftests, and a
      # pull request selects from each. Never under coverage: testmon switches
      # itself off under pytest-cov. CI saves these only from a green run,
      # because a failed test is recorded as failed and re-runs every time.
      - for: [core, api, sources]
        cmd: '{{.TESTMON_ENV}}{{.ITEM}} "{{.PY}}" -X faulthandler -m pytest {{index .TESTMON_PATHS .ITEM}} -q {{.XDIST}} --testmon'

  be:test:affected:
    desc: 'The tests a change reaches, from the recorded database (CI: SUITE=core|api|sources, EXTRA="test files", SHARD=1/4 for one shard of the selection)'
    requires:
      vars: [SUITE]
    vars:
      # pytest-split deselects after testmon has (both trylast; split's runs
      # second), so every shard splits the same selection and the shards
      # together run exactly it. They must start from the same database.
      SPLIT: '{{if .SHARD}}--splits {{splitList "/" .SHARD | last}} --group {{splitList "/" .SHARD | first}} --splitting-algorithm least_duration --durations-path tests/.test_durations{{end}}'
    cmds:
      # --testmon-forceselect, because pyproject's addopts carries `-m` and
      # testmon otherwise switches selection off whenever `-m` is set. Exit 5
      # (nothing selected) is a pass: the change reached nothing in this suite.
      - '{{.TESTMON_ENV}}{{.SUITE}} "{{.PY}}" -X faulthandler -m pytest {{index .TESTMON_PATHS .SUITE}} -q {{.XDIST}} --testmon-forceselect {{.SPLIT}} || [ $? -eq 5 ]'
      # Test files that name a changed non-Python file (ci/pr_selection.py),
      # which coverage cannot connect to the change.
      - cmd: '"{{.PY}}" -X faulthandler -m pytest {{.EXTRA}} -q {{.XDIST}}'
        if: '[ -n "{{.EXTRA}}" ]'

  be:test:migration:
    desc: The Chroma exporter and the whole move (exporter, importer, Qdrant), in a throwaway chromadb environment
    cmds:
      # chromadb is not a dependency of this repo (ADR-0115): the exporter's own
      # PEP 723 pin decides the environment, and pytest's testpaths never reach
      # deploy/, so no other task imports chromadb. The end-to-end test runs the
      # importer in .venv and needs AIQ_QDRANT_TEST_URL (skipped locally without it).
      - uvx --python 3.12 --with-requirements deploy/migration/chroma_export.py --with pytest pytest deploy/migration/tests -q -p no:cacheprovider

  prompts:pull:
    desc: 'Bring a Langfuse prompt version into review: task prompts:pull [-- --label <label>]'
    env:
      PYTHONPATH: src
    cmds:
      # Git is the platform prompt's source of truth (ADR-0060 (a)). This only
      # ever READS Langfuse: it writes the version under a label into
      # `agents/piloti/prompts/piloti_static.md`, so an edit made in Langfuse
      # can be committed and reviewed like any other.
      - '{{.PY}} scripts/prompts_pull.py {{.CLI_ARGS}}'

  langfuse:provision:
    desc: 'Check (or with -- --apply, create) the score configs, review queue, judges and golden dataset Grid declares in Langfuse'
    env:
      PYTHONPATH: src
    cmds:
      # CHECK by default: prints what is missing or has drifted and writes
      # nothing. `--apply` creates what is missing and never changes or
      # deletes what exists; the judges' evaluation rule is always created
      # disabled (ADR-0089). Needs LANGFUSE_HOST and the project key pair.
      - '{{.PY}} scripts/langfuse_provision.py {{.CLI_ARGS}}'

  prompts:push:
    desc: 'Check (or with -- --apply, publish) the committed platform prompt under a Langfuse label: task prompts:push [-- --label <label> [--apply]]'
    env:
      PYTHONPATH: src
    cmds:
      # CHECK by default: prints what publishing would change and writes
      # nothing. `--apply` (with `--label` named, production included) creates
      # a version whose commit message names its commit and moves the label to
      # it; the fleet serving that label renders it within the prompt cache
      # TTL. It refuses a label whose version no commit holds (edited in
      # Langfuse: pull it into review first) and a file with uncommitted changes.
      - '{{.PY}} scripts/prompts_push.py {{.CLI_ARGS}}'

  be:eval:retrieval:
    desc: 'Retrieval structure check — the Punkt arm''s citable-unit share (model-free, offline; NEEDS the operator corpus in data/oib)'
    env:
      PYTHONPATH: src:frontends/benchmarks/oib_retrieval/src
    cmds:
      # ADR-0058 rule 7 made measurable: a chunker or German-analyzer change
      # that makes fewer Punkte survive as a citable unit fails here, on the
      # real corpus, with no embedder and no key. Baseline is in the harness
      # README; the threshold sits a few points under it so a measurement
      # wobble is not a failure while a real regression is.
      #
      # NOT A CI GATE ANY MORE. It was one until 2026-09-09, when the corpus
      # became operator-provided and gitignored (data/oib/README.md) and no CI
      # checkout could hold the PDFs to measure. This is now an opt-in local
      # tool: run it yourself before a chunker or German-analyzer change, and
      # quote the number in the PR. Without a corpus it exits 1 saying so.
      # What was lost and what would restore it: ADR-0058, "Update (2026-09-09)".
      - '{{.PY}} -m oib_retrieval_eval.runner --structure-only --fail-below {{.RETRIEVAL_GATE_PCT | default "95"}}'

  be:eval:overview:
    desc: Overview/exact/paraphrase golden recall report — the item-12 ratchet (offline, prints cohort table + per-query diff)
    env:
      PYTHONPATH: src:frontends/benchmarks/oib_retrieval/src
    cmds:
      # Gating lives in tests/benchmarks/test_oib_overview_recall.py (CI runs it
      # via be:test:ci); this task is the human entry point to the same numbers.
      - '{{.PY}} -m oib_retrieval_eval.overview'

  be:eval:record-vector:
    desc: Re-record the vector channel for the overview golden set (needs the embeddings key; writes a fixture CI then reads offline)
    env:
      PYTHONPATH: src:frontends/benchmarks/oib_retrieval/src:sources/knowledge_layer/src
    cmds:
      # The recording is the only part of that harness that needs a model and a
      # key. It is committed so `be:eval:overview` and CI stay offline; re-run
      # this when AIQ_EMBED_MODEL, data/oib or the golden questions change.
      - '{{.PY}} -m oib_retrieval_eval.record_vector'

  be:eval:qdrant-parity:
    desc: 'Qdrant retrieval gates G1b/G2/G6 on the OIB corpus, beside the Chroma path''s recorded numbers (NEEDS data/oib, a Qdrant 1.19 server, OPENROUTER_API_KEY; writes results/qdrant_parity)'
    env:
      PYTHONPATH: src:frontends/benchmarks/oib_retrieval/src:sources/knowledge_layer/src
    cmds:
      # qdrant-retrieval-design.md §10; last run: docs/architecture/qdrant-gates-2026-10.md.
      # Embeds the corpus once with the production model through make_embed_model
      # (cached under .cache/qdrant_parity, about $0.12 cold), writes it into Qdrant
      # through ingestion's write_chunks and reads it through the production
      # retriever. Chroma is gone (ADR-0115): its numbers from the gate run are the
      # fixed reference (qdrant_parity/baseline.py). `-- --embedder hashed` runs it
      # keyless as a wiring check only; `-- --variants all` adds the ranking sweep;
      # `-- --qdrant-url URL` points at another server (default $AIQ_QDRANT_TEST_URL
      # or localhost:6333). Only uniquely named parity_* collections are touched.
      - '{{.PY}} -m oib_retrieval_eval.qdrant_parity.runner {{.CLI_ARGS}}'

  be:eval:decisions:
    desc: 'Decision-model eval — does Jev pick the right OIB family, corpus and evidence need on the loop-eval questions (NEEDS OPENROUTER_API_KEY; no backend)'
    cmds:
      # ADR-0064's adoption gate. Needs only a key: the decision reads the
      # question and a fixed description of the six families, ~a cent for the
      # whole set. Exit 0 = the three floors hold; 1 = keep turn_decisions off.
      - '{{.PY}} scripts/decision_eval.py {{.CLI_ARGS}}'

  be:eval:decisions:offpath:
    desc: 'Decision-model eval for the annotations — upload tags, Dokumentart, feedback causes — on the hand-labelled tuning sets (NEEDS OPENROUTER_API_KEY; no backend)'
    cmds:
      # ADR-0064 uses 4, 8 and 9. Exit 0 = the floors in the script hold.
      - '{{.PY}} scripts/decision_eval_offpath.py {{.CLI_ARGS}}'

  be:eval:decisions:office:
    desc: 'Decision-model eval for the office experience — precedent, reference fit, cross-project hits, fingerprint quotes — on the precedent fixture office (NEEDS OPENROUTER_API_KEY; no backend)'
    cmds:
      # ADR-0064 uses 1 (precedent), 10, 11 and 12. Prints each part's sweep
      # beside the thresholds the code ships; run before and after a change to
      # a question's wording or a threshold. A few cents for every part.
      - '{{.PY}} scripts/decision_eval_office.py {{.CLI_ARGS}}'

  be:eval:root-sort:
    desc: 'Root-sort eval — placement precision, coverage and the sure-threshold sweep on a labelled synthetic shelf, plus the new-folder grouping (NEEDS OPENROUTER_API_KEY; no backend)'
    dir: '{{.ROOT_DIR}}/frontends/aiq_api'
    cmds:
      # Sets SURE_CONFIDENCE (frontends/ui/src/lib/filing/root-sort-types.ts).
      # Run before and after a change to the sort prompt, the scoring or the
      # threshold; writes tests/fixtures/root_sort/eval_<date>.json. A few cents.
      - 'PYTHONPATH=../../src:src ../../.venv/bin/python -I ../../scripts/root_sort_eval.py {{.CLI_ARGS}}'

  be:eval:decisions:holdout:
    desc: 'Held-out check for the decision-model uses, on sets written blind to the wording — never tune on them (NEEDS OPENROUTER_API_KEY; no backend)'
    cmds:
      # Exit 0 = every floor holds; the floors sit just under the last result
      # so a regression fails.
      - '{{.PY}} scripts/decision_eval_holdout.py {{.CLI_ARGS}}'

  be:eval:intake:
    desc: 'Erfassungs-Agent eval — the real intake agent reads a fixture Wohnbau with planted traps; precision, recall, traps, cost (NEEDS OPENROUTER_API_KEY and bun; skips without the key; no backend)'
    cmds:
      # The agent graph as the research worker runs it, a live model through
      # common/openrouter.py, the fixture behind the reading tools and the BFF's
      # own needs/record logic under bun (scripts/intake_eval/gate.ts). Exit 1 =
      # a run missed a floor. A run of the boot model costs about a cent.
      #   task be:eval:intake -- --runs 3 --out /tmp/intake_eval/before
      #   task be:eval:intake -- --model anthropic/claude-sonnet-5.5
      #   task be:eval:intake -- --report /tmp/intake_eval/before/report.json
      # docs/contributing/testing-and-verification.md, "The intake eval".
      - '{{.PY}} -m scripts.intake_eval.run {{.CLI_ARGS}}'

  be:eval:turn-census:
    desc: 'Turn census — run a chat question through the real agent and count every model call, token and second it cost; writes to /tmp/turn_census unless --out, takes --override KEY VALUE (NEEDS OPENROUTER_API_KEY and the corpus ingested locally)'
    cmds:
      # The measurement the turns audit could only reconstruct. Runs `nat run`
      # with a recorder on httpx; no backend, no BFF. Example:
      #   task be:eval:turn-census -- "Was weißt du über die OIB 2?" --runs 3
      #   task be:eval:turn-census -- --report /tmp/turn_census/*.jsonl
      - '{{.PY}} scripts/turn_census/census.py {{.CLI_ARGS}}'

  be:eval:answer-suite:
    desc: 'Answer suite — the reference questions through the real agent, timed and checked, with a report (NEEDS OPENROUTER_API_KEY and the corpus ingested; -- --ingest ingests it first, in the suite process)'
    env:
      PYTHONPATH: src
    cmds:
      # The end-to-end check: seconds, reasoning tokens and the answer's own
      # expectations per question, medians over runs, a baseline diff.
      #   task be:eval:answer-suite -- --out /tmp/suite/before
      #   task be:eval:answer-suite -- --out /tmp/suite/after --baseline /tmp/suite/before/results.json
      #   task be:eval:answer-suite -- --report /tmp/suite/after/results.json
      # docs/contributing/testing-and-verification.md, "The answer suite".
      - '{{.PY}} scripts/turn_census/suite.py {{.CLI_ARGS}}'

  be:eval:loop:
    desc: 'Agentic-loop shape eval — rounds, locator use, checkpoint source, truncation (NEEDS a running backend with the corpus; set GRID_LOOP_EVAL_URL to its chat role)'
    cmds:
      # Sibling of be:eval:retrieval and unrunnable in CI for the same reason:
      # the corpus is operator-provided and gitignored, and every question here
      # costs real model calls. What it measures is the SHAPE of a turn, not
      # whether the right passage came back — that is be:eval:retrieval's job.
      #
      # Two runs and a diff:
      #   GRID_LOOP_EVAL_URL=… task be:eval:loop -- --out /tmp/before.csv
      #   …change the loop, redeploy…
      #   GRID_LOOP_EVAL_URL=… task be:eval:loop -- --out /tmp/after.csv
      #   task be:eval:loop -- --compare /tmp/before.csv /tmp/after.csv
      # The compare mode needs no backend at all. Without a URL the run exits 2
      # saying so rather than writing an empty CSV somebody later compares.
      - '{{.PY}} scripts/loop_eval.py {{.CLI_ARGS}}'

  be:eval:turn-shapes:
    desc: ADR-0052 turn-shape eval against Piloti's live model (needs OPENROUTER_API_KEY; skips without it)
    cmds:
      # The two behaviours ADR-0052 moved from the router into the prompt — a
      # greeting does not search, a commissioned report escalates before it
      # retrieves — plus a control question that must still search. Real
      # prompt, real model, stub tools; the trace is the turn's transcript.
      # `-m live` selects what pyproject's addopts deselects everywhere else.
      # `-rs` prints the skip reason, so a run without the key says so instead
      # of going green.
      - '{{.PY}} -X faulthandler -m pytest tests/benchmarks/test_turn_shapes_live.py -q -rs -m live'

  be:test:ci:
    desc: Backend core suite with the coverage gate CI enforces
    cmds:
      - >-
        {{.PY}} -X faulthandler -m pytest tests/ -q {{.XDIST}}
        --cov=src/aiq_agent --cov-report=xml:coverage.xml --cov-report=term
        --cov-fail-under=65

  be:test:shard:
    desc: 'One shard of the core suite with coverage data, no gate (CI: SHARD=1/4 task be:test:shard)'
    vars:
      INDEX: '{{splitList "/" .SHARD | first}}'
      TOTAL: '{{splitList "/" .SHARD | last}}'
    env:
      # One data file per shard; be:test:coverage combines them and gates.
      COVERAGE_FILE: .coverage.shard{{.INDEX}}
    cmds:
      # pytest-split assigns whole tests by their recorded time
      # (tests/.test_durations; refresh with be:test:durations). A test that is
      # not in the file is counted at the average, so a stale file only
      # unbalances the shards, never drops a test.
      - >-
        {{.PY}} -X faulthandler -m pytest tests/ -q {{.XDIST}}
        --splits {{.TOTAL}} --group {{.INDEX}} --splitting-algorithm least_duration
        --durations-path tests/.test_durations
        --cov=src/aiq_agent --cov-report=

  be:test:coverage:
    desc: Combine the core shards' coverage data and apply the gate CI enforces
    cmds:
      - '{{.PY}} -m coverage combine --keep .coverage.shard*'
      - '{{.PY}} -m coverage xml -o coverage.xml'
      - '{{.PY}} -m coverage report --fail-under=65'

  be:test:durations:
    desc: Re-record the core suite's per-test times that be:test:shard splits by
    cmds:
      # Re-run when the shards' times in CI drift apart. Rounded to keep the
      # file's churn down; the split needs proportions, not precision.
      - '{{.PY}} -X faulthandler -m pytest tests/ -q {{.XDIST}} --store-durations --durations-path tests/.test_durations'
      - >-
        {{.PY}} -c "import json, pathlib; p = pathlib.Path('tests/.test_durations');
        d = json.loads(p.read_text()); p.write_text(json.dumps({k: round(v, 3) for k, v in sorted(d.items())}, indent=0) + chr(10))"

  be:test:api:
    desc: aiq_api plugin suite
    cmds:
      - '{{.PY}} -X faulthandler -m pytest frontends/aiq_api/tests/ -q {{.XDIST}}'

  be:verify:
    desc: Everything CI runs for the backend tier
    cmds:
      - task: be:lint
      - task: be:test:ci
      - task: be:test:api
      # sources/ is part of the tier, and CI's backend-test job runs it too.
      - task: be:test:sources

  be:test:postgres:
    desc: >-
      The claim-queue suites' Postgres branch (production's SQL), and the
      metadata store's mail records on it, against a throwaway cluster. Needs
      PostgreSQL server binaries.
    cmds:
      # Serial, not -n logical: every test drops and recreates the same tables
      # in the one scratch database.
      - >-
        bash scripts/rls-test-db.sh --exec "{{.PY}}" -X faulthandler -m pytest -q
        tests/aiq_agent/common/test_claim_queue.py
        tests/knowledge_layer_tests/test_ingest_queue.py
        frontends/aiq_api/tests/test_research_queue_fair.py
        tests/aiq_agent/knowledge/folder_cards
        tests/aiq_agent/knowledge/test_mail_facts.py
