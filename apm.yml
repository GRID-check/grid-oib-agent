# Agent Package Manager manifest: third-party agent skills, pinned and locked.
#
# Skills we did not write are dependencies, so they get a manifest and a
# lockfile rather than a hand copy. `apm install --frozen` reproduces the same
# bytes everywhere, the contract `uv.lock` and `bun.lockb` already give us.
#
#   task agents:setup   install from this file
#   task agents:audit   drift and hidden-Unicode scan
#
# One source, many harnesses. `skills/` holds every skill this repo authors;
# apm deploys them, alongside the third-party ones, into each harness path
# below. Those paths (.claude/, .agents/) are generated and gitignored.
#
# Add a harness here and its directory starts getting the same set. Pinned
# rather than auto-detected because apm 0.28 resolves targets differently in
# `install` and in the `audit` replay, so autodetection reported permanent
# drift against files install never wrote.
name: grid-oib-agent
version: 1.0.0
description: Agent skills for working on the Grid OIB agent repository

targets:
  - claude        # .claude/skills/
  - agent-skills  # .agents/skills/, the shared Agent Skills path

dependencies:
  apm:
    # This repo's own skills. Local paths, so editing one and re-running
    # `task agents:setup` republishes it to every target.
    - ./skills/aiq-add-data-source
    - ./skills/aiq-add-tool
    - ./skills/aiq-customize-prompts-models
    - ./skills/aiq-definition-of-done
    - ./skills/aiq-deploy
    - ./skills/aiq-piloti-riso
    - ./skills/aiq-maintain-ci
    - ./skills/aiq-prepare-pr
    - ./skills/aiq-release-qa
    - ./skills/aiq-research

    # Writing documents an agent consumes: skills, AGENTS.md, CLAUDE.md.
    # Pinned to a commit; an unpinned ref drifts silently under `apm install`.
    - mattpocock/skills/skills/productivity/writing-for-agents#6654f6b60cd9d5be8b54c6fafe44346dabeb3b76

    # `improve-codebase-architecture` is a BUNDLE, not one skill: it calls the
    # Skill tool for `codebase-design` (the module/interface/depth/seam/adapter/
    # leverage/locality vocabulary it refuses to drift from), `grilling` (the
    # decision loop once you pick a candidate) and `domain-modeling` (keeping
    # CONTEXT.md current). Pinning it alone leaves three dead Skill calls, so
    # all four are pinned together at the same commit.
    #
    # It reads `docs/adr/` to avoid re-proposing decisions we already recorded,
    # which is why it is worth more here than in a repo without an ADR log. It
    # also wants a `CONTEXT.md` domain glossary, which this repo does not have
    # yet; the skill creates one lazily.
    - mattpocock/skills/skills/engineering/improve-codebase-architecture#6654f6b60cd9d5be8b54c6fafe44346dabeb3b76
    - mattpocock/skills/skills/engineering/codebase-design#6654f6b60cd9d5be8b54c6fafe44346dabeb3b76
    - mattpocock/skills/skills/engineering/domain-modeling#6654f6b60cd9d5be8b54c6fafe44346dabeb3b76
    - mattpocock/skills/skills/productivity/grilling#6654f6b60cd9d5be8b54c6fafe44346dabeb3b76

    # pstack (poteto's stack). unslop, typescript-best-practices, `how` and
    # `why` carry no disable-model-invocation and so fire on their own; the
    # rest only run when asked for by name.
    #
    # `why` is the sibling of `how`: `how` explains what the code does, `why`
    # reconstructs the forces behind it from source control, issues and docs.
    # That is the question this repo answers with `docs/adr/`, so the two meet.
    #
    # `technical-writing` covers human-facing prose — docs, RFCs, PR bodies —
    # where `writing-for-agents` covers the documents an agent consumes.
    - cursor/plugins/pstack/skills/unslop#bdf7aa355337897f167153e05069aca505dae17c
    - cursor/plugins/pstack/skills/typescript-best-practices#bdf7aa355337897f167153e05069aca505dae17c
    - cursor/plugins/pstack/skills/how#bdf7aa355337897f167153e05069aca505dae17c
    - cursor/plugins/pstack/skills/why#bdf7aa355337897f167153e05069aca505dae17c
    - cursor/plugins/pstack/skills/technical-writing#bdf7aa355337897f167153e05069aca505dae17c
    - cursor/plugins/pstack/skills/interrogate#bdf7aa355337897f167153e05069aca505dae17c
    - cursor/plugins/pstack/skills/blast-radius#bdf7aa355337897f167153e05069aca505dae17c
    - cursor/plugins/pstack/skills/principle-model-the-domain#bdf7aa355337897f167153e05069aca505dae17c

    # UI evidence. These two replace the `frontends/ui/visual/` harness: one
    # drives a real browser, the other puts what it captured in the PR.
    #
    # `agent-browser` is a native CLI, NOT an npm library the repo imports — it
    # is installed per machine (`npm i -g agent-browser && agent-browser
    # install`), and the skill is the instruction sheet for it. Its `--full`,
    # `set viewport`, `set media dark` and `eval` cover what `capture.mjs` did
    # per target, and `skills get core --full` carries the version-matched
    # command reference, so this pin ages with the CLI rather than against it.
    #
    # `before-and-after` owns only the GitHub half: it formats media into one
    # marked block and publishes it with `gh --attach` (GitHub CLI 2.99+). That
    # is the whole reason the PNGs stop being committed — the evidence lands in
    # the PR body, where a reviewer already is, instead of in everyone's clone.
    # It does not capture anything itself; it expects agent-browser above.
    # KNOWN WART, deliberately accepted: `before-and-after` ships its skill in a
    # directory called `skill/`, and apm names a deployed skill after that
    # DIRECTORY rather than the `name:` in its frontmatter, so it lands at
    # `.claude/skills/skill/` and harnesses offer it as "skill".
    #
    # The object form below takes an `alias:` that fixes the directory (`name:`
    # is rejected outright), and it is NOT used here because `apm install` and
    # `apm audit` disagree about it: install honours the alias, the audit replay
    # ignores it, and `task agents:audit` then reports permanent drift — four
    # files orphaned, four unintegrated — on every run, red forever. Confirmed
    # on 0.28.0 and still true on 0.31.0. It is the same install-vs-replay
    # divergence the `targets:` block above is pinned for.
    #
    #   - git: vercel-labs/before-and-after
    #     path: skill
    #     ref: 8306d34f459b6704e08e6adb5829fcddb0dc3557
    #     alias: before-and-after
    #
    # A working gate beats a tidy name, so the string form stays until apm
    # teaches its audit replay about aliases. The skill still TRIGGERS correctly
    # — matching is on the frontmatter description, not the directory — so what
    # the wart costs is the name you would type to invoke it by hand.
    - vercel-labs/agent-browser/skills/agent-browser#aff6125c023b810ea3f2e5deec5379e9a4270bdc
    - vercel-labs/before-and-after/skill#8306d34f459b6704e08e6adb5829fcddb0dc3557
  mcp: []

includes: auto
scripts: {}
