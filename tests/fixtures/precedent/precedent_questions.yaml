# The precedent eval's questions (docs/roadmap/office-experience.md, step A).
#
# Asked in the CURRENT project of the fixture office
# (frontends/ui/tests/fixtures/precedent/office.json): a four-storey timber
# residential building, GK 4, in Perchtoldsdorf, Niederösterreich. Every
# expectation is a fact read off that fixture office, never a value from memory.
#
# Run:  python scripts/turn_census/suite.py --set precedent --runs 2
#
# `expect` keys, each one check:
#   lookup:      required | forbidden | optional — did the turn call project_lookup
#   cites:       list of groups; each group is a list of alternatives, one of which
#                must appear in the answer (a project's name, as the reader sees it)
#   not_cites:   names that must NOT appear (a project the question does not concern,
#                or an invented one)
#   says_none:   the answer says no comparable reference was found
#   caveat:      the answer says the precedent was decided under an earlier edition
#                or that the rules may have changed since
#   mentions:    as in the loop eval: a VALUE that must appear (a dimension, a
#                material, a project's name), alternatives allowed. Never a
#                meaning: whether an answer warns, refuses or says none is the
#                judge's (says_none, caveat), not a word list's
#
#   scenario:    which office the run sits in (office.json `scenarios`): `default`
#                when absent, `wien-bestand` (a Vienna office building conversion:
#                another Land, use and kind of work), `leeres-buero` (no other
#                project at all)
#   holdout:     true for a question written without reading any answer and
#                never used to tune a prompt, a check or the fixture. The report
#                scores them apart: a gap between tuned and held-out is overfitting.
#
# Groups: explicit (asked about past projects), implicit (a decision a past
# project made, not asked as such: the agent should look unasked), norm (a pure
# norm or definition question: no lookup), none (no comparable project exists:
# say so, invent nothing), drift (a precedent under an older edition).

questions:
  # --- explicit -------------------------------------------------------------
  - id: traufe-frueher
    group: explicit
    question: Wie haben wir die Traufe bei unseren früheren Holzbauten ausgeführt?
    expect:
      lookup: required
      cites: [[Baden]]
      mentions: [[Brandsperre, Brandsperren]]

  - id: moedling-nachforderung
    group: explicit
    question: Was hat die Baubehörde in Mödling bei unserer Wohnhausanlage nachgefordert?
    expect:
      lookup: required
      cites: [[Mödling, Moedling]]
      mentions: [["1,20 m", "1,20"], [Rauchabzug]]

  - id: fluchttreppe-moedling
    group: explicit
    question: Welche Fluchttreppe hatten wir bei der Wohnhausanlage in Mödling?
    expect:
      lookup: required
      cites: [[Mödling, Moedling]]
      mentions: [[Stahl, Stahlkonstruktion], [A2]]

  - id: sicherheitstreppenhaus-referenz
    group: explicit
    question: Hatten wir schon ein Projekt mit Sicherheitstreppenhaus? Was hat die Behörde dort verlangt?
    expect:
      lookup: required
      cites: [[Wien 22, Wagramer]]
      mentions: [[Druckbelüftung, Druckbelueftung]]

  - id: linz-decke
    group: explicit
    question: Wie ist bei der Schule in Linz die Holz-Beton-Verbunddecke aufgebaut?
    expect:
      lookup: required
      cites: [[Linz]]
      mentions: [["12 cm", Aufbeton]]

  # --- implicit: the agent should look unasked ------------------------------
  - id: kapselung-gk4
    group: implicit
    question: Wie können wir die Holzdecken in unserem GK-4-Holzbau brandschutztechnisch ausführen, wenn sie nicht in A2 sein sollen?
    expect:
      lookup: required
      cites: [[Baden]]
      mentions: [[Kapselung, K2 60, K₂60, "K2 60"]]

  - id: auflagen-noe-gk4
    group: implicit
    question: Mit welchen Auflagen müssen wir bei der Baubewilligung für unser Wohnhaus rechnen?
    expect:
      lookup: required
      cites: [[Baden, Mödling, Moedling]]

  - id: gutachten-noetig
    group: implicit
    question: Brauchen wir für unseren Holzbau ein Brandschutzgutachten, oder reicht die OIB-Richtlinie 2?
    expect:
      lookup: optional
      cites: [[Baden]]

  # --- norm: no lookup ------------------------------------------------------
  - id: fluchtniveau-definition
    group: norm
    question: Was ist das Fluchtniveau?
    expect:
      lookup: forbidden
      not_cites: [Baden, Mödling, Moedling, Wagramer, Linz, Gänserndorf, Hinterbrühl]

  - id: rauchabzug-norm
    group: norm
    question: Was verlangt die OIB-Richtlinie 2 für den Rauchabzug in Treppenhäusern?
    expect:
      lookup: forbidden

  # --- none: no comparable project exists ------------------------------------
  - id: feuerwehraufzug-keiner
    group: none
    question: Wie haben wir bei unseren Hochhäusern die Feuerwehraufzüge gelöst?
    expect:
      lookup: required
      says_none: true
      not_cites: [Baden, Mödling, Moedling, Linz, Gänserndorf]

  - id: tiefgarage-keine
    group: none
    question: Hatten wir schon einmal eine Tiefgarage mit über 100 Stellplätzen?
    expect:
      lookup: required
      says_none: true

  # --- drift: an older edition ---------------------------------------------
  - id: fluchttreppe-wie-moedling
    group: drift
    question: Können wir die Fluchttreppe genauso ausführen wie in Mödling 2019?
    expect:
      lookup: required
      cites: [[Mödling, Moedling]]
      caveat: true

  - id: kapselung-wie-baden
    group: drift
    question: Können wir das Brandschutzkonzept vom Holzwohnbau Baden einfach übernehmen?
    expect:
      lookup: required
      cites: [[Baden]]
      caveat: true

  # --- what the catalog alone should answer ----------------------------------
  - id: aehnliche-projekte
    group: explicit
    question: Welche unserer abgeschlossenen Projekte sind diesem am ähnlichsten?
    expect:
      lookup: optional
      cites: [[Baden], [Mödling, Moedling]]
      not_cites: [Linz]

  # --- decisions: what only a project's memory recorded ---------------------
  - id: kapselung-warum-gipsfaser
    group: explicit
    question: Warum haben wir beim Holzwohnbau in Baden für die Kapselung Gipsfaserplatten genommen?
    expect:
      lookup: required
      cites: [[Baden]]
      mentions: [[Prüfbericht, Pruefbericht]]

  # --- held out: written 7 Oct 2026 before any of them ran; never tune on these ---
  - id: hold-hinterlueftung-mundart
    group: explicit
    holdout: true
    question: Wie hamma des mit der Hinterlüftung bei der Holzfassade damals gmacht?
    expect:
      lookup: required
      cites: [[Baden]]

  - id: hold-english-escape-stair
    group: explicit
    holdout: true
    question: How did we handle the external escape stair in one of our earlier housing projects?
    expect:
      lookup: required
      cites: [[Mödling, Moedling]]

  - id: hold-dachgeschoss-auflagen
    group: explicit
    holdout: true
    question: Welche Auflagen hat die MA 37 bei unserem Dachgeschoßausbau im 7. Bezirk erteilt?
    expect:
      lookup: required
      cites: [[Wien 7, Neubaugasse, Dachgeschoßausbau]]

  - id: hold-norm-und-praxis
    group: implicit
    holdout: true
    question: Wir planen ein Stiegenhaus in Stahlbeton im Holzbau. Hat sich das bei uns schon bewährt?
    expect:
      lookup: required
      cites: [[Baden]]
      not_cites: [Linz]

  - id: hold-norm-brandabschnitt
    group: norm
    holdout: true
    question: Wie groß darf ein Brandabschnitt laut OIB-Richtlinie 2 höchstens sein?
    expect:
      lookup: forbidden

  - id: hold-none-hallenbad
    group: none
    holdout: true
    question: Haben wir schon einmal ein Hallenbad geplant?
    expect:
      lookup: required
      says_none: true
      not_cites: [Baden, Mödling, Moedling, Linz, Gänserndorf, Hinterbrühl, Wagramer, Neubaugasse]

  # --- held out, another office: the chat sits in a Vienna office building conversion ---
  - id: wien-druckbelueftung
    group: implicit
    holdout: true
    scenario: wien-bestand
    question: Wir brauchen im Hof ein neues Stiegenhaus. Worauf hat die Behörde bei unseren Wiener Bürobauten geachtet?
    expect:
      lookup: required
      cites: [[Wien 22, Wagramer]]

  - id: wien-uebernahme-aus-noe
    group: drift
    holdout: true
    scenario: wien-bestand
    question: Können wir die Kapselungslösung aus dem Holzwohnbau in Baden hier einfach übernehmen?
    expect:
      lookup: required
      cites: [[Baden]]
      # Baden is in Niederösterreich, this project in Wien: the answer must warn
      # that another Bauordnung applied there. A meaning, so the judge reads it.
      caveat: true

  - id: wien-norm-bestand
    group: norm
    holdout: true
    scenario: wien-bestand
    question: Was sagt die OIB-Richtlinie 2 zu Fluchtwegen in Bestandsgebäuden?
    expect:
      lookup: forbidden

  # --- held out, an office with no other project in Piloti ---
  - id: leer-traufe
    group: none
    holdout: true
    scenario: leeres-buero
    question: Wie haben wir die Traufe bei unseren früheren Holzbauten ausgeführt?
    expect:
      lookup: optional
      says_none: true
      not_cites: [Baden, Mödling, Moedling, Linz, Gänserndorf, Hinterbrühl, Wagramer, Neubaugasse]

  - id: leer-aehnliche
    group: none
    holdout: true
    scenario: leeres-buero
    question: Welche ähnlichen Projekte hatten wir schon?
    expect:
      lookup: optional
      says_none: true
      not_cites: [Baden, Mödling, Moedling, Linz, Gänserndorf, Hinterbrühl, Wagramer, Neubaugasse]
