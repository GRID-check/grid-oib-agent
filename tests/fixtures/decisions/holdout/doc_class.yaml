- file_name: Artikel_Bauzeitung_Barrierefrei.pdf
  text: |
    Barrierefreiheit: Wo Planer immer noch stolpern
    Von Sabine Huber | Österreichische Bauzeitung, Ausgabe 18/2025
    Seit Jahren gelten klare Regeln für barrierefreies Bauen, doch in der Praxis zeigen sich bei Abnahmen immer
    wieder dieselben Mängel: zu steile Rampen, fehlende Bewegungsflächen vor Türen, Schwellen bei Terrassentüren.
    Wir haben mit drei Sachverständigen gesprochen, welche Fehler am häufigsten vorkommen und wie man sie schon in
    der Entwurfsphase vermeidet.
  doc_class: sonstiges
