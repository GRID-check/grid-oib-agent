  question: "Was ist eigentlich der Unterschied zwischen einem Brandabschnitt und einem Brandrauchabschnitt?"
  answer: "Ein Brandabschnitt ist ein Bereich, der durch brandabschnittsbildende Wände und Decken so abgetrennt ist, dass sich ein Brand für eine bestimmte Zeit nicht in andere Abschnitte ausbreitet. Ein Rauchabschnitt begrenzt dagegen nur die Ausbreitung von Rauch, etwa durch Rauchschürzen oder rauchdichte Türen. Brandabschnitte haben Feuerwiderstandsanforderungen, Rauchabschnitte nicht zwingend."

