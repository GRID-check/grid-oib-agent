- file_name: D-17_Deckendurchfuehrung_Haustechnik.pdf
  text: |
    DETAIL 17 – Abschottung Leitungsdurchführung Geschoßdecke, M 1:5
    Brandabschnittsbildende Decke REI 90, STB 20 cm.
    Kombiabschottung System XY-Mörtel mit Brandschutzmanschette für brennbare Rohre bis Ø 110 mm,
    Abschottung EI 90 gemäß ETA-17/0123, Ringspalt vollständig mit Mineralwolle (Schmelzpunkt ≥ 1000 °C)
    verfüllt. Mindestabstand zwischen zwei Abschottungen 100 mm. Kennzeichnungsschild dauerhaft neben der
    Durchführung anbringen. Verfüllung nur durch geschultes Personal, Dokumentation für die Abnahme durch die
    Brandschutzbeauftragte.
  type: Detail
  disciplines: [Brandschutz]

