- file_name: BSK_Buero_Linz_Hafen_v3.pdf
  text: |
    Brandschutzkonzept – Bürogebäude "Hafenkante", Linz
    Revision 3, Stand 14.07.2026
    1. Gegenstand
    Das vorliegende Brandschutzkonzept beschreibt die baulichen, anlagentechnischen und organisatorischen
    Maßnahmen für den Neubau eines sechsgeschoßigen Bürogebäudes (Gebäudeklasse 5, Fluchtniveau 19,80 m).
    Abweichend von OIB-RL 2 Tab. 1b wird für die Tragkonstruktion der obersten zwei Geschoße eine
    Holz-Beton-Verbunddecke in REI 60 vorgesehen; als Kompensation dient eine flächendeckende
    Brandmeldeanlage Schutzumfang Vollschutz sowie eine zweite Fluchtmöglichkeit über ein Sicherheitstreppenhaus.
    Brandabschnittsgrößen bis max. 1.200 m² je Geschoß.
  type: Gutachten
  disciplines: [Brandschutz]

- file_name: Statik_Vorbemessung_Aufstockung_Graz.pdf
  text: |
    STATISCHE VORBEMESSUNG
    Projekt: Dachgeschoßaufstockung Wohnhaus Annenstraße 42, 8020 Graz
    Verfasser: Tragwerksplanung Hofer ZT GmbH
    Die bestehenden Dippelbaumdecken des Gründerzeitbestandes sind für die Zusatzlasten aus der Aufstockung
    nicht ausreichend. Vorgesehen ist ein eigenständiges Stahltragwerk, das die Lasten über neue Stützen
    in den Mittelmauern bis ins Fundament abträgt. Nutzlasten gem. ÖNORM EN 1991-1-1 Kat. A: 2,0 kN/m²,
    Schneelast Graz sk = 1,39 kN/m². Die Fundamente der Mittelmauer sind mittels Kernbohrung zu erkunden;
    bis dahin gilt die Bemessung als vorläufig.
  type: Gutachten
  disciplines: [Standsicherheit]

