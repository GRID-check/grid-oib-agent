- file_name: SSN_Reihenhaeuser_Haus1-6.pdf
  text: |
    Schallschutznachweis gemäß OIB-Richtlinie 5 und ÖNORM B 8115-2
    Objekt: 6 Reihenhäuser, Kirchenweg, 4600 Wels
    Nachweis der Luftschalldämmung der Haustrennwände: zweischalige Ziegelwand 2x 17 cm mit durchgehender
    Trennfuge 4 cm Mineralwolle, R'w = 67 dB, rechnerisch DnT,w ≥ 60 dB → Anforderung erfüllt.
    Außenbauteile: maßgeblicher Außenlärmpegel LA,eq,d = 58 dB (Straßenverkehr); erforderliches R'res,w = 33 dB,
    vorhanden 38 dB. Haustechnische Anlagen: Außeneinheit der Luft-Wasser-Wärmepumpe mit Abstand 3,5 m zur
    Grundgrenze, LAF,max am Nachbarfenster < 35 dB nachts.
  type: Gutachten
  disciplines: [Schallschutz]

- file_name: Rauchabzug_TG_Konzept_Rev1.pdf
  text: |
    Entrauchungskonzept Tiefgarage – Wohnprojekt "Seeblick", Bregenz
    Die zweigeschoßige Tiefgarage (ca. 3.100 m², 118 Stellplätze) wird als Großgarage im Sinne der
    OIB-RL 2.2 eingestuft. Die Rauchableitung erfolgt über eine mechanische Rauch- und Wärmeabzugsanlage mit
    Strahlventilatoren, Auslegung 10-facher Luftwechsel, Nachströmung über das Einfahrtstor. Die Rauchabschnitte
    sind durch Rauchschürzen mit 0,5 m Unterzugshöhe gegliedert. Der Nachweis der Rauchfreihaltung der Fluchtwege
    wurde mittels CFD-Simulation geführt (Anhang C). Ansteuerung über die Brandmeldeanlage.
  type: Gutachten
  disciplines: [Brandschutz]

- file_name: Geotechnik_Bericht_Baugrube_Innsbruck.pdf
  text: |
    GEOTECHNISCHES GUTACHTEN
    Baugrunderkundung und Gründungsempfehlung, Wohn- und Geschäftshaus Museumstraße, Innsbruck
    Es wurden 4 Kernbohrungen bis 18 m u. GOK sowie 3 schwere Rammsondierungen abgeteuft. Unter einer 2,5 m
    mächtigen Anschüttung folgen dicht gelagerte sandige Kiese (Inn-Schotter). Grundwasser wurde bei 6,2 m u. GOK
    angetroffen, Bemessungswasserspiegel HGW100 bei 4,8 m. Empfohlen wird eine Flachgründung auf elastisch
    gebetteter Bodenplatte, zulässiger Sohldruck 350 kN/m², Baugrubensicherung mittels rückverankerter Bohrpfahlwand.
  type: Gutachten
  disciplines: [Standsicherheit]

- file_name: Stellungnahme_BF_Gemeindezentrum.pdf
  text: |
    Stellungnahme zur barrierefreien Gestaltung
    Gemeindezentrum Pfarrwerfen – Einreichplanung Stand 06/2026
    Geprüft wurden Zugänge, Rampen, Aufzug, Sanitärräume und Orientierungssysteme nach OIB-RL 4 und ÖNORM B 1600.
    Befund: Die Rampe zum Nebeneingang weist mit 8,2 % eine zu große Neigung auf (zul. 6 %). Das barrierefreie
    WC im OG hat keinen seitlichen Bewegungsraum von 90 cm neben dem WC-Sitz. Ein taktiles Leitsystem vom Gehsteig
    zum Haupteingang fehlt. Die Aufzugskabine 1,10 x 1,40 m entspricht den Anforderungen.
  type: Gutachten
  disciplines: [Nutzungssicherheit/Barrierefreiheit]

- file_name: Raumluft_Schimmel_Befund_Top14.pdf
  text: |
    Befund und Gutachten über Schimmelbefall in der Wohnung Top 14, Hütteldorfer Str. 211, 1140 Wien
    Im Auftrag der Hausverwaltung Kraus wurde am 02.06.2026 eine Ortsbesichtigung durchgeführt. In Schlafzimmer
    und Bad wurde großflächiger Befall (ca. 2,5 m²) an den Außenwandecken festgestellt. Die Luftkeimmessung ergab
    erhöhte Konzentrationen von Aspergillus und Penicillium gegenüber der Außenluft. Oberflächentemperaturen in den
    Ecken 11,8 °C bei 20 °C Raumluft; relative Luftfeuchte über mehrere Tage 68–74 %. Ursache: unzureichende
    Lüftung in Kombination mit einer geometrischen Wärmebrücke.
  type: Gutachten
  disciplines: [Hygiene/Gesundheit/Umweltschutz]

- file_name: Bauphysik_Gutachten_Schule_Leoben.pdf
  text: |
    Bauphysikalisches Gutachten – Neubau Mittelschule Leoben
    Teil A Wärmeschutz: Die Außenwände (Stahlbeton 25 cm + Mineralwolle 24 cm) erreichen U = 0,14 W/m²K,
    das Flachdach U = 0,11 W/m²K, Fenster Uw = 0,85 W/m²K. Der Nachweis des sommerlichen Wärmeschutzes nach
    ÖNORM B 8110-3 für die südorientierten Klassen ist mit außenliegendem Sonnenschutz erfüllt.
    Teil B Schallschutz: Klassenzimmertrennwände DnT,w ≥ 55 dB, Nachhallzeit in den Klassen T = 0,6 s
    durch Akustikdecken; Turnsaal mit Prallwandverkleidung als Absorber.
  type: Gutachten
  disciplines: [Energieeinsparung/Wärmeschutz, Schallschutz]

- file_name: BH_Kufstein_Ausnahme_2026.pdf
  text: |
    STADTGEMEINDE KUFSTEIN
    Der Bürgermeister als Baubehörde I. Instanz
    Geschäftszahl: KU-BAU/2026/0417                                     Kufstein, 19.05.2026
    Bescheid
    Die Behörde gestattet gemäß § 42 TBO 2022 die Abweichung von den Anforderungen der OIB-RL 2 hinsichtlich
    der Ausführung des zweiten Fluchtweges im Beherbergungsbetrieb "Alpenrose" unter folgenden Auflagen:
    1. Einbau einer automatischen Brandmeldeanlage im gesamten Gebäude. 2. Rauchdichte, selbstschließende Türen
    zu allen Gästezimmern (E 30-C Sm). 3. Jährliche Räumungsübung mit Protokoll.
  type: Bescheid
  disciplines: [Brandschutz]
