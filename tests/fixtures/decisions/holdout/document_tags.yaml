- file_name: B8115-2_2021.pdf
  text: |
    ÖNORM B 8115-2
    Ausgabe: 2021-11-15
    Schallschutz und Raumakustik im Hochbau – Teil 2: Anforderungen an den Schallschutz
    1 Anwendungsbereich
    Diese ÖNORM legt Mindestanforderungen an den Luftschallschutz zwischen Räumen, an den Trittschallschutz
    und an den Schallschutz gegen Außenlärm sowie gegen Geräusche haustechnischer Anlagen fest. Sie gilt für
    Neubauten sowie für Zu- und Umbauten. Die Anforderungen werden durch die bewertete Standard-Schallpegeldifferenz
    DnT,w und den bewerteten Standard-Trittschallpegel L'nT,w ausgedrückt.
  type: Norm/Richtlinie
  disciplines: [Schallschutz]

