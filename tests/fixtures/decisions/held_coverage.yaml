passages:
  oib2_overview: &oib2_overview
    - source: oib-rl_2_ausgabe_mai_2023.pdf
      citation: oib-rl_2_ausgabe_mai_2023.pdf, p.3
      punkt: "0"
      text: >-
        Diese Richtlinie legt die Anforderungen an den Brandschutz von Gebäuden fest; für sonstige
        Bauwerke gilt sie sinngemäß. Für Betriebsbauten gilt ergänzend die OIB-Richtlinie 2.1, für
        Garagen, überdachte Stellplätze und Parkdecks die OIB-Richtlinie 2.2 und für Gebäude mit einem
        Fluchtniveau von mehr als 22 m die OIB-Richtlinie 2.3. Bei gemischter Nutzung sind die
        Wechselwirkungen der Nutzungsbereiche zu berücksichtigen.
    - source: oib-rl_2.1_ausgabe_mai_2023.pdf
      citation: oib-rl_2.1_ausgabe_mai_2023.pdf, p.2
      punkt: "1"
      text: >-
        Diese Richtlinie gilt für Betriebsbauten, das sind Gebäude oder Gebäudeteile, die der Produktion
        oder der Lagerung von Gütern dienen. Die Bestimmungen der OIB-Richtlinie 2 gelten zusätzlich,
        soweit hier nichts anderes festgelegt ist.
    - source: oib-richtlinie_2.2_ausgabe_mai_2023.pdf
      citation: oib-richtlinie_2.2_ausgabe_mai_2023.pdf, p.2
      punkt: "1"
      text: >-
        Diese Richtlinie gilt für Garagen, überdachte Stellplätze und Parkdecks. Überdachte Stellplätze
        mit einer Nutzfläche von nicht mehr als 50 m² sind von den Anforderungen dieser Richtlinie
        ausgenommen.
    - source: oib-rl_2.3_ausgabe_mai_2023.pdf
      citation: oib-rl_2.3_ausgabe_mai_2023.pdf, p.2
      punkt: "1"
      text: >-
        Diese Richtlinie gilt für Gebäude mit einem Fluchtniveau von mehr als 22 m. Die Bestimmungen
        der OIB-Richtlinie 2 gelten zusätzlich, soweit hier nichts anderes festgelegt ist.
    - source: oib-rl_2_ausgabe_mai_2023.pdf
      citation: oib-rl_2_ausgabe_mai_2023.pdf, p.4
      punkt: "2"
      text: >-
        Das Brandverhalten von Baustoffen und der Feuerwiderstand von Bauteilen sind getrennt zu
        beurteilen. Für zusätzliche Bekleidungen und Beläge gelten die Anforderungen der Tabelle 1a.
    - source: oib-rl_2_ausgabe_mai_2023.pdf
      citation: oib-rl_2_ausgabe_mai_2023.pdf, p.14
      punkt: "12"
      text: >-
        Bei Änderungen an bestehenden Bauwerken sind für die bestehenden Bauwerksteile, auf die sich
        die Änderungen auswirken, Abweichungen von den Anforderungen dieser Richtlinie zulässig, wenn
        das ursprüngliche Anforderungsniveau des rechtmäßigen Bestandes nicht verschlechtert wird.
    - source: oib-rl_2_ausgabe_mai_2023.pdf
      citation: oib-rl_2_ausgabe_mai_2023.pdf, p.12
      punkt: "8"
      text: >-
        Gebäude müssen für Einsatzkräfte der Feuerwehr zugänglich sein. Erforderliche Aufstell- und
        Bewegungsflächen für die Feuerwehr müssen ausreichend befestigt und tragfähig sein.
  tabelle_1b: &tabelle_1b
    - source: oib-rl_2_ausgabe_mai_2023.pdf
      citation: oib-rl_2_ausgabe_mai_2023.pdf, p.7
      punkt: Tabelle 1b
      text: >-
        Anforderungen an den Feuerwiderstand von Bauteilen, tragende Bauteile. Im obersten Geschoß:
        GK 1 keine Anforderung, GK 2 R 30, GK 3 R 30, GK 4 R 30, GK 5 R 60. In sonstigen oberirdischen
        Geschoßen: GK 1 R 30, GK 2 R 30, GK 3 R 60, GK 4 R 60, GK 5 R 90 und A2. In unterirdischen
        Geschoßen: GK 1 und GK 2 R 60, GK 3 bis GK 5 R 90 und A2.
  stufen: &stufen
    - source: oib-rl_4_ausgabe_mai_2023.pdf
      citation: oib-rl_4_ausgabe_mai_2023.pdf, p.4
      punkt: 2.2.2
      text: >-
        Die Stufenhöhe darf bei Haupttreppen höchstens 18 cm betragen, der Auftritt muss mindestens
        27 cm betragen. Bei Treppen innerhalb von Wohnungen sind eine Stufenhöhe von höchstens 20 cm
        und ein Auftritt von mindestens 24 cm zulässig.
  bescheid: &bescheid
    - source: Baubescheid_MA37_2026-03-14.pdf
      citation: Baubescheid_MA37_2026-03-14.pdf, p.3
      text: >-
        Auflage 7: Die Feuerwehrzufahrt ist mit einer Breite von mindestens 3,50 m und einer
        Tragfähigkeit für 10 t Achslast herzustellen, dauerhaft freizuhalten und zu kennzeichnen. Die
        Herstellung ist mit der Fertigstellungsanzeige nachzuweisen.

