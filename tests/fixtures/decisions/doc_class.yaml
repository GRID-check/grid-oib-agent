# Hand-labelled, written for ADR-0064 use 8 (2026-09-25). Not captured payloads:
# openings in the shape of each Dokumentart the base corpus holds, under file
# names that carry no OIB hint (the case the filename guess sends to
# `sonstiges`). `doc_class` is what a platform owner would pick. Re-run with
# `task be:eval:decisions:offpath`.
- file_name: RL_Brand_2023_final.pdf
  doc_class: oib_richtlinie
  text: >-
    OIB-Richtlinie 2 Brandschutz. Ausgabe: Mai 2023. Diese Richtlinie basiert auf den Beratungen
    der von der Landesamtsdirektorenkonferenz zur Ausarbeitung eines Vorschlages für
    harmonisierte bautechnische Vorschriften eingesetzten Länderexpertengruppe. 1 Begriffsbestimmungen.
    Es gelten die Begriffsbestimmungen des Dokumentes „OIB-Richtlinien – Begriffsbestimmungen“.
    2 Allgemeine Anforderungen und Tragfähigkeit im Brandfall.
- file_name: leitfaden_abweichungen.pdf
  doc_class: oib_leitfaden
  text: >-
    OIB-Leitfaden Abweichungen im Brandschutz und Brandschutzkonzepte. Ausgabe Mai 2023. Dieser
    Leitfaden dient als Hilfestellung bei der Erstellung von Brandschutzkonzepten, wenn von den
    Anforderungen der OIB-Richtlinie 2 abgewichen wird, und beschreibt, wie die Gleichwertigkeit
    nachgewiesen werden kann.
