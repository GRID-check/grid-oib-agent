# Twenty questions a Wiener Planungsbüro actually asks, for the loop eval.
#
# WHAT THIS SET IS FOR
# --------------------
# The agentic-loop work (docs/roadmap/architect-workspace-voice-and-agentic-loop.md,
# "Second landing") changed how a turn spends its retrieval: a locator instead of
# a second search, a checkpoint the model cannot skip, and a first round capped at
# two searches. Every one of those is a claim about behaviour, and a claim about
# behaviour that nobody measured is a preference. `scripts/loop_eval.py` runs this
# set against a reachable backend before and after and prints the deltas.
#
# It is NOT a correctness benchmark. The retrieval golden set
# (frontends/benchmarks/oib_retrieval) measures whether the right passage comes
# back; this measures the SHAPE of the turn that went looking for it — how many
# rounds, whether the locator was used, whether the cited Punkt is the one the
# question is about, whether the budget ran out.
#
# THE EXPECTED FIELDS
# -------------------
# `family`  The document family the answer must be grounded in. `OIB-RL <n>` for
#           a Richtlinie (`2.1`/`2.2`/`2.3` are their own documents), `Bauordnung`
#           for provincial law that lives in RIS, or `null` for a question about
#           the office's own files, which is here as the control that must NOT
#           grow a verdict.
# `punkt`   The Punkt the citation should name, or `null`. Every non-null value is
#           read off the committed structural index
#           (frontends/benchmarks/oib_retrieval/fixtures/punkt_index.json), never
#           remembered: a Punkt number somebody typed from memory scores a correct
#           answer as wrong, which is worse than not scoring it. A citation to a
#           CHILD of the listed Punkt counts as a match (`5.1.2` matches `5.1`) —
#           the question decides the requirement, the corpus decides how deeply it
#           is numbered.
#           Bauordnung rows carry no `punkt`: their paragraphs come from RIS, and
#           nothing committed here can verify one.
# `kind`    The answer envelope's `kind` the turn should reach: `ruling` only where
#           there is a copyable legal value, `walkthrough` where the honest answer
#           is prose, `direct` where nothing is retrieved at all.
#
# Adding a question: give it an id nobody else has, and leave `punkt` null unless
# you looked it up in the index.

questions:
  - id: fluchtweg-gk4
    question: >-
      Wir planen ein Wohnhaus in Gebäudeklasse 4. Wie lang darf der Fluchtweg
      vom Wohnungseingang bis ins Freie sein?
    family: OIB-RL 2
    punkt: "5.1"
    kind: ruling

  - id: feuerwiderstand-gk5
    question: >-
      Welchen Feuerwiderstand brauchen die tragenden Wände in einem Gebäude
      der Gebäudeklasse 5?
    family: OIB-RL 2
    punkt: "2.2"
    kind: ruling

  - id: rauchwarnmelder-wohnung
    question: Müssen wir in jeder Wohnung Rauchwarnmelder vorsehen?
    family: OIB-RL 2
