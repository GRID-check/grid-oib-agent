# Twenty-nine questions a Wiener Planungsbüro actually asks, for the loop eval.
#
# WHAT THIS SET IS FOR
# --------------------
# The agentic-loop work (docs/roadmap/architect-workspace-voice-and-agentic-loop.md,
# "Second landing") changed how a turn spends its retrieval: a locator instead of
# a second search, a checkpoint the model cannot skip, and a first round capped at
# two searches. Every one of those is a claim about behaviour, and a claim about
# behaviour that nobody measured is a preference. `scripts/loop_eval.py` runs this
# set against a reachable backend before and after and prints the deltas.
#
# It is NOT a correctness benchmark. The retrieval golden set
# (frontends/benchmarks/oib_retrieval) measures whether the right passage comes
# back; this measures the SHAPE of the turn that went looking for it — how many
# rounds, whether the locator was used, whether the cited Punkt is the one the
# question is about, whether the budget ran out.
#
# THE EXPECTED FIELDS
# -------------------
# `family`  The document family the answer must be grounded in. `OIB-RL <n>` for
#           a Richtlinie (`2.1`/`2.2`/`2.3` are their own documents), `Bauordnung`
#           for provincial law that lives in RIS, or `null` for a question about
#           the office's own files, which is here as the control that must NOT
#           grow a verdict.
# `punkt`   The Punkt the citation should name, or `null`. Every non-null value is
#           read off the committed structural index
#           (frontends/benchmarks/oib_retrieval/fixtures/punkt_index.json), never
#           remembered: a Punkt number somebody typed from memory scores a correct
#           answer as wrong, which is worse than not scoring it. A citation to a
#           CHILD of the listed Punkt counts as a match (`5.1.2` matches `5.1`) —
#           the question decides the requirement, the corpus decides how deeply it
#           is numbered.
#           Bauordnung rows carry no `punkt`: their paragraphs come from RIS, and
#           nothing committed here can verify one.
# `paragraph` The § the citation should name, for a Bauordnung row, or `null`.
#           Same discipline as `punkt` and for the same reason: a § number read
#           off a fetched consolidated text and committed beside the question,
#           never one somebody remembered. There is no committed RIS fixture in
#           this repo yet, so every one of them is `null` today and
#           `paragraph_match` falls back to the §§ the turn itself retrieved
#           (scripts/loop_eval.py). Filling one in is what turns that column
#           from "did the answer cite something it read" into "did the answer
#           cite the right §".
# `kind`    The answer envelope's `kind` the turn should reach: `ruling` only where
#           there is a copyable legal value, `walkthrough` where the honest answer
#           is prose, `direct` where nothing is retrieved at all.
#
# `suite`   `core` puts the question in the answer suite's default set
#           (`scripts/turn_census/suite.py`, `task be:eval:answer-suite`), which
#           runs through `nat run` without a backend. Keep the core set small and
#           spread over the answer shapes: every run of it costs model calls.
# `expect`  Optional, read only by the answer suite, checked against the answer
#           the pipeline delivered:
#             mentions:     values that must appear (a list inside the list is
#                           alternatives, e.g. [EI2 30, EI₂ 30])
#             not_mentions: phrases that must not (a false claim seen live)
#             shape:        tabs | table | diagram, or a list of acceptable ones
#             kind_also:    kinds the suite accepts besides `kind`, when a
#                           second reading is as right (a list the law
#                           prescribes is a walkthrough AND a ruling); the
#                           other evals keep reading `kind` alone
#           Same discipline as `punkt`: a value is one read off the corpus
#           (the PDF, a retrieved passage), never one remembered.
#
# Adding a question: give it an id nobody else has, and leave `punkt` and
# `paragraph` null unless you looked them up in the index / read them off a
# committed fixture.

questions:
  - id: fluchtweg-gk4
    question: >-
      Wir planen ein Wohnhaus in Gebäudeklasse 4. Wie lang darf der Fluchtweg
      vom Wohnungseingang bis ins Freie sein?
    family: OIB-RL 2
    punkt: "5.1"
    kind: ruling
    suite: core

  - id: feuerwiderstand-gk5
    question: >-
      Welchen Feuerwiderstand brauchen die tragenden Wände in einem Gebäude
      der Gebäudeklasse 5?
    family: OIB-RL 2
    punkt: "2.2"
    kind: ruling
    suite: core

  - id: rauchwarnmelder-wohnung
    question: Müssen wir in jeder Wohnung Rauchwarnmelder vorsehen?
    family: OIB-RL 2
    punkt: "3.11"
    kind: ruling

  - id: abstand-nachbargrenze-brandwand
    question: >-
      Unser Baukörper steht 1,50 m von der Nachbargrundgrenze entfernt.
      Brauchen wir dort eine brandabschnittsbildende Wand?
    family: OIB-RL 2
    punkt: "4.1"
    kind: ruling

  - id: fassade-brandschutz
    question: >-
      Was ist beim Brandschutz einer hinterlüfteten Holzfassade in
      Gebäudeklasse 4 zu beachten?
    family: OIB-RL 2
    punkt: "3.5"
    kind: walkthrough

  - id: was-weisst-du-ueber-oib-2
    question: Was weißt du über die OIB-Richtlinie 2?
    family: OIB-RL 2
    punkt: null
    kind: walkthrough
    suite: core
    expect:
      # All four parts are in the corpus; a live run at low effort claimed 2.1 was not.
      mentions: ["2.1", "2.2", "2.3"]
      not_mentions: ["nicht enthalten"]

  - id: tiefgarage-entrauchung
    question: >-
      Brauchen wir für die Tiefgarage mit 30 Stellplätzen eine mechanische
      Entrauchung?
    family: OIB-RL 2.2
    punkt: null
    kind: ruling

  - id: worum-geht-es-oib-2-2
    question: >-
      Wir haben zum ersten Mal eine Tiefgarage im Projekt. Worum geht es in der
      OIB-Richtlinie 2.2 überhaupt?
    family: OIB-RL 2.2
    punkt: null
    kind: walkthrough

  - id: betriebsbau-brandschutz
    question: >-
      Wir bauen eine Produktionshalle mit rund 1.800 m² Grundfläche. Welche
      Brandschutzanforderungen kommen da auf uns zu?
    family: OIB-RL 2.1
    punkt: null
    kind: walkthrough

  - id: hochhaus-ab-22m
    question: >-
      Ab welchem Fluchtniveau gilt unser Gebäude als Hochhaus, und was ändert
      sich dann?
    family: OIB-RL 2.3
    punkt: null
    kind: ruling

  - id: treppenbreite-wohnbau
    question: >-
      Welche nutzbare Durchgangsbreite muss die notwendige Treppe in einem
      Wohngebäude mit zwölf Wohnungen haben?
    family: OIB-RL 4
    punkt: "2.4"
    kind: ruling

  - id: absturzsicherung-gelaender
    question: >-
      Ab welcher Absturzhöhe brauchen wir eine Absturzsicherung, und wie hoch
      muss sie sein?
    family: OIB-RL 4
    punkt: "4"
    kind: ruling
    suite: core
    expect:
      # OIB-RL 4 Pkt. 4.2.1: 1,00 m, above 12 m Absturzhöhe 1,10 m.
      mentions: ["1,10"]

  - id: barrierefrei-wohngebaeude
    question: >-
      Was fordert die OIB 4 zur barrierefreien Gestaltung bei einem
      Wohngebäude mit acht Wohnungen?
    family: OIB-RL 4
    punkt: "7.4"
    kind: walkthrough

  - id: was-regelt-oib-4
    question: >-
      Was regelt die OIB-Richtlinie 4 eigentlich alles? Ich hätte gern einen
      Überblick, bevor wir den Wohnbau einreichen.
    family: OIB-RL 4
    punkt: null
    kind: walkthrough

  - id: belichtung-aufenthaltsraum
    question: >-
      Wie groß muss die Fensterfläche eines Aufenthaltsraums für die
      Belichtung mindestens sein?
    family: OIB-RL 3
    punkt: "9.1"
    kind: ruling

  - id: feuchtigkeit-erdberuehrt
    question: >-
      Wie ist der Schutz vor Feuchtigkeit aus dem Boden bei erdberührten
      Bauteilen geregelt?
    family: OIB-RL 3
    punkt: "6.1"
    kind: walkthrough

  - id: uwert-aussenwand-neubau
    question: Welchen U-Wert muss die Außenwand im Neubau einhalten?
    family: OIB-RL 6
    punkt: "4.4"
    kind: ruling

  - id: sommerlicher-waermeschutz
    question: >-
      Wie weisen wir den sommerlichen Wärmeschutz für die Südfassade mit
      großen Verglasungen nach?
    family: OIB-RL 6
    punkt: "4.9"
    kind: walkthrough

  - id: schallschutz-zwischen-wohnungen
    question: >-
      Welcher Luftschallschutz ist zwischen zwei Wohnungen im selben Gebäude
      gefordert?
    family: OIB-RL 5
    punkt: "2.3"
    kind: ruling

  - id: tragwerk-einwirkungen
    question: >-
      Welche Einwirkungen müssen wir für das Tragwerk eines Wohnhauses
      ansetzen, und worauf stützt sich das?
    family: OIB-RL 1
    punkt: "2.2"
    kind: walkthrough

  - id: einreichung-wien-unterlagen
    question: >-
      Welche Unterlagen verlangt die Baubehörde in Wien für die Einreichung
      eines Wohnhauses?
    family: Bauordnung
    punkt: null
    kind: walkthrough
    expect:
      # Five runs, 2026-09-24: three ruled on § 63 as a list of what it
      # requires, two walked through it. Both carry the same §§ and items.
      kind_also: [ruling]

  # Four more Bauordnung rows. One row out of twenty-three could not measure a
  # retrieval path, and RIS is the half of the corpus the punkt_index cannot
  # check — so this family is where a RIS change shows up or does not. Each
  # names a Land whose Bauordnung the norm registry actually points at, and
  # `stellplatz-tirol` is the row that catches a Viennese answer to a Tyrolean
  # question (`focus_entries` drops other states' law silently).
  - id: bauhoehe-wien
    question: >-
      Wie hoch dürfen wir in Bauklasse I bauen, und wie wird die Gebäudehöhe
      überhaupt gemessen?
    family: Bauordnung
    punkt: null
    paragraph: null
    kind: ruling

  - id: stellplatz-tirol
    question: >-
      Wie viele Stellplätze müssen wir bei einem Wohnhaus in Innsbruck
      herstellen?
    family: Bauordnung
    punkt: null
    paragraph: null
    kind: ruling
    expect:
      # Four answered runs, 2026-09-24: all walked through § 8 TBO to the
      # count, because Innsbruck's own figures are a municipal Verordnung.
      kind_also: [walkthrough]

  - id: abstandsflaeche-noe
    question: >-
      Welche Abstände zum Nachbargrundstück müssen wir in Niederösterreich
      einhalten?
    family: Bauordnung
    punkt: null
    paragraph: null
    kind: walkthrough

  - id: bewilligungsfrei-salzburg
    question: >-
      Welche Bauvorhaben sind in Salzburg bewilligungsfrei, und was müssen wir
      trotzdem anzeigen?
    family: Bauordnung
    punkt: null
    paragraph: null
    kind: walkthrough
    expect:
      # Three answered runs, 2026-09-24: all ruled on § 2 and § 3 BauPolG,
      # the two lists the question asks for.
      kind_also: [ruling]

  - id: was-steht-im-brandschutzkonzept
    question: >-
      Was steht in unserem Brandschutzkonzept drin? Ich müsste vor der
      Besprechung wissen, was es überhaupt behandelt.
    family: null
    punkt: null
    kind: walkthrough

  - id: ordner-brandschutz-listing
    question: Was liegt eigentlich alles in unserem Ordner Brandschutz?
    family: null
    punkt: null
    kind: direct

  - id: treppenhaus-gk4-tabelle
    question: >-
      Welche Feuerwiderstandsklasse brauchen die Wände eines Treppenhauses in
      GK 4, und welche die Türen zu Wohnungen?
    family: OIB-RL 2
    punkt: null
    kind: ruling
    suite: core
    expect:
      # OIB-RL 2 Tabelle 3, rows 1.1 and 3.1, column GK 4 (pdfplumber, p. 30).
      # The answer lives in a table, not a Punkt, hence no `punkt`.
      mentions: ["REI 60", [EI2 30, "EI₂ 30"]]
      shape: table

  - id: fluchtweg-varianten
    question: >-
      Für den zweiten Fluchtweg in GK 4 überlegen wir eine Außentreppe oder ein
      zweites Treppenhaus. Was müsste ich jeweils nachweisen?
    family: OIB-RL 2
    punkt: "5.1"
    kind: walkthrough
    suite: core
    expect:
      # Two designs, each with its own list of requirements: variant tabs, or
      # one table with a column per design (both seen live, both readable).
      # REI 60: Tabelle 3, row 1.1, GK 4.
      mentions: ["REI 60"]
      shape: [tabs, table]
