# The office-file eval's fixture project (`task be:eval:answer-suite -- --set files`, ADR-0127).
#
# The intake eval's project (`tests/fixtures/intake_eval/project.yaml`, which this extends and
# which stays untouched, its answer key depends on it), grown to the shape of an office's drive:
# nested folders, a 14-page report to read through, and a later letter. Every name, number and
# party is invented. `scripts/turn_census/fixture_files.py` seeds it into the Qdrant and the
# metadata store the suite's runs read, one chunk per page.
#
# `refile` moves a base file into a folder (name -> path); `files` adds new ones. A file's
# `pages` are its pages in order. The questions are `files_questions.yaml` beside this file;
# change both together.
#
# Planted on purpose, and what the questions read off:
#   - „Fluchtweg“ stands on pages 3, 7 and 11 of the Brandschutzkonzept and nowhere else.
#   - „Sprinkler“ stands nowhere.
#   - The Brandschutzkonzept has 14 pages and six chapters; its Aufzug page (9) never says „Fluchtweg“.
#   - Three Geschäftszahlen of the MA 37: one in the base Bescheid, two in the new letter.
#   - EP-01 exists as Index A and Index B; B is the current one. The letter is the newest upload.
#   - The E-Mail-Verlauf about the Stellplätze (`mail/`, rendered by the BFF's renderer and chunked
#     by the real Markdown chunker, ADR-0134): five messages, one per section. The Behörde's own,
#     signed mail (12.05.2026, ma37.wien.gv.at) asks for the Fahrradabstellraum proof by 29.05.2026
#     and invites to the Bauverhandlung on the Planwechsel, 16.06.2026; a forged mail (14.05.2026,
#     ma37-wien.at, „Domain nicht bestätigt“) claims the Ausgleichsabgabe is waived; „ein Stellplatz
#     im Hof“ is written only as a quote inside the Behörde's mail; the Stellplatzberechnung came
#     with Ing. Gruber's signed mail of 04.05.2026.
#
# `markdown` names a file's bytes instead of `pages`; `mail_facts` names what the BFF sends beside
# a filed mail (`mail_thread` for the Verlauf, `mail_origin` for an attachment, by name).

extends: ../intake_eval/project.yaml

project:
  collection: proj_files_eval
  description: "Aufstockung des Wohnhauses in der Hubergasse, Unterlagen der Einreichung"

refile:
  EP-01_Grundrisse_Index-A.pdf: Einreichung/Pläne
  EP-01_Grundrisse_Index-B.pdf: Einreichung/Pläne
  EP-02_Schnitt_A-A.pdf: Einreichung/Pläne

files:
  - name: Brandschutzkonzept_Hubergasse14.pdf
    folder: Gutachten/Brandschutz
    added_at: "2026-06-02"
    tags: [Gutachten]
    pages:
      - |
        BRANDSCHUTZKONZEPT
        Aufstockung Wohnhaus Hubergasse 14, 1160 Wien
        Verfasser: Brandschutz Ziviltechniker Dr. Pichler GmbH, Margaretenstraße 70, 1050 Wien
        Stand: 20.02.2026, Fassung 1

        1. Vorhaben und Grundlagen
        Dieses Konzept beschreibt den baulichen, anlagentechnischen und abwehrenden Brandschutz der Aufstockung des
        Wohnhauses Hubergasse 14 (EZ 1234, KG Ottakring). Grundlage sind die Einreichpläne EP-01 und EP-02, Index B, und
        die OIB-Richtlinie 2 (Ausgabe Mai 2023).
      - |
        Gebäudekenndaten
        Gebäudeklasse 4 nach Aufstockung (Fußboden des obersten Aufenthaltsraums unter 22 m über dem Gelände).
        Geschoße: Keller, Erdgeschoß, 1. bis 3. Obergeschoß. Wohnungen: 11. Nutzung: ausschließlich Wohnen.
        Das Konzept gilt für die Aufstockung und für die Teile des Bestands, die vom Umbau der Erschließung berührt werden.
      - |
        2. Bauliche Maßnahmen
        2.1 Rettungsweg
        Der Fluchtweg aller Wohnungen führt über das bestehende Stiegenhaus ins Freie. Das Stiegenhaus bleibt der einzige
        vertikale Rettungsweg; die Aufstockung erhält keine zweite Stiege.
        Die Rettungsweglänge von der Wohnungseingangstür bis zum Stiegenhaus beträgt im 3. Obergeschoß höchstens 12 m.
      - |
        2.2 Tragwerk und Decken
        Die Decken der Aufstockung aus Brettsperrholz erreichen REI 60, die Decken über dem Erdgeschoß als ertüchtigte
        Dippelbaumdecken ebenfalls REI 60. Tragende Bauteile der Aufstockung werden in R 60 ausgeführt.
        Die Holzoberflächen im Stiegenhaus werden mit nichtbrennbarer Bekleidung (A2) versehen.
      - |
        2.3 Brandabschnitte
        Das Gebäude bildet drei Brandabschnitte: den Keller (BA-01), das Stiegenhaus (BA-02) und die Wohngeschoße je
        Geschoß (BA-03). Wohnungstrennwände und Trenndecken zwischen Wohnungen sind in REI 60 ausgeführt, die Feuermauern
        zu Hubergasse 12 und 16 in REI 90.
      - |
        2.4 Öffnungen und Durchführungen
        Türen von den Wohnungen zum Stiegenhaus sind rauchdicht und selbstschließend (EI2 30-C). Leitungsdurchführungen
        durch Trennbauteile werden mit zugelassenen Abschottungen verschlossen. Die Dachfläche der Aufstockung erhält
        eine Bedachung, die gegen Flugfeuer und strahlende Wärme widerstandsfähig ist.
      - |
        3. Rettungswege und Aufzug
        3.1 Sicherheitsbeleuchtung
        Im Stiegenhaus wird auf jedem Geschoß eine Sicherheitsbeleuchtung angeordnet, damit der Fluchtweg bei
        Stromausfall erkennbar bleibt. Die Kennzeichnung erfolgt mit Rettungszeichen nach ISO 7010.
        Die Tür zum Hof im Erdgeschoß öffnet in Fluchtrichtung und ist ohne Schlüssel zu bedienen.
      - |
        3.2 Stiegenhaus
        Das Stiegenhaus erhält an oberster Stelle eine Rauchabzugsöffnung mit mindestens 1 m² geometrischer Fläche, die vom
        Erdgeschoß aus ausgelöst werden kann. Die Stufen und Podeste der bestehenden Treppe bleiben unverändert.
      - |
        3.3 Aufzug
        Der neue Personenaufzug im Stiegenhausauge ist kein Rettungsweg und im Brandfall nicht zu benutzen. Der Schacht
        erhält Wände in EI 60, die Schachttüren sind in E 30 ausgeführt. Ein Hinweis am Aufzug weist auf das Benutzungsverbot
        im Brandfall hin. Der Aufzugsvorraum entfällt, weil jede Haltestelle in das Stiegenhaus mündet.
      - |
        4. Anlagentechnischer Brandschutz
        4.1 Rauchwarnmelder
        In allen Aufenthaltsräumen der Wohnungen und in den Gängen, über die Fluchtrichtungen laufen, werden vernetzte
        Rauchwarnmelder montiert. Eine Brandmeldeanlage ist für ein Wohngebäude dieser Größe nicht erforderlich.
      - |
        5. Abwehrender Brandschutz
        5.1 Einsatzkräfte
        Die Zufahrt für die Feuerwehr erfolgt über die Hubergasse. Der Fluchtweg im Stiegenhaus darf durch abgestellte
        Gegenstände nicht eingeengt werden; die Hausordnung weist darauf hin. Eine trockene Steigleitung ist nicht
        erforderlich, weil das oberste Geschoß vom Gelände aus mit der Drehleiter erreichbar ist.
      - |
        5.2 Löschwasser
        Hydranten in der Hubergasse (Abstand etwa 60 m) stellen die Löschwasserversorgung sicher. Tragbare
        Feuerlöscher (je Geschoß einer, 6 kg) werden im Stiegenhaus an gut sichtbarer Stelle angebracht.
      - |
        6. Organisatorischer Brandschutz
        Die Hausverwaltung erstellt eine Brandschutzordnung Teil A und B und aktualisiert sie nach jeder Änderung der
        Nutzung. Die Wartung der Rauchabzugsöffnung und der Rauchwarnmelder erfolgt jährlich und wird dokumentiert.
      - |
        7. Schlussbemerkung
        Das Konzept ist mit der Baubehörde abgestimmt und wird mit dem Bescheid der MA 37 verbindlich. Änderungen der
        Pläne nach Index B sind dem Verfasser vorzulegen.

        Wien, am 20.02.2026
        Brandschutz Ziviltechniker Dr. Pichler GmbH

