# Stack configuration for the `prod` stack — TEMPLATE.

#

# Non-secret config lives here, committed. ALL secrets live in the Pulumi ESC

# environment `grid-oib/prod` (imported via the `environment:` block below).

# Stack-file values win over env values on conflict, so the env holds ONLY the
# secret keys — this file is the single source of truth for plaintext config.

#

#   cd deploy/pulumi

#   pulumi stack init prod

#   esc env set matthiasbigl/grid-oib/prod pulumiConfig.grid-oib:kubeconfig            "$(cat /path/to/kubeconfig)" --secret

#   esc env set matthiasbigl/grid-oib/prod pulumiConfig.grid-oib:pgAppPassword         "$(openssl rand -base64 24)" --secret

#   # Password for the least-privilege `grid_app_rw` runtime role (ADR-0041).

#   # Required, no fallback — a stack without it fails at `pulumi preview`:

#   esc env set matthiasbigl/grid-oib/prod pulumiConfig.grid-oib:pgRuntimePassword     "$(openssl rand -base64 32)" --secret

#   esc env set matthiasbigl/grid-oib/prod pulumiConfig.grid-oib:seaweedfsSecretKey    "$(openssl rand -base64 24)" --secret

#   esc env set matthiasbigl/grid-oib/prod pulumiConfig.grid-oib:gridInternalApiToken  "$(openssl rand -hex 32)" --secret

#   esc env set matthiasbigl/grid-oib/prod pulumiConfig.grid-oib:gridAdminToken        "$(openssl rand -hex 32)" --secret

#   esc env set matthiasbigl/grid-oib/prod pulumiConfig.grid-oib:openrouterApiKey      "sk-or-..." --secret

#   esc env set matthiasbigl/grid-oib/prod pulumiConfig.grid-oib:tavilyApiKey          "tvly-..." --secret

#   esc env set matthiasbigl/grid-oib/prod pulumiConfig.grid-oib:workosApiKey          "sk_live_..." --secret

#   esc env set matthiasbigl/grid-oib/prod pulumiConfig.grid-oib:workosCookiePassword  "$(openssl rand -hex 32)" --secret

#   # Encrypts DB-claimed job payloads at rest (they carry the user auth token).

#   # REQUIRED whenever jobExecution=db (the deploy fails closed without it; set

#   # grid-oib:allowPlaintextJobPayloads=true to override for dev/single-node):

#   esc env set matthiasbigl/grid-oib/prod pulumiConfig.grid-oib:jobPayloadKek          "$(openssl rand -base64 32)" --secret

#   # `requirepass` for the two Dragonfly instances (cache + edge counter store).

#   # REQUIRED — the deploy fails closed without them; set

#   # grid-oib:allowUnauthenticatedRedis=true to run without authentication

#   # deliberately. The two MUST DIFFER: every app pod carries the cache password

#   # in its REDIS_URL, and sharing it would let the app tier flush the edge

#   # rate-limit counters.

#   esc env set matthiasbigl/grid-oib/prod pulumiConfig.grid-oib:dragonflyPassword      "$(openssl rand -base64 32)" --secret

#   esc env set matthiasbigl/grid-oib/prod pulumiConfig.grid-oib:rateLimitStorePassword "$(openssl rand -base64 32)" --secret

#   # Optional (only if using the local BYOK backend):

#   esc env set matthiasbigl/grid-oib/prod pulumiConfig.grid-oib:byokLocalKek          "$(openssl rand -base64 32)" --secret

#

# Discover your provider's StorageClass first:  kubectl get storageclass

environment:
  - grid-oib/prod
config:
  grid-oib:namespace: grid
  # ── Images (from the publish-images CI workflow → GHCR) ──

  grid-oib:imageRegistry: ghcr.io/grid-check
  # This line IS the promotion mechanism: every develop→prod promotion PR must

  # bump it to the new develop-tip sha (publish-images builds every service as

  # sha-<full sha> on every develop push). Do NOT have CI compute this

  # dynamically from the merge commit — prod merge shas never have GHCR images;

  # only develop tips do.
  grid-oib:imageTag: sha-8d588ad2e49699dc465e82e566a7f131aea17cbb
  # ── Storage (provider CSI, NVMe/TCP) ──

  # Classes offered by the provider (see `kubectl get storageclass`):

  #   premium         — DEFAULT, 3 storage replicas (use for all durable data)

  #   standard        — 2 replicas

  #   single-replica  — 1 replica (cheapest; no storage-level redundancy)

  # NOTE: `lightbits` is the *VolumeSnapshotClass* name, NOT a StorageClass.

  # All classes reclaim `Delete` — deleting a PVC destroys its data irreversibly.
  grid-oib:storageClass: premium
  # ── Ingress / TLS ── One key moves every public host: app./s3./otel. derive

  # from baseDomain (per-host appDomain/s3Domain/otelDomain keys remain as overrides).
  grid-oib:baseDomain: piloti.at
  grid-oib:letsEncryptEmail: matthias@bigls.net
  grid-oib:useStagingIssuer: "false" # flip to false once DNS + TLS verified
  # The provider ships an unremovable metrics stack, so DON'T install a second.

  grid-oib:installMetricsServer: "false"
  # After the first deploy, read the Envoy LoadBalancer's external IP

  # (`kubectl -n envoy-gateway-system get svc`) and pin it here so DNS keeps

  # pointing at the same address across any Gateway re-creation (the provider

  # reserves a released IP for 14 days and reclaims it via this annotation):
  grid-oib:loadBalancerIp: "45.144.209.196"
  # ── Public DNS (Cloudflare) ──

  # Off by default: a stack whose records are maintained by hand deploys exactly

  # as before. Turning it on removes the manual per-host DNS step at the end of

  # every deploy — the step whose failure mode is a healthy cluster nobody can

  # reach and an ACME challenge that never solves.

  #

  # Requires `loadBalancerIp` above to be pinned (an unpinned address can change

  # under a Gateway re-creation, and records written from it would be wrong with

  # nothing to notice), plus:

  #   pulumi config set        grid-oib:dnsZoneId   <zone id from the Cloudflare Overview page>

  #   pulumi config set        grid-oib:dnsZoneName example.com

  #   esc env set matthiasbigl/grid-oib/prod pulumiConfig.grid-oib:cloudflareApiToken "<Zone:DNS:Edit, scoped to that zone>" --secret

  #   pulumi config set        grid-oib:dnsEnabled  true

  #

  # `dnsZoneName` is the ZONE apex, which is not necessarily `baseDomain` — a

  # stack can live on a subdomain of its zone. Every managed host is checked to

  # fall inside it, because the Cloudflare API treats a name outside the zone as

  # relative and appends the zone to it, creating a record that resolves nowhere

  # and reporting success.

  #

  # Set `dnsZoneBaseline: true` on EXACTLY ONE stack — the one that owns the

  # zone-level records (www, _dmarc, the apex). When this stack's baseDomain is

  # the zone apex, that stack is the natural owner.
  grid-oib:dnsEnabled: "true"
  # NetworkPolicies (default-deny ingress + least-privilege allows) are ON by

  # default. Set false only if a validation pass shows they block required

  # traffic on your cluster. Egress is left open (see network-policies.ts).

  # grid-oib:networkPolicies: "true"

  # Pulumi `protect` on the resources whose loss is not recoverable by re-running

  # `pulumi up`: the CloudNativePG Cluster (the operator owns its PVCs, so

  # deleting the CR destroys every database) and the SeaweedFS / Chroma

  # StatefulSets. Protected resources make Pulumi REFUSE to delete or replace

  # them, so a stray rename or `pulumi destroy` fails loudly with the data still

  # there. Keep this true on prod; lift a single resource deliberately with

  # `pulumi state unprotect <urn>`.

  # grid-oib:protectDataResources: "true"

  # ── Postgres (CloudNativePG) ──
  grid-oib:pgInstances: "3" # HA: 1 primary + 2 streaming replicas
  grid-oib:pgStorageSize: 20Gi
  # Continuous WAL archiving + nightly base backups to SeaweedFS (PITR). This is

  # the only recovery path from the provider's `Delete` reclaim policy, so it is

  # ON in prod. The grid-pg-backups bucket is auto-created.
  grid-oib:pgBackupsEnabled: "true"
  grid-oib:pgBackupRetention: 30d
  grid-oib:pgBackupSchedule: "0 0 2 * * *" # 6-field (sec min hour …): 02:00 daily
  # ── SeaweedFS ──

  # Pin the storage engine in prod: the provider replaces nodes on ITS schedule,

  # and an unpinned tag would re-pull whatever SeaweedFS shipped that day —

  # surprise storage-engine upgrades are the one class of update you want to

  # control. 3.80 is the compose-proven version; bump deliberately.
  grid-oib:seaweedfsImage: chrislusf/seaweedfs:3.80
  # PINNED to the pre-ADR-0043 layout because this stack already holds objects.

  # The split topology (master/volume/filer as separate workloads, filer

  # namespace on Postgres) uses different PVCs, so flipping this is a DATA

  # MIGRATION, not a config change: without the runbook in

  # `docs/deployment/kubernetes.md` § "Migrating SeaweedFS to the split

  # topology", the cluster comes up empty while every existing object sits on a

  # PersistentVolumeClaim that nothing mounts. Nothing errors — which is exactly

  # why this is pinned rather than left to the default.

  #

  # Rehearse on dev first. The split topology is what makes volume capacity a

  # replica count and moves the per-chunk encryption keys off the disk holding

  # the ciphertext they open.
  grid-oib:seaweedfsTopology: single
  grid-oib:seaweedfsStorageSize: 20Gi
  grid-oib:seaweedfsBucket: grid-documents
  grid-oib:seaweedfsAccessKey: grid
  # ── Shared Chroma vector store (horizontal scaling) ──

  # true = one shared Chroma server all agent replicas/workers use (unpins

  # vectors from a single pod). false = embedded per-pod Chroma (single agent).
  grid-oib:chromaEnabled: "true"
  grid-oib:chromaStorageSize: 20Gi
  # ── Agent (backend) — vertical scaling levers ──

  grid-oib:backendRequestsCpu: "1"
  grid-oib:backendRequestsMemory: 2Gi
  grid-oib:backendLimitsCpu: "4"
  grid-oib:backendLimitsMemory: 8Gi
  grid-oib:backendDaskWorkers: "1"
  grid-oib:backendDaskThreads: "4"
  grid-oib:backendMaxActiveJobs: "8"
  grid-oib:backendMaxActiveJobsPerOrg: "3"
  grid-oib:backendIngestMaxWorkers: "2"
  grid-oib:backendDataStorageSize: 20Gi
  # ── Research execution (ADR-0021) ──

  # "dask" = per-pod cluster (agent is a singleton). "db" = DB-claimed workers:

  # web tier runs no Dask and dedicated agent-worker replicas execute research

  # jobs, scaling the token-heavy workload horizontally. Requires chromaEnabled.
  grid-oib:jobExecution: db
  grid-oib:agentWorkerMinReplicas: "1"
  grid-oib:agentWorkerMaxReplicas: "3"
  grid-oib:agentWorkerConcurrency: "1"
  # Seconds a terminating worker may spend finishing the research jobs it has

  # already claimed (terminationGracePeriodSeconds). On SIGTERM the worker stops

  # claiming and drains; below this budget the kubelet SIGKILLs it mid-job, so

  # every deploy and every node drain destroys research a user is waiting on.

  # Set it at or above the p99 job duration; the cost is deploy latency, since

  # workers roll one at a time and a draining one holds its slot this long.
  grid-oib:agentWorkerDrainSeconds: "600"
  # Chat/web replicas. Safe at >1 via conversation affinity (the frontend WS

  # proxy pins each conversation to its owning replica — ADR-0028).
  grid-oib:backendReplicas: "1"
  # ── Frontend (horizontal) ──

  grid-oib:frontendMinReplicas: "1"
  grid-oib:frontendMaxReplicas: "3"
  # ── Auth / platform ──

  grid-oib:requireAuth: "true"
  grid-oib:workosClientId: client_01KEF0YGXCZ6QCJGGBWD7Z266J # pragma: allowlist secret (public OAuth client id)
  grid-oib:enforceFeatureFlags: "false"
  # Agent Skills + Jobs (ADR-0046) stay dark in prod until they have run in

  # staging. Flip to "true" to show the Skills and Jobs tabs and bring the job

  # scheduler up.
  grid-oib:skillsEnabled: "true"
  # Collaboration (ADR-0032…0035) stays dark in prod until it has run in staging.

  grid-oib:collaborationEnabled: "true"
  # ── Observability / OTel Collector + Aspire dashboard (ADR-0029) ──

  # Deployed only when grid-oib:observabilityEnabled (default true) AND every

  # dependency below is set (otelPrimaryApiKey plus the dashboard's Connect

  # application; otel.<baseDomain> is the host); otherwise `pulumi preview`

  # warns and skips the tier.

  # REQUIRED secret:

  #   esc env set matthiasbigl/grid-oib/prod pulumiConfig.grid-oib:otelPrimaryApiKey "$(openssl rand -hex 32)" --secret

  # dashboardImage/collectorImage default to digest-pinned versions in src/config.ts —

  # only override here when deliberately upgrading.

  # Dashboard auth runs on the Gateway against a dedicated WorkOS **Connect**

  # application (ADR-0029 Amendment 2 — the app's own AuthKit client cannot

  # serve this flow). Created by

  # `WORKOS_API_KEY=sk_… npm run provision:workos-env -- --apply` (frontends/ui)

  # with WORKOS_CONNECT_APP_NAME / WORKOS_CONNECT_REDIRECT_URIS set — it

  # matches by name and creates a CONFIDENTIAL OAuth application with callback

  # https://<otelDomain>/oauth2/callback, printing the client id + secret

  # exactly once at creation. Still dashboard-manual: assigning the

  # platform:organizations:view permission under Scopes. Then:

  #   pulumi config set        grid-oib:otelOidcIssuer       https://<tenant>.authkit.app

  #   pulumi config set        grid-oib:otelOidcClientId     client_...

  #   esc env set matthiasbigl/grid-oib/prod pulumiConfig.grid-oib:otelOidcClientSecret <secret> --secret

  # ── err2issue: ERROR telemetry -> GitHub issues (ADR-0031) ──

  # OFF in prod for now — deliberately, not by oversight. Two things must be

  # true before flipping it:

  #   1. `err2issueImage` is digest-pinned. It currently defaults to a moving

  #      `:latest` because upstream publishes no tags; a moving tag on a pod

  #      holding a repo-write token is not a prod posture, and the trivy job in

  #      .github/workflows/security.yml only scans pinned refs.

  #   2. Steady-state error volume is known from dev, so

  #      err2issueMaxNewFingerprintsPerDay is a considered number rather than

  #      the conservative 20 that ships by default.

  # Then:

  #   pulumi config set        grid-oib:err2issueEnabled     true

  #   pulumi config set        grid-oib:err2issueGithubRepo  GRID-check/grid-oib-agent

  #   esc env set matthiasbigl/grid-oib/prod pulumiConfig.grid-oib:err2issueGithubToken ghp_... --secret

  #   pulumi config set        grid-oib:err2issueImage       ghcr.io/matthiasbigl/err2issue@sha256:...
  grid-oib:err2issueEnabled: "false"
  grid-oib:protectDataResources: "true"
  grid-oib:seaweedfsPerOrgBuckets: "true"
  grid-oib:dnsZoneName: piloti.at
  grid-oib:dnsZoneId: 66de14f8d07a729634f5d230418bb907 # pragma: allowlist secret (public zone id, Cloudflare zone Overview page)
  grid-oib:dnsZoneBaseline: "false"
  grid-oib:langfuseInitUserEmail: matthias@bigls.net
  grid-oib:langfuseOrgId: grid
  grid-oib:langfuseProjectId: grid-oib
  grid-oib:otelOidcIssuer: https://prestigious-energy-03.authkit.app
  grid-oib:otelOidcClientId: client_01M0SKKRX0XAQ99AFZ31WNJ6XT # pragma: allowlist secret (public OAuth client id)
