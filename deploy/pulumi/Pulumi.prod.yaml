# Stack configuration for the `prod` stack — TEMPLATE.
#
# Non-secret values are shown with placeholders; edit them for your cluster.
# Secret values are NOT in this file yet — set them with the CLI so they are
# encrypted into this file by the stack's secrets provider:
#
#   cd deploy/pulumi
#   pulumi stack init prod
#   pulumi config set --secret grid-oib:kubeconfig            "$(cat /path/to/kubeconfig)"
#   pulumi config set --secret grid-oib:pgAppPassword         "$(openssl rand -base64 24)"
#   pulumi config set --secret grid-oib:seaweedfsSecretKey    "$(openssl rand -base64 24)"
#   pulumi config set --secret grid-oib:gridInternalApiToken  "$(openssl rand -hex 32)"
#   pulumi config set --secret grid-oib:gridAdminToken        "$(openssl rand -hex 32)"
#   pulumi config set --secret grid-oib:openrouterApiKey      "sk-or-..."
#   pulumi config set --secret grid-oib:tavilyApiKey          "tvly-..."
#   pulumi config set --secret grid-oib:workosApiKey          "sk_live_..."
#   pulumi config set --secret grid-oib:workosCookiePassword  "$(openssl rand -hex 32)"
#   # Encrypts DB-claimed job payloads at rest (they carry the user auth token).
#   # REQUIRED whenever jobExecution=db (the deploy fails closed without it; set
#   # grid-oib:allowPlaintextJobPayloads=true to override for dev/single-node):
#   pulumi config set --secret grid-oib:jobPayloadKek          "$(openssl rand -base64 32)"
#   # Optional (only if using the local BYOK backend):
#   pulumi config set --secret grid-oib:byokLocalKek          "$(openssl rand -base64 32)"
#
# Discover your provider's StorageClass first:  kubectl get storageclass
config:
  grid-oib:namespace: grid

  # ── Images (from the publish-images CI workflow → GHCR) ──
  grid-oib:imageRegistry: ghcr.io/grid-check
  grid-oib:imageTag: latest

  # ── Storage (provider CSI, NVMe/TCP) ──
  # Classes offered by the provider (see `kubectl get storageclass`):
  #   premium         — DEFAULT, 3 storage replicas (use for all durable data)
  #   standard        — 2 replicas
  #   single-replica  — 1 replica (cheapest; no storage-level redundancy)
  # NOTE: `lightbits` is the *VolumeSnapshotClass* name, NOT a StorageClass.
  # All classes reclaim `Delete` — deleting a PVC destroys its data irreversibly.
  grid-oib:storageClass: premium

  # ── Ingress / TLS ──
  grid-oib:appDomain: app.example.com
  grid-oib:s3Domain: s3.example.com
  grid-oib:letsEncryptEmail: ops@example.com
  grid-oib:useStagingIssuer: "true"   # flip to false once DNS + TLS verified
  # The provider ships an unremovable metrics stack, so DON'T install a second.
  grid-oib:installMetricsServer: "false"
  # After the first deploy, read the Envoy LoadBalancer's external IP
  # (`kubectl -n envoy-gateway-system get svc`) and pin it here so DNS keeps
  # pointing at the same address across any Gateway re-creation (the provider
  # reserves a released IP for 14 days and reclaims it via this annotation):
  # grid-oib:loadBalancerIp: "203.0.113.10"
  # NetworkPolicies (default-deny ingress + least-privilege allows) are ON by
  # default. Set false only if a validation pass shows they block required
  # traffic on your cluster. Egress is left open (see network-policies.ts).
  # grid-oib:networkPolicies: "true"

  # ── Postgres (CloudNativePG) ──
  grid-oib:pgInstances: "3"           # HA: 1 primary + 2 streaming replicas
  grid-oib:pgStorageSize: 20Gi
  # Continuous WAL archiving + nightly base backups to SeaweedFS (PITR). This is
  # the only recovery path from the provider's `Delete` reclaim policy, so it is
  # ON in prod. The grid-pg-backups bucket is auto-created.
  grid-oib:pgBackupsEnabled: "true"
  grid-oib:pgBackupRetention: 30d
  grid-oib:pgBackupSchedule: "0 0 2 * * *"   # 6-field (sec min hour …): 02:00 daily

  # ── SeaweedFS ──
  # Pin the storage engine in prod: the provider replaces nodes on ITS schedule,
  # and an unpinned tag would re-pull whatever SeaweedFS shipped that day —
  # surprise storage-engine upgrades are the one class of update you want to
  # control. 3.80 is the compose-proven version; bump deliberately.
  grid-oib:seaweedfsImage: chrislusf/seaweedfs:3.80
  grid-oib:seaweedfsStorageSize: 20Gi
  grid-oib:seaweedfsBucket: grid-documents
  grid-oib:seaweedfsAccessKey: grid

  # ── Shared Chroma vector store (horizontal scaling) ──
  # true = one shared Chroma server all agent replicas/workers use (unpins
  # vectors from a single pod). false = embedded per-pod Chroma (single agent).
  grid-oib:chromaEnabled: "true"
  grid-oib:chromaStorageSize: 20Gi

  # ── Agent (backend) — vertical scaling levers ──
  grid-oib:backendRequestsCpu: "1"
  grid-oib:backendRequestsMemory: 2Gi
  grid-oib:backendLimitsCpu: "4"
  grid-oib:backendLimitsMemory: 8Gi
  grid-oib:backendDaskWorkers: "1"
  grid-oib:backendDaskThreads: "4"
  grid-oib:backendMaxActiveJobs: "8"
  grid-oib:backendMaxActiveJobsPerOrg: "3"
  grid-oib:backendIngestMaxWorkers: "2"
  grid-oib:backendDataStorageSize: 20Gi

  # ── Research execution (ADR-0021) ──
  # "dask" = per-pod cluster (agent is a singleton). "db" = DB-claimed workers:
  # web tier runs no Dask and dedicated agent-worker replicas execute research
  # jobs, scaling the token-heavy workload horizontally. Requires chromaEnabled.
  grid-oib:jobExecution: db
  grid-oib:agentWorkerMinReplicas: "2"
  grid-oib:agentWorkerMaxReplicas: "8"
  grid-oib:agentWorkerConcurrency: "1"
  # Chat/web replicas. Safe at >1 via conversation affinity (the frontend WS
  # proxy pins each conversation to its owning replica — ADR-0028).
  grid-oib:backendReplicas: "2"

  # ── Frontend (horizontal) ──
  grid-oib:frontendMinReplicas: "2"
  grid-oib:frontendMaxReplicas: "6"

  # ── Auth / platform ──
  grid-oib:requireAuth: "true"
  grid-oib:workosClientId: client_REPLACE_ME
  grid-oib:enforceFeatureFlags: "false"
  grid-oib:workflowsEnabled: "false"
