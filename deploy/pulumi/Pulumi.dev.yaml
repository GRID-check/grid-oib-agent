# Stack configuration for the `dev` (staging) stack.
#
# Deployed automatically from the `develop` branch by .github/workflows/deploy.yml
# once CI + Security are green. Secret values are ciphertext, encrypted by the
# stack's Pulumi-Cloud-managed key (safe to commit; only holders of stack access
# can decrypt). To re-create a stack from scratch:
#
#   cd deploy/pulumi
#   pulumi stack init matthiasbigl/grid-oib/dev          # Pulumi Cloud backend
#   pulumi config set --secret grid-oib:kubeconfig            "$(cat /path/to/kubeconfig)"
#   pulumi config set --secret grid-oib:pgAppPassword         "$(openssl rand -base64 24)"
#   pulumi config set --secret grid-oib:seaweedfsSecretKey    "$(openssl rand -base64 24)"
#   pulumi config set --secret grid-oib:gridInternalApiToken  "$(openssl rand -hex 32)"
#   pulumi config set --secret grid-oib:gridAdminToken        "$(openssl rand -hex 32)"
#   pulumi config set --secret grid-oib:openrouterApiKey      "sk-or-..."
#   pulumi config set --secret grid-oib:tavilyApiKey          "tvly-..."
#   pulumi config set --secret grid-oib:workosApiKey          "sk_test_..."
#   pulumi config set --secret grid-oib:workosCookiePassword  "$(openssl rand -hex 32)"
#   pulumi config set --secret grid-oib:jobPayloadKek         "$(openssl rand -base64 32)"
#   pulumi config set grid-oib:registryUsername               "<ghcr user>"   # private images only
#   pulumi config set --secret grid-oib:registryPassword      "<token w/ read:packages>"
#
# Staging is intentionally lighter than prod (single replicas, smaller volumes).
config:
  grid-oib:namespace: grid
  # ── Images (GHCR) ──
  grid-oib:imageRegistry: ghcr.io/grid-check
  grid-oib:imageTag: latest
  # ── Storage (provider CSI, NVMe/TCP) ──

  # Classes: premium (default, 3 replicas) / standard (2) / single-replica (1).

  # `lightbits` is the VolumeSnapshotClass, not a StorageClass. All reclaim

  # `Delete` (PVC delete = data gone). Staging can use the cheaper single-replica.
  grid-oib:storageClass: single-replica
  # ── Ingress / TLS ── One key moves every public host: app./s3./otel. derive
  # from baseDomain (per-host appDomain/s3Domain/otelDomain keys remain as overrides).
  grid-oib:baseDomain: dev.piloti.at
  grid-oib:letsEncryptEmail: matthias@bigls.net
  grid-oib:useStagingIssuer: "false" # staging CA verified; prod LE certs now issue
  # Provider ships an unremovable metrics stack — don't install a second one.

  grid-oib:installMetricsServer: "false"
  # ── Postgres ──
  grid-oib:pgInstances: "1"
  grid-oib:pgStorageSize: 10Gi
  # ── SeaweedFS ──
  grid-oib:seaweedfsStorageSize: 10Gi
  grid-oib:seaweedfsBucket: grid-documents
  grid-oib:seaweedfsAccessKey: grid
  # ── Shared Chroma ──
  grid-oib:chromaEnabled: "true"
  grid-oib:chromaStorageSize: 10Gi
  # ── Agent (smaller on staging) ──
  grid-oib:backendRequestsCpu: "500m"
  grid-oib:backendRequestsMemory: 1Gi
  grid-oib:backendLimitsCpu: "2"
  grid-oib:backendLimitsMemory: 4Gi
  grid-oib:backendDaskWorkers: "1"
  grid-oib:backendDaskThreads: "2"
  grid-oib:backendMaxActiveJobs: "4"
  grid-oib:backendMaxActiveJobsPerOrg: "2"
  grid-oib:backendIngestMaxWorkers: "2"
  grid-oib:backendDataStorageSize: 10Gi
  # ── Research execution ──
  grid-oib:jobExecution: db
  grid-oib:agentWorkerMinReplicas: "1"
  grid-oib:agentWorkerMaxReplicas: "3"
  grid-oib:agentWorkerConcurrency: "1"
  # Drain budget for in-flight research jobs on shutdown (see Pulumi.prod.yaml).
  # Shorter on staging: faster deploys matter more than saving a staging job.
  grid-oib:agentWorkerDrainSeconds: "180"
  # Staging is meant to be re-creatable, so the data resources are NOT protected
  # here — `pulumi destroy` must work without a manual unprotect. Prod keeps the
  # default (true).
  grid-oib:protectDataResources: "false"
  grid-oib:backendReplicas: "1"
  # ── Frontend ──
  grid-oib:frontendMinReplicas: "1"
  grid-oib:frontendMaxReplicas: "3"
  # ── Auth / platform ──
  grid-oib:requireAuth: "true"
  grid-oib:workosClientId: client_01KEF0YGNPX7S4SF952ZX46V1K  # pragma: allowlist secret (public OAuth client id)
  grid-oib:enforceFeatureFlags: "false"
  grid-oib:workflowsEnabled: "true"
  grid-oib:kubeconfig:
    secure: 
  grid-oib:pgAppPassword:
    secure: AAABACnXc43NKLd9CCOX6hr+yeu4axn4yeeLe2FPoLF43BTysecDrT7rzupBXbAvLYUcUCEOOexvQHPLpc1CSw==
  grid-oib:seaweedfsSecretKey:
    secure: AAABALGn13j5irEYeN/66neWZZ85MnUMGAmLGi3yJzMk70EOOOvRCKLOpLqaFuRvmWIKOejit4BKHa5ncPlVhA==
  grid-oib:gridInternalApiToken:
