# =============================================================================
# AI-Q Blueprint - Docker Compose
# =============================================================================
#
# Services:
#   aiq-agent - Backend API server
#   frontend               - Next.js UI (aiq-blueprint-ui)
#   postgres               - PostgreSQL for jobs and checkpoints
#
# Build targets (backend only):
#   dev     - Development build (includes CLI)
#   release - Production build (web only, validates env vars)
#
# Usage:
#   # Build locally (default)
#   cd deploy/compose
#   docker compose --env-file ../.env -f docker-compose.yaml up -d --build
#   BUILD_TARGET=release docker compose --env-file ../.env -f docker-compose.yaml up -d --build
#
#   # Use pre-built images from registry (skip --build)
#   BACKEND_IMAGE=nvcr.io/nvidia/blueprint/aiq-agent:2.0.0 \
#   FRONTEND_IMAGE=nvcr.io/nvidia/blueprint/aiq-frontend:2.0.0 \
#   docker compose --env-file ../.env -f docker-compose.yaml up -d
#
# Frontend image:
#   The frontend is built from frontends/ui/Dockerfile.
#
# =============================================================================

services:
  aiq-agent:
    image: ${BACKEND_IMAGE:-nvcr.io/nvidia/blueprint/aiq-agent:2.0.0}
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
      target: ${BUILD_TARGET:-release}
    container_name: aiq-agent
    env_file:
      - ../.env
    environment:
      - APP_ENV=${APP_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Database config (with Docker defaults)
      - NAT_JOB_STORE_DB_URL=${NAT_JOB_STORE_DB_URL:-postgresql+asyncpg://aiq:aiq_dev@postgres:5432/aiq_jobs}
      - AIQ_CHECKPOINT_DB=${AIQ_CHECKPOINT_DB:-postgresql://aiq:aiq_dev@postgres:5432/aiq_checkpoints}
      - AIQ_SUMMARY_DB=${AIQ_SUMMARY_DB:-postgresql+psycopg://aiq:aiq_dev@postgres:5432/aiq_jobs}
      # SSE LISTEN/NOTIFY needs a direct Postgres session; set explicitly so a
      # future PgBouncer in front of the pooled DSNs never breaks job streams.
      - AIQ_LISTEN_DB_URL=${AIQ_LISTEN_DB_URL:-postgresql://aiq:aiq_dev@postgres:5432/aiq_jobs}
      # Shared cache (Dragonfly, ADR-0020): citation-registry snapshots and
      # cross-replica caches. Unset = per-process in-memory fallback.
      - REDIS_URL=${REDIS_URL:-redis://dragonfly:6379/0}
      # Project Memory: the `remember` tool writes via the frontend's internal
      # API (single-writer separation — the backend never touches grid_app).
      - FRONTEND_INTERNAL_URL=${FRONTEND_INTERNAL_URL:-http://frontend:3000}
      - GRID_INTERNAL_API_TOKEN=${GRID_INTERNAL_API_TOKEN:-grid-internal-dev-token}
      # LlamaIndex persistence (used by config_web_default_llamaindex.yml)
      - AIQ_CHROMA_DIR=${AIQ_CHROMA_DIR:-/app/data/chroma_data}
      # Server config
      # Grid OIB config (default)
      - CONFIG_FILE=${BACKEND_CONFIG:-/app/configs/config_oib_openrouter.yml}
      - HOST=0.0.0.0
      - PORT=8000
      # RAG config
      # - RAG_SERVER_URL=${RAG_SERVER_URL:-https://rag-backend}
      # - RAG_INGEST_URL=${RAG_INGEST_URL:-https://rag-ingest}
      # Dask worker config
      - DASK_NWORKERS=${DASK_NWORKERS:-1}
      - DASK_NTHREADS=${DASK_NTHREADS:-4}
      # Optional: bound per-worker memory (Dask spills/restarts above this)
      # - DASK_MEMORY_LIMIT=${DASK_MEMORY_LIMIT:-}
      # Optional: recycle workers after this many seconds to drop accumulated state
      # - DASK_LIFETIME=${DASK_LIFETIME:-}
      # Optional (default true): set to "false" to let workers exit gracefully without respawning
      # - DASK_LIFETIME_RESTART=${DASK_LIFETIME_RESTART:-}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ../../configs:/app/configs:ro
      - ../../data/oib:/app/data/oib:ro
      - aiq-data:/app/data
      - chroma_data:/app/data/chroma_data
    networks:
      - aiq-network
    depends_on:
      aiq-data-permissions:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # service_started, NOT service_healthy: the cache is optional by design
      # (fail-open in both tiers) and must never block the stack.
      dragonfly:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  aiq-data-permissions:
    image: alpine:3.20
    command: ["sh", "-c", "chown -R 1000:1000 /app/data"]
    volumes:
      - aiq-data:/app/data
      - chroma_data:/app/data/chroma_data
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2024-06-29T01-20-47Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aiq-network
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb local/grid-documents --ignore-existing
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - aiq-network

  frontend:
    image: ${FRONTEND_IMAGE:-nvcr.io/nvidia/blueprint/aiq-frontend:2.0.0}
    build:
      context: ../../frontends/ui
      dockerfile: deploy/Dockerfile
    container_name: aiq-blueprint-ui
    environment:
      - REQUIRE_AUTH=${REQUIRE_AUTH:-false}
      # APP_ENV lets the internal memory route distinguish dev from prod: the
      # well-known dev default GRID_INTERNAL_API_TOKEN is only accepted when
      # APP_ENV is development/dev/local (NODE_ENV is always 'production' in
      # the built image, so it cannot be used for this).
      - APP_ENV=${APP_ENV:-production}
      - BACKEND_URL=${BACKEND_URL:-http://aiq-agent:8000}
      - GRID_APP_DATABASE_URL=${GRID_APP_DATABASE_URL:-postgresql://aiq:aiq_dev@postgres:5432/grid_app}
      # Shared service token for the internal memory endpoint (must match aiq-agent)
      - GRID_INTERNAL_API_TOKEN=${GRID_INTERNAL_API_TOKEN:-grid-internal-dev-token}
      # Admin token for the backend's /v1/admin/oib/* endpoints (must match
      # aiq-agent). Powers the platform-owner base-knowledge management UI.
      - GRID_ADMIN_TOKEN=${GRID_ADMIN_TOKEN:-}
      - WORKOS_CLIENT_ID=${WORKOS_CLIENT_ID}
      - WORKOS_API_KEY=${WORKOS_API_KEY}
      - NEXT_PUBLIC_WORKOS_REDIRECT_URI=${NEXT_PUBLIC_WORKOS_REDIRECT_URI:-${WORKOS_REDIRECT_URI:-http://localhost:3000/api/auth/callback}}
      - WORKOS_COOKIE_PASSWORD=${WORKOS_COOKIE_PASSWORD}
      # BYOK LLM credentials (ADR-0022): secret backend for tenant API keys.
      # Default: WorkOS Vault when WORKOS_API_KEY is set, else local AES-GCM
      # under GRID_BYOK_LOCAL_KEK (32 bytes, base64).
      - GRID_BYOK_SECRET_BACKEND=${GRID_BYOK_SECRET_BACKEND:-}
      - GRID_BYOK_LOCAL_KEK=${GRID_BYOK_LOCAL_KEK:-}
      - GRID_BYOK_ALLOW_PRIVATE_BASE_URLS=${GRID_BYOK_ALLOW_PRIVATE_BASE_URLS:-false}
      - FILE_UPLOAD_ACCEPTED_TYPES=${FILE_UPLOAD_ACCEPTED_TYPES:-.pdf,.docx,.txt,.md}
      - FILE_UPLOAD_MAX_SIZE_MB=${FILE_UPLOAD_MAX_SIZE_MB:-}
      - FILE_UPLOAD_MAX_FILE_COUNT=${FILE_UPLOAD_MAX_FILE_COUNT:-}
      - FILE_EXPIRATION_CHECK_INTERVAL_HOURS=${FILE_EXPIRATION_CHECK_INTERVAL_HOURS:-}
      - MINIO_ENDPOINT=http://minio:9000
      # Browser-reachable endpoint used ONLY to sign presigned URLs handed to the
      # browser (PDF preview/download). Must be a host the browser can resolve --
      # the internal `minio` hostname above is not. Defaults to the published
      # localhost port for local dev; set to your public MinIO/S3 URL in prod.
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=grid-documents
      - MINIO_PRESIGNED_URL_TTL_SECONDS=600
      - PROJECT_PURGE_GRACE_DAYS=${PROJECT_PURGE_GRACE_DAYS:-7}
      # OpenRouter model catalog for the org model-config picker/validation.
      # The catalog endpoint works unauthenticated; the key (same one the
      # backend uses) scopes the listing to account availability when set.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Euros per 1 USD for comparing EUR budget limits against the USD costs
      # OpenRouter reports (docs/architecture/usage-budgets.md).
      - GRID_BUDGET_EUR_PER_USD=${GRID_BUDGET_EUR_PER_USD:-0.86}
      # Platform tier (ADR-0016): break-glass owner bootstrap, platform-org
      # external id override, and the self-serve org creation gate.
      - GRID_PLATFORM_OWNER_EMAILS=${GRID_PLATFORM_OWNER_EMAILS:-}
      - GRID_PLATFORM_ORG_EXTERNAL_ID=${GRID_PLATFORM_ORG_EXTERNAL_ID:-grid-platform}
      - GRID_DISABLE_SELF_SERVE_ORGS=${GRID_DISABLE_SELF_SERVE_ORGS:-false}
      # Shared cache (Dragonfly, ADR-0020): read-through caches (membership,
      # flags, prompt view, model overrides, budget limits, model catalog) and
      # the WS-upgrade rate limiter. Unset = per-process in-memory fallback.
      - REDIS_URL=${REDIS_URL:-redis://dragonfly:6379/0}
      - GRID_WS_UPGRADE_RATE_LIMIT=${GRID_WS_UPGRADE_RATE_LIMIT:-30}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - aiq-network
    depends_on:
      aiq-agent:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # Liveness for the frontend web server. Hits the dependency-free
    # /api/healthz (not `/`, a full SSR render, and not /api/health, which
    # proxies the backend). start_period covers the drizzle-kit migrate that
    # runs before the server starts listening.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/healthz"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M
    restart: unless-stopped

  purger:
    image: ${FRONTEND_IMAGE:-nvcr.io/nvidia/blueprint/aiq-frontend:2.0.0}
    build:
      context: ../../frontends/ui
      dockerfile: deploy/Dockerfile
    container_name: grid-purger
    command: ["node", "purger/index.js"]
    environment:
      - GRID_APP_DATABASE_URL=${GRID_APP_DATABASE_URL:-postgresql://aiq:aiq_dev@postgres:5432/grid_app}
      - BACKEND_URL=${BACKEND_URL:-http://aiq-agent:8000}
      - GRID_INTERNAL_API_TOKEN=${GRID_INTERNAL_API_TOKEN:-grid-internal-dev-token}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=grid-documents
      - WORKOS_API_KEY=${WORKOS_API_KEY}
      - PURGER_POLL_INTERVAL_MS=${PURGER_POLL_INTERVAL_MS:-60000}
    networks:
      - aiq-network
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      aiq-agent:
        condition: service_healthy
    restart: unless-stopped

  dragonfly:
    # Redis-protocol shared cache (ADR-0020). Cache semantics only: every
    # value is reconstructible (read-through caches, rate-limit counters,
    # citation snapshots), so no persistence volume — cache_mode evicts under
    # memory pressure instead of failing writes.
    # --force_epoll: Dragonfly defaults to io_uring and CRASHES on boot where
    # the kernel/seccomp denies it (common on VPS/managed Docker hosts);
    # epoll is universally available and far above our throughput needs.
    image: dragonflydb/dragonfly:v1.27.1
    container_name: aiq-dragonfly
    command:
      [
        "dragonfly",
        "--logtostderr",
        "--force_epoll",
        "--proactor_threads=2",
        "--maxmemory=256mb",
        "--cache_mode=true",
        "--dbfilename=",
      ]
    ulimits:
      memlock: -1
    networks:
      - aiq-network
    # Observability only — nothing depends_on this being healthy: both app
    # tiers fail open to in-process caches (ADR-0020), so a broken cache must
    # never block a deployment.
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6379 ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: aiq-postgres
    environment:
      POSTGRES_USER: aiq
      POSTGRES_PASSWORD: aiq_dev
      POSTGRES_DB: aiq_jobs
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - aiq-network
    stdin_open: true
    tty: true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiq -d aiq_jobs && pg_isready -U aiq -d aiq_checkpoints && pg_isready -U aiq -d grid_app"]
      interval: 5s
      timeout: 5s
      retries: 5
      # Crash recovery (fsync of the data dir) can take >1 min on slow disks;
      # without a start_period the stack fails with "postgres is unhealthy".
      start_period: 120s
    restart: unless-stopped

volumes:
  aiq-data:
    driver: local
  chroma_data:
    driver: local
  minio-data:
    driver: local
  postgres-data:
    driver: local

networks:
  aiq-network:
    driver: bridge
