# clamd for the malware scanner (ADR-0133). One file for both deploy paths:
# Compose mounts it, and Pulumi (deploy/pulumi/src/app/clamav.ts) reads it into
# a ConfigMap, so the two cannot drift.
#
# The scanner fails closed (ADR-0133). Every setting below that is not a
# default closes a way clamd would otherwise answer `OK` for a file it did not
# fully inspect. The BFF client (frontends/ui/src/lib/malware-scan/) maps the
# answers: `stream: OK` is clean, `Heuristics.Limits.Exceeded.*` is a failed
# scan, any other `FOUND` is infected, and everything else is a failed scan.

# --- Process --------------------------------------------------------------
# In the foreground, logging to stderr for the container runtime. `User` drops
# root where the image's entrypoint starts clamd as root (Compose); the
# Kubernetes pod already runs as `clamav`, where clamd ignores it.
Foreground yes
User clamav
LogTime yes
LogClean no
LogVerbose no
# Keep the reply `stream: <name> FOUND`; extended info appends a hash and size.
ExtendedDetectionInfo no

# --- Network --------------------------------------------------------------
# TCP only; the NetworkPolicy `clamav-bff-only` (Pulumi) or the Compose network
# decides who may connect. clamd itself authenticates nobody.
TCPSocket 3310
TCPAddr 0.0.0.0
MaxConnectionQueueLength 30
MaxThreads 8
# Seconds a client may stay silent mid-stream, and before its command.
ReadTimeout 120
CommandReadTimeout 30
IdleTimeout 60

# --- Signatures -----------------------------------------------------------
# freshclam writes here; clamd checks for a newer database every 10 minutes
# and loads it beside the old one, so scans continue during a reload.
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
SelfCheck 600
ConcurrentDatabaseReload yes

# --- What is scanned ------------------------------------------------------
# The raw message is streamed whole: clamd decodes the MIME parts and unpacks
# archives itself.
ScanMail yes
ScanArchive yes
ScanPDF yes
ScanOLE2 yes
ScanHTML yes
ScanPE yes
ScanELF yes
Bytecode yes

# --- Alerts instead of silent OKs (RT-S4) ---------------------------------
# Without these, a file over a limit, an encrypted archive or document, or a
# macro document comes back `OK`.
HeuristicAlerts yes
# A signature match wins over a heuristic one: a real virus inside an
# encrypted or oversized container is reported by its name.
HeuristicScanPrecedence no
AlertExceedsMax yes
AlertEncrypted yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
AlertOLE2Macros yes
AlertBrokenExecutables yes

# --- Limits ---------------------------------------------------------------
# A stream over 30 MiB is refused (`INSTREAM size limit exceeded`): the
# largest raw message the webhook accepts is 26 MiB. The rest are clamd's
# defaults, written down so a release that moves them cannot loosen them
# unseen. Exceeding any of them is an alert (AlertExceedsMax), never an OK.
StreamMaxLength 30M
MaxScanTime 120000
MaxScanSize 400M
MaxFileSize 100M
MaxRecursion 17
MaxFiles 10000
