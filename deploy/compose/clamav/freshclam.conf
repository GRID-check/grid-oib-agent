# freshclam for the malware scanner (ADR-0133). Mounted by Compose and read
# into the ConfigMap by Pulumi (deploy/pulumi/src/app/clamav.ts), beside
# clamd.conf.
#
# Signatures that stop updating are refused, not trusted: the BFF answers
# `failed` for every scan once the loaded database is older than 48 hours, and
# the clamd container's readiness probe fails at the same age.
Foreground yes
LogTime yes
DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
DatabaseMirror database.clamav.net
ScriptedUpdates yes
# Twelve checks a day. ClamAV's CDN rate-limits clients that ask more often.
Checks 12
# Tell clamd to load a new database at once rather than at its next SelfCheck.
NotifyClamd /etc/clamav/clamd.conf
