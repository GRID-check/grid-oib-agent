[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=83.0.0", "setuptools-scm>=10.2.1"]

[tool.setuptools]
packages = ["duckduckgo_news_search"]
package-dir = {"duckduckgo_news_search" = "src"}

[project]
name = "duckduckgo-news-search"
version = "1.0.0"
description = "NAT-based DuckDuckGo news search tool using ddgs"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
dependencies = [
    "ddgs>=9.14.4,<10",
    "pydantic>=2.0.0",
]

[project.entry-points."nat.plugins"]
duckduckgo_news_search = "duckduckgo_news_search.register"
