[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=83.0.0", "setuptools-scm>=10.2.1"]

[tool.setuptools]
# `ris_adapter.lookup` is a package of its own (one module per pipeline stage);
# an explicit `packages` list does not recurse, so it is named here too.
packages = ["ris_adapter", "ris_adapter.lookup"]
package-dir = {"ris_adapter" = "src"}

[project]
name = "ris-adapter"
version = "1.0.0"
description = "NAT tools for the Austrian OGD-RIS API: search law/case law and fetch entire documents on demand"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = {text = "Apache-2.0"}
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "beautifulsoup4>=4.12.0",
]

[project.entry-points."nat.plugins"]
ris_adapter = "ris_adapter.register"
