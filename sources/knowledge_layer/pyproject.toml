[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 64", "setuptools-scm>=10.2.1"]

[tool.setuptools]
packages = ["knowledge_layer", "knowledge_layer.llamaindex", "knowledge_layer.foundational_rag"]
package-dir = {"knowledge_layer" = "src"}

[project]
name = "knowledge-layer"
version = "1.0.0"
description = "NAT-based Knowledge Layer - pluggable document ingestion and retrieval"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    # src/view_image.py imports boto3 lazily to fetch image bytes from
    # SeaweedFS. It was reaching us only as a transitive of langchain-aws, so
    # the one S3 code path in the Python tier would have vanished the day an
    # unrelated LLM provider dependency was dropped.
    "boto3>=1.34",
]

[project.optional-dependencies]
llamaindex = [
    "llama-index>=0.14.23",
    "llama-index-embeddings-nvidia>=0.1.0",
    "llama-index-vector-stores-chroma>=0.1.0",
    "chromadb>=0.4.0",
    "pdfplumber>=0.11.10",
    "pypdfium2>=5.12.1",
    "Pillow>=9.0.0",
    "openai>=2.45.0",
    "docx2txt>=0.8",
]
foundational_rag = [
    "requests>=2.28.0",
    "urllib3>=2.7.0,<3",
    "docx2txt>=0.8",
    "python-pptx>=0.6.21",
]
all = [
    "knowledge-layer[llamaindex,foundational_rag]",
]

[project.entry-points."nat.plugins"]
knowledge_layer = "knowledge_layer.register"
