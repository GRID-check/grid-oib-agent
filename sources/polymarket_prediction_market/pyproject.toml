[build-system]
build-backend = "setuptools>=83.0.0"
requires = ["setuptools >= 64", "setuptools-scm>=10.2.1"]

[tool.setuptools]
packages = ["polymarket_prediction_market"]
package-dir = {"polymarket_prediction_market" = "src"}

[project]
name = "polymarket-prediction-market"
version = "1.0.0"
description = "NAT-based Polymarket prediction market search tool"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.entry-points."nat.plugins"]
polymarket_prediction_market = "polymarket_prediction_market.register"
