[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=83.0.0", "setuptools-scm>=10.2.1"]

[tool.setuptools]
packages = ["exa_web_search"]
package-dir = {"exa_web_search" = "src"}

[project]
name = "exa-web-search"
version = "1.0.0"
description = "NAT-based Exa web search tool"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
dependencies = [
    "pydantic>=2.0.0",
    "langchain-exa>=1.1.0",
]

[project.entry-points."nat.plugins"]
exa_web_search = "exa_web_search.register"
