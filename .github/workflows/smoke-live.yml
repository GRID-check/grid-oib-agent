name: Smoke (live agent)

# What a reader does, through what a reader reaches: the backend served the way
# the container serves it (deploy/start_web.py, the real config, prompt, model
# through OpenRouter, and tools), driven over the chat socket the way the UI
# drives it. It asks "Was weißt du über die OIB-Richtlinie 2?" and reads the
# answer, then asks again and cancels that turn mid-answer with a follow-up. It
# fails on any log record at ERROR or CRITICAL from the first question on, a
# traceback, an unawaited coroutine, no answer, or a follow-up that never
# completed: the records the collector forwards to err2issue, caught before
# they ship instead of after. scripts/turn_census/smoke.py; `task be:smoke`
# locally.
#
# Why this exists: every issue err2issue filed in September 2026 lived in a seam
# the unit suites fake (a tool schema the model's arguments did not fit, a reply
# shape a parser did not expect, a payload a dependency could not read, a
# workflow that did not build, the teardown of a cancelled turn), and each one
# logged at ERROR. Against the socket handler before #769 this smoke fails on a
# hundred-odd "Task exception was never retrieved" from the cancelled turn,
# which a smoke on `nat run` never reaches.
#
# The OIB corpus comes from staging: an admin uploads and syncs it in
# Platform → Knowledge, and corpus-snapshot.yml mirrors it into the private
# snapshot ghcr.io/<owner>/grid-oib-corpus (scripts/corpus_snapshot.py). This job
# only restores that snapshot and never publishes. The sync after the restore is
# a no-op unless the chunk format changed, so a pull request that changes it
# pays for its own re-ingest and leaves the shared snapshot alone. With a corpus
# the answer itself is checked too: no canned non-answer, a [KB] source, and
# about Brandschutz. Without one only the ERROR gate runs, and the log says so,
# until a snapshot is published: from then on a missing corpus fails the job.
#
# Costs about two model turns per run. On a pull request it runs only for the paths
# that change what the agent does. It skips (with a notice) only where GitHub
# withholds secrets, a fork or Dependabot; anywhere else a missing key fails
# the job. The weekly turn-shapes eval failed three weeks running on that same
# missing secret, which is what a skip-as-success would have hidden here.

on:
  pull_request:
    paths:
      - "src/**"
      - "sources/**"
      - "configs/**"
      - "frontends/aiq_api/**"
      - "deploy/start_web.py"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/turn_census/**"
      - "scripts/corpus_snapshot.py"
      - "Taskfile.yml"
      - ".github/workflows/smoke-live.yml"
  push:
    branches: [develop]
    paths:
      - "src/**"
      - "sources/**"
      - "configs/**"
      - "frontends/aiq_api/**"
      - "deploy/start_web.py"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/turn_census/**"
      - "scripts/corpus_snapshot.py"
      - "Taskfile.yml"
      - ".github/workflows/smoke-live.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read # the corpus snapshot corpus-snapshot.yml publishes

concurrency:
  group: smoke-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: OIB-2 question, no ERROR logged
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AIQ_CHROMA_DIR: ${{ github.workspace }}/.corpus-chroma
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.14"
      - uses: ./.github/actions/setup-task
      - name: Require the model key
        id: key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # GitHub withholds secrets from exactly these two; anywhere else an
          # empty key means the secret is missing, and a smoke that passes by
          # not running is the silent failure this job exists to prevent.
          SECRETS_WITHHELD: ${{ github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]' }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "$SECRETS_WITHHELD" = "true" ]; then
            echo "::notice::GitHub withholds secrets from this pull request (a fork or Dependabot); the smoke did not run."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::OPENROUTER_API_KEY is not set; the smoke would not run. See the header of this workflow."
            exit 1
          fi
      - uses: oras-project/setup-oras@v1
        if: ${{ steps.key.outputs.present == 'true' }}
      - name: Restore the ingested corpus
        id: corpus
        if: ${{ steps.key.outputs.present == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          .venv/bin/python scripts/corpus_snapshot.py pull --repository "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/grid-oib-corpus"
          if ls data/oib/*.pdf data/oib_uploads/*.pdf > /dev/null 2>&1; then
            # A no-op when the snapshot matches this branch's chunk format;
            # a full re-ingest, for this run only, when it does not.
            .venv/bin/python -c "from aiq_agent import oib_sync; print('sync', oib_sync.sync())"
          fi
          # Once a snapshot is published, the smoke requires the corpus: a
          # restore that silently failed must not pass as "only the ERROR gate
          # ran". GHCR says "denied" alike for a missing package and a refused
          # login, so whether one exists is asked of the packages API instead.
          if gh api --silent "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/grid-oib-corpus"; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No corpus snapshot published yet: run 'Corpus snapshot from staging' once the corpus is uploaded there. Only the ERROR gate runs."
          fi
      - name: Smoke
        if: ${{ steps.key.outputs.present == 'true' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REQUIRE_CORPUS: ${{ steps.corpus.outputs.required }}
        run: |
          args=(--out "$RUNNER_TEMP/smoke")
          if [ "$REQUIRE_CORPUS" = "true" ]; then args+=(--require-corpus); fi
          task be:smoke -- "${args[@]}"
      - name: Keep the run's log
        if: ${{ always() && steps.key.outputs.present == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: smoke-log
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
