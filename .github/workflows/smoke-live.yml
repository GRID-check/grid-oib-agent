name: Smoke (live agent)

# One real question — "Was weißt du über die OIB-Richtlinie 2?" — through the
# shipped workflow with `nat run`: the real config, prompt, model (through
# OpenRouter) and tools, including the post-answer stages. It fails on any log
# record at ERROR or CRITICAL, a traceback, an unawaited coroutine, or no
# answer: the records the collector forwards to err2issue, caught before they
# ship instead of after. scripts/turn_census/smoke.py; `task be:smoke` locally.
#
# Why this exists: every issue err2issue filed in September 2026 lived in a seam
# the unit suites fake (a tool schema the model's arguments did not fit, a reply
# shape a parser did not expect, a payload a dependency could not read, a
# workflow that did not build), and each one logged at ERROR. Run against
# develop before this branch, this smoke fails on an unawaited coroutine per
# trace event; on the branch it passes.
#
# The OIB corpus is operator-provided and not in git (data/oib/README.md), and
# ingesting it costs embedding and summary calls. So it is ingested once and
# reused: scripts/corpus_snapshot.py keeps the ingested state (PDFs, vectors,
# summaries, registry) as a private OCI artifact, ghcr.io/<owner>/grid-oib-corpus,
# tagged by oib_sync.CHUNK_FORMAT_VERSION. Every run restores it; the sync after
# that is a no-op unless a PDF or the chunk format changed, and only then costs
# anything. Runs on develop (and dispatches) publish a snapshot the sync
# changed; a pull request never does, so a branch that changes the chunk format
# pays for its own re-ingest without replacing the shared one.
#
# The first snapshot needs the PDFs once, either from `task be:corpus:push`
# on a machine that has them ingested, or from the repository secret
# OIB_CORPUS_URL (a .tar.gz of the PDFs, named as oib.or.at publishes them) on a
# develop run. With a corpus the answer itself is checked too: not "nothing
# found", and about Brandschutz. Without one only the ERROR gate runs, and the
# log says so.
#
# Costs one model turn per run. On a pull request it runs only for the paths
# that change what the agent does. It skips (with a notice) only where GitHub
# withholds secrets, a fork or Dependabot; anywhere else a missing key fails
# the job. The weekly turn-shapes eval failed three weeks running on that same
# missing secret, which is what a skip-as-success would have hidden here.

on:
  pull_request:
    paths:
      - "src/**"
      - "sources/**"
      - "configs/**"
      - "frontends/aiq_api/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/turn_census/**"
      - "scripts/corpus_snapshot.py"
      - ".github/workflows/smoke-live.yml"
  push:
    branches: [develop]
    paths:
      - "src/**"
      - "sources/**"
      - "configs/**"
      - "frontends/aiq_api/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read
  packages: write # the corpus snapshot; pushed only outside pull requests

concurrency:
  group: smoke-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: OIB-2 question, no ERROR logged
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AIQ_CHROMA_DIR: ${{ github.workspace }}/.corpus-chroma
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.14"
      - uses: ./.github/actions/setup-task
      - name: Require the model key
        id: key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # GitHub withholds secrets from exactly these two; anywhere else an
          # empty key means the secret is missing, and a smoke that passes by
          # not running is the silent failure this job exists to prevent.
          SECRETS_WITHHELD: ${{ github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]' }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "$SECRETS_WITHHELD" = "true" ]; then
            echo "::notice::GitHub withholds secrets from this pull request (a fork or Dependabot); the smoke did not run."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::OPENROUTER_API_KEY is not set; the smoke would not run. See the header of this workflow."
            exit 1
          fi
      - uses: oras-project/setup-oras@v1
        if: ${{ steps.key.outputs.present == 'true' }}
      - name: Restore the ingested corpus
        id: corpus
        if: ${{ steps.key.outputs.present == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OIB_CORPUS_URL: ${{ secrets.OIB_CORPUS_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          .venv/bin/python scripts/corpus_snapshot.py pull --repository "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/grid-oib-corpus"
          before="$(sha256sum data/oib_registry.json 2>/dev/null || true)"
          if [ -n "$OIB_CORPUS_URL" ]; then
            curl -fsSL "$OIB_CORPUS_URL" | tar -xz -C data/oib
          fi
          if ls data/oib/*.pdf > /dev/null 2>&1; then
            # A no-op when the snapshot is current; otherwise it ingests only
            # what is new, or everything when the chunk format moved.
            .venv/bin/python -c "from aiq_agent import oib_sync; print('sync', oib_sync.sync())"
          else
            echo "::notice::No corpus: no snapshot published and OIB_CORPUS_URL not set. Only the ERROR gate runs."
          fi
          after="$(sha256sum data/oib_registry.json 2>/dev/null || true)"
          [ "$before" != "$after" ] && echo "changed=true" >> "$GITHUB_OUTPUT" || true
      - name: Smoke
        if: ${{ steps.key.outputs.present == 'true' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: task be:smoke -- --out "$RUNNER_TEMP/smoke"
      - name: Publish the corpus snapshot the sync changed
        if: ${{ steps.corpus.outputs.changed == 'true' && github.event_name != 'pull_request' }}
        run: .venv/bin/python scripts/corpus_snapshot.py push --repository "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/grid-oib-corpus"
      - name: Keep the run's log
        if: ${{ always() && steps.key.outputs.present == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: smoke-log
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
