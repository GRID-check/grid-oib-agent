name: Security

# Surveillance, not a gate: what can turn red without anyone changing the code.
# A CVE disclosed against a dependency or a pinned image, a secret nobody
# noticed, a Semgrep rule that landed upstream. Weekly, and on demand.
#
# The gate for a CHANGE lives in ci.yml, behind `CI OK`, and checks only what
# the change itself can break:
#   gitleaks   every pull request and push, full history (repo job)
#   Semgrep    pull requests, diff-aware: findings the change introduces
#   trivy      the third-party image pins the change adds or moves
#
# This workflow used to run on every pull request and push as well, beside CI.
# That cost six runner slots per push, and what it caught there was either
# already gated (gitleaks) or not the change's doing: a CVE disclosed this
# morning against an untouched Langfuse pin turned every pull request that
# edited deploy/pulumi red, and the staging deploy with it. Here, a red run is a
# finding for someone to triage, and nobody's merge waits on it.
#
# All of it is free and runs in CI, with no GitHub Advanced Security licence.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security
  cancel-in-progress: true

jobs:
  # The whole tree, so it reports the backlog too. Advisory: the backlog is not
  # a regression, and the pull request scan already blocks new findings.
  semgrep:
    name: SAST (Semgrep, full tree)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: semgrep/semgrep:1.177.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep scan
        continue-on-error: true
        run: >-
          semgrep ci --json-output=semgrep.json
          --exclude-rule javascript.lang.security.audit.unsafe-formatstring.unsafe-formatstring
        env:
          SEMGREP_RULES: p/default p/javascript p/typescript p/python p/secrets p/github-actions
      - name: Findings summary
        if: always()
        continue-on-error: true
        run: python3 ci/semgrep_summary.py semgrep.json "the whole tree, backlog included" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-findings
          path: semgrep.json
          retention-days: 14

  # Every lockfile in the tree (both npm ones, bun.lock, both uv.locks).
  # Dependabot opens the fix pull requests (.github/dependabot.yml). Advisory
  # while the backlog is triaged: to make it a gate, run it on pull requests in
  # osv-scanner's diff mode, which reports only what a change introduces.
  #
  # There is deliberately no second dependency scanner. pip-audit, bun audit
  # and npm audit query the same advisory databases OSV ingests; that job was
  # the whole difference between a 2m36s run and a 9m53s one, and two of its
  # three steps reported nothing (a registry 503, a pip-audit abort) behind
  # `|| true` while OSV found 23 advisories in 4 seconds.
  osv:
    name: Dependency vulns (OSV-Scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        continue-on-error: true
        with:
          scan-args: |-
            -r
            ./

  # Every branch (gitleaks' default `--all`), unlike CI's scan of one commit's
  # history: a secret pushed to any branch is already on GitHub, and a gitleaks
  # rule update that flags an old commit surfaces here first instead of on
  # somebody's unrelated pull request.
  gitleaks:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:v8.30.1 detect --source /repo --redact -v

  # Every pinned image, against today's advisories. This is the run that turns
  # red when a pin we have not touched gets a fixable CVE; the fix is a pin bump
  # or a boxed exception in .trivyignore.yaml.
  trivy:
    name: Image vulns (trivy, every pin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRIVY_VERSION: "0.61.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 ci/pinned_images.py list | tee pins.txt
      - name: Restore the layer analysis
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .trivy-cache/fanal
          key: trivy-layers-${{ env.TRIVY_VERSION }}-${{ hashFiles('pins.txt') }}
      - run: bash ci/trivy_scan.sh pins.txt
      - name: Save the layer analysis
        if: always() && hashFiles('.trivy-cache/fanal/**') != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .trivy-cache/fanal
          key: trivy-layers-${{ env.TRIVY_VERSION }}-${{ hashFiles('pins.txt') }}
