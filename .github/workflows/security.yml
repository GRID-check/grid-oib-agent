name: Security

# Always-on security analysis, running fully in CI (no GitHub Advanced Security
# licence required on this private repo):
#   - Semgrep     -> SAST for Python + TS/JS + GitHub Actions (replaces CodeQL
#                    and Sonar's security rules)
#   - OSV-Scanner -> dependency vulnerabilities from lockfiles (replaces Sonar SCA;
#                    Dependabot opens the fix PRs, see .github/dependabot.yml)
#   - dependency-audit -> pip-audit + npm audit, complementary advisory sources
#   - gitleaks    -> secret scanning across full history
#   - iac-config  -> Trivy misconfig scan of Dockerfiles + Compose/k8s YAML
#
# Runs on every PR and push to the integration branches, plus a weekly scheduled
# full scan to catch newly-disclosed advisories in code that has not changed.
#
# Enforcement:
#   - BLOCKING (aggregated by the `security-ok` gate → mark it required in branch
#     protection): Semgrep (diff-aware on PRs, so only NEW findings block; still
#     advisory on push/schedule to avoid failing on the existing backlog),
#     OSV-Scanner, and gitleaks.
#   - ADVISORY (continue-on-error, promote once the baseline is clean):
#     dependency-audit and iac-config.
on:
  push:
    branches: [develop, "release/**"]
  pull_request:
    branches: [develop, "release/**"]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: SAST (Semgrep)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
        with:
          # semgrep ci diffs PRs against the base branch; full history lets it
          # scope the scan to changed code instead of falling back to a full scan.
          fetch-depth: 0
      # `semgrep ci` is diff-aware on PRs (reports only findings NEW vs the base
      # branch) and full-tree on push/schedule. So it BLOCKS a PR that introduces
      # a new finding (clean-as-you-code) without failing on the existing backlog;
      # push/schedule runs stay advisory (continue-on-error below). Rule packs run
      # in no-account mode — no SEMGREP_APP_TOKEN needed. Findings are written to
      # SARIF + JSON, surfaced in the run's job summary, and kept as an artifact.
      # Two rules are tuned out of the ruleset as policy/noise (documented in the
      # PR that added this): github-actions-mutable-action-tag — the repo uses
      # major-version tags and lets Dependabot keep them current rather than
      # SHA-pinning; and unsafe-formatstring — INFO-level template noise.
      - name: Semgrep scan
        run: >-
          semgrep ci --sarif-output=semgrep.sarif --json-output=semgrep.json
          --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
          --exclude-rule javascript.lang.security.audit.unsafe-formatstring.unsafe-formatstring
        env:
          SEMGREP_RULES: >-
            p/default
            p/javascript
            p/typescript
            p/python
            p/secrets
            p/github-actions
        # Block on PRs (diff-aware → only new findings); advisory on push/schedule.
        continue-on-error: ${{ github.event_name != 'pull_request' }}
      - name: Findings summary
        if: always()
        continue-on-error: true # a summary hiccup must never affect the gate
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, collections, pathlib
          p = pathlib.Path("semgrep.json")
          if not p.exists():
              print("## Semgrep SAST\n\nNo JSON output produced."); raise SystemExit
          res = json.loads(p.read_text()).get("results", [])
          print("## Semgrep SAST\n")
          print(f"**{len(res)} finding(s)** "
                "(diff-aware on PRs: new vs base branch; full tree on push/schedule)\n")
          sev = collections.Counter(r.get("extra", {}).get("severity", "INFO") for r in res)
          if res:
              print("| Severity | Count |\n|---|---|")
              for s in ("ERROR", "WARNING", "INFO"):
                  if sev.get(s):
                      print(f"| {s} | {sev[s]} |")
              print("\n| Rule | File | Line |\n|---|---|---|")
              for r in res[:50]:
                  rule = r.get("check_id", "").split(".")[-1]
                  print(f"| `{rule}` | {r.get('path','')} | {r.get('start',{}).get('line','')} |")
              if len(res) > 50:
                  print(f"\n…and {len(res) - 50} more — see the `semgrep-findings` artifact.")
          PY
      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-findings
          path: |
            semgrep.sarif
            semgrep.json
          retention-days: 14

  deps-osv:
    name: Dependency vulns (OSV-Scanner)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      # Reads the lockfiles in the tree (uv.lock, frontends/ui/package-lock.json)
      # and reports known-vulnerable versions against the OSV database.
      # The runnable action lives in a subdirectory (the repo root action.yml is
      # metadata only), and there is no floating v2 tag, so pin an exact release.
      # The reusable workflow is intentionally avoided: it uploads SARIF to code
      # scanning, which needs GitHub Advanced Security (exactly what this stack
      # is designed not to require).
      # NOTE: `--skip-git` was REMOVED in osv-scanner v2 (git roots are skipped by
      # default now); passing it makes the CLI exit 127 and scan nothing. Just
      # scan the tree recursively.
      - uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            -r
            ./
        # BLOCKING (Phase 2): a known-vulnerable dependency fails the check.
        # Triage a specific advisory that has no fix yet via an `osv-scanner.toml`
        # [[IgnoredVulns]] entry rather than reinstating continue-on-error.

  dependency-audit:
    name: Dependency audit
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
      # Informational (does not block merges on transitive advisories); surfaces
      # in the job log and can be promoted to blocking once the baseline is clean.
      - name: pip-audit (Python)
        continue-on-error: true
        run: |
          . .venv/bin/activate
          uv pip install pip-audit
          pip-audit --strict || true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontends/ui/package-lock.json
      - name: npm audit (frontend)
        continue-on-error: true
        working-directory: frontends/ui
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high || true

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so gitleaks scans all commits
      # Run the OSS gitleaks image directly rather than gitleaks-action, which
      # requires a paid GITLEAKS_LICENSE for organisation-owned repos. Config and
      # false-positive allowlist live in .gitleaks.toml.
      - name: gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect --source /repo --redact -v

  iac-config:
    name: IaC misconfig (Trivy config)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      # Static misconfiguration scan of the infra-as-code we CAN parse statically:
      # the Dockerfiles and the Docker Compose / any k8s YAML. NOTE: this does NOT
      # see the Pulumi-defined Kubernetes resources — Trivy/Checkov don't parse
      # Pulumi TypeScript, so that surface is covered by the deploy-pulumi
      # typecheck + Semgrep instead. Config lives in trivy.yaml / .trivyignore.
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
        # Phase 1 (advisory) for a newly-added scanner — surfaces misconfig in the
        # log without blocking while the baseline is tuned; drop once clean.
        continue-on-error: true

  security-ok:
    name: Security OK
    if: always()
    # Aggregate gate for the BLOCKING security checks, so branch protection needs
    # one required status. Advisory jobs (dependency-audit, iac-config) are
    # intentionally excluded until promoted. Mark `Security OK` required in repo
    # Settings -> Branches to actually enforce.
    needs: [semgrep, deps-osv, secret-scan]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Require the blocking security jobs to have passed
        run: |
          python3 - <<'EOF'
          import json, sys
          needs = json.loads('''${{ toJSON(needs) }}''')
          failed = {k: v["result"] for k, v in needs.items() if v["result"] not in ("success", "skipped")}
          if failed:
              print("Failing security jobs:", failed)
              sys.exit(1)
          print("All blocking security jobs passed or were skipped.")
          EOF
