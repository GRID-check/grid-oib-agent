name: Security

# Always-on security analysis, running fully in CI (no GitHub Advanced Security
# licence required on this private repo):
#   - Semgrep     -> SAST for Python + TS/JS + GitHub Actions (replaces CodeQL
#                    and Sonar's security rules)
#   - OSV-Scanner -> dependency vulnerabilities from lockfiles (replaces Sonar SCA;
#                    Dependabot opens the fix PRs, see .github/dependabot.yml)
#   - dependency-audit -> pip-audit + bun audit (UI) + npm audit (web), complementary advisory sources
#   - gitleaks    -> secret scanning across full history
#   - image-scan  -> trivy on the digest-pinned observability images (ADR-0029)
#                    deployed via deploy/pulumi (these images are not part of
#                    any repo-built Dockerfile, so no other scanner sees them)
#
# Runs on every PR and push to the integration branches, plus a weekly scheduled
# full scan to catch newly-disclosed advisories in code that has not changed.
#
# Phase 1 (current): Semgrep, OSV-Scanner and both dependency audits (pip-audit,
# bun audit) are non-blocking (continue-on-error)
# so findings surface in the job log without blocking merges while we tune noise
# (see .semgrepignore / .gitleaks.toml). Once trusted, drop continue-on-error to
# make them required checks.
on:
  push:
    branches: [develop, "release/**"]
  pull_request:
    branches: [develop, "release/**"]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
        with:
          # semgrep ci diffs PRs against the base branch; full history lets it
          # scope the scan to changed code instead of falling back to a full scan.
          fetch-depth: 0
      # `semgrep ci` is diff-aware on PRs (reports only findings NEW vs the base
      # branch) and full-tree on push/schedule. So it BLOCKS a PR that introduces
      # a new finding (clean-as-you-code) without failing on the existing backlog;
      # push/schedule runs stay advisory (continue-on-error below). Rule packs run
      # in no-account mode — no SEMGREP_APP_TOKEN needed. Findings are written to
      # SARIF + JSON, surfaced in the run's job summary, and kept as an artifact.
      # Two rules are tuned out of the ruleset as policy/noise (documented in the
      # PR that added this): github-actions-mutable-action-tag — the repo uses
      # major-version tags and lets Dependabot keep them current rather than
      # SHA-pinning; and unsafe-formatstring — INFO-level template noise.
      - name: Semgrep scan
        run: >-
          semgrep ci --sarif-output=semgrep.sarif --json-output=semgrep.json
          --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
          --exclude-rule javascript.lang.security.audit.unsafe-formatstring.unsafe-formatstring
        env:
          SEMGREP_RULES: >-
            p/default
            p/javascript
            p/typescript
            p/python
            p/secrets
            p/github-actions
        # Block on PRs (diff-aware → only new findings); advisory on push/schedule.
        continue-on-error: ${{ github.event_name != 'pull_request' }}
      - name: Findings summary
        if: always()
        continue-on-error: true # a summary hiccup must never affect the gate
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, collections, pathlib
          p = pathlib.Path("semgrep.json")
          if not p.exists():
              print("## Semgrep SAST\n\nNo JSON output produced."); raise SystemExit
          res = json.loads(p.read_text()).get("results", [])
          print("## Semgrep SAST\n")
          print(f"**{len(res)} finding(s)** "
                "(diff-aware on PRs: new vs base branch; full tree on push/schedule)\n")
          sev = collections.Counter(r.get("extra", {}).get("severity", "INFO") for r in res)
          if res:
              print("| Severity | Count |\n|---|---|")
              for s in ("ERROR", "WARNING", "INFO"):
                  if sev.get(s):
                      print(f"| {s} | {sev[s]} |")
              print("\n| Rule | File | Line |\n|---|---|---|")
              for r in res[:50]:
                  rule = r.get("check_id", "").split(".")[-1]
                  print(f"| `{rule}` | {r.get('path','')} | {r.get('start',{}).get('line','')} |")
              if len(res) > 50:
                  print(f"\n…and {len(res) - 50} more — see the `semgrep-findings` artifact.")
          PY
      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-findings
          path: |
            semgrep.sarif
            semgrep.json
          retention-days: 14

  deps-osv:
    name: Dependency vulns (OSV-Scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reads the lockfiles in the tree (uv.lock, frontends/ui/bun.lock)
      # and reports known-vulnerable versions against the OSV database.
      # The runnable action lives in a subdirectory (the repo root action.yml is
      # metadata only), and there is no floating v2 tag, so pin an exact release.
      # The reusable workflow is intentionally avoided: it uploads SARIF to code
      # scanning, which needs GitHub Advanced Security (exactly what this stack
      # is designed not to require).
      # NOTE: `--skip-git` was REMOVED in osv-scanner v2 (git roots are skipped by
      # default now); passing it makes the CLI exit 127 and scan nothing. Just
      # scan the tree recursively.
      - uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            -r
            ./
        # Advisory until the reported lockfile CVEs are triaged; then remove to block.
        continue-on-error: true

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      # No persisted checkout token: the steps below run PR-controlled setup
      # actions and dependency install scripts, which must never find a
      # repository credential in the workspace git config.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      # Informational (does not block merges on transitive advisories); surfaces
      # in the job log and can be promoted to blocking once the baseline is clean.
      - name: pip-audit (Python)
        continue-on-error: true
        run: |
          . .venv/bin/activate
          uv pip install pip-audit
          pip-audit --strict || true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-bun
      # Informational for the same reason as pip-audit above: Phase 1 keeps both
      # audits advisory (docs/compliance/external-dependencies.md §C) so a new
      # transitive advisory does not block unrelated merges. Promote both together
      # once the baseline is clean.
      - name: Dependency audit (frontend)
        continue-on-error: true
        working-directory: frontends/ui
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun audit --audit-level=high || true
      # The Astro microservice (frontends/web) installs with npm, so its
      # lockfile needs npm audit rather than bun audit.
      - name: Dependency audit (web)
        continue-on-error: true
        working-directory: frontends/web
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high || true

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so gitleaks scans all commits
      # Run the OSS gitleaks image directly rather than gitleaks-action, which
      # requires a paid GITLEAKS_LICENSE for organisation-owned repos. Config and
      # false-positive allowlist live in .gitleaks.toml.
      - name: gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect --source /repo --redact -v

  image-scan:
    name: Image vulns (trivy)
    runs-on: ubuntu-latest
    steps:
      # Needed for the digest extraction below to see deploy/pulumi/src/config.ts.
      - uses: actions/checkout@v7
      # The observability images (ADR-0029) and the Langfuse tier's (ADR-0044)
      # are digest-pinned in deploy/pulumi/src/config.ts and never flow through
      # a repo Dockerfile, so OSV/dependency scanners never see them. trivy
      # scans the pinned digests directly. Blocking on HIGH/CRITICAL is safe
      # precisely because the digests are pinned: a new finding means a
      # deliberate image bump decision, never a surprise from a mutable tag.
      # --ignore-unfixed keeps the gate about what we can act on.
      #
      # This is what makes the pins SELF-MAINTAINING. Adding a pinned image
      # without adding it here would leave it unscanned forever, so the count
      # assertion below is deliberately exact rather than a lower bound: a new
      # pin fails this job until someone extends the list.
      - name: Extract pinned images
        id: images
        run: |
          expected=(
            'mcr\.microsoft\.com/dotnet/aspire-dashboard'
            'otel/opentelemetry-collector-contrib'
            'ghcr\.io/langfuse/langfuse'
            'ghcr\.io/langfuse/langfuse-worker'
            'clickhouse/clickhouse-server'
          )
          # `langfuse` is a prefix of `langfuse-worker`, so the alternation is
          # anchored with (@) to keep the shorter pattern from swallowing the
          # longer one's digest and reporting four images where there are five.
          pattern="$(IFS='|'; echo "(${expected[*]})@sha256:[a-f0-9]{64}")"
          grep -oE "$pattern" deploy/pulumi/src/config.ts | sort -u | tee pinned-images.txt
          # A partial match would leave the loop below scanning fewer images (or
          # none) and still passing. Require exactly one digest per image.
          test "$(wc -l < pinned-images.txt)" -eq "${#expected[@]}"
          for image in "${expected[@]}"; do
            grep -qE "^${image}@sha256:[a-f0-9]{64}$" pinned-images.txt
          done
      # `.trivyignore.yaml` carries deliberate, time-boxed exceptions for
      # findings inside the upstream images that we cannot fix by bumping (each
      # entry states why it is not exploitable here and expires, so the gate
      # comes back red rather than ignoring a CVE forever).
      - name: Scan each pinned image
        run: |
          failed=0
          while read -r img; do
            echo "=== trivy: $img"
            docker run --rm \
              -v "$PWD/.trivyignore.yaml:/config/.trivyignore.yaml:ro" \
              aquasec/trivy:0.61.1 image \
              --ignorefile /config/.trivyignore.yaml \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$img" || failed=1
          done < pinned-images.txt
          exit $failed
