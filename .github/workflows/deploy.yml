name: Deploy (staging)

# Deploys the `dev` (staging) Pulumi stack after the images for a develop commit
# have been built + pushed. Chained off "Publish Images" (not a raw push) so the
# stack never references a tag GHCR doesn't have yet, and it deploys the exact
# commit's immutable SHA tag rather than the moving `latest`. An explicit gate
# step additionally requires the commit's CI and Security workflows to be green
# before anything touches the cluster (Publish Images runs in parallel with
# them, so chaining alone would deploy untested code).
#
# One-time setup (per environment). Pulumi stack CONFIG IS FILE-BASED: the
# values live in deploy/pulumi/Pulumi.dev.yaml in THIS REPO, not in Pulumi
# Cloud (which stores only state + the secrets-decryption key). CI reads the
# checked-out file, so the configured stack file MUST BE COMMITTED:
#   1. cd deploy/pulumi && pulumi stack init matthiasbigl/dev
#   2. Edit Pulumi.dev.yaml: real baseDomain/letsEncryptEmail/
#      workosClientId/storageClass (placeholders make the program fail closed).
#   3. Set every secret with `pulumi config set --secret ...` (full list in the
#      Pulumi.dev.yaml header). For the kubeconfig use a NON-EXPIRING
#      ServiceAccount token, not the Control-Center download (dies in ≤2 weeks)
#      — see docs/deployment/kubernetes.md §2b.
#   4. COMMIT the updated Pulumi.dev.yaml to `develop` — the secrets in it are
#      ciphertext (encrypted by the stack's Pulumi-Cloud-managed key) and safe
#      to commit. Without this commit every CI deploy fails its preflight.
#   5. Add repo secret PULUMI_ACCESS_TOKEN (a Pulumi Cloud access token).
# The "Preflight" step below verifies step 2/4 happened and fails with
# instructions if not.
on:
  workflow_run:
    workflows: ["Publish Images"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      imageTag:
        description: >-
          Image tag to deploy. Leave empty for the triggering commit's own
          sha-<40-hex> tag. Set it to a PREVIOUS build's tag to roll the cluster
          back without reverting code — the rollout is gated exactly like a
          forward deploy (surge, soak, drain), so a rollback is just a deploy of
          an older image.
        required: false
        type: string

permissions:
  contents: read
  actions: read # poll CI / Security workflow conclusions for the gate step

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Pulumi up (dev)
    # Only when the image build actually succeeded (skip on failed/cancelled).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: staging
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      # The image tag the cluster is pinned to for this run: normally the
      # triggering commit's immutable tag, or an operator-supplied older tag
      # when rolling back.
      IMAGE_TAG: ${{ inputs.imageTag || format('sha-{0}', github.event.workflow_run.head_sha || github.sha) }}
    steps:
      # Manual dispatch only deploys develop: images are published only for
      # develop/release/tags, so dispatching from a feature branch would pin a
      # sha-<sha> tag that does not exist in GHCR and roll the cluster into
      # ImagePullBackOff.
      - name: Guard manual dispatch to develop
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/develop' }}
        # Read the ref from the runner's built-in $GITHUB_REF env var rather than
        # interpolating ${{ github.ref }} into the shell, so `github` context data
        # never lands in the run script (Semgrep run-shell-injection).
        run: |
          echo "::error::workflow_dispatch deploys are only supported from develop (images for '$GITHUB_REF' are never published)."
          exit 1

      # IMAGE_TAG is interpolated into `pulumi config set`, so constrain it to
      # the shapes publish-images actually produces before it reaches a command
      # line. Rejecting anything else also catches the likelier operator error
      # of typing a tag GHCR does not have (→ cluster-wide ImagePullBackOff).
      - name: Validate image tag
        run: |
          case "$IMAGE_TAG" in
            sha-[0-9a-f]*) [ "${#IMAGE_TAG}" -eq 44 ] || { echo "::error::sha- tag must be the full 40-hex commit sha"; exit 1; } ;;
            latest) ;;
            v[0-9]*) ;;
            *) echo "::error::refusing image tag '$IMAGE_TAG' — expected sha-<40-hex>, v<version>, or latest."; exit 1 ;;
          esac
          echo "deploying image tag: $IMAGE_TAG"

      # The upstream "Publish Images" workflow runs ONLY on push to
      # develop/release and on tags (never on pull_request), so
      # workflow_run.head_sha is always a trusted, already-merged commit, not
      # fork PR code. This is the safe use of workflow_run + checkout, so the
      # generic pwn-request rule is a false positive here.
      # nosemgrep: yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout
      - uses: actions/checkout@v7
        with:
          # Deploy the exact commit whose images were just published.
          ref: ${{ env.DEPLOY_SHA }}

      # The stated invariant: staging only receives commits whose CI and
      # Security workflows passed. Publish Images has no `needs` relationship
      # to them, so enforce it here by polling both workflows' conclusions for
      # the deploy SHA (they usually finish long before the image build).
      - name: Require green CI + Security for this commit
        uses: actions/github-script@v8
        with:
          script: |
            const required = ["CI", "Security"];
            const sha = process.env.DEPLOY_SHA;
            const deadline = Date.now() + 25 * 60 * 1000;
            for (const name of required) {
              for (;;) {
                const runs = (await github.rest.actions.listWorkflowRunsForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  head_sha: sha,
                  per_page: 50,
                })).data.workflow_runs.filter((r) => r.name === name);
                const run = runs[0]; // most recent for this SHA
                if (run && run.status === "completed") {
                  if (run.conclusion !== "success") {
                    core.setFailed(`${name} for ${sha} concluded '${run.conclusion}' — refusing to deploy.`);
                    return;
                  }
                  core.info(`${name}: success`);
                  break;
                }
                if (!run) core.info(`${name}: no run found yet for ${sha}, waiting…`);
                else core.info(`${name}: ${run.status}, waiting…`);
                if (Date.now() > deadline) {
                  core.setFailed(`${name} for ${sha} did not complete within 25 minutes.`);
                  return;
                }
                await new Promise((r) => setTimeout(r, 30_000));
              }
            }

      # Fail fast, with instructions, if the committed stack file is still the
      # template — otherwise the failure surfaces as a cryptic preview error.
      - name: Preflight - stack file is configured, not the template
        working-directory: deploy/pulumi
        run: |
          bad=0
          grep -nE "REPLACE_ME|example\.com" Pulumi.dev.yaml && bad=1
          grep -q "secure:" Pulumi.dev.yaml || { echo "no 'secure:' ciphertext blocks found — secrets were never set/committed"; bad=1; }
          if [ "$bad" -ne 0 ]; then
            echo "::error::deploy/pulumi/Pulumi.dev.yaml on develop is still the placeholder template."
            echo "::error::Run the one-time setup in this workflow's header (edit values, set --secret config, COMMIT the file), then re-run."
            exit 1
          fi
          echo "stack file preflight OK"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deploy/pulumi/package-lock.json

      - name: Install program deps
        working-directory: deploy/pulumi
        run: npm ci

      # The CrossGuard policy pack is a separate Node program with its own deps.
      - name: Install policy-pack deps
        working-directory: deploy/pulumi/policy
        run: npm ci

      - name: Typecheck (cluster-free gate)
        working-directory: deploy/pulumi
        run: npx tsc --noEmit && (cd policy && npx tsc --noEmit)

      # Plan + two independent gates on the SAME plan `pulumi up` will apply
      # (the imageTag override is applied BEFORE previewing):
      #   1. schema-validate every CustomResource against the upstream CRD
      #      schemas — tsc can't check apiextensions.CustomResource fields;
      #   2. the CrossGuard policy pack — rollout safety (surge-only rollouts,
      #      readiness soaks, progress deadlines, shutdown budgets), resource
      #      bounds, and image-pull correctness. A `mandatory` violation fails
      #      the preview here, before anything touches the cluster.
      - name: Validate plan (CRD schemas + policy pack)
        working-directory: deploy/pulumi
        run: |
          # Download the installer to a file first, then run it, rather than
          # piping curl straight into a shell (curl|sh): a hijacked endpoint
          # can't execute in one uninspectable stream.
          curl -fsSL https://get.pulumi.com -o "$RUNNER_TEMP/install-pulumi.sh"
          sh "$RUNNER_TEMP/install-pulumi.sh" --version latest
          export PATH="$HOME/.pulumi/bin:$PATH"
          pulumi stack select matthiasbigl/grid-oib/dev
          pulumi config set grid-oib:imageTag "$IMAGE_TAG"
          # `--json` puts EVERYTHING on stdout, diagnostics included, so a bare
          # redirect leaves a failed preview looking like a naked `exit 1` with
          # no reason anywhere in the log. Surface the captured output before
          # failing — the API server's rejection message is the whole story.
          if ! pulumi preview --policy-pack ./policy --json > .plan.json; then
            echo "::error::pulumi preview failed — captured output follows"
            cat .plan.json
            exit 1
          fi
          node scripts/validate-crs.mjs .plan.json
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Pulumi up
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: matthiasbigl/grid-oib/dev
          work-dir: deploy/pulumi
          refresh: true
          # Show the full resource diff in the job log — the audit trail for what
          # a deploy actually changed in the cluster.
          diff: true
          # …and into the run summary, so "what did that deploy change?" is
          # answerable from the Actions UI without opening the log.
          comment-on-summary: true
          # Re-run the guardrails against the real update, not just the preview:
          # `up` re-plans after the refresh, so this is the plan that lands.
          policyPacks: policy
          # Pin this run to an immutable image tag (publish-images tags with
          # `type=sha,format=long` → `sha-<full-sha>`), overriding the stack's
          # default `latest` for a reproducible deploy. Rolling back is the same
          # command with an older tag — see the workflow_dispatch input above.
          config-map: |
            { "grid-oib:imageTag": { "value": "${{ env.IMAGE_TAG }}", "secret": false } }
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
