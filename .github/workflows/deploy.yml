name: Deploy

# Continuous deployment via Pulumi (state + encrypted secrets in Pulumi Cloud).
#
#   develop branch  ->  `dev`  stack  ->  staging domain   (environment: develop)
#   prod    branch  ->  `prod` stack  ->  production domain (environment: production)
#
# Triggered only AFTER the CI workflow concludes successfully on those branches,
# and then re-verifies that BOTH required gates (`CI OK` + `Security OK`) are
# green on the exact commit before touching the cluster — so nothing deploys
# until the whole pipeline passes.
#
# Secrets model: every app secret (kubeconfig, DB password, API keys, KEK, ...)
# lives ENCRYPTED in the stack config (Pulumi Cloud secrets provider), set once
# with `pulumi config set --secret`. The only GitHub secret needed is
# PULUMI_ACCESS_TOKEN. Put it on each Environment and gate `production` with
# required reviewers (Settings -> Environments) for a manual prod approval.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  # One deploy per branch at a time; never cancel an in-flight apply.
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy:
    # Only our integration branches, and only if the CI run itself was green.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'develop' ||
       github.event.workflow_run.head_branch == 'prod')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Branch -> GitHub Environment (scopes secrets + prod approval gate).
    environment: ${{ github.event.workflow_run.head_branch == 'prod' && 'production' || 'develop' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Enforce "the WHOLE pipeline passed": the triggering event only tells us CI
      # finished; assert both aggregate gates are success on this exact commit.
      - name: Require CI OK + Security OK on this commit
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            const { data } = await github.rest.checks.listForRef({
              owner: context.repo.owner, repo: context.repo.repo, ref: sha, per_page: 100,
            });
            const latest = {};
            for (const c of data.check_runs) latest[c.name] = c.conclusion; // last wins
            const required = ["CI OK", "Security OK"];
            const bad = required.filter((n) => latest[n] !== "success");
            if (bad.length) {
              core.setFailed(`Pipeline not fully green on ${sha}: ` +
                bad.map((n) => `${n}=${latest[n] ?? "missing"}`).join(", "));
            }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deploy/pulumi/package-lock.json
      - name: Install Pulumi program deps
        working-directory: deploy/pulumi
        run: npm ci # runs the `prepare` hook → builds the crd2pulumi SDK

      - name: Pulumi up
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: grid-check/${{ github.event.workflow_run.head_branch == 'prod' && 'prod' || 'dev' }}
          work-dir: deploy/pulumi
          # Fail the deploy rather than leave a half-applied stack silently.
          refresh: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
