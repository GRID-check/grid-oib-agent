name: Deploy (staging)

# Deploys the `dev` (staging) Pulumi stack after the images for a develop commit
# have been built + pushed. Chained off "Publish Images" (not a raw push) so the
# stack never references a tag GHCR doesn't have yet, and it deploys the exact
# commit's immutable SHA tag rather than the moving `latest`. An explicit gate
# step additionally requires the commit's CI and Security workflows to be green
# before anything touches the cluster (Publish Images runs in parallel with
# them, so chaining alone would deploy untested code).
#
# Image pinning is PER-SERVICE, not global. Publish Images is incremental: on
# a develop push it only rebuilds images whose inputs changed. A service
# rebuilt at this commit gets the commit's immutable sha-<sha> tag; a service
# that was NOT rebuilt keeps whatever the stack already deploys (per-service
# stack config key → global imageTag → `latest`), so a partial publish never
# points an unchanged service at a tag GHCR does not have (ImagePullBackOff).
# A manual dispatch pins all three services to the operator-supplied tag,
# preserving full-fleet rollback semantics; the workflow first verifies the
# tag exists for all three images, so a rollback to a partially-built commit
# fails fast instead of rolling the others into ImagePullBackOff.
#
# One-time setup (per environment). Stack config is FILE-BASED for plaintext
# (committed deploy/pulumi/Pulumi.<stack>.yaml) and ESC-BASED for secrets (the
# Pulumi Cloud environment `grid-oib/<stack>`, imported via the stack file's
# `environment:` block — rationale in docs/deployment/pulumi-cloud-feature-audit.md).
# The apply runs on this runner (`pulumi up`); because the state backend is
# Pulumi Cloud, every update is recorded in the console (stack → Activity)
# with full logs/diffs regardless of where the CLI runs:
#   1. cd deploy/pulumi && pulumi stack init matthiasbigl/grid-oib/dev
#   2. Edit Pulumi.dev.yaml: real baseDomain/letsEncryptEmail/
#      workosClientId/storageClass (placeholders make the program fail closed).
#   3. Move the secrets into ESC: `pulumi config env init --stack dev
#      --keep-config` creates the `grid-oib/dev` environment with everything
#      encrypted; then delete the duplicated `secure:` blocks from
#      Pulumi.dev.yaml (full list in the file header). For the kubeconfig use a
#      NON-EXPIRING ServiceAccount token, not the Control-Center download (dies
#      in ≤2 weeks) — see docs/deployment/kubernetes.md §2b.
#   4. COMMIT the updated Pulumi.dev.yaml (plaintext + `environment:` import) —
#      without it every CI deploy fails its preflight.
#   5. Add repo secret PULUMI_ACCESS_TOKEN (gate previews + the apply).
# The "Preflight" step below verifies step 2/4 happened and fails with
# instructions if not.
#
# PRODUCTION (`deploy-prod` job below). A merged develop→prod promotion PR
# pushes the `prod` branch, which previews + applies the SAME program against
# stack matthiasbigl/grid-oib/prod — completing the flow diagrammed in
# docs/deployment/cd.md. One-time requirements:
#   * GitHub environment `production` exists with REQUIRED REVIEWERS
#     (Settings → Environments). The environment gate IS the human approval;
#     until it exists the job runs unreviewed.
#   * Repo secret PULUMI_ACCESS_TOKEN reachable there (the same secret the
#     staging job uses; no environment-scoped secret needed).
#   * Images must ALREADY exist in GHCR: prod consumes the imageTag PINNED in
#     its committed Pulumi.prod.yaml, so unlike staging this job sets NO config,
#     resolves NO per-service refs and verifies NO rollback tag — the preview
#     applies exactly what the stack file records. That pinned line IS the
#     promotion mechanism: every develop→prod promotion PR bumps
#     grid-oib:imageTag to the new develop-tip sha (publish-images builds all
#     services as sha-<full sha> on every develop push). CI computes nothing
#     dynamically here — prod merge shas never have GHCR images; only develop
#     tips do. (Publish Images never runs for `prod`, so there is nothing else
#     to pin tags.)
# There is deliberately NO Publish Images chaining and NO template preflight:
# the prod stack is expected fully configured, and a broken one fails closed
# at `pulumi preview`. CI does not run on `prod` pushes either (ci.yml targets
# develop/release only), so green-CI enforcement belongs in prod BRANCH
# PROTECTION (require the promotion PR's checks) plus the environment
# reviewers — not in a poll like staging's. Manual workflow_dispatch with
# target=prod (or both) also runs this job, behind the same reviewer gate —
# usable as a manual prod re-apply.
on:
  push:
    branches: [prod]
  workflow_run:
    workflows: ["Publish Images"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      imageTag:
        description: >-
          Image tag to deploy. Leave empty for the triggering commit's own
          sha-<40-hex> tag. Set it to a PREVIOUS build's tag to roll the cluster
          back without reverting code — the rollout is gated exactly like a
          forward deploy (surge, soak, drain), so a rollback is just a deploy of
          an older image.
        required: false
        type: string
      target:
        description: 'Which stacks to deploy'
        type: choice
        options: [staging, prod, both]
        default: staging

permissions:
  contents: read
  actions: read # poll CI / Security workflow conclusions for the gate step
  packages: read # verify the rollback tag exists for all three images (dispatch)

# Concurrency is PER JOB now (`deploy-dev` / `deploy-prod` below): a
# production apply must not queue behind a staging publish or vice versa.
# Within each stack, updates still run strictly one at a time.
jobs:
  # The green-CI gate, lifted out of the deploy into its own job so that
  # "do not deploy" and "something is wrong" can look different. As a step it
  # had only one way to stop the run, `core.setFailed`, and a commit superseded
  # before its CI finished took that path — so an ordinary merge train painted
  # the Actions tab red, which is how a real deploy failure stops being noticed.
  # Now: green → deploy; a FAILED check → this job fails, because a commit that
  # should have shipped did not; a CANCELLED one → this job passes and the
  # deploy is skipped, because the commit was superseded and was never going to
  # ship. Nothing about WHICH commits reach the cluster changes.
  gate:
    name: Require green CI + Security
    # Same conditions the deploy itself carries: this job decides whether that
    # deploy runs, so it must not run in cases the deploy would not.
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && (inputs.target == 'staging' || inputs.target == 'both')) }}
    runs-on: ubuntu-latest
    outputs:
      # 'true' only when every required workflow is green for this commit.
      # Empty when the gate failed or was skipped, which the deploy reads as no.
      proceed: ${{ steps.require.outputs.proceed }}
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # The stated invariant: staging only receives commits whose CI and
      # Security workflows passed. Publish Images has no `needs` relationship
      # to them, so enforce it here by polling both workflows' conclusions for
      # the deploy SHA (they usually finish long before the image build).
      - name: Require green CI + Security for this commit
        id: require
        uses: actions/github-script@v9
        with:
          script: |
            const required = ["CI", "Security"];
            const sha = process.env.DEPLOY_SHA;
            const deadline = Date.now() + 25 * 60 * 1000;
            for (const name of required) {
              for (;;) {
                const runs = (await github.rest.actions.listWorkflowRunsForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  head_sha: sha,
                  per_page: 50,
                })).data.workflow_runs.filter((r) => r.name === name);
                const run = runs[0]; // most recent for this SHA
                if (run && run.status === "completed") {
                  // CANCELLED is not a failure, it is a SUPERSESSION: `develop`
                  // moved on while the images were building and the concurrency
                  // group killed this commit's CI. Nothing is broken, nothing is
                  // deployable, and the newer tip brings its own Publish Images →
                  // Deploy chain. Standing down quietly is the whole point of
                  // this job: a red mark here is meant to mean "a commit that
                  // should have shipped did not", and a merge train that paints
                  // it red as a matter of routine is how a real deploy failure
                  // stops being noticed.
                  if (run.conclusion === "cancelled") {
                    core.notice(
                      `${name} for ${sha} was cancelled — this commit was superseded before its ` +
                      `checks finished, so there is nothing to deploy. Skipping.`
                    );
                    core.setOutput("proceed", "false");
                    return;
                  }
                  if (run.conclusion !== "success") {
                    core.setFailed(`${name} for ${sha} concluded '${run.conclusion}' — refusing to deploy.`);
                    return;
                  }
                  core.info(`${name}: success`);
                  break;
                }
                if (!run) core.info(`${name}: no run found yet for ${sha}, waiting…`);
                else core.info(`${name}: ${run.status}, waiting…`);
                if (Date.now() > deadline) {
                  core.setFailed(`${name} for ${sha} did not complete within 25 minutes.`);
                  return;
                }
                await new Promise((r) => setTimeout(r, 30_000));
              }
            }
            core.setOutput("proceed", "true");

  deploy:
    name: Pulumi up (dev)
    # `gate` already encodes the trigger conditions; a skipped or failed gate
    # leaves this output empty, so both read as "do not deploy".
    needs: gate
    if: ${{ needs.gate.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      # The image tag the cluster is pinned to for this run: normally the
      # triggering commit's immutable tag, or an operator-supplied older tag
      # when rolling back.
      IMAGE_TAG: ${{ inputs.imageTag || format('sha-{0}', github.event.workflow_run.head_sha || github.sha) }}
      # The triggering "Publish Images" run id — workflow_run only; empty on
      # workflow_dispatch, where every service is treated as built/pinned.
      RUN_ID: ${{ github.event.workflow_run.id }}
      # The tag an OPERATOR typed, empty otherwise. It is what separates the two
      # kinds of manual dispatch: a rollback, which pins every service to one
      # chosen tag, from a bare re-deploy, which asks for the fleet as it should
      # be — each service at the newest image actually built for it.
      EXPLICIT_TAG: ${{ inputs.imageTag }}
    steps:
      # Manual dispatch only deploys develop: images are published only for
      # develop/release/tags, so dispatching from a feature branch would pin a
      # sha-<sha> tag that does not exist in GHCR and roll the cluster into
      # ImagePullBackOff.
      - name: Guard manual dispatch to develop
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/develop' }}
        # Read the ref from the runner's built-in $GITHUB_REF env var rather than
        # interpolating ${{ github.ref }} into the shell, so `github` context data
        # never lands in the run script (Semgrep run-shell-injection).
        run: |
          echo "::error::workflow_dispatch deploys are only supported from develop (images for '$GITHUB_REF' are never published)."
          exit 1

      # IMAGE_TAG is interpolated into `pulumi config set`, so constrain it to
      # the shapes publish-images actually produces before it reaches a command
      # line. Rejecting anything else also catches the likelier operator error
      # of typing a tag GHCR does not have (→ cluster-wide ImagePullBackOff).
      - name: Validate image tag
        run: |
          case "$IMAGE_TAG" in
            sha-[0-9a-f]*) [ "${#IMAGE_TAG}" -eq 44 ] || { echo "::error::sha- tag must be the full 40-hex commit sha"; exit 1; } ;;
            latest) ;;
            v[0-9]*) ;;
            *) echo "::error::refusing image tag '$IMAGE_TAG' — expected sha-<40-hex>, v<version>, or latest."; exit 1 ;;
          esac
          echo "deploying image tag: $IMAGE_TAG"

      # The upstream "Publish Images" workflow runs ONLY on push to
      # develop/release and on tags (never on pull_request), so
      # workflow_run.head_sha is always a trusted, already-merged commit, not
      # fork PR code. This is the safe use of workflow_run + checkout, so the
      # generic pwn-request rule is a false positive here.
      # nosemgrep: yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout
      - uses: actions/checkout@v7
        with:
          # Deploy the exact commit whose images were just published.
          ref: ${{ env.DEPLOY_SHA }}

      # Fail fast, with instructions, if the committed stack file is still the
      # template — otherwise the failure surfaces as a cryptic preview error.
      #
      # The check walks the document structurally rather than grepping for
      # substrings: the stack file's own header carries `pulumi config set
      # --secret` examples and placeholder hostnames, so a plain grep matches
      # documentation, and a bare `environment:` match would accept an import of
      # the WRONG environment. Requirements, all position-aware:
      #   * no placeholder values on a real (non-comment) config line;
      #   * either a `secure:` key nested under `config:` (committed ciphertext)
      #     or a top-level `environment:` block importing exactly `grid-oib/dev`.
      - name: Preflight - stack file is configured, not the template
        working-directory: deploy/pulumi
        run: |
          bad=0
          awk -f - Pulumi.dev.yaml <<'AWK' || bad=1
          # Documentation and blank lines carry no configuration.
          /^[[:space:]]*#/ || /^[[:space:]]*$/ { next }

          # Track the current top-level key (column 0 = document root).
          /^[^[:space:]]/ { top = $0; sub(/:.*$/, "", top) }

          /REPLACE_ME|example\.com/ {
            printf "placeholder value still in the stack file: %s\n", $0
            placeholder = 1
          }

          # Committed ciphertext: a `secure:` mapping key inside the config tree.
          top == "config" && /^[[:space:]]+secure:[[:space:]]*[^[:space:]]/ { encrypted = 1 }

          # ESC import: `environment: [grid-oib/dev]` or a `- grid-oib/dev` item
          # under a top-level `environment:` block. Any other value is a
          # different environment and must not satisfy the check.
          top == "environment" {
            entry = $0
            sub(/^[[:space:]]*environment:[[:space:]]*/, "", entry)
            gsub(/[][,"]/, " ", entry)
            sub(/^[[:space:]]*-[[:space:]]*/, " ", entry)
            n = split(entry, fields, /[[:space:]]+/)
            for (i = 1; i <= n; i++) {
              if (fields[i] == "") continue
              if (fields[i] == "grid-oib/dev") esc = 1
              else other = fields[i]
            }
          }

          END {
            if (placeholder) exit 1
            if (top == "") {
              print "Pulumi.dev.yaml has no configuration at all."
              exit 1
            }
            if (!encrypted && !esc) {
              if (other != "") printf "environment: imports %s, not the grid-oib/dev ESC environment\n", other
              else print "no encrypted config found - neither a committed secure: entry under config: nor an environment: import of grid-oib/dev"
              exit 1
            }
          }
          AWK
          if [ "$bad" -ne 0 ]; then
            echo "::error::deploy/pulumi/Pulumi.dev.yaml on develop is still the placeholder template."
            echo "::error::Run the one-time setup in this workflow's header (edit values, set --secret config, COMMIT the file), then re-run."
            exit 1
          fi
          echo "stack file preflight OK"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deploy/pulumi/package-lock.json

      - name: Install program deps
        working-directory: deploy/pulumi
        run: npm ci

      # The CrossGuard policy pack is a separate Node program with its own deps.
      - name: Install policy-pack deps
        working-directory: deploy/pulumi/policy
        run: npm ci

      - name: Typecheck (cluster-free gate)
        working-directory: deploy/pulumi
        run: npx tsc --noEmit && (cd policy && npx tsc --noEmit)

      # Plan + two independent gates on the SAME plan `pulumi up` will apply
      # (the imageTag override is applied BEFORE previewing):
      #   1. schema-validate every CustomResource against the upstream CRD
      #      schemas — tsc can't check apiextensions.CustomResource fields;
      #   2. the CrossGuard policy pack — rollout safety (surge-only rollouts,
      #      readiness soaks, progress deadlines, shutdown budgets), resource
      #      bounds, and image-pull correctness. A `mandatory` violation fails
      #      the preview here, before anything touches the cluster.
      - name: Install Pulumi
        run: |
          # Download the installer to a file first, then run it, rather than
          # piping curl straight into a shell (curl|sh): a hijacked endpoint
          # can't execute in one uninspectable stream.
          curl -fsSL https://get.pulumi.com -o "$RUNNER_TEMP/install-pulumi.sh"
          sh "$RUNNER_TEMP/install-pulumi.sh" --version latest

      # Publish Images is incremental: on a develop push it only rebuilds
      # images whose inputs changed, so a single global imageTag for every
      # service would pin unchanged services to a tag GHCR does not have
      # (ImagePullBackOff). Resolve ONE ref per service and export it: a
      # service rebuilt at this commit gets the commit's immutable sha-<sha>
      # tag; a service that was NOT rebuilt keeps whatever the stack currently
      # deploys — its per-service config key (the full image ref the last
      # deploy pinned), then the global imageTag (all images were historically
      # built at every develop sha), then `latest`. On
      # workflow_dispatch (manual rollback) every service is pinned to
      # $IMAGE_TAG, preserving full-fleet semantics.
      - name: Resolve per-service image refs
        working-directory: deploy/pulumi
        run: |
          export PATH="$HOME/.pulumi/bin:$PATH"
          pulumi stack select matthiasbigl/grid-oib/dev

          # GHCR repository paths are lowercase (docker/metadata-action
          # lowercases the image name when publish-images pushes), and an
          # uppercase ref in a Pod spec is rejected outright by containerd
          # ("repository name must be lowercase"). The owner login is mixed
          # case, so fold it here — this is the same value the Pulumi program
          # defaults to (`ghcr.io/grid-check`).
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          registry="ghcr.io/${owner}"

          # Which images did the triggering publish run actually build? Job
          # names are the contract with publish-images.yml; only successful
          # jobs count. On dispatch RUN_ID is empty and every service is
          # treated as built (pinned) below.
          built_jobs=""
          if [ -n "$RUN_ID" ]; then
            built_jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.conclusion == "success") | .name')"
          fi

          # Manual rollback pins ALL three services to $IMAGE_TAG, so verify
          # that tag is published for every image before anything is pinned —
          # a tag only some images were built at would roll the others into
          # ImagePullBackOff. The workflow_run path never has this problem:
          # rebuilt images carry the sha just pushed, non-rebuilt keep their
          # stored ref.
          #
          # Ask GHCR itself, not the packages REST API: there is no
          # `/repos/{owner}/{repo}/packages/...` endpoint (it 404s), the
          # org/user variants differ by owner type, and listing versions would
          # need pagination over every sha ever published. A manifest HEAD is
          # exactly the lookup the kubelet will perform.
          if [ -z "$RUN_ID" ] && [ -n "$EXPLICIT_TAG" ]; then
            for service in backend frontend web; do
              image_path="${owner}/grid-oib-${service}"
              pull_token="$(curl -sSL -u "${GITHUB_ACTOR}:${GH_TOKEN}" \
                "https://ghcr.io/token?service=ghcr.io&scope=repository:${image_path}:pull" \
                | jq -r '.token // empty')"
              [ -n "$pull_token" ] || {
                echo "::error::could not obtain a GHCR pull token for ${image_path} — the job token needs 'packages: read'."
                exit 1
              }
              # $IMAGE_TAG is constrained to sha-<40-hex>/v*/latest by the
              # "Validate image tag" step above, so it is safe in the URL.
              status="$(curl -sSL -o /dev/null -w '%{http_code}' --head \
                -H "Authorization: Bearer ${pull_token}" \
                -H 'Accept: application/vnd.oci.image.index.v1+json' \
                -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
                -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
                -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
                "https://ghcr.io/v2/${image_path}/manifests/${IMAGE_TAG}")"
              [ "$status" = "200" ] || {
                echo "::error::rollback tag '$IMAGE_TAG' is not published for grid-oib-${service} (ghcr.io/${image_path} returned HTTP $status). Pick a tag from a fully-built commit."
                exit 1
              }
            done
            echo "rollback tag '$IMAGE_TAG' verified for backend, frontend and web"
          fi

          is_built() {
            if [ -n "$RUN_ID" ]; then
              echo "$built_jobs" | grep -qx "Build & push $1 image"
            elif [ -n "$EXPLICIT_TAG" ]; then
              # Rollback: the operator pinned every service to their tag, and
              # the loop above already proved it exists for all three.
              return 0
            else
              # Bare re-deploy (dispatch, no tag). Nothing was built FOR this
              # commit, so treat every service as unbuilt and let the
              # per-service resolution below find each one's newest image. This
              # is the only way to redeploy the fleet after a commit that built
              # nothing: pinning all three to this commit's own sha names tags
              # GHCR does not have, and the preflight would fail the run.
              return 1
            fi
          }

          # The newest develop commit at which publish-images actually BUILT
          # this service, from run history. This is what a mutable stored ref
          # resolves to: ':latest' names whatever the node happens to have
          # cached, and — the failure that forced this — writing it back
          # verbatim means an unchanged image string, so Kubernetes rolls
          # nothing. Three times in one day a real change built fresh images
          # and then a docs-only commit arrived minutes later, superseded the
          # real commit's deploy (its CI is cancelled, the gate skips), and
          # the docs commit's own deploy "kept" :latest — so the built images
          # sat in GHCR unused and the fleet stayed stale, silently.
          newest_built_sha() {
            for rid in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/publish-images.yml/runs?branch=develop&status=success&per_page=25" --jq '.workflow_runs[].id'); do
              hit="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$rid/jobs?per_page=50" --jq "[.jobs[] | select(.conclusion == \"success\") | .name] | index(\"Build & push $1 image\")")"
              if [ -n "$hit" ] && [ "$hit" != "null" ]; then
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$rid" --jq .head_sha
                return 0
              fi
            done
            return 1
          }

          resolve_ref() {
            service="$1"
            if is_built "$service"; then
              if [ -n "$RUN_ID" ]; then
                # Rebuilt at this commit: publish-images just pushed its tag.
                tag="sha-${DEPLOY_SHA}"
              else
                # Manual rollback: the operator's chosen tag.
                tag="$IMAGE_TAG"
              fi
            else
              # Not rebuilt: keep what the stack currently deploys — but only
              # an IMMUTABLE ref is "what it deploys". The per-service key
              # holds the FULL image ref the last deploy pinned (this workflow
              # writes $*_IMAGE_REF verbatim), so echo it as-is — prefixing
              # would double the registry/name.
              deployed="$(pulumi config get "grid-oib:${service}Image" 2>/dev/null || true)"
              case "$deployed" in
                *:latest)
                  # Mutable: resolve to the newest commit this service was
                  # built at, so the pin becomes immutable and the rollout
                  # actually happens. See newest_built_sha above.
                  built="$(newest_built_sha "$service" || true)"
                  if [ -n "$built" ]; then
                    tag="sha-${built}"
                  else
                    # No build found in recent history: keeping :latest is
                    # then genuinely all there is. Say so.
                    echo "::warning::${service} has no recent develop build; keeping ${deployed}" >&2
                    echo "$deployed"
                    return 0
                  fi
                  ;;
                *:*)
                  echo "$deployed"
                  return 0
                  ;;
                ?*)
                  # A bare tag (e.g. hand-set in the stack): normalize it.
                  tag="$deployed"
                  ;;
                *)
                  # Fallback for stacks that predate per-service pinning: the
                  # global imageTag (all images were historically built at
                  # every develop sha), then the newest built sha, then
                  # `latest` as the very last resort.
                  tag="$(pulumi config get grid-oib:imageTag 2>/dev/null || true)"
                  if [ -z "$tag" ]; then
                    built="$(newest_built_sha "$service" || true)"
                    if [ -n "$built" ]; then tag="sha-${built}"; else tag="latest"; fi
                  fi
                  ;;
              esac
            fi
            echo "${registry}/grid-oib-${service}:${tag}"
          }

          BACKEND_IMAGE_REF="$(resolve_ref backend)"
          FRONTEND_IMAGE_REF="$(resolve_ref frontend)"
          WEB_IMAGE_REF="$(resolve_ref web)"

          echo "backend  -> $BACKEND_IMAGE_REF"
          echo "frontend -> $FRONTEND_IMAGE_REF"
          echo "web      -> $WEB_IMAGE_REF"

          echo "BACKEND_IMAGE_REF=$BACKEND_IMAGE_REF" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE_REF=$FRONTEND_IMAGE_REF" >> "$GITHUB_ENV"
          echo "WEB_IMAGE_REF=$WEB_IMAGE_REF" >> "$GITHUB_ENV"
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }} # gh api: built-job lookup + rollback-tag verification

      - name: Validate plan (CRD schemas + policy pack)
        working-directory: deploy/pulumi
        run: |
          export PATH="$HOME/.pulumi/bin:$PATH"
          pulumi stack select matthiasbigl/grid-oib/dev
          pulumi config set grid-oib:imageTag "$IMAGE_TAG"
          pulumi config set grid-oib:backendImage "$BACKEND_IMAGE_REF"
          pulumi config set grid-oib:frontendImage "$FRONTEND_IMAGE_REF"
          pulumi config set grid-oib:webImage "$WEB_IMAGE_REF"
          # `--json` puts the plan on stdout, but policy-pack violations are NOT
          # part of it — a mandatory CrossGuard failure shows up as a bare
          # "error: preview failed" with the reason nowhere in the JSON. On
          # failure, re-run in text mode (cheap: the plan is cached server-side)
          # so the violating rule and resource are visible in the log.
          if ! pulumi preview --policy-pack ./policy --json > .plan.json; then
            echo "::error::pulumi preview failed — re-running in text mode to surface the reason"
            pulumi preview --policy-pack ./policy || true
            echo "::error::captured JSON plan follows"
            cat .plan.json
            exit 1
          fi
          node scripts/validate-crs.mjs .plan.json
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      # The apply runs on THIS runner, right after the gates, against the same
      # pinned image refs. Because the state backend is Pulumi Cloud, the update
      # is recorded in the console (stack → Activity) with full logs and diffs
      # no matter where the CLI runs — no Pulumi-hosted runner needed. (The
      # experimental `pulumi up --remote` / Deployments path was tried and
      # reverted same-day; see docs/deployment/pulumi-cloud-feature-audit.md.)
      - name: Pulumi up
        working-directory: deploy/pulumi
        run: |
          export PATH="$HOME/.pulumi/bin:$PATH"
          pulumi stack select matthiasbigl/grid-oib/dev
          pulumi config set grid-oib:imageTag "$IMAGE_TAG"
          pulumi config set grid-oib:backendImage "$BACKEND_IMAGE_REF"
          pulumi config set grid-oib:frontendImage "$FRONTEND_IMAGE_REF"
          pulumi config set grid-oib:webImage "$WEB_IMAGE_REF"
          pulumi up --yes
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

  # Mirrors the staging job above (same runner, checkout action/version,
  # toolchain setup, working directories, secret mechanism, plan gates and
  # error handling) against the fully-configured prod stack. All staging-only
  # machinery is absent ON PURPOSE — see the header comment: no dispatch
  # guard, no image-tag validation or pinning (the committed stack config owns
  # the image refs), no CI/Security poll, no template preflight.
  deploy-prod:
    name: Pulumi up (prod)
    # Direct events only: pushes to `prod` (branch filter on the push trigger)
    # and manual dispatches with target=prod/both. NEVER on the workflow_run
    # chain from Publish Images — that is staging's trigger and would otherwise
    # queue a prod apply on every merge to develop.
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.target == 'prod' || inputs.target == 'both')) }}
    runs-on: ubuntu-latest
    # Required-reviewer protection comes from this GitHub environment.
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      # Pushes land on refs/heads/prod, so the default checkout IS the
      # promoted commit (dispatch checks out whatever ref it ran from).
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deploy/pulumi/package-lock.json

      - name: Install program deps
        working-directory: deploy/pulumi
        run: npm ci

      - name: Install policy-pack deps
        working-directory: deploy/pulumi/policy
        run: npm ci

      - name: Typecheck (cluster-free gate)
        working-directory: deploy/pulumi
        run: npx tsc --noEmit && (cd policy && npx tsc --noEmit)

      - name: Install Pulumi
        run: |
          # Installer downloaded to a file first, not piped into a shell —
          # same rationale as the staging job's step above.
          curl -fsSL https://get.pulumi.com -o "$RUNNER_TEMP/install-pulumi.sh"
          sh "$RUNNER_TEMP/install-pulumi.sh" --version latest

      # The same two independent plan gates as staging (CRD schema validation +
      # mandatory CrossGuard policies), but against the prod stack and with NO
      # config overrides: what is previewed is exactly what the stack pins.
      - name: Validate plan (CRD schemas + policy pack)
        working-directory: deploy/pulumi
        run: |
          export PATH="$HOME/.pulumi/bin:$PATH"
          pulumi stack select matthiasbigl/grid-oib/prod
          # `--json` puts the plan on stdout, but policy-pack violations are NOT
          # part of it — re-run in text mode on failure so the violating rule is
          # visible in the log (the failed plan itself is cached server-side).
          if ! pulumi preview --policy-pack ./policy --json > .plan.json; then
            echo "::error::pulumi preview failed — re-running in text mode to surface the reason"
            pulumi preview --policy-pack ./policy || true
            echo "::error::captured JSON plan follows"
            cat .plan.json
            exit 1
          fi
          node scripts/validate-crs.mjs .plan.json
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Pulumi up
        working-directory: deploy/pulumi
        run: |
          export PATH="$HOME/.pulumi/bin:$PATH"
          pulumi stack select matthiasbigl/grid-oib/prod
          pulumi up --yes
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
