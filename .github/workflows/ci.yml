name: CI

# One consolidated pipeline for the monorepo. A path filter runs only the
# backend and/or frontend jobs a change actually touches; the `ci-ok` gate at
# the end is the single required status check for branch protection (it passes
# when every needed job succeeded or was skipped). Private repo -> PRs run
# directly (no copy-pr-bot).
on:
  push:
    branches: [develop, "release/**"]
  pull_request:
    branches: [develop, "release/**"]

permissions:
  contents: read
  pull-requests: write # coverage sticky comments (same-repo PRs)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      web: ${{ steps.filter.outputs.web }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # Every filter also watches the shared tooling each job depends on:
            # the root Taskfile (which defines the commands the jobs run) and the
            # composite setup actions. Otherwise a change to `fe:verify`,
            # `infra:types` or a setup action merges without its job running.
            backend:
              - 'src/**'
              - 'frontends/aiq_api/**'
              - 'sources/**'
              - 'tests/**'
              - 'ci/**'
              - 'configs/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Taskfile.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            frontend:
              - 'frontends/ui/**'
              # The BFF's model-config tests read the workflow config (the agent
              # groups it seeds are derived from `llms:`), so a PR touching only
              # `configs/` must still run them — otherwise a drift between the
              # two lands green because no frontend job ran at all.
              - 'configs/**'
              - 'Taskfile.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            web:
              - 'frontends/web/**'
              - 'Taskfile.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            infra:
              - 'deploy/**'
              - 'Taskfile.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

  backend-lint:
    name: Backend lint
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
      - uses: ./.github/actions/setup-task
      # Defined in the root Taskfile so `task be:lint` locally runs exactly this.
      - run: task be:lint

  # Deliberately NOT behind a paths filter. `pre-commit run --all-files` scans
  # the WHOLE repo, so gating it on the backend filter meant a PR touching only
  # deploy/** or frontends/ui/** could land drift on develop that stayed
  # invisible until some later, unrelated backend PR tripped over it — which is
  # exactly how the secrets baseline kept breaking CI. Running it on every PR
  # means whoever introduces the drift is the one who sees it.
  repo-lint:
    name: Repo lint (pre-commit, all files)
    runs-on: ubuntu-latest
    steps:
      # No persisted checkout token: this job executes repository-defined
      # pre-commit hooks, so the job's git config must not hand them a
      # credential they never need (hook repos clone over anonymous https).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      # pre-commit builds an isolated env per hook repo on every run — four
      # virtualenvs plus a node env — and they only change when a `rev:` in
      # .pre-commit-config.yaml does. Measured locally: ~25s of env building
      # collapses to ~0.3s warm, against a 113 MB dir that compresses to ~37 MB.
      #
      # `env.pythonLocation` is in the key because the cached envs are bound to
      # an exact interpreter: pre-commit health-checks pyvenv.cfg against the
      # live python and rebuilds on mismatch, and setup-python floats the patch
      # version — without it the runner would periodically restore 37 MB and
      # immediately discard it. That variable is exported by actions/setup-python
      # inside setup-python-env, so this step MUST come after it, and after
      # checkout so hashFiles can see the config.
      #
      # The whole directory is cached, not just the repo dirs: db.db is the
      # url+rev -> dir index, and restoring one without the other desynchronises
      # them. Note this cache deliberately contains no ruff env, since SKIP
      # suppresses installing those hooks — do not reuse this key from a job
      # that actually runs ruff.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-${{ env.pythonLocation }}-
      # `pytest` in SKIP is a no-op kept for clarity: that local hook is
      # stages: [push], so it never runs at the default stage anyway.
      - name: Pre-commit (non-ruff, non-pytest hooks)
        run: |
          . .venv/bin/activate
          SKIP=ruff-check,ruff-format,pytest pre-commit run --all-files

  backend-test:
    name: Backend tests (py${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python }}
      - uses: ./.github/actions/setup-task
      - name: Core suite (coverage-gated)
        run: task be:test:ci
      - name: aiq_api plugin suite
        run: task be:test:api:ci
      - name: Coverage comment (backend)
        if: github.event_name == 'pull_request' && matrix.python == '3.13'
        continue-on-error: true # never fail CI on a comment hiccup
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-xml-coverage-path: coverage.xml
          title: Backend coverage (src/aiq_agent)
          unique-id-for-comment: backend-coverage

  # `task fe:verify` runs lint -> types -> tests -> build in series, which is
  # right locally but wasteful here: on a 2-core runner the four steps measured
  # 25s + 38s + 264s + 89s, so the tests alone were ~63% of the job and
  # everything else waited on them. The work is split across jobs that run
  # concurrently, and the suite itself is sharded. Each piece still runs through
  # the root Taskfile, so a local `task fe:verify` executes the same commands.
  frontend:
    name: Frontend (lint, types, build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      # These jobs run PR-controlled code — `bun install` executes dependency
      # lifecycle scripts and the suite runs the app itself — so the checkout
      # must not leave a repository credential in .git/config for them to find.
      # Nothing here needs authenticated git: there are no git-URL dependencies
      # in frontends/ui, and the artifact round-trip uses the Actions API.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Node stays the RUNTIME (and Turbopack's PostCSS step spawns a real
      # `node`); Bun is only the installer and script runner.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-task
      - run: task fe:install
      - run: task fe:lint
      - run: task fe:types
      - run: task fe:build

  frontend-test:
    name: Frontend tests (shard ${{ matrix.shard }}/6)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    strategy:
      # One shard's failure should not hide the others' results.
      fail-fast: false
      # Six, not four. Measured per-shard wall clock locally at 2 workers (to
      # match the 2-core runners), calibrated against the real N=4 CI run — the
      # runners came out 1.68x slower, and the model then predicted N=4's slowest
      # job at 194s against an actual 194s.
      #
      #   N=4   slowest 194s    N=6   152s    N=8   132s    N=10  ~116s
      #
      # So 4->6 buys 42s, 6->8 only 20s more, and each step adds ~14% runner
      # time — this is where the curve flattens. Note the floor: vitest shards by
      # FILE, and InputArea.spec.tsx alone is 45.9s of the suite's 209.6s of test
      # execution, so it lands in whichever shard is slowest at every N. Raising N
      # further cannot beat that file; splitting it can.
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      # These jobs run PR-controlled code — `bun install` executes dependency
      # lifecycle scripts and the suite runs the app itself — so the checkout
      # must not leave a repository credential in .git/config for them to find.
      # Nothing here needs authenticated git: there are no git-URL dependencies
      # in frontends/ui, and the artifact round-trip uses the Actions API.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-task
      - run: task fe:install
      - run: task fe:test:shard SHARD=${{ matrix.shard }}/6
      # Coverage is collected per shard and merged below: a shard only ever
      # loads its own slice of the app, so its coverage is meaningless alone and
      # cannot be recomputed afterwards from the others.
      - uses: actions/upload-artifact@v4
        # A failing shard still wrote its blob, and the merged report is where a
        # reviewer will look — without this the upload is skipped on failure and
        # the merge job silently reports on a subset.
        if: always()
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: frontends/ui/.vitest-reports
          include-hidden-files: true
          retention-days: 1

  frontend-coverage:
    name: Frontend coverage
    needs: [changes, frontend-test]
    # Runs whenever the shards ran at all: a failing shard still produced a blob,
    # and the merged report is the most useful thing to look at when one fails.
    if: ${{ !cancelled() && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # These jobs run PR-controlled code — `bun install` executes dependency
      # lifecycle scripts and the suite runs the app itself — so the checkout
      # must not leave a repository credential in .git/config for them to find.
      # Nothing here needs authenticated git: there are no git-URL dependencies
      # in frontends/ui, and the artifact round-trip uses the Actions API.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-task
      - run: task fe:install
      - uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          merge-multiple: true
          path: frontends/ui/.vitest-reports
      - run: task fe:test:merge
      - name: Coverage comment (frontend)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: frontends/ui

  web:
    name: Web (Astro check + build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontends/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontends/web/package-lock.json
      - uses: ./.github/actions/setup-task
      # Astro reprocesses every blog image on a cold cache — the first CMS
      # upload alone cost ~25s of the job. The cache is keyed on the image
      # sources so it only misses when an image actually changed; `restore-keys`
      # makes that miss a partial hit (the unchanged images stay warm) instead of
      # a full reprocess. `cacheDir` puts it outside node_modules, where
      # `task web:install`'s `npm ci` would otherwise delete it.
      - uses: actions/cache@v4
        with:
          path: frontends/web/.astro-cache
          key: astro-cache-${{ runner.os }}-${{ hashFiles('frontends/web/src/content/blog/_images/**', 'frontends/web/src/assets/**') }}
          restore-keys: |
            astro-cache-${{ runner.os }}-
      - run: task web:verify
        working-directory: .

  infra:
    name: Infra (Pulumi typecheck)
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/pulumi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deploy/pulumi/package-lock.json
      - run: npm ci
      # The policy pack is its own Node program with its own lockfile; a rule
      # that no longer compiles would otherwise only surface at deploy time,
      # i.e. with the guardrails already load-bearing.
      - run: npm ci
        working-directory: deploy/pulumi/policy
      - uses: ./.github/actions/setup-task
      # Type-checks every `spec` written against the @kubernetes-models CRD
      # types (Gateway API / Envoy Gateway / cert-manager) AND the policy pack.
      # The deeper gates — `pulumi preview` + schema-validate every CR + the
      # CrossGuard policy pack — need stack credentials and still run in
      # deploy.yml; this is the part that can run on an untrusted PR.
      - run: task infra:types
        working-directory: .

  ci-ok:
    name: CI OK
    if: always()
    # `frontend-coverage` is deliberately NOT here. It is serialised after all
    # four shards but produces only the coverage comment — correctness is
    # already gated by the shards themselves, which do fail this gate. Requiring
    # it added ~58s to every run (shards finished 18:57:57, CI OK landed
    # 18:58:55) for a job whose real work is a 5s merge. It still reports its own
    # red check if the merge breaks; it just no longer holds the gate open.
    needs: [changes, backend-lint, backend-test, frontend, frontend-test, web, infra, repo-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Require needed jobs to have passed (skipped is fine)
        run: |
          python3 - <<'EOF'
          import json, sys
          needs = json.loads('''${{ toJSON(needs) }}''')
          failed = {k: v["result"] for k, v in needs.items() if v["result"] not in ("success", "skipped")}
          if failed:
              print("Failing jobs:", failed)
              sys.exit(1)
          print("All required jobs passed or were skipped.")
          EOF
