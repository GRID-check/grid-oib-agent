name: AIQ CI

# Runs on PRs (so problems are caught BEFORE merge) and on pushes to the
# integration/release branches. This is a private repo — all PR authors are
# trusted collaborators — so PRs run CI directly; the former NVIDIA
# copy-pr-bot / pull-request-branch mirroring (for untrusted external PRs) was
# removed. If this repo is ever opened to external contributors, gate secret-
# using jobs behind an environment/approval before restoring fork PR runs.
on:
  push:
    branches:
      - develop
      - "release/**"
  pull_request:
    branches:
      - develop
      - "release/**"

permissions:
  contents: read

concurrency:
  group: aiq-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Lint and Hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check

      - name: Install dev dependencies
        run: |
          uv venv --python 3.13 .venv
          uv sync --group dev
          uv pip install nbconvert

      - name: Ruff checks
        run: |
          . .venv/bin/activate
          ruff check .
          ruff format --check .

      - name: Run remaining pre-commit hooks
        run: |
          . .venv/bin/activate
          SKIP=ruff-check,ruff-format,pytest pre-commit run --all-files

  test:
    name: Pytest and Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install test dependencies
        run: |
          uv venv --python 3.13 .venv
          uv sync --group dev

      # Core backend suite (tests/ + sources/**/tests via testpaths). This is
      # the coverage-gated package.
      - name: Backend core tests (gated coverage)
        run: |
          set -euo pipefail
          . .venv/bin/activate
          python -X faulthandler -m pytest tests/ -v \
            --junitxml=report.xml \
            --cov=src/aiq_agent \
            --cov-report=xml \
            --cov-report=term \
            --cov-fail-under=65

      # The aiq_api plugin suite lives outside `tests/` and was NEVER run in CI
      # before — every frontends/aiq_api/tests/* file (job submit/access,
      # deep-research, ingest, the DB-executor + pub/sub tests) went unchecked.
      - name: aiq_api plugin tests
        run: |
          set -euo pipefail
          . .venv/bin/activate
          python -X faulthandler -m pytest frontends/aiq_api/tests/ -v \
            --junitxml=report-aiqapi.xml \
            --cov=frontends/aiq_api/src/aiq_api \
            --cov-report=xml:coverage-aiqapi.xml \
            --cov-report=term

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-coverage
          path: |
            report.xml
            report-aiqapi.xml
            coverage.xml
            coverage-aiqapi.xml
          retention-days: 7

  test-scripts:
    name: Script Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install script test dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.13 .venv
          uv sync --group dev
          for pkg in \
            ./frontends/benchmarks/freshqa \
            ./frontends/benchmarks/intent_classifier
          do
            if [ -d "$pkg" ]; then
              uv pip install --no-deps -e "$pkg"
            fi
          done

      - name: Run script tests
        run: |
          . .venv/bin/activate
          chmod +x ci/scripts/test_scripts.sh
          ci/scripts/test_scripts.sh --skip-setup
