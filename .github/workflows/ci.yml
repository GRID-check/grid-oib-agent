name: CI

# One consolidated pipeline for the monorepo. A path filter runs only the
# backend and/or frontend jobs a change actually touches; the `ci-ok` gate at
# the end is the single required status check for branch protection (it passes
# when every needed job succeeded or was skipped). Private repo -> PRs run
# directly (no copy-pr-bot).
on:
  push:
    branches: [develop, "release/**"]
  pull_request:
    branches: [develop, "release/**"]

permissions:
  contents: read
  pull-requests: write # coverage sticky comments (same-repo PRs)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'frontends/aiq_api/**'
              - 'sources/**'
              - 'tests/**'
              - 'ci/**'
              - 'configs/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            frontend:
              - 'frontends/ui/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'deploy/**'
              - '.github/workflows/ci.yml'

  backend-lint:
    name: Backend lint
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
      - name: Ruff
        run: |
          . .venv/bin/activate
          ruff check .
          ruff format --check .

  # Deliberately NOT behind a paths filter. `pre-commit run --all-files` scans
  # the WHOLE repo, so gating it on the backend filter meant a PR touching only
  # deploy/** or frontends/ui/** could land drift on develop that stayed
  # invisible until some later, unrelated backend PR tripped over it — which is
  # exactly how the secrets baseline kept breaking CI. Running it on every PR
  # means whoever introduces the drift is the one who sees it.
  repo-lint:
    name: Repo lint (pre-commit, all files)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      # No persisted checkout token: this job executes repository-defined
      # pre-commit hooks, so the job's git config must not hand them a
      # credential they never need (hook repos clone over anonymous https).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - name: Pre-commit (non-ruff, non-pytest hooks)
        run: |
          . .venv/bin/activate
          SKIP=ruff-check,ruff-format,pytest pre-commit run --all-files

  backend-test:
    name: Backend tests (py${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python }}
      - name: Core suite (coverage-gated)
        run: |
          set -euo pipefail
          . .venv/bin/activate
          python -X faulthandler -m pytest tests/ -v \
            --junitxml=report-core.xml \
            --cov=src/aiq_agent --cov-report=xml:coverage.xml --cov-report=term \
            --cov-fail-under=65
      - name: aiq_api plugin suite
        run: |
          set -euo pipefail
          . .venv/bin/activate
          python -X faulthandler -m pytest frontends/aiq_api/tests/ -v \
            --junitxml=report-aiqapi.xml \
            --cov=frontends/aiq_api/src/aiq_api --cov-report=xml:coverage-aiqapi.xml --cov-report=term
      - name: Coverage comment (backend)
        if: github.event_name == 'pull_request' && matrix.python == '3.13'
        continue-on-error: true # never fail CI on a comment hiccup
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-xml-coverage-path: coverage.xml
          title: Backend coverage (src/aiq_agent)
          unique-id-for-comment: backend-coverage

  frontend:
    name: Frontend (lint, types, test, build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: frontends/ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontends/ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      # json-summary/json feed the coverage comment below.
      - run: npm run test:ci -- --coverage.reporter=json-summary --coverage.reporter=json
      - run: npm run build
      - name: Coverage comment (frontend)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: frontends/ui

  infra:
    name: Infra (Pulumi typecheck)
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: deploy/pulumi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deploy/pulumi/package-lock.json
      - run: npm ci
      # Type-checks every `spec` written against the @kubernetes-models CRD
      # types (Gateway API / Envoy Gateway / cert-manager). The deeper gate —
      # `npm run validate` (pulumi preview + schema-validate every CR) — needs
      # stack credentials and still runs in deploy.yml; this is the part that
      # can run on an untrusted PR.
      - run: npm run typecheck

  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, backend-lint, backend-test, frontend, infra, repo-lint]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Require needed jobs to have passed (skipped is fine)
        run: |
          python3 - <<'EOF'
          import json, sys
          needs = json.loads('''${{ toJSON(needs) }}''')
          failed = {k: v["result"] for k, v in needs.items() if v["result"] not in ("success", "skipped")}
          if failed:
              print("Failing jobs:", failed)
              sys.exit(1)
          print("All required jobs passed or were skipped.")
          EOF
