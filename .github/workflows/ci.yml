name: CI

# One consolidated pipeline for the monorepo. A path filter runs only the
# backend and/or frontend jobs a change actually touches; the `ci-ok` gate at
# the end is the single required status check for branch protection (it passes
# when every needed job succeeded or was skipped). Private repo -> PRs run
# directly (no copy-pr-bot). A push whose tree a green pull_request run already
# tested skips every job and passes (`changes`, ci/reuse_green_run.py).
on:
  push:
    branches: [develop, "release/**"]
  pull_request:
    branches: [develop, "release/**"]

permissions:
  contents: read
  pull-requests: write # coverage sticky comments (same-repo PRs)

concurrency:
  # A push gets a group of its own. GitHub drops a pending run when a newer run
  # joins its group, and that newer run's diff covers only its own push, so the
  # dropped push's checks would never run. A PR keeps one group: its newer push
  # may cancel the older run, because every PR run diffs the whole PR (`changes`).
  group: ${{ github.event_name == 'push' && format('ci-push-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # find the pull request run's green marker (ci/reuse_green_run.py)
    outputs:
      # 'true' when this push's tree already passed in full on its pull request.
      # The filter then does not run, every tier reads 'false', every job below
      # skips, and CI OK passes: the run still concludes `success` for deploy.yml.
      reused: ${{ steps.reuse.outputs.hit || 'false' }}
      backend: ${{ steps.filter.outputs.backend || 'false' }}
      frontend: ${{ steps.filter.outputs.frontend || 'false' }}
      web: ${{ steps.filter.outputs.web || 'false' }}
      infra: ${{ steps.filter.outputs.infra || 'false' }}
      packages: ${{ steps.filter.outputs.packages || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          # synchronize checks out the PR head. The default PR checkout is a
          # merge commit, which would mix develop into the diff.
          ref: ${{ github.event.action == 'synchronize' && (github.event.pull_request.head.sha || github.sha) || github.sha }}
      # A squash merge onto a base that has not moved lands exactly the tree the
      # PR's last run tested, so on push this looks for that run's green marker
      # (uploaded by CI OK below) and skips the re-run on a hit. Only a completed,
      # successful pull_request run of this same, unmodified workflow from this
      # repository counts. A miss or any error runs everything, as does a failure
      # of this step (continue-on-error leaves `hit` unset).
      - name: Reuse the pull request's green result for this tree
        id: reuse
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ci/reuse_green_run.py ci-green
      - uses: dorny/paths-filter@v4
        id: filter
        if: steps.reuse.outputs.hit != 'true'
        with:
          # One definition, read by this workflow and by Docker Build. What each
          # family means, and why the image scopes are separate: .github/filters.yml
          filters: .github/filters.yml
          # Empty token → git diff, so `base` is honoured on pull_request.
          # pull_request: the whole PR against its base, on every push. Diffing
          # only the last push skipped any tier an earlier, cancelled run owed,
          # and a skipped tier counts as passed. security.yml and docker-build.yml
          # carry the same expression.
          # push: this push vs event.before.
          token: ''
          base: ${{ github.event.pull_request.base.sha || github.event.before }}

  backend-lint:
    name: Backend lint
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
      - uses: ./.github/actions/setup-task
      # Defined in the root Taskfile so `task be:lint` locally runs exactly this.
      - run: task be:lint

  # Deliberately NOT behind a paths filter. `pre-commit run --all-files` scans
  # the WHOLE repo, so gating it on the backend filter meant a PR touching only
  # deploy/** or frontends/ui/** could land drift on develop that stayed
  # invisible until some later, unrelated backend PR tripped over it. Running it
  # on every PR means whoever introduces the drift is the one who sees it.
  #
  # It does wait for `changes`, for one answer only: a push whose tree already
  # passed on its pull request skips this too.
  repo-lint:
    name: Repo lint (pre-commit, all files)
    needs: changes
    if: needs.changes.outputs.reused != 'true'
    runs-on: ubuntu-latest
    steps:
      # No persisted checkout token: this job executes repository-defined
      # pre-commit hooks, so the job's git config must not hand them a
      # credential they never need (hook repos clone over anonymous https).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      # pre-commit builds an isolated env per hook repo on every run — four
      # virtualenvs plus a node env — and they only change when a `rev:` in
      # .pre-commit-config.yaml does. Measured locally: ~25s of env building
      # collapses to ~0.3s warm, against a 113 MB dir that compresses to ~37 MB.
      #
      # `env.pythonLocation` is in the key because the cached envs are bound to
      # an exact interpreter: pre-commit health-checks pyvenv.cfg against the
      # live python and rebuilds on mismatch, and setup-python floats the patch
      # version — without it the runner would periodically restore 37 MB and
      # immediately discard it. That variable is exported by actions/setup-python
      # inside setup-python-env, so this step MUST come after it, and after
      # checkout so hashFiles can see the config.
      #
      # The whole directory is cached, not just the repo dirs: db.db is the
      # url+rev -> dir index, and restoring one without the other desynchronises
      # them.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-${{ env.pythonLocation }}-
      - name: Pre-commit (all hooks)
        run: |
          . .venv/bin/activate
          pre-commit run --all-files
      - uses: ./.github/actions/setup-task
      # The other half of `task lint:repo`, and deliberately in THIS job rather
      # than behind a paths filter: `skills/` is the source, `.claude/` and
      # `.agents/` are generated and gitignored, and apm.lock.yaml records
      # hashes of both — so an edit to a skill that was never re-locked appears
      # in no diff at all. It went unnoticed for seven files until an audit was
      # run by hand. `apm audit` exits 0 on drift; `task agents:audit` is the
      # wrapper that does not.
      - name: Agent-skill lockfile (apm)
        run: task agents:audit

  backend-test:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
        with:
          # ONE version, stated once, everywhere: the interpreter the backend
          # image ships (`deploy/Dockerfile`) is the one this suite runs on.
          # The old 3.12/3.13 matrix guarded a version nobody deployed and
          # cost real debugging time (ToolNode batch order differs per
          # interpreter; see the gotchas register).
          python-version: "3.14"
      - uses: ./.github/actions/setup-task
      - name: Core suite (coverage-gated)
        run: task be:test:ci
      - name: Coverage comment (backend)
        if: github.event_name == 'pull_request'
        continue-on-error: true # never fail CI on a comment hiccup
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-xml-coverage-path: coverage.xml
          title: Backend coverage (src/aiq_agent)
          unique-id-for-comment: backend-coverage

  # The aiq_api and sources/ suites ran as steps after the core suite in
  # `backend-test`, so the job paid for all three in series (core 2m17s, then
  # aiq_api 50s, then sources 7s). They share nothing with the core suite but
  # the environment, so they run beside it. `task be:verify` still runs all
  # three locally.
  backend-test-plugins:
    name: Backend tests (aiq_api, sources)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.14" # same interpreter as `backend-test`
      - uses: ./.github/actions/setup-task
      - name: aiq_api plugin suite
        run: task be:test:api:ci
      # sources/ is its own suite, not part of tests/. Same definition as the
      # local `task be:verify`.
      - name: sources/ package suites
        run: task be:test:sources

  # `task fe:verify` runs lint -> types -> tests -> build in series, which is
  # right locally but wasteful here: on a 2-core runner the four steps measured
  # 25s + 38s + 264s + 89s, so the tests alone were ~63% of the job and
  # everything else waited on them. The work is split across jobs that run
  # concurrently, and the suite itself is sharded. Each piece still runs through
  # the root Taskfile, so a local `task fe:verify` executes the same commands.
  frontend:
    name: Frontend (lint, types, build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      # These jobs run PR-controlled code — `bun install` executes dependency
      # lifecycle scripts and the suite runs the app itself — so the checkout
      # must not leave a repository credential in .git/config for them to find.
      # Nothing here needs authenticated git: there are no git-URL dependencies
      # in frontends/ui, and the artifact round-trip uses the Actions API.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Node stays the RUNTIME (and Turbopack's PostCSS step spawns a real
      # `node`); Bun is only the installer and script runner.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-task
      - run: task fe:install
      - run: task fe:cards:check
      - run: task fe:lint
      - run: task fe:types
      - run: task fe:build

  tenant-isolation:
    # The ONLY check that proves tenant isolation actually holds. The unit suite
    # cannot: `tenant-isolation.integration.spec.ts` self-skips without a
    # database, so without this job CI is green whether the policies work or
    # not. It also runs migrations as a non-superuser owner, which is what
    # catches privilege mistakes that a superuser-run migration hides.
    name: Tenant isolation (row-level security)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-task
      - run: task fe:install
      # ubuntu-latest ships PostgreSQL server binaries but does not run a
      # cluster; the script builds a throwaway one and tears it down.
      - name: Tenant-isolation suite against a real Postgres
        run: task db:test:rls
        env:
          # Turns "the suite skipped" into a failure for THIS job only. The
          # suite self-skips without a database, and the unit shards legitimately
          # have none — so the demand for one has to come from the job that is
          # supposed to provide it, not from `CI` being set.
          GRID_RLS_SUITE_REQUIRED: "1"

  frontend-test:
    name: Frontend tests (shard ${{ matrix.shard }}/6)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    strategy:
      # One shard's failure should not hide the others' results.
      fail-fast: false
      # Six, not four. Measured per-shard wall clock locally at 2 workers (to
      # match the 2-core runners), calibrated against the real N=4 CI run — the
      # runners came out 1.68x slower, and the model then predicted N=4's slowest
      # job at 194s against an actual 194s.
      #
      #   N=4   slowest 194s    N=6   152s    N=8   132s    N=10  ~116s
      #
      # So 4->6 buys 42s, 6->8 only 20s more, and each step adds ~14% runner
      # time — this is where the curve flattens. Note the floor: vitest shards by
      # FILE, and InputArea.spec.tsx alone is 45.9s of the suite's 209.6s of test
      # execution, so it lands in whichever shard is slowest at every N. Raising N
      # further cannot beat that file; splitting it can.
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      # These jobs run PR-controlled code — `bun install` executes dependency
      # lifecycle scripts and the suite runs the app itself — so the checkout
      # must not leave a repository credential in .git/config for them to find.
      # Nothing here needs authenticated git: there are no git-URL dependencies
      # in frontends/ui, and the artifact round-trip uses the Actions API.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-task
      - run: task fe:install
      - run: task fe:test:shard SHARD=${{ matrix.shard }}/6
      # Coverage is collected per shard and merged below: a shard only ever
      # loads its own slice of the app, so its coverage is meaningless alone and
      # cannot be recomputed afterwards from the others.
      - uses: actions/upload-artifact@v7
        # A failing shard still wrote its blob, and the merged report is where a
        # reviewer will look — without this the upload is skipped on failure and
        # the merge job silently reports on a subset.
        if: always()
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: frontends/ui/.vitest-reports
          include-hidden-files: true
          retention-days: 1

  frontend-coverage:
    name: Frontend coverage
    needs: [changes, frontend-test]
    # Runs whenever the shards ran at all: a failing shard still produced a blob,
    # and the merged report is the most useful thing to look at when one fails.
    if: ${{ !cancelled() && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # These jobs run PR-controlled code — `bun install` executes dependency
      # lifecycle scripts and the suite runs the app itself — so the checkout
      # must not leave a repository credential in .git/config for them to find.
      # Nothing here needs authenticated git: there are no git-URL dependencies
      # in frontends/ui, and the artifact round-trip uses the Actions API.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-task
      - run: task fe:install
      - uses: actions/download-artifact@v8
        with:
          pattern: vitest-blob-*
          merge-multiple: true
          path: frontends/ui/.vitest-reports
      - run: task fe:test:merge
      - name: Coverage comment (frontend)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: frontends/ui

  web:
    name: Web (Astro check + build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontends/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontends/web/package-lock.json
      - uses: ./.github/actions/setup-task
      # Astro reprocesses every blog image on a cold cache — the first CMS
      # upload alone cost ~25s of the job. The cache is keyed on the image
      # sources so it only misses when an image actually changed; `restore-keys`
      # makes that miss a partial hit (the unchanged images stay warm) instead of
      # a full reprocess. `cacheDir` puts it outside node_modules, where
      # `task web:install`'s `npm ci` would otherwise delete it.
      - uses: actions/cache@v6
        with:
          path: frontends/web/.astro-cache
          key: astro-cache-${{ runner.os }}-${{ hashFiles('frontends/web/src/content/blog/_images/**', 'frontends/web/src/assets/**') }}
          restore-keys: |
            astro-cache-${{ runner.os }}-
      - run: task web:verify
        working-directory: .

  infra:
    name: Infra (Pulumi typecheck)
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/pulumi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deploy/pulumi/package-lock.json
      - run: npm ci
      # The policy pack is its own Node program with its own lockfile; a rule
      # that no longer compiles would otherwise only surface at deploy time,
      # i.e. with the guardrails already load-bearing.
      - run: npm ci
        working-directory: deploy/pulumi/policy
      - uses: ./.github/actions/setup-task
      # Type-checks every `spec` written against the @kubernetes-models CRD
      # types (Gateway API / Envoy Gateway / cert-manager) AND the policy pack.
      # The deeper gates — `pulumi preview` + schema-validate every CR + the
      # CrossGuard policy pack — need stack credentials and still run in
      # deploy.yml; this is the part that can run on an untrusted PR.
      - run: task infra:types
        working-directory: .
      # Manifest assertions under `pulumi.runtime.setMocks` — no cluster, no
      # stack credentials, so this is the part of the deeper gate that CAN run
      # on an untrusted PR. It catches the class tsc cannot: a renamed weed
      # flag, a Service missing the gRPC port `weed shell` needs, a liveness
      # probe on an endpoint that answers 423.
      - run: task infra:test
        working-directory: .

  packages:
    # The `packages/` directory had NO gate at all: no Taskfile target, no CI
    # job, no pre-commit hook — 830 tests behind a default-ON feature that
    # renders OIB compliance verdicts, and the only thing between a broken
    # assertion and a customer was somebody remembering to run pytest by hand.
    # Same shape as `sources/` before it, and the same fix.
    #
    # Its own job rather than a step in `backend-test`/`frontend`, because both
    # packages sit OUTSIDE their neighbouring workspace: `ifc-spatial` has its
    # own package-lock.json (not the UI's bun workspace) and `ifc-spatial-py`
    # its own uv.lock (not the root uv workspace), so neither tier's install
    # can run them.
    name: Standalone packages (packages/)
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    steps:
      # Runs PR-controlled code (`npm ci` executes dependency lifecycle scripts,
      # and the suites run the packages themselves), so no repository credential
      # is left in .git/config for them to find.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/ifc-spatial/package-lock.json
      # ifc-spatial-py resolves against its OWN uv.lock, not the root one, so the
      # cache has to be keyed on that file — pointing it at the repo-root lock
      # would restore an environment this suite never uses and then build the
      # real one from scratch on every run. It is the expensive half of this job
      # (636 tests, 3m55s measured locally) and it drags IfcOpenShell + shapely
      # wheels in, so the cache is the difference between ~4 and ~6 minutes.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: packages/ifc-spatial-py/uv.lock
      - uses: ./.github/actions/setup-task
      - name: Install the packages' own toolchains
        run: task pkg:install
      # Two steps, not `task pkg:test`, so the job's summary says WHICH package
      # failed without opening the log.
      - name: ifc-spatial (tests + typecheck)
        run: task pkg:test:ts
      - name: ifc-spatial-py (pytest)
        run: task pkg:test:py

  release-note:
    name: Release note
    # The note lint runs on every pull request and push, so a push straight to
    # release/** is still checked; only the require-a-note step reads a PR (its
    # base and its labels). Skipped like every other job when a push reuses its
    # pull request's green result for the same tree.
    needs: changes
    if: needs.changes.outputs.reused != 'true'
    # Deliberately NOT behind a paths filter, and deliberately not part of the
    # backend tier: this job answers "does this change need a note, and does the
    # note read like something a customer can use?", which is a question about
    # the whole PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The require-a-note check diffs against the merge base, so the base
          # branch has to be there. Shallow-by-default checkout has neither.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # The house rules on note prose (plain sentences, no internal references,
      # no reStructuredText) — the notes are published verbatim to piloti.at.
      - name: Lint the notes
        run: uv run --no-project --with reno==4.1.0 python scripts/release_notes.py lint

      - name: reno lint
        run: uv run --no-project --with reno==4.1.0 reno --rel-notes-dir releasenotes lint .

      # AGENTS.md: a change a customer can notice ships with its note in the same
      # PR. Enforced here rather than trusted, because the note is the first thing
      # that gets dropped under time pressure and the only thing the customer sees.
      # Escape hatch: the `no-release-note` label, for a PR that genuinely changes
      # nothing a user can observe. A push has no PR to label, so this step runs
      # on pull requests only.
      - name: Require a note for user-visible changes
        if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-release-note') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 ci/require_release_note.py "$BASE_SHA" "$HEAD_SHA"

  ci-ok:
    name: CI OK
    if: always()
    # `frontend-coverage` is deliberately NOT here. It is serialised after all
    # four shards but produces only the coverage comment — correctness is
    # already gated by the shards themselves, which do fail this gate. Requiring
    # it added ~58s to every run (shards finished 18:57:57, CI OK landed
    # 18:58:55) for a job whose real work is a 5s merge. It still reports its own
    # red check if the merge breaks; it just no longer holds the gate open.
    #
    # `tenant-isolation` IS here, and must stay: it is the only check that proves
    # the row-level-security boundary actually holds (ADR-0041). The unit shards
    # cannot — the integration suite self-skips without a database.
    #
    # `retrieval-eval` USED TO BE here, for the same reason: it was the only
    # check that proved a chunker still leaves Punkte as citable units
    # (ADR-0058 rule 7). It is gone, deliberately, and the reason is written
    # down here rather than deleted with it: the gate reads the real OIB
    # Richtlinien, and those are now operator-provided and gitignored
    # (data/oib/README.md), so no CI checkout can ever have a corpus to measure.
    # A job that can only pass vacuously is worse than no job.
    #
    # The harness survives as an opt-in local tool (`task be:eval:retrieval`),
    # and it now says so when the corpus is absent instead of raising.
    # What restoring the gate would take, and what was lost with it:
    # docs/adr/0058-retrieval-correctness-and-the-measurement-gate.md,
    # "Update (2026-09-09)".
    needs: [changes, backend-lint, backend-test, backend-test-plugins, frontend, frontend-test, tenant-isolation, web, infra, packages, repo-lint, release-note]
    runs-on: ubuntu-latest
    steps:
      - name: Require needed jobs to have passed (skipped is fine)
        run: |
          python3 - <<'EOF'
          import json, sys
          needs = json.loads('''${{ toJSON(needs) }}''')
          failed = {k: v["result"] for k, v in needs.items() if v["result"] not in ("success", "skipped")}
          if failed:
              print("Failing jobs:", failed)
              sys.exit(1)
          print("All required jobs passed or were skipped.")
          EOF
      # A green pull_request run leaves a marker named for the tree it tested
      # (GITHUB_SHA is the merge commit every job checked out), so the push that
      # lands this exact tree can reuse the result: `changes` reads it. After the
      # check above and without always(), so a failing gate uploads nothing, and
      # the push still demands that the whole run concluded `success`. Best
      # effort: a hiccup here costs the push a full re-run, never this gate.
      - name: Name the tree this run tested
        id: tree
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)"
          [[ "$tree" =~ ^[0-9a-f]{40}$ ]]
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/green-run.txt"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - name: Record this tree as green
        if: github.event_name == 'pull_request' && steps.tree.outputs.tree != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ci-green-${{ steps.tree.outputs.tree }}
          path: ${{ runner.temp }}/green-run.txt
          retention-days: 7
          overwrite: true
