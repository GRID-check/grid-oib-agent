name: CI

# One consolidated pipeline for the monorepo. A path filter runs only the
# backend and/or frontend jobs a change actually touches; the `ci-ok` gate at
# the end is the single required status check for branch protection (it passes
# when every needed job succeeded or was skipped). Private repo -> PRs run
# directly (no copy-pr-bot).
on:
  push:
    branches: [develop, "release/**"]
  pull_request:
    branches: [develop, "release/**"]

permissions:
  contents: read
  pull-requests: write # coverage sticky comments (same-repo PRs)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'frontends/aiq_api/**'
              - 'sources/**'
              - 'tests/**'
              - 'ci/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            frontend:
              - 'frontends/ui/**'
              - '.github/workflows/ci.yml'
            deploy:
              - 'deploy/pulumi/**'
              - '.github/workflows/ci.yml'

  backend-lint:
    name: Backend lint
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
      - name: Ruff
        run: |
          . .venv/bin/activate
          ruff check .
          ruff format --check .
      - name: Pre-commit (non-ruff, non-pytest hooks)
        run: |
          . .venv/bin/activate
          SKIP=ruff-check,ruff-format,pytest pre-commit run --all-files

  backend-test:
    name: Backend tests (py${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python }}
      - name: Core suite (coverage-gated)
        run: |
          set -euo pipefail
          . .venv/bin/activate
          python -X faulthandler -m pytest tests/ -v \
            --junitxml=report-core.xml \
            --cov=src/aiq_agent --cov-report=xml:coverage.xml --cov-report=term \
            --cov-fail-under=65
      - name: aiq_api plugin suite
        run: |
          set -euo pipefail
          . .venv/bin/activate
          python -X faulthandler -m pytest frontends/aiq_api/tests/ -v \
            --junitxml=report-aiqapi.xml \
            --cov=frontends/aiq_api/src/aiq_api --cov-report=xml:coverage-aiqapi.xml --cov-report=term
      - name: Coverage comment (backend)
        if: github.event_name == 'pull_request' && matrix.python == '3.13'
        continue-on-error: true # never fail CI on a comment hiccup
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-xml-coverage-path: coverage.xml
          title: Backend coverage (src/aiq_agent)
          unique-id-for-comment: backend-coverage

      - name: Upload coverage (3.13 only, for Sonar)
        if: matrix.python == '3.13' && always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            coverage.xml
            coverage-aiqapi.xml
            report-core.xml
            report-aiqapi.xml
          retention-days: 7

  frontend:
    name: Frontend (lint, types, test, build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: frontends/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontends/ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      # json-summary/json feed the coverage comment; lcov feeds Sonar.
      - run: npm run test:ci -- --coverage.reporter=json-summary --coverage.reporter=json --coverage.reporter=lcov
      - run: npm run build
      - name: Coverage comment (frontend)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: frontends/ui
      - name: Upload frontend coverage (for Sonar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontends/ui/coverage/
          retention-days: 7

  deploy-pulumi:
    name: Deploy (Pulumi typecheck)
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: deploy/pulumi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deploy/pulumi/package-lock.json
      # `npm ci` restores the CRD-generated type packages
      # (@kubernetes-models/*). `tsc --noEmit` then validates every Gateway API /
      # Envoy Gateway / cert-manager CustomResource spec against the real CRD
      # schemas — a bad field fails here instead of at `pulumi up`.
      - run: npm ci
      - run: npm run typecheck

  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, backend-lint, backend-test, frontend, deploy-pulumi]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Require needed jobs to have passed (skipped is fine)
        run: |
          python3 - <<'EOF'
          import json, sys
          needs = json.loads('''${{ toJSON(needs) }}''')
          failed = {k: v["result"] for k, v in needs.items() if v["result"] not in ("success", "skipped")}
          if failed:
              print("Failing jobs:", failed)
              sys.exit(1)
          print("All required jobs passed or were skipped.")
          EOF
