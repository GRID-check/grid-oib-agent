name: Sync Labels

# Labels-as-code: creates/updates the repo labels from .github/labels.yml so
# they never have to be made by hand. Runs when the label file changes on
# develop, and on manual dispatch (use dispatch to seed the labels the first
# time, before this is merged you can also run it from the Actions tab on this
# branch). skip-delete keeps any labels not listed here.
on:
  push:
    branches: [develop]
    paths:
      - ".github/labels.yml"
      - ".github/workflows/labels.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Sync labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          yaml-file: .github/labels.yml
          skip-delete: true
