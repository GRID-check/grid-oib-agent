name: PR

# PR hygiene automation. Uses pull_request_target (base-repo context, so it can
# label and comment on PRs) but NEVER checks out or runs PR code — it only reads
# the event payload and the base-branch config, so it is safe with the write
# token.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      # The repo uses Conventional Commits and squash-merges the PR title, so
      # the title must itself be a valid conventional-commit subject.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            ci
            build
            chore
            revert

  closing-keywords:
    name: Closing keywords
    runs-on: ubuntu-latest
    steps:
      # GitHub closes an issue on merge only when a closing keyword stands
      # directly before its number: "Fixes #1, #2" closes #1 and leaves #2
      # open. #756 listed 40 issues that way and closed one. The body is read
      # from the event payload through the environment, never interpolated
      # into the script.
      - name: One keyword per issue
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          pattern='\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\b:?\s+#[0-9]+\s*(,|\band\b|&)\s*#[0-9]+'
          if printf '%s' "$BODY" | grep -Pqio "$pattern"; then
            printf '%s' "$BODY" | grep -Pio "$pattern" | sed 's/^/  /'
            echo "::error::A closing keyword is followed by a list of issues, and GitHub closes only the first. Write the keyword before every number: 'Fixes #1, fixes #2'."
            exit 1
          fi

  label:
    name: Auto-label by path
    runs-on: ubuntu-latest
    # Never block a PR on labeling (e.g. before the labels-as-code sync has
    # seeded them, or a transient labels API hiccup).
    continue-on-error: true
    steps:
      - uses: actions/labeler@v7.0.0
        with:
          sync-labels: true
