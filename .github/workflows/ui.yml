name: AIQ UI CI

# Runs on PRs and on pushes to develop/release, only when UI sources (or this
# workflow) change. Private repo -> PRs run directly; the copy-pr-bot mirroring
# was removed (see ci.yml). The former no-op `install` job was dropped: it ran
# `npm ci` and produced nothing, so every downstream job re-installed anyway —
# each job now installs once with the built-in npm cache.
on:
  push:
    branches:
      - develop
      - "release/**"
    paths:
      - "frontends/ui/**"
      - ".github/workflows/ui.yml"
  pull_request:
    branches:
      - develop
      - "release/**"
    paths:
      - "frontends/ui/**"
      - ".github/workflows/ui.yml"

permissions:
  contents: read

concurrency:
  group: aiq-ui-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontends/ui

jobs:
  lint:
    name: UI Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontends/ui/package-lock.json
      - run: npm ci
      - run: npm run lint

  type-check:
    name: UI Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontends/ui/package-lock.json
      - run: npm ci
      - run: npm run type-check

  unit-test:
    name: UI Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontends/ui/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - name: Upload UI coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-coverage
          path: frontends/ui/coverage/
          retention-days: 7

  build:
    name: UI Build
    runs-on: ubuntu-latest
    needs:
      - lint
      - type-check
      - unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontends/ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Upload UI build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-next-build
          path: frontends/ui/.next/
          retention-days: 7
