name: Claude Code Review

# Automatic PR review — no `@claude` mention needed. Runs the `code-review`
# skill from Anthropic's plugin marketplace against the PR diff and posts the
# findings as a review.
#
# Requires the `CLAUDE_CODE_OAUTH_TOKEN` repository secret (Pro/Max
# subscription token from `claude setup-token`).
#
# Cost note: this only fires when a PR is opened or moved out of draft, not on
# every push. Add `synchronize` to the trigger types below if you want a fresh
# review on each new commit (that bills one Claude run per push).
on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review PR
    # Draft PRs are reviewed once they are marked ready, not while in progress.
    # Dependabot PRs are skipped: claude-code-action refuses a bot actor ("Add
    # bot to allowed_bots list") so the job only ever failed there, and allowing
    # the bot would buy an LLM review of a lockfile bump, which CI (typecheck,
    # tests) already judges for free.
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b # v1.0.247
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: |
            --max-turns 20
