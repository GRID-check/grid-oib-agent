# Screenshot preview — when a PR changes a visual preview or the registry,
# capture the targets that are MISSING or STALE (a PNG absent, or a `/dev` route
# edited since its last capture), point reviewers at the PNGs from a sticky PR
# comment, and land them on the branch with a bot commit. `visual/pending.mjs` is
# the one definition of "needs a capture", shared with the `fe:test` registry
# gate, so a contributor in an environment where the harness cannot run (no
# browser, restricted sandbox) is healed by CI instead of blocked.
#
# The comment LINKS the artifact instead of embedding the images. This
# repository is private and GitHub renders comment images through its anonymous
# camo proxy, which gets a 404 for every URL into a private repo, so inline
# previews are impossible here.
#
# Capture, commit and comment are DELIBERATELY separate jobs: capture executes
# PR-controlled code (registry import, `bun install`, the app itself) with a read-only
# token and no persisted credential; the commit job checks out the captured SHA
# but runs no PR code — it copies only the artifact's PNGs and manifest — and the
# commenting job checks out nothing. The write scopes live only in those two.

name: Screenshot preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - frontends/ui/visual/registry.mjs
      # A preview route edit makes its shot stale; the workflow is what heals it.
      - frontends/ui/src/app/dev/**
      # Re-run when the workflow itself changes, so a fix to this plumbing is
      # exercised on the PR that makes it instead of on some later PR.
      - .github/workflows/screenshot-preview.yml

# One run per PR at a time; a fresh push cancels the stale comment build.
concurrency:
  group: screenshot-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Least privilege per job: the jobs that execute PR-controlled code (registry
# import, `bun install`, the harness) run read-only and persist no credential;
# only the commit job keeps one, because the push is its entire job and no
# PR-controlled code runs in it (see its checkout step).
permissions:
  contents: read

jobs:
  detect:
    name: Detect targets needing a capture
    runs-on: ubuntu-latest
    # Fork PRs get a read-only token and cannot receive comments — skip them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    outputs:
      has_new: ${{ steps.diff.outputs.has_new }}
      ids: ${{ steps.diff.outputs.ids }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: List the targets that need a capture
        id: diff
        working-directory: frontends/ui
        run: |
          set -euo pipefail
          # `pending.mjs` reads the registry and the manifest with Node's own
          # modules — no install, no browser — and IGNORES an id whose shape is
          # unsafe because ids flow into a shell command, a filename glob and a
          # comment body below.
          IDS=$(node visual/pending.mjs)

          echo "ids=$IDS" >> "$GITHUB_OUTPUT"
          if [ -n "$IDS" ]; then
            echo "has_new=true" >> "$GITHUB_OUTPUT"
            echo "Screenshot targets needing capture: $IDS"
          else
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            echo "Every registered target has current screenshots."
          fi

  # Untrusted half: runs PR code, holds no write scope and no credential.
  capture:
    name: Capture previews
    needs: detect
    if: needs.detect.outputs.has_new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      count: ${{ steps.stage.outputs.count }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # The steps below run PR-controlled dependency scripts and app code —
          # they must never find a repository credential in the workspace.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: ./.github/actions/setup-bun

      - name: Install dependencies
        working-directory: frontends/ui
        run: bun install --frozen-lockfile

      - name: Cache the Playwright Chromium download
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontends/ui/bun.lock') }}

      - name: Install Chromium for playwright-core
        # The `/opt/pw-browsers` pre-install in docs/ux/visual-screenshots.md is the
        # DEV-CONTAINER contract; CI runners ship no such browser, so playwright-core
        # fetches its own here — the cache above keeps that to once per lockfile.
        working-directory: frontends/ui
        # `--no-install`: playwright-core is a frozen direct dependency with a
        # declared CLI binary, so a miss here means the install above is broken —
        # fail instead of silently fetching a package from the network.
        run: npx --no-install playwright-core install chromium

      - name: Cache the Turbopack dev compile
        # The harness runs `next dev`, which compiles each preview route on demand —
        # from cold that is by far the longest part of the job. Turbopack persists
        # its work here, so restoring it turns most of that compile into a cache hit.
        # `restore-keys` makes a near-miss (a source change since the last run) still
        # useful: Turbopack revalidates what changed instead of rebuilding everything.
        uses: actions/cache@v6
        with:
          path: frontends/ui/.next/dev/cache
          key: turbopack-dev-${{ runner.os }}-${{ hashFiles('frontends/ui/bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbopack-dev-${{ runner.os }}-${{ hashFiles('frontends/ui/bun.lock') }}-
            turbopack-dev-${{ runner.os }}-

      - name: Capture screenshots for the pending targets
        working-directory: frontends/ui
        env:
          IDS: ${{ needs.detect.outputs.ids }}
        # Unquoted on purpose: the ids are a validated, space-separated list.
        run: bun run screenshots -- $IDS

      - name: Stage generated PNGs and the manifest
        id: stage
        working-directory: frontends/ui
        env:
          IDS: ${{ needs.detect.outputs.ids }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # NOT a dot-directory: actions/upload-artifact skips hidden paths
          # unless `include-hidden-files` is set, so the previous `.preview-out`
          # staged four PNGs and then uploaded an empty artifact, which is why
          # every preview comment reported "produced no files".
          OUT="$GITHUB_WORKSPACE/preview-out"
          mkdir -p "$OUT"
          for id in $IDS; do
            for f in "visual/screenshots/$id".*.png; do
              cp "$f" "$OUT/"
            done
          done
          # The manifest travels with the PNGs: the commit job lands it verbatim,
          # because only the capture job's checkout has the route sources the
          # hashes were taken from.
          cp visual/screenshots.manifest.json "$OUT/"
          echo "count=$(find "$OUT" -maxdepth 1 -name '*.png' | wc -l)" >> "$GITHUB_OUTPUT"
          ls -la "$OUT"

      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: screenshot-previews
          path: preview-out
          if-no-files-found: ignore

  # Trusted write half: it checks out the PR branch and copies ONLY the artifact
  # the capture job produced — no PR code runs here, no dependency install, no
  # harness. That separation is what keeps a write-scoped token out of reach of
  # the PR-controlled half. The `synchronize` event the push fires runs this
  # workflow again; by then nothing is pending, so it converges rather than loops.
  commit:
    name: Commit regenerated screenshots
    needs: [detect, capture]
    if: ${{ !cancelled() && needs.detect.outputs.has_new == 'true' && needs.capture.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bot commit back to the PR branch
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The immutable SHA, never `head.ref`: the branch can move between the
          # capture and this push, and a commit on the moved tip would carry
          # screenshots of a tree that is no longer what the branch is.
          ref: ${{ github.event.pull_request.head.sha }}
          # persist-credentials stays at its default (on) HERE, unlike the
          # capture job: the push below is this job's whole purpose and it runs
          # no PR-controlled code, so the zizmor/artipacked warning about a
          # persisted credential is the expected, accepted one — the write IS
          # the job.
          # The explicit refspec below is what keeps the mutable branch safe:
          # the checkout is the captured SHA, so a branch that advanced makes
          # the push a non-fast-forward and Git refuses it.

      - uses: actions/download-artifact@v8
        with:
          name: screenshot-previews
          path: preview-out

      - name: Land the captured PNGs and manifest
        run: |
          set -euo pipefail
          shopt -s nullglob
          cp preview-out/*.png frontends/ui/visual/screenshots/
          if [ -f preview-out/screenshots.manifest.json ]; then
            cp preview-out/screenshots.manifest.json frontends/ui/visual/screenshots.manifest.json
          fi

      - name: Commit and push
        id: commit
        env:
          # Through the environment, never interpolated into the script: a git
          # refname may contain `;`, `$()` and backticks, so `${{ ... }}` in a
          # `run:` body is script injection even for a same-repo branch.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontends/ui/visual/screenshots frontends/ui/visual/screenshots.manifest.json
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to commit — the tree already holds current screenshots."
            exit 0
          fi
          git commit -m "chore(ui): regenerate screenshots for changed previews"
          git push origin "HEAD:$HEAD_REF"
          echo "committed=true" >> "$GITHUB_OUTPUT"

  # Privileged half: no checkout of PR code, no dependency install, no app code —
  # it only reports what capture produced, so the write-scoped token is never
  # reachable from anything the PR controls.
  comment:
    name: Comment with the previews
    needs: [detect, capture, commit]
    # Runs even when capture failed, so a broken harness is reported in the
    # comment rather than as silence.
    if: ${{ !cancelled() && needs.detect.outputs.has_new == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # upsert the sticky comment
    steps:
      - name: Upsert the sticky PR comment
        uses: actions/github-script@v9
        env:
          IDS: ${{ needs.detect.outputs.ids }}
          COUNT: ${{ needs.capture.outputs.count }}
          ARTIFACT_URL: ${{ needs.capture.outputs.artifact_url }}
          COMMITTED: ${{ needs.commit.outputs.committed }}
        with:
          script: |
            const pr = context.payload.pull_request.number
            const ids = (process.env.IDS || '').split(' ').filter(Boolean)
            const count = Number(process.env.COUNT || 0)
            const artifactUrl = process.env.ARTIFACT_URL || ''
            const committed = process.env.COMMITTED === 'true'
            const marker = '<!-- screenshot-preview -->'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const list = ids.map((id) => `\`${id}\``).join(', ')

            const ok = count > 0 && artifactUrl
            const body = (ok
              ? [
                  marker,
                  '## Screenshot previews',
                  `Captured ${count} PNG(s) for ${list} (desktop + mobile, light + dark).`,
                  '',
                  committed
                    ? 'Committed the regenerated PNGs and the manifest to this branch — the visual gate picks them up on the next run.'
                    : 'The capture ran, but the commit did not land (open it from the artifact below).',
                  '',
                  `**[Download the \`screenshot-previews\` artifact](${artifactUrl})**`,
                  '',
                  'Linked rather than inlined because this repository is private: GitHub fetches',
                  'comment images through an anonymous proxy, which 404s on every URL into a',
                  'private repo.',
                ]
              : [
                  marker,
                  '## Screenshot previews',
                  `Screenshot capture produced no files for ${list}. See the [workflow log](${runUrl}).`,
                ]
            ).concat([
              '',
              '<sub>Generated by the screenshot-preview workflow. Informational only.</sub>',
            ]).join('\n')

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: pr,
              per_page: 100,
            })
            const existing = comments.find((c) => c.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body })
            }
