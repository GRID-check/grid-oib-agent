# Screenshot preview comments — when a PR adds a new visual target to
# frontends/ui/visual/registry.mjs, run the screenshot harness for ONLY the new
# ids and post the PNGs (desktop + mobile, light + dark) as a sticky PR comment.
#
# Inline images in a PR comment need a fetchable URL — workflow artifacts cannot
# be embedded — so the PNGs are pushed to a `screenshot-previews` branch under
# `pr-<number>/` and referenced via raw.githubusercontent.com. Informational
# only: a harness failure must never block the PR.
#
# Capture and publish are DELIBERATELY separate jobs: capture executes
# PR-controlled code (registry import, `npm ci`, the app itself) with a read-only
# token and no persisted credential, then hands over a PNG artifact; publish
# checks out nothing, validates that artifact and is the only job holding write
# scope. So PR code never runs next to a credential that can write the repo.

name: Screenshot preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - frontends/ui/visual/registry.mjs

# One run per PR at a time; a fresh push cancels the stale comment build.
concurrency:
  group: screenshot-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Least privilege per job: the jobs that execute PR-controlled code (registry
# import, `npm ci`, the harness) run read-only, and no job keeps a checkout
# credential in the workspace — the write token is injected only into the publish
# step, after all PR-controlled steps have finished.
permissions:
  contents: read

jobs:
  detect:
    name: Detect new screenshot targets
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Fork PRs get a read-only token and cannot receive comments — skip them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    outputs:
      has_new: ${{ steps.diff.outputs.has_new }}
      ids: ${{ steps.diff.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Diff registry against the PR base
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # No `git fetch` here: `fetch-depth: 0` above already fetched every
          # branch, so `origin/$BASE_REF` is present — and with
          # `persist-credentials: false` a fetch would fail for lack of a
          # credential.
          BASE_FILE=$(mktemp --suffix=.mjs)
          if git cat-file -e "origin/$BASE_REF:frontends/ui/visual/registry.mjs" 2>/dev/null; then
            git show "origin/$BASE_REF:frontends/ui/visual/registry.mjs" > "$BASE_FILE"
          else
            # Registry did not exist on the base — every target is new.
            echo 'export const SCREENSHOT_TARGETS = []' > "$BASE_FILE"
          fi

          # Ids flow into a shell command, a filename glob and a comment body, so
          # only accept the registry's own safe id shape and drop anything else.
          IDS=$(node --input-type=module -e "
            import { pathToFileURL } from 'node:url'
            const base = (await import(pathToFileURL('$BASE_FILE'))).SCREENSHOT_TARGETS ?? []
            const head = (await import(pathToFileURL('frontends/ui/visual/registry.mjs'))).SCREENSHOT_TARGETS ?? []
            const baseIds = new Set(base.map((t) => t.id))
            const ids = head
              .filter((t) => !baseIds.has(t.id))
              .map((t) => t.id)
              .filter((id) => /^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(id))
            process.stdout.write(ids.join(' '))
          ")

          echo "ids=$IDS" >> "$GITHUB_OUTPUT"
          if [ -n "$IDS" ]; then
            echo "has_new=true" >> "$GITHUB_OUTPUT"
            echo "New screenshot targets: $IDS"
          else
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            echo "No new screenshot targets in this PR."
          fi

  # Untrusted half: runs PR code, holds no write scope and no credential.
  capture:
    name: Capture previews
    needs: detect
    if: needs.detect.outputs.has_new == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # The steps below run PR-controlled dependency scripts and app code —
          # they must never find a repository credential in the workspace.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontends/ui/package-lock.json

      - name: Install dependencies
        working-directory: frontends/ui
        run: npm ci

      - name: Cache the Playwright Chromium download
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontends/ui/package-lock.json') }}

      - name: Install Chromium for playwright-core
        # The `/opt/pw-browsers` pre-install in docs/ux/visual-screenshots.md is the
        # DEV-CONTAINER contract; CI runners ship no such browser, so playwright-core
        # fetches its own here — the cache above keeps that to once per lockfile.
        working-directory: frontends/ui
        run: npx playwright-core install chromium

      - name: Capture screenshots for the new targets
        working-directory: frontends/ui
        env:
          IDS: ${{ needs.detect.outputs.ids }}
        # Unquoted on purpose: the ids are a validated, space-separated list.
        run: npm run screenshots -- $IDS

      - name: Stage generated PNGs
        working-directory: frontends/ui
        env:
          IDS: ${{ needs.detect.outputs.ids }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.preview-out"
          for id in $IDS; do
            for f in "visual/screenshots/$id".*.png; do
              [ -e "$f" ] && cp "$f" "$GITHUB_WORKSPACE/.preview-out/"
            done
          done
          ls -la "$GITHUB_WORKSPACE/.preview-out"

      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-previews
          path: .preview-out
          if-no-files-found: ignore

  # Privileged half: no checkout of PR code, no dependency install, no app code —
  # it only consumes the validated PNG artifact, so the write-scoped token is never
  # reachable from anything the PR controls.
  publish:
    name: Publish previews
    needs: [detect, capture]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write # push the screenshot-previews branch
      pull-requests: write # upsert the sticky comment
    steps:
      # A harness that produced nothing uploads no artifact; that is reported in the
      # comment below, not as a red job.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: screenshot-previews
          path: .preview-out

      - name: Validate the artifact contents
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p .preview-out
          cd .preview-out
          # Only real PNGs with registry-shaped names get published.
          for f in *; do
            [ -f "$f" ] || { echo "::error::unexpected non-file entry: $f"; exit 1; }
            case "$f" in
              *[!A-Za-z0-9._-]* | .* | *..*) echo "::error::rejected file name: $f"; exit 1 ;;
              *.png) ;;
              *) echo "::error::rejected non-PNG file: $f"; exit 1 ;;
            esac
            [ "$(file --brief --mime-type "$f")" = "image/png" ] || { echo "::error::not a PNG: $f"; exit 1; }
          done
          ls -la

      - name: Push PNGs to the screenshot-previews branch
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IDS: ${{ needs.detect.outputs.ids }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          PNGS=("$GITHUB_WORKSPACE/.preview-out/"*.png)
          if [ ${#PNGS[@]} -eq 0 ]; then
            echo "No PNGs to publish — the comment step will report it."
            exit 0
          fi
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          PREVIEWS=$(mktemp -d)
          if git ls-remote --exit-code --heads "$REMOTE" screenshot-previews > /dev/null 2>&1; then
            git clone --depth=1 --branch screenshot-previews "$REMOTE" "$PREVIEWS"
          else
            git init -b screenshot-previews "$PREVIEWS"
            git -C "$PREVIEWS" remote add origin "$REMOTE"
          fi
          # Identity must be set on the previews clone — that is where we commit.
          git -C "$PREVIEWS" config user.name "github-actions[bot]"
          git -C "$PREVIEWS" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p "$PREVIEWS/pr-$PR_NUMBER"
          cp "${PNGS[@]}" "$PREVIEWS/pr-$PR_NUMBER/"
          git -C "$PREVIEWS" add "pr-$PR_NUMBER"
          if git -C "$PREVIEWS" diff --cached --quiet; then
            echo "Previews unchanged — nothing to push."
            exit 0
          fi
          git -C "$PREVIEWS" commit -m "Screenshot previews for PR #$PR_NUMBER ($IDS)"
          # Rebase over any concurrent push from another PR's run.
          git -C "$PREVIEWS" fetch origin screenshot-previews || true
          git -C "$PREVIEWS" rebase origin/screenshot-previews || true
          git -C "$PREVIEWS" push origin screenshot-previews

      - name: Upsert the sticky PR comment
        uses: actions/github-script@v7
        env:
          IDS: ${{ needs.detect.outputs.ids }}
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            const pr = context.payload.pull_request.number
            const ids = (process.env.IDS || '').split(' ').filter(Boolean)
            const marker = '<!-- screenshot-preview -->'
            const rawBase = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/screenshot-previews/pr-${pr}`

            const outDir = path.join(process.env.GITHUB_WORKSPACE, '.preview-out')
            const files = fs.existsSync(outDir) ? fs.readdirSync(outDir) : []
            const sections = []
            for (const id of ids) {
              const variants = files.filter((f) => f.startsWith(`${id}.`) || f.startsWith(`${id}.mobile.`))
              if (variants.length === 0) continue
              const images = variants
                .sort()
                .map((f) => `<img src="${rawBase}/${f}" alt="${f}" width="420">`)
                .join('\n')
              sections.push(`### \`${id}\`\n${images}`)
            }
            const body = sections.length
              ? `${marker}\n## Screenshot previews\nNew visual targets in this PR (desktop + mobile, light + dark):\n\n${sections.join('\n\n')}\n\n<sub>Generated by the screenshot-preview workflow — informational only.</sub>`
              : `${marker}\n## Screenshot previews\nScreenshot capture produced no files for: ${ids.map((i) => `\`${i}\``).join(', ')}. Check the workflow log.`

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: pr,
              per_page: 100,
            })
            const existing = comments.find((c) => c.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body })
            }
