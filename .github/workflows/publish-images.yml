name: Publish Images

# Builds the backend + frontend images and PUSHES them to GHCR so the Pulumi
# k8s deployment (deploy/pulumi) can reference immutable, pre-built tags.
#
# Complements docker-build.yml (which only validates the build on PRs, no push).
# Runs on merges to develop/release and on version tags. Each image is tagged
# with the commit SHA (immutable — what Pulumi should pin via `imageTag`) and a
# moving tag (`latest` on develop, the git tag on releases).
on:
  push:
    branches: [develop, "release/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Build & push backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/grid-oib-backend
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}
            type=ref,event=tag
      - name: Build & push (release target)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: release
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  frontend:
    name: Build & push frontend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/grid-oib-frontend
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}
            type=ref,event=tag
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: frontends/ui
          file: frontends/ui/deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
