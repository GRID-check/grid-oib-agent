name: Publish Images

# Builds the backend + frontend + web (landing) images and PUSHES them to GHCR
# so the Pulumi k8s deployment (deploy/pulumi) can reference immutable,
# pre-built tags.
#
# Complements docker-build.yml (which only validates the build on PRs, no push).
# Runs on merges to develop/release and on version tags. Each image is tagged
# with the commit SHA (immutable — what Pulumi should pin via `imageTag`) and a
# moving tag (`latest` on develop, the git tag on releases).
#
# The web image bakes its site URLs at build time: `latest`/SHA images carry the
# DEV hosts (app.dev.piloti.at / dev.piloti.at), version-tagged images the PROD
# hosts (app.piloti.at / piloti.at) — the Dockerfile defaults cover dev, the
# build args below override for release tags.
#
# Path-filtered rebuilds: the `changes` job (dorny/paths-filter) tracks which
# inputs each image consumes, so on pushes to develop an image is only rebuilt
# when its own inputs changed — a blog-post commit under frontends/web/** (blog
# content lives at frontends/web/src/content/**) rebuilds just the web image.
# Non-develop refs (release/** branches, version tags) and manual
# workflow_dispatch runs always build ALL three images (unchanged behavior).
on:
  push:
    branches: [develop, "release/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Backend filter mirrors exactly what deploy/Dockerfile COPYs from the
          # repo-root build context (plus the toolchain files and the workflow
          # itself — a changed Dockerfile/trigger always rebuilds the image).
          filters: |
            backend:
              - 'src/**'
              - 'sources/**'
              - 'frontends/aiq_api/**'
              - 'frontends/cli/**'
              - 'frontends/debug/**'
              - 'configs/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'deploy/entrypoint.py'
              - 'deploy/start_web.py'
              - 'deploy/Dockerfile'
              - '.github/workflows/publish-images.yml'
            frontend:
              - 'frontends/ui/**'
              - '.github/workflows/publish-images.yml'
            # frontends/web/** already covers blog content
            # (frontends/web/src/content/**), so a blog save rebuilds only grid-web.
            web:
              - 'frontends/web/**'
              - '.github/workflows/publish-images.yml'

  backend:
    name: Build & push backend image
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/develop' || needs.changes.outputs.backend == 'true' }}
    steps:
      # No persisted checkout token: images are pushed via docker/login-action
      # below, never git credentials.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/grid-oib-backend
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}
            type=ref,event=tag
      - name: Build & push (release target)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: release
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  frontend:
    name: Build & push frontend image
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/develop' || needs.changes.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/grid-oib-frontend
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}
            type=ref,event=tag
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: frontends/ui
          file: frontends/ui/deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  web:
    name: Build & push web image
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/develop' || needs.changes.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/grid-oib-web
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}
            type=ref,event=tag
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: frontends/web
          file: frontends/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PUBLIC_APP_URL=${{ startsWith(github.ref, 'refs/tags/') && 'https://app.piloti.at' || 'https://app.dev.piloti.at' }}
            PUBLIC_SITE_URL=${{ startsWith(github.ref, 'refs/tags/') && 'https://piloti.at' || 'https://dev.piloti.at' }}
