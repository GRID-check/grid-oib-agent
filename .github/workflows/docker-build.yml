name: Docker Build

# Validates that the backend, frontend and web (landing) images actually BUILD,
# on PRs to the integration/release branches — so a broken Dockerfile is caught
# before merge instead of at deploy time (the failure mode we hit on Coolify).
# Build only, no push.
#
# Layer cache is READ-ONLY on purpose (`cache-from`, no `cache-to`). These runs
# restore the `buildcache` tag publish-images.yml pushes to GHCR on develop and
# deliberately write nothing back:
#
#   Safety. This workflow holds `packages: read` and nothing else, so a PR run
#   CANNOT write the cache. Writing back would be the direction that matters:
#   with mode=max a PR that leaves the Dockerfile and lockfile untouched
#   produces an identical BuildKit key for the dependency stage, so a poisoned
#   layer written here would be imported wholesale by the next publish run and
#   pushed to GHCR without ever appearing in a diff. The token's permission
#   keeps that door shut by construction.
#
#   (The cache moved from type=gha to GHCR because the three mode=max caches,
#   an estimated 3-5 GB, were LRU-evicting each other — and the trivy, Astro
#   and node/uv caches — out of the repo's 10 GB Actions cache budget, which
#   made publishes cold and left them hanging for ages in "exporting to GitHub
#   Actions cache". The registry has no such budget; see publish-images.yml.)
#
# A missing `buildcache` tag (first run, image renamed) is a warning and a cold
# build, never a failure.
#
# Note the ceiling: `COPY . .` invalidates the app build step on any source
# change, so this reliably saves the apt / uv sync / bun install / npm ci layers
# but never `RUN bun run build`.
on:
  pull_request:
    branches: [develop, "release/**"]

permissions:
  contents: read
  # Read-only pull of the GHCR `buildcache` tags publish-images.yml maintains.
  packages: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build backend image
    runs-on: ubuntu-latest
    steps:
      # No persisted checkout token: images are pushed via docker/login-action
      # (publish-images.yml), never git credentials.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR (cache pull only)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (release target, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: release
          push: false
          cache-from: type=registry,ref=ghcr.io/grid-check/grid-oib-backend:buildcache
          # The OIB knowledge base is volume-based (embedded live on first boot);
          # nothing knowledge-related is baked at build time.

  frontend:
    name: Build frontend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR (cache pull only)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: frontends/ui
          file: frontends/ui/deploy/Dockerfile
          push: false
          cache-from: type=registry,ref=ghcr.io/grid-check/grid-oib-frontend:buildcache

  web:
    name: Build web image (landing site)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR (cache pull only)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: frontends/web
          file: frontends/web/Dockerfile
          push: false
          cache-from: type=registry,ref=ghcr.io/grid-check/grid-oib-web:buildcache
          # No build-args: the image is host-agnostic (the sign-in link
          # resolves PUBLIC_APP_URL at runtime; SEO metadata defaults to prod).
