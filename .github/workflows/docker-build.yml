name: Docker Build

# Validates that the backend and frontend images actually BUILD, on PRs to the
# integration/release branches — so a broken Dockerfile is caught before merge
# instead of at deploy time (the failure mode we hit on Coolify). Build only,
# no push; layer cache via GitHub Actions cache keeps it fast.
on:
  pull_request:
    branches: [develop, "release/**"]

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (release target, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: release
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          # OIB seed is optional at build time; an empty seed still builds.

  frontend:
    name: Build frontend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: frontends/ui
          file: frontends/ui/deploy/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
