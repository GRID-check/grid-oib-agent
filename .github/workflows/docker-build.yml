name: Docker Build

# Validates that the backend, frontend and web (landing) images actually BUILD,
# on PRs to the integration/release branches — so a broken Dockerfile is caught
# before merge instead of at deploy time (the failure mode we hit on Coolify).
# Build only, no push.
#
# Layer cache is READ-ONLY on purpose (`cache-from`, no `cache-to`). These runs
# restore the entry publish-images.yml wrote on develop and deliberately write
# nothing back, for two independent reasons:
#
#   Safety. GitHub scopes a pull_request run's caches to refs/pull/N/merge, a
#   child ref, which develop/release/tag runs cannot read — while a PR CAN read
#   its base branch. Writing back would be the direction that matters: with
#   mode=max a PR that leaves the Dockerfile and lockfile untouched produces an
#   identical BuildKit key for the dependency stage, so a poisoned layer would
#   be imported wholesale by the next publish run and pushed to GHCR without
#   ever appearing in a diff. Read-only keeps that door shut by construction
#   rather than by trusting the ref scoping alone.
#
#   Quota. mode=max on these three images is an estimated 3-5 GB of the repo's
#   10 GB cache budget. A per-PR write would allocate its own set per PR ref;
#   two concurrent PRs would exceed the cap, and LRU evicts by last access —
#   which preferentially deletes the develop entries (touched only on merge)
#   in favour of PR entries (touched every push). That trades a warm publish
#   path for a warm PR path, i.e. it slows down the pipeline that ships.
#
# Note the ceiling: `COPY . .` invalidates the app build step on any source
# change, so this reliably saves the apt / uv sync / bun install / npm ci layers
# but never `RUN bun run build`.
on:
  pull_request:
    branches: [develop, "release/**"]

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build backend image
    runs-on: ubuntu-latest
    steps:
      # No persisted checkout token: images are pushed via docker/login-action
      # (publish-images.yml), never git credentials.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build (release target, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: release
          push: false
          cache-from: type=gha,scope=backend
          # The OIB knowledge base is volume-based (embedded live on first boot);
          # nothing knowledge-related is baked at build time.

  frontend:
    name: Build frontend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: frontends/ui
          file: frontends/ui/deploy/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend

  web:
    name: Build web image (landing site)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: frontends/web
          file: frontends/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          # No build-args: the image is host-agnostic (the sign-in link
          # resolves PUBLIC_APP_URL at runtime; SEO metadata defaults to prod).
