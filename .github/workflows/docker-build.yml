name: Docker Build

# Validates that the backend and frontend images actually BUILD, on PRs to the
# integration/release branches — so a broken Dockerfile is caught before merge
# instead of at deploy time (the failure mode we hit on Coolify). Build only,
# no push; layer cache via GitHub Actions cache keeps it fast.
on:
  pull_request:
    branches: [develop, "release/**"]

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build backend image
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1.10.0
      - name: Build (release target, no push)
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: deploy/Dockerfile
          target: release
          push: false
          # The OIB knowledge base is volume-based (embedded live on first boot);
          # nothing knowledge-related is baked at build time.

  frontend:
    name: Build frontend image
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1.10.0
      - name: Build (no push)
        uses: useblacksmith/build-push-action@v2
        with:
          context: frontends/ui
          file: frontends/ui/deploy/Dockerfile
          push: false
