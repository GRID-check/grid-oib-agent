name: Docker Build

# Validates that the backend, frontend and web (landing) images actually BUILD,
# on PRs to the integration/release branches — so a broken Dockerfile is caught
# before merge instead of at deploy time (the failure mode we hit on Coolify).
# Build only, no push; layer cache via GitHub Actions cache keeps it fast.
on:
  pull_request:
    branches: [develop, "release/**"]

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build backend image
    runs-on: ubuntu-latest
    steps:
      # No persisted checkout token: images are pushed via docker/login-action
      # (publish-images.yml), never git credentials.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build (release target, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: release
          push: false
          # The OIB knowledge base is volume-based (embedded live on first boot);
          # nothing knowledge-related is baked at build time.

  frontend:
    name: Build frontend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: frontends/ui
          file: frontends/ui/deploy/Dockerfile
          push: false

  web:
    name: Build web image (landing site)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: frontends/web
          file: frontends/web/Dockerfile
          push: false
          # Dev defaults cover the build; prod URLs are passed by
          # publish-images.yml on release tags.
          build-args: |
            PUBLIC_APP_URL=https://app.dev.piloti.at
            PUBLIC_SITE_URL=https://dev.piloti.at
