name: trivy bench (temporary)

# TEMPORARY measurement harness, deleted before this branch is proposed.
# Establishes WHAT the 4-minute image-scan step is spending its time on
# before anything is optimised.
on:
  push:
    branches: ["claude/trivy-performance-**"]

permissions:
  contents: read

jobs:
  bench:
    name: bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bench
        run: |
          set -uo pipefail
          cache="$PWD/.trivy-cache"
          mkdir -p "$cache"
          LANGFUSE='ghcr.io/langfuse/langfuse@sha256:c782c55ab8fef96fac5ce85c57d8eacfd74b5e2549d01504ed3281e183d853ba'

          trivy() {
            docker run --rm \
              -v "$cache:/root/.cache/trivy" \
              -v "$PWD/.trivyignore.yaml:/config/.trivyignore.yaml:ro" \
              aquasec/trivy:0.61.1 "$@"
          }

          echo "::group::db download"
          time trivy image --download-db-only --cache-dir /root/.cache/trivy \
            --db-repository 'mirror.gcr.io/aquasec/trivy-db:2'
          echo "::endgroup::"

          bench() {
            label="$1"; shift
            start=$(date +%s)
            trivy image --skip-db-update --cache-dir /root/.cache/trivy \
              --ignorefile /config/.trivyignore.yaml \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              "$@" >"/tmp/$label.out" 2>&1
            rc=$?
            echo "RESULT ${label} $(( $(date +%s) - start ))s rc=${rc}"
          }

          # A: today's flags, cold blob cache.
          bench A-full-cold "$LANGFUSE"
          # B: same, warm blob cache (does the cost survive a cache hit?).
          bench B-full-warm "$LANGFUSE"
          # Drop the blob cache again, keep the vuln DB, for the cold comparisons.
          sudo rm -rf "$cache/fanal"
          # C: vulnerabilities only, cold.
          bench C-vuln-cold --scanners vuln "$LANGFUSE"
          sudo rm -rf "$cache/fanal"
          # D: vulnerabilities only, cold, unbounded layer parallelism.
          bench D-vuln-parallel-cold --scanners vuln --parallel 0 "$LANGFUSE"
          # E: vulnerabilities only, warm.
          bench E-vuln-warm --scanners vuln "$LANGFUSE"

          du -sh "$cache" "$cache"/* 2>/dev/null || true
          for f in /tmp/*.out; do echo "--- $f"; head -20 "$f"; done
