# PAUSED (2026-09-30): the answer suite no longer runs in CI.
#
# Everything below the stub is the full workflow, commented out line by line.
# To restore it, delete the stub (from `name:` to the end of the `paused` job)
# and remove the leading "# " from every line of the original.
#
# Why a stub at all: a workflow file with no `on:` trigger is an invalid
# workflow, which GitHub reports on every push. The stub is valid, has no PR or
# push trigger, and only runs when someone starts it by hand, so nothing in CI
# depends on it and nothing fails because of it.
#
# The suite itself still runs locally: `task be:eval:answer-suite`
# (docs/contributing/testing-and-verification.md, "The answer suite").
#
# Before restoring it: the ingest below reads the PDFs from data/oib and keeps a
# registry file, and the base corpus no longer works that way. It is objects in
# object storage plus the `oib_corpus_files` table (ADR-0082 step A2), and
# `--ingest` runs `oib_sync.sync()` over that table. The job then needs a corpus
# store of its own (SeaweedFS, the BFF's upload route and a database), or an
# ingest that takes a directory of PDFs. Neither is built; this is the gap.

name: Answer suite (paused)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paused:
    name: Answer suite (paused)
    runs-on: ubuntu-latest
    steps:
      - run: echo "The answer suite is paused in CI; run it locally with 'task be:eval:answer-suite'."

