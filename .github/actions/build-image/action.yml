name: Build image
description: >-
  Build one of the three images (backend, frontend, web) from an entry of the
  plan `ci/image_inputs.py` writes, and push it under its content tag
  `inputs-<hash>` when asked to. The commit's own tags (`sha-<commit>`,
  `latest`) are never set here: CI's publish job adds them once every check on
  the commit has passed.

inputs:
  name:
    description: backend, frontend or web
    required: true
  context:
    required: true
  dockerfile:
    required: true
  target:
    required: false
    default: ""
  repository:
    description: The GHCR repository, e.g. grid-oib-backend
    required: true
  hash:
    description: The input hash from the plan
    required: true
  registry:
    description: Lowercase registry prefix, e.g. ghcr.io/grid-check
    required: true
  push:
    description: >-
      "true" pushes the image and writes the layer cache, which needs a token
      with `packages: write`. Anything else builds only.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # The web build reprocesses every blog image on a cold cache, and the layer
    # cache cannot help it (`COPY . .` comes first). CI's web job writes this
    # cache; restoring it into the build context lets the container start warm.
    # frontends/web/.dockerignore leaves `.astro-cache` in the context for this,
    # and the runner stage copies only dist/, so it never reaches the image.
    - name: Restore the Astro asset cache into the build context
      if: inputs.name == 'web'
      uses: actions/cache/restore@v6
      with:
        path: frontends/web/.astro-cache
        key: astro-cache-${{ runner.os }}-${{ hashFiles('frontends/web/src/content/blog/_images/**', 'frontends/web/src/assets/**') }}
        restore-keys: |
          astro-cache-${{ runner.os }}-

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # Also needed to build only: the layer cache is read from GHCR.
    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Labels
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ inputs.registry }}/${{ inputs.repository }}
        tags: type=raw,value=inputs-${{ inputs.hash }}

    # Layer cache in GHCR, one `buildcache` tag per image, rather than type=gha:
    # three mode=max caches (3-5 GB) LRU-evicted each other and every other
    # cache out of the repository's 10 GB Actions budget, and re-exporting them
    # through the cache API left publishes hanging for half an hour.
    #
    # Written only by a push build. A pull request build reads it and writes
    # nothing, so a pull request can never put a layer into the cache that the
    # next publish imports without it appearing in any diff. `mode=max` because
    # the layer worth reusing is the dependency install in an intermediate
    # stage; `image-manifest`/`oci-mediatypes` because GHCR rejects the legacy
    # cache manifest.
    #
    # GRID_GIT_SHA is the commit that BUILT the image. An image whose inputs did
    # not change is not rebuilt, only re-tagged, so a container reports the
    # commit its code came from, which is the one worth reading in a pilot report.
    - name: Build${{ inputs.push == 'true' && ' and push' || '' }}
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        target: ${{ inputs.target }}
        push: ${{ inputs.push == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          GRID_GIT_SHA=${{ github.sha }}
        cache-from: type=registry,ref=${{ inputs.registry }}/${{ inputs.repository }}:buildcache
        cache-to: ${{ inputs.push == 'true' && format('type=registry,ref={0}/{1}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true', inputs.registry, inputs.repository) || '' }}
