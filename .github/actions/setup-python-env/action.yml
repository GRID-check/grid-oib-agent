name: Setup Python env
description: Python + uv + a synced dev virtualenv (.venv), shared across jobs.

inputs:
  python-version:
    description: Python version to provision.
    required: false
    default: "3.14"

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Setup uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true

    - name: Create venv and sync dev deps
      shell: bash
      # Pass the input through env rather than interpolating ${{ }} straight into
      # the run script — avoids the shell-injection pattern Semgrep flags
      # (run-shell-injection), even though this input is CI-controlled today.
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
        # uv's default hard-link install leaves nltk's bundled corpora with
        # st_nlink>=2. nltk pathsec then refuses to open them (CWE-59), which
        # is how llama-index's SentenceSplitter dies on any path that actually
        # splits — the retrieval harness (`task be:eval:retrieval`, now a local
        # tool) is where it was first hit, and production splits too. Copy mode
        # is the install that matches how those files have to be read.
        # A venv built before copy mode: `UV_LINK_MODE=copy uv sync --group dev --reinstall`.
        UV_LINK_MODE: copy
      run: |
        uv venv --python "$PYTHON_VERSION" .venv
        uv sync --group dev
